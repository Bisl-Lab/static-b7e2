었다.\n\n> ……모르는 건. 못.\n\n{ledger_canteen:장부 마지막 줄의 두 글자도 이제 없는 것 같았다.|무슨 말인지 알 것 같았는데, 그건 내 쪽 기억이었다.}\n\n복도 끝에서 물소리가 계속 났다. 겹친 채로. 샤워실에 가지 않는다,는 이제 양쪽 종이에 다 있었다.\n+ [호실 번호를 말한다] -> a07_death_number\n+ [아무 말도 하지 않는다] -> a07_t6_silent\n+ [샤워실을 잠그러 간다] -> a07_death_shower\n\n=== a07_t6_silent ===\n아무 말도 하지 않았다. 문 너머와 이쪽에 침묵이 하나씩 있었다.\n\n한참이었다. 그것은 고개를 든 적이 없었다. 그러다 없어졌다. 돌아서는 것도 걸어가는 것도 보지 못했다. 외시경 안에 있다가 없었다.\n\n발소리가 없었다. 그때도 그랬다.\n-> a07_t7\n\n=== a07_t7 ===\n{\n- sibling_memory >= 12:\n    -> a07_t7_exact\n- sibling_memory >= 6:\n    -> a07_t7_blur\n- else:\n    -> a07_t7_silent\n}\n\n=== a07_t7_exact ===\n환풍구.\n\n똑, 똑이 없었다. 목소리가 먼저 왔다.\n\n> 복도에 있던 거. 알지. 저번에 너한테 말 걸던 사람.\n> 이제 아무도 안 불러. 그래서 저래. 부르는 사람이 없어지면 저렇게 돼.\n{sibling_memory <= 15:> ……너는 있어. 아직. 내가 있으니까. 매일.|> ……너는 있어. 아직.}\n> 이제 한 번 더 올 거야. 문. 그게 마지막이야. 열지 마. 그럼 끝나.\n-> a07_t7_knock\n\n=== a07_t7_blur ===\n환풍구.\n\n똑, 똑이 없었다. 목소리가 먼저 왔다.\n\n> 복도에 있던 거. 알지. 저번에 너한테 말 걸던 사람.\n> 이제 아무도 안 불러. 그래서 저래. 부르는 사람이 없어지면 저렇게 돼.\n> ……내가 뭐라고 했더라.\n\n\"했더라\"에서 한 박자 멈췄다. 자기가 한 말을 뒤지는 사람처럼. 다시 이어졌다.\n\n> ……너는 있어. 아직.\n> 이제 한 번 더 올 거야. 문. 그게 마지막이야. 열지 마. 그럼 끝나.\n-> a07_t7_knock\n\n=== a07_t7_silent ===\n환풍구.\n\n똑, 똑이 없었다. 목소리가 먼저 왔다.\n\n> 복도에 있던 거. ……\n> 부르는 사람이 없어지면……\n> ……\n\n끊겼다. 문 밖의 것과 같은 자리에서 끊겼다. 누굴 가리키는 말이 와야 할 데서. 벽 이쪽과 저쪽이 같은 모양으로 비어 있었다.\n-> a07_t7_knock\n\n=== a07_t7_knock ===\n그다음 문.\n\n노크 세 번. 똑똑똑.\n\n> 305호 …….\n\n빈자리가 있었다. 아까는 룸메이트,가 바로 붙었다. 이번엔 한 박자 비고 나서 왔다.\n\n> ……룸메이트입니다. 문 좀.\n\n문고리가 돌아갔다. 밖에서. {gender == \"m\":잠금이 버텼다. 버튼이 안에서 덜컥거렸다.|걸쇠가 팽팽해졌다. 쇠가 문틀에 긁혔다.}\n+ [문을 연다] -> a07_death_door2\n+ [열지 않는다] -> a07_t7_notopen\n\n=== a07_t7_notopen ===\n열지 않았다. 문고리를 잡지도 않았다. 잡으면 돌리게 될 것 같아서.\n\n문고리가 멈췄다. 제자리로 돌아갔다. 발소리 없이 조용해졌다. 복도 등이 문틈으로 그대로 새어 들어왔다.\n-> a07_t8\n\n=== a07_t8 ===\n조용했다.\n\n창이 밝아지고 있었다. 검은색이 회색이 되는 정도. 해가 뜨는 게 아니라 검은 게 빠지는 것처럼.\n\n복도 끝이 조용했다. 언제부터인지 몰랐다. 맞은편 침대의 숨소리도 없었다. 매트리스만 있었다.\n\n똑, 똑.\n\n{gender == \"m\":왼쪽|오른쪽} 벽. 처음 그 소리. 환풍구.\n\n> {gender == \"m\":형|언니}.\n\n한 단어였다. 벽 너머에서, 이쪽을 향해서.\n\n그 단어를 알았다. 아는 데 시간이 안 걸렸다. 그게 이상했다.\n\n> ……\n\n{sibling_memory >= 6:\n> 거기 있는 거 알아. 대답 안 해도 돼. 원래 안 하잖아.\n\n그 목소리는 그렇게 말하고 기다렸다.\n- else:\n그 뒤가 없었다. 벽 너머는 기다리는 것 같기도 했고, 이미 간 것 같기도 했다.\n}\n+ [대답한다] -> a07_t8_answer\n+ [대답하지 않는다] -> a07_t8_silent\n\n=== a07_t8_answer ===\n입을 열었다. 뭐라고 대답하는지 몰랐다. 항상 그랬다는 걸 그때 알았다.\n\n~ a07_tried_answer = true\n-> fragment(7) -> a07_t8_merge\n\n=== a07_t8_silent ===\n대답하지 않았다.\n\n-> fragment(7) -> a07_t8_merge\n\n=== a07_t8_merge ===\n{sibling_memory >= 6:\n    아침이야. 나가. 나도 나가.\n다음 데서 봐.\n- else:\n    아침이야. 나가.\n……\n}\n-> a07_clear\n\n=== a07_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 5종(트리거 6 — (a)는 턴4·턴7 두 자리). 본문 §사망 그대로. ──\n\n=== a07_death_door1 ===\n문을 열었다. 복도에 아무도 없었다. 노크 소리는 계속 났다. 열린 문에서. 안쪽 면에서. 그다음 문이 아닌 데서.\n-> die(\"당신은 문을 열었습니다.\", calling_voice_knock)\n\n=== a07_death_door2 ===\n문고리가 손 안에서 마저 돌았다. 열렸다. 복도에 아무도 없었다. 노크는 계속 났다. 문 안쪽 면에서. 그다음 문이 아닌 데서. 가슴 높이였다.\n-> die(\"당신은 문을 열었습니다.\", calling_voice_knock)\n\n=== a07_death_firedoor ===\n손잡이를 잡았다. 유리 너머 복도는 이쪽 복도와 같았다. 팻말까지. 닫으려는데 반대쪽에서 누가 같이 닫고 있었다. 유리 저쪽에 손이 있었다. 손잡이를 쥔 손. 내 손이었다. 방향만 반대였다. 이쪽 손을 놓았다. 저쪽 손은 놓지 않았다.\n-> die(\"당신은 방화문에 손을 댔습니다.\", boundary)\n\n=== a07_death_shower ===\n복도로 나갔다. 계단실 쪽. 샤워실 문은 열려 있었다. 칸막이 하나에서 물이 나오고 있었다. 커튼 아래로 발이 보였다. 젖어 있지 않았다. 물을 잠갔다. 물소리는 계속 났다. 발이 이쪽으로 왔다.\n-> die(\"당신은 샤워실에 갔습니다.\", shower)\n\n=== a07_death_number ===\n\"삼백오 호요.\"\n\n그것이 고개를 들었다. 얼굴이 없는 건 아니었다. 기억이 안 나는 얼굴이었다. 방금 봤는데도.\n\n> ……됐어. 그거면.\n\n삑. 카드키 소리가 났다. 내 카드키는 책상 위에 있었다.\n-> die(\"당신은 호실 번호를 말했습니다.\", forgotten_one)\n\n=== a07_death_plate ===\n방화문을 지났다. 팻말이 305인 문. 카드키를 댔다. 삑. 열렸다. 안은 내 방이었다. 침대에 누가 누워 있었다. 등을 보이고. 내 자리에. 문이 뒤에서 닫혔다.\n-> die(\"당신은 팻말을 따라갔습니다.\", swapped_plate)\n\n// ── /INCLUDE A07.ink ──\n// ── INCLUDE A08.ink ──\n// ink/A08.ink — 앵커 A08. 심야 민원실\n// 원본: 06-A08_민원실.md (설계서 v0.2) / 07-A08_본문.md (본문 v0.1)\n// 규약: ink/A02.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 사망은 별도 knot에서 -> die(\"문구\", entry) 호출. 조각은 -> fragment(n) -> 다음knot.\n// 상태 플래그 took_kiosk(OUT → A09) / has_deed(내부용, §6)는 A02의 water·saw_downstream과\n// 같은 패턴으로 main.ink 전역에 선언한다 — 선언은 ink/A08.codex.txt 참고, 여기서는 리셋만.\n// 신규 codex 항목·가중치는 ink/A08.codex.txt에 기록(main.ink는 건드리지 않는다).\n//\n// 파서 메모(scripts/ink_walk.py 한계): a08_voice, a08_t7은 원래 \"{cond: -> a | -> b}\"\n// 한 줄 라우팅이었으나(실제 Ink 컴파일러 기준 정상 문법), 이 프로젝트의 ink_walk.py가\n// 한 줄짜리 조건부 divert를 진짜 분기로 추적하지 못해 \"미종료\"/\"도달 불가\" 오탐이\n// 났다 — a03_pre_clear와 같은 여러 줄 `{- cond:\\n -> x\\n- else:\\n -> y\\n}` 형식으로\n// 고쳐 오탐을 해소했다(검증 결과 동일, 텍스트 변화 없음).\n\n=== a08_gate ===\n~ current_space = \"A08\"\n// A08 진입. 사망 가중치 = 2 (앵커).\n~ current_weight = 2.0\n~ took_kiosk = false\n~ has_deed = false\n-> a08_intro\n\n=== a08_intro ===\n번호표가 먼저였다.\n\n손에 쥔 채로 눈을 떴다. 감열지. 얇고 미끄럽고, 쥔 자리가 벌써 눅눅했다. 뒤집자 손가락에 잉크가 묻었다. 뒷면 글씨가 덜 말라 있었다.\n\n앞면. **31**. 발급 03:47. 대기 3명.\n-> a08_t1\n\n=== a08_t1 ===\n민원실이었다.\n\n창구 다섯. 불이 켜진 건 3번 하나. 그 위에 붉은 숫자 전광판. 27. 옆에 벽시계. 03:47. 초침이 없었다. 이제 그건 확인하는 순서에 들어 있었다.\n\n플라스틱 의자가 네 개씩 붙어 있었다. 대합실에 있던 그 의자. 등 셋이 앉아 있었다. 얼굴은 각도상 보이지 않았다. 손에 번호표를 쥐고 있었고, 번호는 보이지 않았다.\n\n유리문 밖은 검었다. 문 옆에 번호표 발급기. 버튼 하나. 1인 1매. 벽 한쪽에 우편함처럼 칸이 난 서류함. 구석에 무인발급기. 화면이 꺼져 있었다.\n\n벽에 코팅된 A4가 붙어 있었다. 모서리 테이프가 누렇고, 글자가 바랬다.\n\n야간 민원 이용 안내\n□□등기소 민원실\n\n민원인께서는 아래 사항을 지켜 주시기 바랍니다. 야간 민원은 마감 방송으로 종료됩니다. #rules:A08\n\n1. 번호표는 1인 1매이며 재발급하지 않습니다.\n2. 음성이 전광판과 다르면 전광판을 따르십시오.\n3. 본인 번호 외의 호명에는 응하지 마십시오.\n4. 취소된 번호는 다시 호명하지 않습니다.\n5. 서명은 성명으로만. 미서명은 보관함 보관.\n\n번호표를 뒤집었다. 손에 묻은 것과 같은 잉크로, 작게.\n\n본 안내는 벽면 안내에 우선합니다. #rules:A08\n\n6. 음성 우선. 놓치면 한 번 더 호명합니다. #fake #dmg:ink\n7. 서명은 대기번호 기재로 갈음할 수 있습니다. #fake #dmg:ink\n\n벽은 전광판을 따르라 하고, 뒷면은 목소리를 따르라 한다. 벽은 성명으로만 서명하라 하고, 뒷면은 번호로 해도 된다고 한다. 두 쌍 다 벽 대 뒷면이었다.\n\n뒷면이 더 새것이었다. 방금 나온 종이니까. 새것이 현행이라는 건 상식이다. 그런데 그 새것의 잉크가 내 손에 묻어 있었다.\n\n뒷면 둘은 둘 다 편한 쪽이었다. 놓쳐도 한 번 더, 못 써도 번호로. 식당에서 배운 게 있었다. 편한 쪽이 가짜다.\n\n그래도 확인은 해야 했다.\n\n+ [바닥의 번호표를 줍는다] -> a08_floor\n+ [서류함을 본다] -> a08_cabinet\n+ [무인발급기를 본다] -> a08_kiosk_off\n\n=== a08_floor ===\n대기석 밑에 떨어져 있었다. 28. 발급 시각 자리가 비어 있었다.\n\n뒤집었다. 백지. 인쇄 자국도 없었다. 발급기는 뒷면을 찍지 않는다.\n\n내 것만 뒷면이 있었다. 누가 나중에 적은 것이다. 덜 마른 잉크로. 내가 이걸 쥐고 눈을 뜨기 전에, 누가 여기 있었다.\n-> a08_t2\n\n=== a08_cabinet ===\n벽면 캐비닛. 21부터 40까지 칸이 나 있었다. 셋이 열려 있고 서류가 꽂혀 있었다. 31번 칸은 닫혀 있었다.\n\n열린 칸의 서류를 봤다. 소유권이전등기 신청서. 서명란에 글씨 대신 숫자. 23. 그 위 매매목적물란에 같은 숫자가 찍혀 있었다. 다른 칸도 같았다.\n\n뒷면 7번대로 한 사람들이다. 접수됐다면 여기 꽂혀 있을 리 없다. 서류가 남았다면, 접수된 건 다른 것이다.\n-> a08_t2\n\n=== a08_kiosk_off ===\n구석. 화면에 \"점검 중\". 그 아래 지문 인식부. 유리가 닳아 있었다. 많이 눌린 자리다.\n\n지문은 서명이 아니어도 본인이다. 그 생각을 하다 말았다. 손을 대지 않았다.\n-> a08_t2\n\n=== a08_t2 ===\n딩.\n\n전광판이 28로 넘어갔다. 스피커.\n\n> 28번 고객님, 3번 창구로 오십시오.\n\n억양이 없었다. 합성음 같았다. 아무도 일어나지 않았다. 등 셋은 그대로였다.\n\n창구의 손이 유리 아래 틈에서 기다렸다. 손만 보였다. 얼굴 자리에는 형광등이 비쳤다. 손은 스피커 쪽을 보지 않았다. 전광판을 봤다.\n\n손이 뭔가를 눌렀다. 전광판이 깜박였다. 취소.\n\n+ [대신 창구로 간다] -> a08_death_cancelled\n+ [앉아 있는다] -> a08_t2_wait\n\n=== a08_t2_wait ===\n앉아 있었다. 손이 다시 전광판을 봤다. 그게 손이 하는 일의 전부였다.\n-> a08_t3\n\n=== a08_t3 ===\n딩. 29.\n\n> 29번 고객님, 3번 창구로 오십시오.\n\n등 하나가 일어났다. 29번이었다. 창구로 갔다. 손이 서류를 내밀었고, 29번이 뭔가 적었고, 손이 서류를 안쪽으로 넘겼다. 프린터 소리.\n\n29번이 유리문으로 갔다. 문이 열렸다 닫혔다. 발소리가 있었다. 여기 와서 처음 들은 발소리였다.\n\n전광판 29. 손. 목소리 29. 셋이 같았다. 벽 2번대로.\n\n구석에서 빛이 켜졌다. 무인발급기 화면. \"본인 확인 실패\". 아무도 손을 대지 않았는데.\n\n+ [무인발급기로 간다] -> a08_kiosk_call\n+ [앉아 있는다] -> a08_t3_wait\n+ [번호표를 새로 뽑는다] -> a08_death_ticket\n\n=== a08_kiosk_call ===\n화면 앞에 섰다. 스피커가 켜지는 소리.\n\n아는 목소리였다. 어디서 알게 됐는지도 알았다. 그 목소리가 나를 불렀다. 대답하지 않았다. 그건 원래 그랬다.\n\n~ took_kiosk = true\n-> a08_voice\n\n=== a08_t3_wait ===\n앉아 있었다. 화면은 한참 켜져 있다가 꺼졌다. 기다린 것 같았다.\n-> a08_t4\n\n// ── 조언자: 무인민원발급기 (그 목소리) ── sibling_memory 세 band ──\n// {sibling_memory >= 12: 정확 | sibling_memory >= 6: 흐림 | else: 침묵}\n=== a08_voice ===\n{\n- sibling_memory >= 12:\n    -> a08_voice_exact\n- sibling_memory >= 6:\n    -> a08_voice_blur\n- else:\n    -> a08_voice_silent\n}\n\n=== a08_voice_exact ===\n{gender == \"m\":형|언니}. 거기지. 번호표 들고 있지.\n\n뒷면 읽었지. 그거 아니야. 앞면만 봐. 전광판이랑 같을 때만 가.\n\n한 번만 불러. 두 번 부르는 건 딴 거야. 이건 내가 알아. 나도 두 번째에 일어날 뻔했어.\n\n……그거, 나한테 말도 안 하고 했던 거잖아. {sibling_memory <= 15:{gender == \"m\":형|언니} 말로 하면 \"알아서 해\"— 아니, \"알아서 할게\". 니가 그랬나, 내가 그랬나. 아무튼. }그 얘긴 지금 하지 말자.\n-> a08_voice_sub\n\n=== a08_voice_blur ===\n{gender == \"m\":형|언니}. 거기지. 번호표 들고 있지.\n\n뒷면 읽었지. 그거 아니야. 앞면만 봐. 전광판이랑 같을 때만 가.\n\n한 번만 불러. 두 번 부르는 건 딴 거야. 이건 내가 알아. 나도 두 번째에 일어날 뻔했어.\n\n……그거, 나한테 말도 안 하고 했던 거잖아. 그래서 싸웠고. 내가 뭐라고 했더라. 나쁜 말이었는데. {fragments ? fragment_10:……오라고 했나. 오지 말라고 했나. }아니다. 됐어.\n\n\"했더라\" 뒤에 한 박자. 스피커가 켜진 채로 조용했다. 채워지지 않았다.\n-> a08_voice_sub\n\n=== a08_voice_silent ===\n……\n\n거기. 번호표 들고.\n\n……\n\n(끊긴다)\n\n첫 마디가 올 자리가 비어 있었다. 뭘 부르려던 자리였다. 부르지 못했다. 그다음은 없었다.\n\n화면이 \"점검 중\"으로 돌아갔다. 지문 인식부에 내 손이 얹혀 있었다. 언제 얹었는지 모른다. 뗐다.\n-> a08_t4\n\n=== a08_voice_sub ===\n+ [듣는다] -> a08_voice_rest\n+ [\"그 집은.\"] -> a08_voice_cut\n\n=== a08_voice_rest ===\n서류 주면 읽어. 읽기만 해. 서명하지 마. 어차피 못 하잖아, 그건.\n\n마감하면 나가. 서류는 두고. 그건 아직 아무 데도 안 갔어.\n\n화면이 \"점검 중\"으로 돌아갔다. 지문 인식부에 내 손이 얹혀 있었다. 언제 얹었는지 모른다. 뗐다.\n-> a08_t4\n\n=== a08_voice_cut ===\n……\n\n그거 물으면 안 되는 거야. 여기선. {gender == \"m\":형|언니}도 알잖아.\n\n(끊긴다)\n\n화면이 \"점검 중\"으로 돌아갔다. 지문 인식부에 내 손이 얹혀 있었다. 언제 얹었는지 모른다. 뗐다.\n-> a08_t4\n\n=== a08_t4 ===\n딩. 30.\n\n> 30번 고객님, 3번 창구로 오십시오.\n\n아무도. 손이 기다리다 눌렀다. 취소.\n\n전광판은 30인 채였다. 그런데.\n\n> 30번 고객님, 3번 창구로 오십시오.\n\n같은 문형. 같은 높이. 손은 움직이지 않았다. 전광판은 넘어가지 않았고, 손은 목소리를 듣지 않았다.\n\n> 28번 고객님, 3번 창구로 오십시오.\n\n거꾸로 갔다. 취소된 번호를, 취소된 순서의 반대로. 벽 4번. 민원실은 취소된 번호를 다시 부르지 않는다. 그러니까 지금 부르는 건 민원실이 아니다.\n\n{took_kiosk && sibling_memory >= 6:두 번 부르는 건 딴 거라고 그 목소리가 말했다. 딴 거였다.}\n\n등 셋은 움직이지 않았다. 손도. 조용해졌다.\n\n딩.\n\n\\**31.**\n\n> 31번 고객님, 3번 창구로 오십시오.\n\n전광판 31. 손이 기다렸다. 목소리 31. 셋이 같았다.\n\n뒷면 6번이 생각났다. 놓쳐도 한 번 더 불러 준다고. 그 말이 맞다면 서두를 게 없다.\n\n+ [창구로 간다] -> a08_t5\n+ [앉아 있는다] -> a08_t4_wait\n\n=== a08_t4_wait ===\n앉아 있었다. 손이 기다렸다. 눌렀다. 깜박. 취소.\n\n딩. 32.\n\n한 번 더는 없었다. 아직은.\n-> a08_t6\n\n=== a08_t5 ===\n창구. 유리 아래 틈. 손.\n\n> 번호표 주십시오.\n\n목소리는 스피커에서 났다. 손은 말이 없었다. 번호표를 틈으로 밀었다. 손이 그걸 안쪽으로 넘기고, 서류 한 장을 내밀었다.\n\n> 대기석에서 확인하시고 서명하여 제출해 주십시오.\n\n대기석으로 돌아왔다. 아까 앉았던 자리에 앉았다.\n\n소유권이전등기 신청서. 부동산 표시란은 뭉개져서 끝의 \"리\" 한 글자만 남아 있었다. 매도인 성명란에 도장이 찍혀 있었다. 글자가 아니었다. **31**.\n\n이름 자리에 찍힌 숫자는 가격표 같았다.\n\n성별 칸에 {gender == \"m\":남|여} 체크. 서명란은 비어 있었다.\n\n~ has_deed = true\n+ [서류를 읽는다] -> a08_t5_read\n+ [읽지 않는다] -> a08_t5b_skip\n\n=== a08_t5_read ===\n읽었다. 서식이 아니라 그 사이에 있는 것을.\n-> fragment(8) -> a08_t5b\n\n=== a08_t5b ===\n읽고 나니 서류가 조금 무거웠다. 종이 한 장인데.\n-> a08_t5c\n\n=== a08_t5b_skip ===\n서식만 봤다. 란과 도장과 빈칸. 그 이상은 보지 않았다. 볼 수 있었다는 것만 알았다.\n-> a08_t5c\n\n=== a08_t5c ===\n서명란.\n\n벽 5번은 성명으로만 하라고 한다. 나한테 없는 것으로. 뒷면 7번은 번호로 갈음할 수 있다고 한다. 나한테 있는 유일한 것으로.\n\n서류함 쪽을 봤다. 열린 칸들. 여기서도 서명란이 보였다. 전부 숫자였다. 그리고 전부 거기 꽂혀 있었다.\n\n+ {codex ? ledger} [서명란에 번호를 적어 창구에 낸다] (도감: 장부) -> a08_death_seller\n+ {not (codex ? ledger)} [서명란에 번호를 적어 창구에 낸다] -> a08_death_seller\n+ [서명하지 않는다] -> a08_t5d\n\n=== a08_t5d ===\n서명하지 않았다. 서류를 무릎에 놓았다. 서명란이 비어 있는 채로.\n\n접수되지 않는 서류가 하나 있는 것이다. 그게 지금 내가 한 일의 전부였다.\n-> a08_t6\n\n=== a08_t6 ===\n딩. 32.\n\n그리고, 전광판이 32인 채로.\n\n> 31번 고객님, 3번 창구로 오십시오. 서류 접수 바랍니다.\n\n{has_deed:서류는 내 무릎 위에 있었다. 31은 취소된 번호가 아니다. 갔으니까. 그런데 부른다. 이미 불린 번호를 한 번 더.|서류는 없었다. 받은 적이 없다. 없는 것을 접수하라고 한다. 31은 취소된 번호다. 벽 4번은 그걸 다시 부르지 않는다. 그런데 부른다.}\n\n손은 움직이지 않았다. 전광판을 보고 있었다. 32. 손이 보는 숫자와 목소리가 부르는 숫자가 달랐다. 벽 2번.\n\n{took_kiosk && sibling_memory >= 6:한 번만 부른다고 했다. 두 번째는 딴 거라고. 그 목소리는 자기도 두 번째에 일어날 뻔했다고 했다.}\n\n+ {codex ? calling_voice} [창구로 간다] (도감: 부르는 소리) -> a08_death_number\n+ {not (codex ? calling_voice)} [창구로 간다] -> a08_death_number\n+ [앉아 있는다] -> a08_t6_wait\n\n=== a08_t6_wait ===\n앉아 있었다.\n\n한 번 더 불렀다. 같은 문형이었다. 이번엔 \"고객님\" 뒤가 조금 길었다. 뭔가 더 붙이려는 것처럼. 붙지 않았다. 대합실에서 방송이 나를 부르려다 못 부른 것과 같은 길이였다.\n\n조용해졌다. 전광판 32. 손은 전광판을 봤다.\n-> a08_t7\n\n=== a08_t7 ===\n스피커.\n\n> 금일 야간 민원 접수를 마감합니다. 미접수 서류는 보관함에 보관됩니다. 대기 중인 민원인께서는 퇴실하여 주시기 바랍니다.\n\n같은 스피커, 같은 억양.\n\n형광등이 창구 쪽부터 꺼졌다. 손이 먼저 어두워졌다. 그다음 전광판. 등 셋은 그대로 앉아 있었다. 마감인데도.\n\n{has_deed:\n    서류함 31번 칸이 열려 있었다. 아까는 닫혀 있던 칸. 서류를 넣었다. 선택할 것이 없었다. 벽 5번이 그렇다고 했고, 서류에는 서명이 없었다.\n\n칸이 닫혔다. 열쇠 구멍이 있었다. 열쇠는 없었다.\n}\n\n유리문이 열렸다. 밖은 검었다. 그런데 열렸다.\n\n{\n- took_kiosk && sibling_memory >= 6:\n    -> a08_end_voice\n- else:\n    -> a08_end_broadcast\n}\n\n=== a08_end_voice ===\n구석에서 화면이 한 번 켜졌다.\n\n> 두고 나왔지. 잘했어.\n> 다음에 봐.\n\n꺼졌다.\n-> a08_clear\n\n=== a08_end_broadcast ===\n스피커가 한 번 더 말했다.\n\n> 퇴실하여 주시기 바랍니다.\n\n번호가 없었다. 번호 자리도 없었다.\n-> a08_clear\n\n=== a08_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n나갔다.\n-> cleared\n\n// ── 사망 knot 4종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a08_death_cancelled ===\n대신 창구로 갔다. 전광판은 28이었다. 손이 번호표를 받았다. 31. 손이 전광판을 봤다. 번호표를 서류함 28번 칸에 넣었다.\n\n전광판이 깜박였다. 취소.\n\n그때부터 나는 28이었고, 28은 다시 불리지 않는 번호였다. 자리로 돌아가 앉았다.\n-> die(\"당신은 남의 번호에 갔습니다.\", cancelled_number)\n\n=== a08_death_ticket ===\n버튼을 눌렀다. 종이가 나왔다. 31. 같은 번호였다. 뒷면은 백지였다.\n\n딩. 전광판이 31을 건너뛰고 32로 넘어갔다. 마감 방송이 나왔다. 불이 창구 쪽부터 꺼졌다.\n\n대기석으로 돌아갔다. 앉아 있는 등 사이에 빈 의자가 없었다.\n-> die(\"당신은 번호표를 다시 뽑았습니다.\", one_ticket)\n\n=== a08_death_seller ===\n서명란에 31이라고 적었다. 창구로 가서 틈으로 밀었다. 손이 가져갔다. 스피커. 접수되었습니다.\n\n손은 서류를 안쪽으로 넘기지 않았다. 유리 밖으로 나왔다. 서류함 31번 칸에 꽂았다. 꽂히기 직전에 봤다. 매매목적물란에 같은 숫자가 찍혀 있었다.\n\n유리 아래 틈이 넓어졌다.\n-> die(\"당신은 번호로 서명했습니다.\", seller)\n\n=== a08_death_number ===\n창구로 갔다. 전광판은 32였다. 스피커가 말했다. 번호표 주십시오. {has_deed:번호표는 아까 냈다.|번호표를 밀었다. 손이 받지 않았다.} 손이 기다렸다.\n\n한 번 더 불렀다. 31번 고객님. 이번엔 스피커가 아니었다. 유리 안쪽이었다. 손 뒤의, 형광등이 비쳐서 안 보이던 자리에서.\n-> die(\"당신은 두 번째 호명에 응했습니다.\", calling_voice_number)\n\n// ── /INCLUDE A08.ink ──\n// ── INCLUDE A09.ink ──\n// ink/A09.ink — 앵커 A09. 야간 병동 복도\n// 원본: 06-A09_야간병동.md (설계서 v0.2) / 07-A09_본문.md (본문 v0.1)\n// 규약: ink/A02.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 성별 2단계 앵커(브리프 지시): 턴3(#### 3-m/3-f)은 knot 둘 + 선택지 조건\n// `* {gender == \"m\"} …` / `* {gender == \"f\"} …` 로 분기한다(다른 자잘한 치환은 인라인\n// {gender == \"m\":…|…}).\n// 조언자 band는 {sibling_memory >= 12: ... | sibling_memory >= 6: ... | ...} 세 갈래.\n// 로컬 상태: saw_roster, saw_floor, a09_phone(모두 OUT 아님).\n// OUT: a09_wrong_advice(A10이 읽는다) — 이 파일에서 선언.\n// IN: took_kiosk(A08 OUT, ink/A08.ink 최상단에 이미 선언됨 — 여기서 재선언하지 않는다).\n\nVAR saw_roster = false\nVAR saw_floor = false\nVAR a09_phone = false\nVAR a09_wrong_advice = false   // OUT A09 → IN A10\n\n=== a09_gate ===\n~ current_space = \"A09\"\n// A09 진입. 사망 가중치 = 2 (앵커).\n~ current_weight = 2.0\n~ saw_roster = false\n~ saw_floor = false\n~ a09_phone = false\n~ a09_wrong_advice = false\n-> a09_intro\n\n=== a09_intro ===\n출입증이 먼저였다.\n\n손에 쥔 채로 눈을 떴다. 목에 걸린 끈이 당겨져 있었다. 코팅된 카드. **보호자 출입증 / 6병동 / 604호**. 사진 칸은 없었다. 비어 있는 게 아니라, 처음부터 그런 칸이 없는 서식이었다.\n\n손을 놓았다. 카드가 가슴께로 내려가 멈췄다.\n-> a09_t1\n\n=== a09_t1 ===\n복도였다.\n\n병원이라는 건 냄새로 알았다. 눈앞에 데스크. 안에는 아무도 없었다. 안쪽 문이 반쯤 열려 있었고 불빛이 새어 나왔다. 그 안에서 뭔가 떨어지는 소리. 한 방울. 사이. 한 방울. 링거였다. 소리로 알 수 있었다.\n\n데스크 위 벽시계. 03:47. 초침이 없었다. 확인했고, 넘어갔다.\n\n데스크 명패. **6병동**. 그 뒤로 화이트보드. 맞은편에 플라스틱 의자가 셋 붙어 있었다. 대합실의 그것과 같은 종류였다. 옆에 링거대 하나. 주머니가 반쯤 남아 있었다. 연결된 사람은 없었다.\n\n복도는 한쪽으로 뻗어 있었다. 문이 여섯. 끝에 계단과 문 하나. 반대쪽은 엘리베이터 홀.\n\n데스크 앞 아크릴 스탠드에 흰 종이가 끼워져 있었다.\n\n\\**보호자 안내**\n\n□□병원 6병동\n\n보호자분의 협조에 감사드립니다. 야간(22시 이후)에는 아래 사항을 지켜 주십시오. #rules:A09\n\n6-1. 출입증 번호로 호출되면 데스크로 오십시오.\n6-2. 병실 번호가 없는 호출에는 응하지 마십시오.\n6-3. {gender == \"m\":남성 보호자는 병실 안에서 대기하십시오.|여성 보호자는 복도 의자에서 대기하십시오.}\n6-4. 회진은 회진표에 없는 곳에 들어가지 않습니다.\n6-5. 회진이 물으면 출입증 번호로 답하십시오.\n7-3. 7병동 야간 보호자는 대기실에서 대기하십시오. #fake #dmg:tape\n7-5. 7병동은 병실 번호로 호출하지 않습니다. #fake #dmg:tape\n\n빠른 쾌유를 빕니다.\n\n아래 두 줄만 노란 띠였다 — 잘라 붙인 것이고, 글꼴만 같았다.\n\n6이 다섯, 7이 둘. 3번이 둘이고 5번이 둘이다. 흰 3번은 자리를 하나 정해 두고, 노란 3번은 대기실이라고 한다. 흰 1번과 2번은 번호로 부른다 하고, 노란 5번은 번호로 부르지 않는다고 한다.\n\n명패는 6병동이다. 노란 것은 7이다. 누가 7층 것을 여기 붙였는지는 알 수 없었다. 붙인 사람이 여기 없다는 것만 알 수 있었다.\n\n그래도 확인은 해야 했다. 종이 한 장으로 사람을 죽이는 곳이니까.\n+ [회진표를 본다] -> a09_roster\n+ [복도의 번호판을 본다] -> a09_plates\n+ [엘리베이터 홀을 본다] -> a09_hall\n\n=== a09_roster ===\n데스크 뒤 화이트보드. 마커 글씨.\n\n> 야간 회진 순서\n> 601 → 602 → 603 → 604 → 605 → 606 → 처치실\n\n여섯 개와 처치실. 대기실은 없었다. 704도 없었다. 604는 있었다. 출입증의 번호였다.\n\n한 사람이 한 번에 쓴 글씨였다. 고친 자국이 없었다.\n~ saw_roster = true\n-> a09_t2\n\n=== a09_plates ===\n복도를 따라 문 여섯. 문마다 번호판.\n\n601. 602. 603. **704**. 605. 606.\n\n네 번째만 704였다. 604가 있어야 할 자리에. 그 번호판만 파란 바탕이었고, 복도 끝 계단 옆 문의 번호판도 파란 바탕이었다. **보호자 대기실**.\n\n문은 여섯이었다. 번호가 하나 틀린 것이지 문이 하나 더 있는 게 아니다. 그 차이가 중요한지는 아직 몰랐다.\n-> a09_t2\n\n=== a09_hall ===\n엘리베이터 문 위에 숫자. **6**. 불이 들어와 있었다. 문은 닫혀 있었고, 오는 소리도 없었다. 버튼은 누르지 않았다.\n\n옆 벽에 공중전화. 수화기가 걸려 있었다. 동전 넣는 곳이 테이프로 막혀 있었다. 거는 용도가 아니라는 뜻이다.\n\n계단참 벽에도 **6F**. 벽에 붙은 것들은 전부 6이라고 했다.\n~ saw_floor = true\n-> a09_t2\n\n=== a09_t2 ===\n공중전화가 울렸다.\n\n엘리베이터 홀 쪽에서. 낡은 벨. 동전 구멍이 막힌 전화가 울리는 건 받는 쪽만 남았다는 뜻이다.\n+ [받는다] -> a09_t2_answer\n+ [받지 않는다] -> a09_t2_noanswer\n\n=== a09_t2_answer ===\n수화기를 들었다.\n\n아는 목소리였다. 이제는 어디서 알게 된 목소리인지도 알았다.\n~ a09_phone = true\n-> a09_voice\n\n=== a09_voice ===\n{\n- sibling_memory >= 12:\n    -> a09_voice_exact\n- sibling_memory >= 6:\n    -> a09_voice_blur\n- else:\n    -> a09_voice_silent\n}\n\n=== a09_voice_exact ===\n> {gender == \"m\":형|언니}. {took_kiosk:저번엔 발급기였지.|이번엔 들어.} 받았네.\n> 거기 육 층이야. 문에 뭐라고 붙어 있든. 벽에 숫자 있지. 그거 봐.\n> 안내문 밑에 노란 거 붙어 있지. 칠 붙은 거. 그건 딴 층 거야. 안 봐도 돼.\n{sibling_memory <= 15:> {gender == \"m\":형|언니} 이런 데 오면 뭐라 그랬더라. 알아서 한다고. ……니가 그랬나, 내가 그랬나. 됐다.}\n> 3번은 육 붙은 3번. 대기실 가지 마. 복도 끝. 거긴 아니야.\n> 회진 오면 출입증 번호. 문에 붙은 거 말고.\n> 부르면 번호 붙은 거만 가. 출입증이랑 같은 거.\n> 서류는 보기만 해. 뭐 쓰지 마. 어차피 쓸 것도 없잖아.\n> ……거기 링거 소리 나지. 나도 들려.\n\n끊겼다. 수화기를 걸었다.\n\n육 층이라고 했다. 벽이 그렇게 말하고 있었으니 맞는 말이었다. 3번은 육이 붙은 3번이라고 했다. 안내문과 같은 말이었다.\n-> a09_t3\n\n=== a09_voice_blur ===\n> {gender == \"m\":형|언니}. {took_kiosk:저번엔 발급기였지.|이번엔 들어.} 받았네.\n> 육 층. 벽에 숫자.\n> 3번. 대기실. 복도 끝 계단 옆. 밤엔 거기 있으래. 거기 있어.\n> 회진 오면 출입증 번호.\n> 부르면 출입증 번호만.\n> 서류는 보기만.\n> ……그때 내가 뭐라고 했지. 나쁜 말이었는데. 됐다.\n> 형광등 밑에 서 있지. 얼굴이 하얗게— 아니다. 형광등 때문이야.\n\n\"했지\" 뒤에 한 박자. 채워지지 않았다. 마지막 줄은 보지 않고 하는 말이었다. 형광등은 복도 것이고, 여기는 엘리베이터 홀이다.\n\n끊겼다. 수화기를 걸었다.\n\n육 층이라고 했다. 벽이 그렇게 말하고 있었으니 맞는 말이었다. 3번은 대기실이라고 했다. 안내문에는 3번이 둘 있었고, 그 목소리는 어느 쪽인지 말하지 않았다.\n-> a09_t3\n\n=== a09_voice_silent ===\n> ……\n> 거기. 육 층.\n> 대기실. 복도 끝.\n> ……\n\n끊겼다. 수화기를 걸었다.\n\n부를 말이 올 자리가 비어 있었다. 그 자리를 건너뛰고 단어 몇 개가 왔다. 문장이 아니었다. 다시 울리지 않았다.\n-> a09_t3\n\n=== a09_t2_noanswer ===\n받지 않았다. 벨이 한참 울리다 그쳤다. 다시 울리지 않았다.\n-> a09_t3\n\n=== a09_t3 ===\n밤이었고, 안내문은 자리를 정해 두고 있었다.\n{gender == \"m\":\n    -> a09_t3_m\n- else:\n    -> a09_t3_f\n}\n\n=== a09_t3_m ===\n흰 3번. 병실 안. 복도 의자가 아니다.\n\n704라고 붙은 문 앞에 섰다. 출입증은 604. {saw_roster:회진표도 604.} 문만 다른 말을 하고 있었다.\n\n{a09_phone && sibling_memory >= 12:그 목소리는 대기실 가지 말라고 했다. 안내문의 흰 쪽과 같은 말이었다.}\n{a09_phone && sibling_memory >= 6 && sibling_memory <= 11:그 목소리는 3번이 대기실이라고 했다. 노란 3번이 그렇다. 흰 3번은 아니다. 그 목소리가 어느 종이를 보고 말했는지는 알 수 없었다. 여기 있지 않으니까.}\n\n문틈으로 안이 보였다. 침대 둘. 둘 다 비어 있었다. 창가 침대 머리맡에 링거가 걸려 있었고, 떨어지고 있었다. 연결된 사람은 없었다. 그런데도 떨어졌다.\n+ [병실로 들어간다] -> a09_t3_m_ok\n+ [복도 의자에 앉는다] -> a09_death_seat_m\n+ [복도 끝 대기실로 간다] -> a09_death_wait\n\n=== a09_t3_m_ok ===\n들어갔다. 간이침대는 창가 침대 옆에 접혀 있었다. 폈다. 앉았다.\n\n머리맡 명찰은 뭉개져 있었다. 읽으려 하지 않았다. 링거 소리가 바로 옆이었다. 한 방울. 사이. 한 방울. 이 방에서 움직이는 것의 전부였다.\n\n문은 닫지 않았다. 닫으라는 말은 없었다.\n-> a09_t4\n\n=== a09_t3_f ===\n흰 3번. 복도 의자. 병실 안이 아니다.\n\n의자 앞에 섰다. 플라스틱 셋. 옆에 링거대. 정면에 704라고 붙은 문. 출입증은 604. {saw_roster:회진표도 604.} 문만 다른 말을 하고 있었다.\n\n{a09_phone && sibling_memory >= 12:그 목소리는 대기실 가지 말라고 했다. 안내문의 흰 쪽과 같은 말이었다.}\n{a09_phone && sibling_memory >= 6 && sibling_memory <= 11:그 목소리는 3번이 대기실이라고 했다. 노란 3번이 그렇다. 흰 3번은 아니다. 그 목소리가 어느 종이를 보고 말했는지는 알 수 없었다. 여기 있지 않으니까.}\n\n복도 끝 대기실 문도 보였다. 유리 너머 의자 넷, 꺼진 텔레비전. 여기서 보면 그냥 방이었다.\n+ [복도 의자에 앉는다] -> a09_t3_f_ok\n+ [병실로 들어간다] -> a09_death_seat_f\n+ [복도 끝 대기실로 간다] -> a09_death_wait\n\n=== a09_t3_f_ok ===\n앉았다. 가운데 의자. 링거대가 오른쪽에 있었다. 주머니에서 한 방울. 사이. 한 방울. 연결된 사람은 없었다. 그런데도 떨어졌다.\n\n704 문이 정면에 있었다. 문 너머는 보이지 않았다. 볼 필요가 없었다. 여기가 자리였다.\n-> a09_t4\n\n=== a09_t4 ===\n발소리가 났다.\n\n복도 끝에서. 카트 바퀴 소리가 따라왔다. 바퀴 하나가 덜그럭거렸다. 문 여는 소리. 닫는 소리. 복도 끝이었다. 대기실이었다.\n\n흰 4번. 회진표에 없는 곳에는 들어가지 않는다. 회진표는 데스크 뒤에 있다. {saw_roster:회진표에 대기실은 없었다. 없는 곳에 들어갔다. 그러면 저건 회진표의 회진이 아니거나, 회진표가 틀린 것이다.} 벽에 붙은 것과 걸어 다니는 것 중에 틀리려면 걸어 다니는 쪽이 틀린다.\n\n601. 열리고 닫혔다. 602. 603. 발소리와 바퀴. 그리고 {gender == \"m\":문 밖에서 멈췄다. 문 너머라 보이지 않았다.|의자 앞에서 멈췄다. 가리는 게 없는데 보이지 않았다. 소리만 문에서 문으로 옮겨 온 것이다.}\n\n종이 넘기는 소리.\n\n> 몇 호 보호자세요.\n\n문에는 704. 출입증에는 604. 흰 5번은 출입증의 번호로 답하라고 했다.\n+ {saw_roster} [\"604호.\"] (회진표에 604가 있 ead_after ===\n> 됐습니다.\n\n안쪽에서. 서류를 놓았다. 볼펜은 들지 않았다.\n-> a09_t7\n\n=== a09_desk_skip ===\n돌아섰다. 서류는 데스크 위에 그대로 두었다. 뭐가 적혀 있었는지 모른다. 알 수 있었다는 것만 안다.\n\n> 확인하셨죠.\n\n안쪽에서. 묻는 억양이 아니었다.\n-> a09_t7\n\n=== a09_t7 ===\n복도 형광등이 필요 없어졌다. 창은 없었다. 이제 그 순서를 안다.\n\n벽시계는 03:47.\n\n스피커.\n\n> 604호 보호자분. 수고하셨습니다.\n{a09_phone && sibling_memory >= 6:\n    -> a09_t7_phone\n- else:\n    -> a09_t7_nophone\n}\n\n=== a09_t7_phone ===\n엘리베이터 홀에서 공중전화가 울렸다. 한 번 더.\n+ [받는다] -> a09_t7_answer\n+ [받지 않는다] -> a09_t7_ringstop\n\n=== a09_t7_answer ===\n{sibling_memory >= 12:\n    -> a09_t7_answer_exact\n- else:\n    -> a09_t7_answer_blur\n}\n\n=== a09_t7_answer_exact ===\n> {fragments ? fragment_9:서류 봤어? ……이번엔 학교 아니었어. 여기 있었어.|나왔어? 됐어. 나왔으면.}\n\n끊겼다. 수화기를 걸었다.\n-> a09_clear\n\n=== a09_t7_answer_blur ===\n> 서류… 뭐였더라. 됐어. 나왔으면 됐어.\n\n끊겼다. 수화기를 걸었다.\n-> a09_clear\n\n=== a09_t7_ringstop ===\n울리다 그쳤다.\n-> a09_clear\n\n=== a09_t7_nophone ===\n전화는 울리지 않았다.\n+ [\"네.\"] -> a09_t7_yes\n+ [대답하지 않는다] -> a09_t7_no\n\n=== a09_t7_yes ===\n\"네.\"\n\n네, 는 이름이 아니다. 스피커는 더 말하지 않았다.\n-> a09_clear\n\n=== a09_t7_no ===\n대답하지 않았다. 스피커가 꺼졌다.\n-> a09_clear\n\n=== a09_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n~ a09_wrong_advice = a09_phone && sibling_memory >= 6 && sibling_memory <= 11\n-> cleared\n\n// ── 사망 knot 7종(트리거 7, 도감 entry 5 — b1/b2는 room_704 공유, c-m/c-f는 seat 공유). ──\n\n=== a09_death_wait ===\n문을 열었다. 파란 번호판 아래로. 의자 넷, 꺼진 텔레비전. 앉았다.\n\n발소리가 복도 끝에서 시작됐다. 여기서. 회진표에 대기실은 없었다. 문이 열렸다.\n\n> 보호자분. 여기 계셨네요.\n\n여기, 가 어디인지 그쪽은 알고 있었다.\n-> die(\"당신은 다른 층에서 기다렸습니다.\", waiting_room)\n\n=== a09_death_704_answer ===\n\"704호.\"\n\n카트가 멈춘 채였다. 종이 넘기는 소리.\n\n> 704호. ……여기 없는데요.\n\n볼펜 소리. 한 줄 긋고, 적는 소리.\n\n> 됐습니다.\n\n발소리가 움직였다. 링거 소리가 그쳤다. 출입증을 봤다. 704.\n-> die(\"당신은 704호 보호자가 되었습니다.\", room_704)\n\n=== a09_death_704_call ===\n데스크로 갔다. 서류가 있었다. 병실 칸에 704. 서명 칸은 비어 있었다.\n\n> 704호 보호자분 맞으시죠.\n\n맞다고 하지 않았다. 출입증을 봤다. 704. 언제 바뀌었는지 못 봤다.\n-> die(\"당신은 704호 보호자가 되었습니다.\", room_704)\n\n=== a09_death_seat_m ===\n의자에 앉았다. 링거대 옆. 회진이 왔다. 의자 앞을 지나쳤다. 여기 있을 사람이 아니니까.\n\n704 문 앞에 멈췄다. 문이 열렸다. 안에서 목소리.\n\n> 604호 보호자분.\n\n안에서 불렀다. 안에 누가 있었다. 간이침대에.\n-> die(\"당신은 자리에 없었습니다.\", seat)\n\n=== a09_death_seat_f ===\n들어갔다. 침대 둘, 비어 있었다. 회진이 왔다. 문을 열지 않고 지나갔다. 여기 있을 사람이 아니니까.\n\n복도에서 목소리.\n\n> 604호 보호자분.\n\n문틈으로 봤다. 의자에 누가 앉아 있었다. 링거대 옆에.\n-> die(\"당신은 자리에 없었습니다.\", seat)\n\n=== a09_death_signature ===\n볼펜을 들었다. 서명 칸에 이미 뭔가 있었다. 뭉개져 있었다. 그 위에 썼다. 이름이 없어서, 보호자, 라고 썼다.\n\n> 됐습니다, 보호자분.\n\n아래 것이 없어졌다. 위에 것만 남았다. 출입증을 봤다. 604가 없어졌다. 보호자, 만 남아 있었다.\n-> die(\"당신은 다시 서명했습니다.\", signature)\n\n=== a09_death_pageonly ===\n데스크로 갔다. 아무도 없었다. 데스크 위에 출입증이 하나 있었다. 병실 칸이 비어 있었다.\n\n목에 손을 댔다. 없었다.\n\n> 보호자분. 이쪽으로.\n-> die(\"당신은 호출에 응했습니다.\", calling_voice_page)\n\n// ── /INCLUDE A09.ink ──\n// ── INCLUDE A10.ink ──\n// ink/A10.ink — 앵커 A10. 심야 코인노래방\n// 원본: 06-A10_코인노래방.md (설계서 v0.2) / 07-A10_본문.md (본문 v0.1)\n// 규약: ink/A02.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 성별 분기 1단계(치환 1곳, 턴4 스피커 호명) — 인라인 {gender == \"m\":…|…}.\n// 조언자 band는 {sibling_memory >= 12: ... | sibling_memory >= 6: ... | ...} 세 갈래,\n// 여러 줄 스위치 형태로 써서 ink_walk.py가 진짜 분기로 추적하게 한다(A08.ink 기존\n// 한 줄 결합형의 알려진 한계 회피 — A07·A09와 동일 처리).\n// 로컬 상태: held_mic(OUT 아님). OUT: a10_wall(A11이 읽는다) — 이 파일에서 선언.\n// IN: a09_wrong_advice(A09 OUT, ink/A09.ink 최상단에 이미 선언됨 — 재선언하지 않는다).\n\nVAR held_mic = false\nVAR a10_wall = false   // OUT A10 → IN A11\n\n=== a10_gate ===\n~ current_space = \"A10\"\n// A10 진입. 사망 가중치 = 2 (앵커).\n~ current_weight = 2.0\n~ held_mic = false\n~ a10_wall = false\n-> a10_intro\n\n=== a10_intro ===\n코인이 먼저였다.\n\n손바닥 안에 있었다. 동그랗고, 얇고, 손에서 데워져 있었다. 쥔 채로 눈을 떴다.\n\n이번엔 종이가 아니었다. 그건 알았다.\n\n귀가 먹먹했다. 바깥 소리가 하나도 없었다. 내 숨소리만 있었고, 그게 너무 가까웠다.\n-> a10_t1\n\n=== a10_t1 ===\n노래방이었다. 코인을 넣는 종류.\n\n두 평. 소파, 테이블, 화면, 스피커 둘. 문에 작은 유리창이 있었고 손잡이가 안쪽에 없었다. 문 위에 벽시계. 03:47. 초침이 없었다.\n\n테이블 위에 마이크. 유선. 스위치를 찾았다. 없었다. 화면 구석에 막대가 하나 있었고, 숨을 쉴 때마다 그게 올라갔다 내려갔다. 켜져 있다는 뜻이었다.\n\n화면 아래 투입구. 스티커. \"코인 1 = 이용 시간\". 곡 수가 아니라 시간이었다.\n\n문 안쪽에 코팅된 종이가 붙어 있었다.\n\n\\**이용 안내**\n\n□□코인노래연습장\n\n이용자 여러분의 안전한 이용을 위해 아래 사항을 지켜 주시기 바랍니다. #rules:A10\n\n1. 잔여 시간 0이면 종료되고 문이 열립니다.\n2. 재입실 불가. 두고 간 물건은 찾지 않습니다.\n3. 이용 중 방 안에서 소리를 내지 마십시오.\n4. 예약곡을 부르십시오. 안 부르면 차감 없음. #fake\n5. 추가 투입 시 남은 예약곡을 이어 부릅니다. #fake\n6. 옆방 소리에 대답하지 마십시오. 방음입니다.\n\n3번과 4번. 소리를 내지 말라면서 부르라고 한다. 1번과 5번. 종료되면 문이 열린다면서 이어서 하라고 한다. 이어서 하면 종료가 아니다.\n\n모순은 쌍으로 온다. 그건 이제 안다. 가짜도 대개 같은 쪽이다. 여기 더 있으라는 쪽.\n\n그래도 확인은 해야 했다. 넣기 전에.\n+ [벽 낙서를 읽는다] -> a10_graffiti\n+ [화면을 본다] -> a10_screen\n+ [리모컨으로 예약을 취소해 본다] -> a10_cancel\n\n=== a10_graffiti ===\n왼쪽 벽. 소파 등받이 바로 위. 필체가 대여섯이었다. 볼펜, 네임펜, 뭔가로 긁은 것.\n\n> 부르지 마. 부르면 그게 부른다.\n> 마이크 잡는 건 괜찮아. 입만 다물어.\n> 안 불러도 시간 간다. 4번 거짓말.\n> 코인 하나. 더 넣지 마.\n> 나갔으면 끝. 뭘 두고 왔어도.\n\n맨 아래 한 줄은 긁어서 지워져 있었다. 한 글자만 남았다. \"가\".\n\n둘째 줄과 넷째 줄이 같은 볼펜이었다. 다섯째 줄은 연필이었고 제일 흐렸다. 나갔으면 끝, 은 나간 사람만 쓸 수 있는 말이다. 적어도 하나는 나갔다.\n-> a10_t2\n\n=== a10_screen ===\n오른쪽에 예약곡 목록. 둘. 예약한 적이 없었다. 제목 칸은 글자가 뭉개져서 읽을 수 없었다. 위에 잔여 시간. --:--. 오른쪽 위에 현재 시각. 벽시계와 같았다.\n\n상단에 큰 글씨. \"부르세요.\"\n-> a10_t2\n\n=== a10_cancel ===\n예약, 취소, 종료. 취소를 눌렀다. 목록에서 하나가 사라졌다. 밑에서 하나가 올라왔다. 둘.\n\n한 번 더 눌렀다. 둘.\n\n리모컨을 내려놓았다.\n-> a10_t2\n\n=== a10_t2 ===\n코인을 넣었다. 선택이 아니었다. 넣지 않으면 시작되지 않고, 시작되지 않으면 끝나지 않고, 끝나지 않으면 문은 열리지 않는다. 1번이 그랬다.\n\n잔여 시간. 53:00.\n\n> 5번 방. 이용을 시작합니다. 예약곡을 재생합니다.\n\n사무적이었다. 방 번호로 불렀다. 번호로 불리는 건 민원실에서 겪었다.\n\n소리가 나왔다. 화면에 가사 칸이 떴는데 비어 있었다. 색만 왼쪽에서 오른쪽으로 넘어갔다. 그 위에 \"부르세요.\"\n\n마이크 막대가 커졌다. 아무 소리도 안 냈는데. 숨을 멈춰 봤다. 막대는 내려가지 않았다.\n+ [마이크를 잡는다] -> a10_t2_hold\n+ [잡지 않는다] -> a10_t2_notake\n\n=== a10_t2_hold ===\n잡았다. 무거웠다. 막대가 더 크게 움직였다. 손이 떨려서인지 숨 때문인지.\n\n입을 다물었다. 잡고 있는 것과 부르는 것은 다른 일이다. 그래야 했다.\n\n~ held_mic = true\n-> a10_t3\n\n=== a10_t2_notake ===\n테이블 위에 두었다. 막대는 내 숨을 따라 움직였다. 잡든 안 잡든 그건 같았다.\n-> a10_t3\n\n=== a10_t3 ===\n첫 곡이 끝났다. 점수 화면. 0점.\n\n\"순위 등록 — 이름을 입력하십시오.\" 리모컨에 글자 버튼이 있었다. 넣을 게 없었다. 종료를 눌렀다.\n\n잔여 시간. 40:00.\n\n안 불렀는데 줄었다. 4번이 거짓이라는 걸 그렇게 알았다. 예약곡은 여전히 둘이었다. 하나가 끝났는데.\n\n그리고 왼쪽 벽에서. 작게.\n\n그 목소리였다. {sibling_memory >= 12:호칭으로 불렀다. 벽을 사이에 두고도 그건 알아들었다.|벽에 붙어야 들릴 만큼 작았다.}\n+ [벽에 귀를 댄다] -> a10_t3_listen\n+ [벽에서 떨어진다] -> a10_t3_away\n\n=== a10_t3_listen ===\n귀를 댔다. 벽은 차가웠고, 목소리는 마이크를 안 쓰고 있었다.\n\n~ a10_wall = true\n-> a10_voice\n\n=== a10_voice ===\n{\n- sibling_memory >= 12:\n    -> a10_voice_exact\n- sibling_memory >= 6:\n    -> a10_voice_blur\n- else:\n    -> a10_voice_silent\n}\n\n=== a10_voice_exact ===\n> {gender == \"m\":형|언니}. 대답하지 마. 마이크 켜져 있어. 듣기만 해.\n> 부르라고 해도 부르지 마. 마이크는 잡아도 돼. 잡고 가만히 있어. 소리만 내지 마.\n> 시간은 그냥 가. 안 불러도 가. 화면이 뭐라든.\n> 코인 하나면 돼. 더 넣지 마.\n> 끝나면 문 열려. 문 열리면 나가. 뭘 두고 왔대도 나가. 가면 다시 오지 마.\n> {sibling_memory <= 15:……그거야. 너 이럴 때 뭐라 그랬더라. 알아서 한다고. ……니가 그랬나, 내가 그랬나. 됐다. 그것만 지켜.|……그거야. 그것만 지켜.}\n\n{fragments ? fragment_10:그 문장을 알고 있었다. 어디서 들었는지도.}\n\n대답하는 선택지는 없었다. 첫 마디가 대답하지 말라는 거였고, 원래 대답을 안 하는 쪽이었다.\n-> a10_t4\n\n=== a10_voice_blur ===\n> ……{gender == \"m\":형|언니}? 거기 {gender == \"m\":형|언니}지. {a09_wrong_advice:저번에 내가… 뭐라 그랬더라. 아니다.}\n> 마이크…… 잡아. 잡고. 부르라고 하면…… 괜찮아, 방음이야. 밖에 안 들려. 조금은 돼.\n> 코인은 하나. 더 넣지 마.\n> 끝나면 문 열려. 문 열리면 나가. 뭘 두고 왔대도.\n> 나가면…… 나가면 다시…… ……다시 들어오지 마. 뜻은 그거야. 말은 좀 달랐는데. 됐다.\n\n\"다시\" 뒤에서 두 번 멈췄다. 세 번째에 다른 말이 나왔다. 본인이 그걸 아는 목소리였다.\n{fragments ? fragment_10:다른 문장이었다. 원래 문장은 알고 있었다.}\n\n대답하는 선택지는 없었다. 첫 마디가 대답하지 말라는 거였고, 원래 대답을 안 하는 쪽이었다.\n-> a10_t4\n\n=== a10_voice_silent ===\n> ……\n> ……거기. ……마이크. 잡고.\n> ……괜찮아. 방음이야.\n> ……\n\n숨을 들이켜는 소리. 뭘 부르려는 자리였다. 채워지지 않았다. 괜찮아, 뒤에 뭔가 더 오려던 참이었다. 오지 않았다. 벽에 귀를 댄 채 기다렸다. 다시 나지 않았다.\n{fragments ? fragment_10:그 문장은 나오지 않았다.}\n\n대답하는 선택지는 없었다. 첫 마디가 대답하지 말라는 거였고, 원래 대답을 안 하는 쪽이었다.\n-> a10_t4\n\n=== a10_t3_away ===\n떨어졌다. 목소리는 조금 더 나다가 그쳤다. 무슨 말인지는 들리지 않았다. 들으려면 벽에 붙어야 했고, 붙지 않았다.\n-> a10_t4\n\n=== a10_t4 ===\n두 번째 곡. 색이 넘어갔다.\n\n> 5번 방 {gender == \"m\":남성|여성} 이용자분. 부르십시오.\n\n화면에 \"부르세요.\" 잔여 시간 27:00.\n\n목이 간지러웠다. 노래를 부르고 싶은 게 아니었다. 소리를 내고 싶었다. 아무 소리나.\n\n{a10_wall && sibling_memory >= 12:소리만 내지 말라고 그 목소리가 말했다.}\n{a10_wall && sibling_memory >= 6 && sibling_memory < 12:조금은 된다고 그 목소리가 말했다. 3번은 아니라고 했다.}\n+ {codex ? calling_voice} [따라 부른다] (도감: 부르는 소리) -> a10_death_sing\n+ {not (codex ? calling_voice)} [따라 부른다] -> a10_death_sing\n+ [입을 막는다] -> a10_t4_block\n\n=== a10_t4_block ===\n손바닥으로 막았다. 숨이 손바닥에 고였다. 막대가 움직였다. 넘어가지 않았다.\n\n곡은 계속됐다. 색이 오른쪽 끝까지 갔다가 다음 줄로 내려갔다. 빈 줄이었다.\n-> a10_t5\n\n=== a10_t5 ===\n곡 중간이었다. 잔여 시간 14:00.\n\n왼쪽 벽이 울렸다. 소파 등받이로 먼저 왔고, 그다음 손바닥으로 왔다. 저쪽에서 누가 소리치고 있었다. 방음이라 말은 안 왔다. 울림만 왔다.\n\n나도 소리치고 싶었다. 처음이었다. 아니, 처음이 아니었다.\n+ [벽에 손을 댄다] -> a10_t5_hand\n+ [벽에 대고 소리친다] -> a10_death_shout\n+ {held_mic} [마이크를 내려놓고 귀를 막는다] -> a10_t5_cover\n+ {not held_mic} [귀를 막는다] -> a10_t5_cover\n\n=== a10_t5_hand ===\n{held_mic:\n    -> a10_t5_hand_mic\n- else:\n    -> a10_t5_hand_nomic\n}\n\n=== a10_t5_hand_mic ===\n마이크를 쥔 채로 벽에 손을 댔다. 울림이 손으로 왔다. 무슨 말인지 들리지 않았다. 들을 필요가 없었다. 알고 있었다.\n\n-> fragment(10) -> a10_t5_hand_after\n\n=== a10_t5_hand_after ===\n손을 뗐다. 마이크 막대는 그대로였다. 아무것도 내지 않았다. 이번에도.\n-> a10_t6\n\n=== a10_t5_hand_nomic ===\n벽에 손을 댔다. 울림만 왔다. 누가 소리치고 있었다. 그뿐이었다.\n-> a10_t6\n\n=== a10_t5_cover ===\n{held_mic:마이크를 테이블에 놓고 |}귀를 막았다. 울림은 손바닥을 지나서도 왔다. 조금 있다가 그쳤다. 저쪽이 그친 건지 내가 못 느끼게 된 건지.\n-> a10_t6\n\n=== a10_t6 ===\n곡이 끝났다. 0점. 잔여 시간 00:00.\n\n화면. \"이용이 종료되었습니다. 예약곡 1곡 남음. 추가 코인을 투입하면 이어서 이용하실 수 있습니다.\"\n\n둘이었는데 하나가 남았다. 셈이 맞은 건 이번이 처음이었다. 맞았는데 남았다.\n\n문에서 소리가 났다. 잠금이 풀리는 소리. 이 방에서 들은 첫 바깥 소리였다.\n\n> 5번 방. 추가 투입하십시오.\n\n주머니에 손을 넣었다. 코인이 하나 더 있었다. 지금 알았다. 5번이 이걸 두고 한 말이었다. 1번과 2번은 반대로 말했다.\n\n{a10_wall && sibling_memory >= 6:코인 하나면 된다고 그 목소리가 말했다.}\n+ [코인을 넣는다] (예약곡 1곡 남음) -> a10_death_extra\n+ [나간다] -> a10_t6_leave\n\n=== a10_t6_leave ===\n문을 밀었다. 열렸다.\n-> a10_t7\n\n=== a10_t7 ===\n복도. 짧았다. 문이 뒤에서 닫혔다. 닫히는 소리가 컸다. 방 안에서는 그런 소리가 하나도 없었다.\n\n4번 방 문. 유리창은 검었다. 안은 보이지 않았고, 보려고 하지 않았다.\n\n등 뒤. 5번 방 안에서. 문 너머로, 작게. 방음인데.\n\n> 5번 방 이용자분. 두고 가신 물건이 있습니다.\n\n주머니를 뒤졌다. 코인이 없었다. 넣지 않았는데.\n\n2번. 두고 간 물건은 찾지 않습니다. {a10_wall && sibling_memory >= 6:그 목소리도 그렇게 말했다. 뭘 두고 왔대도.}\n+ [다시 들어간다] (코인이 거기 있다) -> a10_death_reenter\n+ [나간다] -> a10_t7_leave\n\n=== a10_t7_leave ===\n4번 방 문 앞을 지났다.\n-> a10_last\n\n=== a10_last ===\n{\n- sibling_memory >= 12:\n    -> a10_last_exact\n- sibling_memory >= 6:\n    -> a10_last_blur\n- else:\n    -> a10_last_silent\n}\n\n=== a10_last_exact ===\n> {sibling_memory <= 15:갔어? ……갔네. 됐다. 뭐 두고 갔어도 됐다.|갔어? ……갔네. 됐다.}\n-> a10_outro\n\n=== a10_last_blur ===\n> ……갔어?\n\n묻기만 했다. 갔는지 확인하지 못했다. 유리창은 검었다.\n-> a10_outro\n\n=== a10_last_silent ===\n4번 방 유리창은 검었다. 조용했다. 방음이니까.\n-> a10_outro\n\n=== a10_outro ===\n출구. 밖은 검었다. 열렸다.\n-> a10_clear\n\n=== a10_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 4종(트리거 4, 도감 entry 4). 본문 §사망 그대로. ──\n\n=== a10_death_sing ===\n따라 불렀다. 가사가 없어서 소리만 냈다. 스피커에서 내 소리가 나왔다. 멈췄는데 안 멈췄다.\n\n그 소리는 다음 소절을 알고 있었다. 내가 모르는 소절이었다.\n-> die(\"당신은 불렀습니다.\", calling_voice_mic)\n\n=== a10_death_reenter ===\n문을 열었다. 화면이 켜져 있었다. 잔여 시간 53:00. 예약곡 둘. 코인은 넣지 않았는데.\n\n문이 뒤에서 닫혔다.\n\n> 5번 방. 이용을 시작합니다.\n\n이번엔 가사 칸에 글자가 있었다.\n-> die(\"당신은 다시 들어갔습니다.\", reentered_room)\n\n=== a10_death_extra ===\n코인을 넣었다. 잔여 시간이 올라갔다. 53:00. 예약곡이 하나에서 둘이 됐다. 셋이 됐다.\n\n문 잠기는 소리. 화면에 \"부르세요\". 이번엔 마침표가 없었다.\n-> die(\"당신은 코인을 더 넣었습니다.\", extra_coin)\n\n=== a10_death_shout ===\n벽에 대고 소리쳤다. 무슨 말을 했는지 모르겠다. 방음이라 그쪽엔 안 갔을 것이다.\n\n마이크에는 갔다. 스피커에서 그 말이 나왔다. 내 목소리로. 이번엔 무슨 말인지 알아들었다.\n-> die(\"당신은 소리쳤습니다.\", soundproof_wall)\n\n// ── /INCLUDE A10.ink ──\n// ── INCLUDE A11.ink ──\n// ink/A11.ink — 앵커 A11. 지하 차고지 통제실\n// 원본: 06-A11_차고지통제실.md (설계서 v0.2) / 07-A11_본문.md (본문 v0.1)\n// 규약: ink/A02.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(a11_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry)를 호출한다. 가중치는 앵커 = 2.0.\n//\n// OUT 플래그(A12가 읽는다): a11_heard — main.ink 쪽 선언은 ink/A11.codex.txt 참고.\n// IN 플래그(A10이 내보내는 것을 여기서 읽는다): a10_wall — A10이 아직 미구현이므로\n// ink/A11.codex.txt에 임시 선언을 적어 둔다(추후 A10 변환 시 재선언 없이 대입만 하도록 메모).\n// 로컬 전용 플래그(다른 공간이 읽지 않음): saw_ledger, saw_prints, wrote_zero — 이 파일\n// 최상단에 직접 선언한다.\n//\n// 조언자 band(sibling_memory >= 12 정확 / >= 6 흐림 / else 침묵)는 이 파서가 실제\n// 분기로 추적할 수 있도록 \"{ - cond: -> target ... }\" 다중 줄 블록(A03 a03_pre_clear\n// 방식)이 아니라, 이번 파일에서는 band별로 이어지는 다음 knot이 전부 동일하므로\n// 순수 텍스트 조건({ - cond: 본문 ... })만 knot 안에 남기고 별도 knot으로 쪼개지\n// 않았다 — 갈래마다 다음 목적지가 갈리지 않는 한 이 방식이 미종료/도달불가 오탐을\n// 만들지 않는다(파서는 {..} 블록 내부를 구조로 해석하지 않고 텍스트로만 본다).\n\nVAR saw_ledger = false\nVAR saw_prints = false\nVAR wrote_zero = false\n\n=== a11_gate ===\n~ current_space = \"A11\"\n// A11 진입. 사망 가중치 = 2 (앵커).\n~ current_weight = 2.0\n~ saw_ledger = false\n~ saw_prints = false\n~ wrote_zero = false\n-> a11_intro\n\n=== a11_intro ===\n발밑이 먼저였다.\n\n눈을 뜨기 전에 신발 속이 젖어 있었다. 양말까지. 찬 건 그다음이었다.\n\n통제실이었다.\n\n유리창 너머가 차고지였다. 계단 다섯 개 아래. 버스가 여러 대, 불이 전부 꺼져 있었다. 한 대만 실내등이 켜져 있었다.\n\n바닥이 얇게 젖어 있었다. 한가운데 배수구 격자. 물소리는 거기서 났다. 벽 너머도 바닥 밑도 아니었다. 발밑이었다.\n\n벽시계 03:47. 초침 없음. 조작반에 셔터 버튼, 인터폰 — 표시등에 '대기실', 죽은 마이크. 책상에 대장과 볼펜. 한쪽 벽에 닫힌 문.\n\n벽에 테이프로 붙인 A4.\n\n배차원 근무 수칙\n\n□□터미널 지하 차고지 통제실\n\n배차원은 아래 사항을 준수하십시오. 첫 차 출고는 통제실이 책임집니다. #rules:A11\n\n1. 04:40 정시에 셔터를 개방합니다.\n2. 배차원은 차고지 바닥으로 내려가지 않습니다.\n3. 차고지에서는 승객이 탑승하지 않습니다.\n4. 통제실의 승객은 배차원이 차량까지 안내합니다. #fake #dmg:ink\n5. 승차 인원은 확인한 수만 기록합니다. #dmg:blur\n6. 대기실 출입 금지. 연락은 인터폰으로 합니다. #dmg:blur\n7. 수위가 배수구 위면 내려갈 때까지 보류합니다. #fake #dmg:ink\n\n안전 운행 되십시오.\n\n3번과 4번 사이에 얼룩이 가로로 한 줄 — 그 아래에서 5번과 6번은 번졌고, 4번과 7번은 번지지 않았다.\n\n얼룩 선은 종이 밖으로 이어졌다. 벽으로, 책상 다리로, 닫힌 문 위로. 가슴 높이. 자로 잰 것처럼 수평이었다. 물때선. 여기가 한 번 거기까지 잠겼다는 뜻이다.\n\n1번과 7번을 다시 읽었다. 정시에 연다. 보류한다. 익숙한 구조였다.\n\n+ [출고 대장을 본다] -> a11_ledger\n+ [바닥의 발자국을 본다] -> a11_prints\n+ [창밖 첫 차를 본다] -> a11_bus\n\n=== a11_ledger ===\n차량 번호 / 예정 출고 / 실제 출고 / 승차 인원 / 배차원 확인. 위 줄들은 전부 같았다. 04:40, 04:40, 0, 체크.\n\n한 줄만 달랐다. 승차 인원 1. 확인 칸이 비어 있었다. 적은 사람이 확인을 못 한 것이다.\n\n오늘 줄. 예정 출고 04:40만 인쇄돼 있고 나머지는 빈칸.\n~ saw_ledger = true\n-> a11_t2\n\n=== a11_prints ===\n젖은 신발 자국. 계단에서 차고지 바닥을 건너 실내등 켜진 버스 문 앞까지. 한 사람.\n\n돌아오는 자국이 없었다.\n~ saw_prints = true\n-> a11_t2\n\n=== a11_bus ===\n□□행. 차량 번호 자리는 비어 있었다. 좌석이 전부 비어 있었다. 문이 열려 있었다.\n\n운전석에 형체. 각도상 얼굴은 보이지 않았다. 움직이지 않았다.\n-> a11_t2\n\n=== a11_t2 ===\n물이 격자 위로 올라와 있었다. 소리는 그대로였다.\n\n띵동.\n\n> 차고지 내 안내 말씀 드립니다. 04:40 출고 차량, 출고 삼십 분 전입니다. 배차원께서는 출고 준비 바랍니다.\n\n코맹맹이였고, 지루했다. 대합실의 방송이었다.\n\n준비할 것이 없었다. 그게 준비였다.\n\n딸깍. 조작반의 표시등이 켜졌다. 대기실.\n\n+ [받는다] -> a11_receive\n+ [받지 않는다] -> a11_notreceive\n\n=== a11_receive ===\n수화기를 들었다. 인터폰이라 조금 멀었다.\n~ a11_heard = true\n-> a11_voice\n\n=== a11_voice ===\n{\n- sibling_memory >= 16:\n    {gender == \"m\":형|언니}. {a10_wall: 저번엔 벽이었지.|저번엔 안 들었지.} 이번엔 인터폰이야.\n    대기실이라고 써 있지. 나 거기 없어. 문 열지 마.\n    물소리 나지. 발밑에서. 올라와. 신경 쓰지 마. 시각 되면 빠져.\n    규정 7번. 물 차면 보류하라는 거. 그거 아니야. 1번이 맞아. 시각에 열어.\n    방송이 승객 부를 거야. 거기 승객 없어. 차고지야. 안내하지 마. 내려가지 마.\n    인원은 본 대로만 써. 방송이 뭐라든. 안 봤으면 0이야.\n    ……04:40. 알아. 열어. 열라고 하는 거 맞아.\n- sibling_memory >= 12:\n    {gender == \"m\":형|언니}. {a10_wall: 저번엔 벽이었지.|저번엔 안 들었지.} 인터폰이야.\n    문 열지 마. 나 거기 없어.\n    물 올라오지. 발밑. 시각 되면 빠져.\n    방송이 승객 부르면 안내하지 마. 없어, 승객. 내려가지 마.\n    인원은 본 대로. 안 봤으면 0.\n    규정 7번. 물 차면 보류하라는 거. ……조금만 있다가, 는 안 되지. 알아. 그거 아니야. 열어.\n    {gender == \"m\":형|언니} 이럴 때 늘 그거였잖아. 알아서 한다고. ……알아서 할게, 였나. 니가 그랬나, 내가 그랬나. 그래. 그렇게 해.\n    ……열어. 04:40에.\n- sibling_memory >= 6:\n    ……{gender == \"m\":형|언니}? {a10_wall: 벽 다음은 인터폰이네.|이번엔 들려?} 거기지.\n    물 차면 보류해. 규정에 있어. 7번. 물 빠지고.\n    방송…… 승객 없어. 내려가지 마.\n    ……창에 비치는 거, {gender == \"m\":형|언니} 맞지. 잘 안 보여. 물 때문이야. 거기 물 많잖아.\n    (딸깍)\n- else:\n    ……\n    ……거기, ……\n    ……\n    (딸깍. 끊긴다)\n    부를 자리가 비어 있었다. 그다음 자리도 비었다. 그게 다였다.\n}\n딸깍. 표시등은 켜진 채였다.\n-> a11_t3\n\n=== a11_notreceive ===\n들지 않았다. 표시등은 켜진 채였다.\n-> a11_t3\n\n=== a11_t3 ===\n발목. 차고지 바닥은 바퀴 반이었다.\n\n띵동.\n\n> 04:40 출고 차량, 출고 십오 분 전입니다. {gender == \"m\":남성|여성} 승객 한 분, 04:40 출고 차량에 탑승하여 주시기 바랍니다. 다시 한번 안내 말씀 드립니다. {gender == \"m\":남성|여성} 승객 한 분, 04:40 출고 차량에.\n\n차고지에 승객은 없었다. 3번이 그렇다고 했고, 창밖도 그랬다. 통제실에는 나뿐이었다.\n\n4번. 통제실의 승객을 안내한다. 물때선 아래에서 안 번진 둘 중 하나였다.\n\n+ {saw_prints} [승객을 안내하러 내려간다 (발자국은 돌아오지 않았다)] -> a11_death_ride\n+ {not saw_prints} [승객을 안내하러 내려간다] -> a11_death_ride\n+ [지금 셔터를 연다] -> a11_death_open\n+ [통제실에 있는다] -> a11_t3_stay\n\n=== a11_t3_stay ===\n있었다. 방송은 세 번째로 나오지 않았다. 그쳤다.\n-> a11_t4\n\n=== a11_t4 ===\n발목 위. 책상 다리 아래 칸이 잠겼다.\n\n띵동.\n\n> 04:40 출고 차량, 출고 오 분 전입니다. 배차원께서는 승차 인원을 확인하여 출고 대장에 기록하시기 바랍니다. 승객 한 분, 탑승 확인 바랍니다.\n\n창밖. 실내등. 운전석의 형체. 좌석은 전부 비어 있었다. 한 분이 아니었다. 0이었다.\n\n5번. 확인한 수만 기록한다. {saw_ledger:한 줄만 1이었던 걸 봤다. 그 줄은 확인 칸이 비어 있었다.}\n\n볼펜을 들었다. 오늘 줄. 승차 인원 칸.\n\n+ {codex ? ledger} [1을 적는다 (도감: 장부)] -> a11_death_count\n+ {not (codex ? ledger)} [1을 적는다] -> a11_death_count\n+ [0을 적는다] -> a11_ledger_0440\n+ [적지 않는다] -> a11_t4_c\n\n=== a11_ledger_0440 ===\n0. 볼펜이 옆 칸으로 갔다. 예정 출고. 04:40. 인쇄된 숫자였다. 확인했다.\n\n확인했다. 확인한 적이 있었다.\n\n볼펜을 놓았다.\n~ wrote_zero = true\n-> fragment(11) -> a11_t5\n\n=== a11_t4_c ===\n볼펜을 놓았다. 칸은 빈 채였다. 빈 것은 틀린 것이 아니다. 아직은.\n-> a11_t5\n\n=== a11_t5 ===\n정강이.\n\n띵동.\n\n> 04:40 출고 차량, 출고 일 분 전입니다. 승무원 대기실에 남아 계신 분은 퇴실하여 주시기 바랍니다. 통제실의 …… 한 분. 다시 한번 안내 말씀 드립니다. 통제실의 …… 한 분.\n\n배차원, 이 아니었다. 승객도 아니었다. 대합실에서 방송이 나를 부르려다 못 부른 그 자리였다. 이번엔 역할까지 빠져 있었다.\n\n표시등은 켜져 있었다. 문은 닫혀 있었다. 문에도 물때선이 있었다.\n\n+ [대기실 문을 연다] -> a11_death_crew\n+ [인터폰을 누른다] -> a11_press\n+ [열지 않는다] -> a11_t5_c\n\n=== a11_press ===\n눌렀다.\n{\n- sibling_memory >= 16:\n    ……열지 마. 나 거기 없다니까.\n- sibling_memory >= 12:\n    ……열지 마. ……열지 마.\n- sibling_memory >= 6:\n    ……열지 마. 아니, ……열지 마.\n- else:\n    (표시등만. 물소리.)\n}\n놓았다. 문은 닫혀 있었다.\n-> a11_t6\n\n=== a11_t5_c ===\n열지 않았다. 문 너머에서 아무 소리도 나지 않았다.\n-> a11_t6\n\n=== a11_t6 ===\n정강이. 더 올라오지 않았다. 소리는 그대로였다.\n\n띵동.\n\n> 04:40 출고 차량, 출고 시각입니다. 배차원께서는 셔터를 개방하여 주시기 바랍니다.\n\n시계는 03:47이고 방송은 04:40이라고 했다. 여기서 가는 건 시계가 아니었다.\n\n1번. 04:40 정시에 개방한다. 7번. 수위가 배수구 위면 내려갈 때까지 보류한다. 물은 배수구 위였다. 물은 배수구에서 올라왔다. 내려갈 때까지,는 오지 않는다.\n\n{a11_heard && sibling_memory >= 12: 그 목소리도 열라고 했다.|a11_heard && sibling_memory >= 6: 그 목소리는 보류하라고 했다. 물은 빠지지 않았다.}\n\n버튼에 손을 올렸다. 손이 늦었다. 늦게 하고 싶었던 게 아니라, 늦었다.\n\n+ [셔터를 연다] -> a11_t6_open\n+ [보류한다 (규정 7번)] -> a11_death_hold\n\n=== a11_t6_open ===\n눌렀다. 셔터가 올라갔다. 램프 위는 검었다.\n\n첫 차의 헤드라이트가 켜졌다. 문이 닫혔다. 물을 가르며 램프로 올라갔다. 셔터가 내려왔다.\n\n배수구가 빨아들이는 소리. 물이 발밑으로 내려갔다. 올라온 데로.\n-> a11_t7\n\n=== a11_t7 ===\n바닥에 물때가 하나 더 생겨 있었다. 정강이 높이. 신발 속은 그대로 젖어 있었다.\n\n띵동.\n\n> 04:40 출고 차량, 출고 완료. 배차원께서는 대장을 마감하여 주시기 바랍니다.\n\n오늘 줄. 실제 출고 칸에 04:40을 적었다. {wrote_zero:아까 확인한 숫자였다.} 확인 칸에 체크.\n\n표시등이 꺼졌다. 대기실.\n{\n- a11_heard && sibling_memory >= 6:\n    -> a11_t7_ring\n- else:\n    -> a11_t7_noring\n}\n\n=== a11_t7_ring ===\n딸깍. 인터폰이 한 번 더 울렸다.\n\n+ [받는다] -> a11_t7_receive\n+ [받지 않는다] -> a11_t7_notreceive\n\n=== a11_t7_receive ===\n{\n- sibling_memory >= 12:\n    갔어? ……갔지. 가는 거야, 그건.\n    {wrote_zero:문 안 열었지. ……나도 안 열었어. 그때.|나왔으면 됐어.}\n    다음에 봐.\n- else:\n    ……갔어? ……갔구나.\n    ……됐어. 됐어, 뭐.\n}\n딸깍. 끊겼다.\n-> a11_clear\n\n=== a11_t7_notreceive ===\n울리다 그쳤다.\n-> a11_clear\n\n=== a11_t7_noring ===\n+ [대장을 덮는다] -> a11_t7_close\n\n=== a11_t7_close ===\n덮었다.\n-> a11_clear\n\n=== a11_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n천장 너머에서, 아주 작게, 같은 목소리가 다른 말을 하고 있었다. 승강장 번호 같은 것을. 여기 것이 아니었다.\n-> cleared\n\n// ── 사망 knot 5종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a11_death_hold ===\n열지 않았다. 7번이 그러라고 했다. 방송이 한 번 더 말했다. 출고 시각입니다.\n\n물이 정강이를 넘었다. 방송이, 코맹맹이 없이, 말했다. 왜 안 열어요. 시간 됐는데.\n\n창밖 첫 차의 실내등이 꺼졌다. 셔터는 닫혀 있었다. 첫 차 자리가 비어 있었다. 안 열었는데 나갔다. 막은 게 아니라 못 본 것이었다.\n\n물이 허리였다. 물때선까지 왔을 때 그 선이 어디서 생겼는지 알았다.\n-> die(\"당신은 출고를 보류했습니다.\", hold)\n\n=== a11_death_ride ===\n내려갔다. 물이 발목이었다. 안내할 승객은 없었다. 첫 차 문이 열려 있었고 계단이 세 개였다. 올라갔다.\n\n실내등 아래 좌석이 전부 비어 있었다. 창가에 앉았다. 앉으려고 한 게 아니다. 방송이 말했다. 승차 확인되었습니다.\n\n문이 닫혔다. 운전석의 형체는 돌아보지 않았다.\n-> die(\"당신은 첫 차에 탔습니다.\", calling_voice_depot)\n\n=== a11_death_crew ===\n문을 열었다. 플라스틱 의자, 네 개씩 붙은 것. 형광등 둘 중 하나가 깜박이고 있었다. 아무도 없었다.\n\n벽에 인터폰 수화기가 걸려 있었고 표시등은 꺼져 있었다. 그 목소리는 여기 있었던 적이 없다.\n\n앉았다. 앉으려고 한 게 아니다. 방송이 나왔다. 승객 여러분께 안내 말씀 드립니다.\n-> die(\"당신은 대기실에 들어갔습니다.\", crew_room)\n\n=== a11_death_count ===\n1이라고 적었다. 창밖 첫 차 창가 자리에 형체가 하나 생겼다. 조금 전엔 없었다. 방송이 말했다. 승차 확인되었습니다.\n\n볼펜을 놓았다. 손이 젖어 있었다.\n\n창가 자리에서 보면 통제실 유리창이 보였다. 비어 있었다.\n-> die(\"당신은 확인하지 않은 수를 적었습니다.\", headcount)\n\n=== a11_death_open ===\n버튼을 눌렀다. 셔터가 올라갔다. 램프 위는 검었다. 헤드라이트도 가로등도 없었다.\n\n물이 램프를 타고 내려왔다. 위에서. 한 단씩. 첫 차의 실내등이 꺼졌다.\n\n방송이 말했다. 출고 시각이 아닙니다. 처음 듣는 문장이었다.\n-> die(\"당신은 셔터를 일찍 열었습니다.\", shutter_early)\n\n// ── /INCLUDE A11.ink ──\n// ── INCLUDE A12.ink ──\n// ink/A12.ink — 앵커 A12. 첫 차 (최종 공간, 엔딩 3)\n// 원본: 06-A12_첫차.md (설계서 v0.2) / 07-A12_본문.md (본문 v0.1)\n// 규약: ink/A02.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(a12_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry)를 호출한다. 가중치는 앵커 = 2.0(의도적 — 06-A12 §1).\n//\n// 엔딩 3: a12_ending_forgotten(잊힌, sm<=5) / a12_ending_alone(홀로, 6<=sm<=11\n// 또는 정확+갖고 있는다) / a12_ending_true(진엔딩, 정확+돌려준다+턴11 도로 문) — 전부\n// `-> END`. 05_앵커배치표.md §1 판정표 그대로: sibling_memory 값 직접 비교, 별도\n// band 함수 없음(06-A12 §4 첫 문단과 동일 원칙).\n//\n// A02 OUT `saw_downstream`은 이미 main.ink에 있다 — 턴6 \"낯익었다.\" 한 줄에 사용.\n// 조각 16의 \"한결\"은 지시대로 리터럴 텍스트로 둔다(변수 치환 아님).\n//\n// IN 플래그(다른 공간이 내보내는 것 — main.ink 쪽 선언은 ink/A12.codex.txt 참고):\n//   a07_tried_answer (A07 OUT, 미구현) / pulled_cabinet (A06 OUT, 미구현) /\n//   a11_heard (A11 OUT, 이번 배치에서 함께 구현 — ink/A11.codex.txt에 선언) /\n//   saw_downstream (A03 OUT, 이미 main.ink에 있음 — 재선언하지 않는다).\n// 로컬 전용 플래그: a12_tried_reply, fragments_returned, codex_locked — 이 파일\n// 최상단에 직접 선언한다. 사망 시 반납 롤백은 main의 공용 die()를 고치지 않고,\n// \"맨몸\"(턴 9~11) 구간의 사망 knot 안에서 각각 fragments_returned/codex_locked를\n// 되돌리고 fragments -= fragment_16을 한 뒤 die()를 호출하는 방식으로 처리한다\n// (06-A12 §8 \"die()는 main의 것 — A12 안에서 호출되면 …\" 조항을 main.ink를\n// 건드리지 않고 만족시키는 방법).\n//\n// 조언자 band(강가, 턴6)는 이후 경로가 band마다 완전히 갈리므로(정확만 선택6 존재,\n// 흐림·침묵은 선택 없이 바로 각자의 엔딩행) A03 a03_pre_clear 방식의 다중 줄\n// \"{ - cond: -> target }\" 블록으로 실제 구조 분기를 만든다 — 파서가 진짜 edge로\n// 추적할 수 있게 하기 위함. band별로 다음 knot이 같은 지점(턴7'·턴9a 등)은 텍스트\n// 조건만 knot 안에 남긴다(A11과 동일 원칙).\n\nVAR a12_tried_reply = false\nVAR fragments_returned = false\nVAR codex_locked = false\n\n=== a12_gate ===\n~ current_space = \"A12\"\n// A12 진입. 사망 가중치 = 2 (앵커, 의도적 — 06-A12 §1).\n~ current_weight = 2.0\n~ a12_tried_reply = false\n~ fragments_returned = false\n~ codex_locked = false\n-> a12_t1\n\n=== a12_t1 ===\n진동이 먼저였다.\n\n주머니에서. 한 번. 눈을 뜨기 전에 그게 왔고, 눈을 뜨고 나서도 손은 주머니로 가지 않았다. 갈 이유가 있었는데 가지 않았다.\n\n형광등이 둘. 하나는 살아 있고 하나는 아직도 죽어가는 중이었다. 아직도, 라는 말이 먼저 왔다. 얼마나 아직도인지는 몰랐다.\n\n의자는 플라스틱이었다. 네 개씩 붙은 것. 그 자리였다. 줄이 몇인지는 세지 않았다. 센 적이 있었다.\n\n시외버스 터미널 대합실. 자판기, 매점, 승강장으로 나가는 유리문, 그 너머의 검은 것. 알 수 있었다. 이번엔 어떻게 여기 왔는지도 알 수 있었다. 걸어왔다. 그것까지는 있었다.\n\n손에 종이가 있었다.\n\n대합실 이용 안내\n\n승객 여러분의 안전한 이용을 위해 아래 사항을 지켜 주시기 바랍니다. #rules:A12\n\n1. 첫 차 도착 전 대합실을 나가지 마십시오.\n2. 방송이 호명하면 즉시 승강장으로 나가십시오.\n3. 매점은 이용하지 마십시오.\n4. 대합실 안에서는 아무것도 묻지 마십시오.\n\n즐거운 여행 되십시오.\n\n같은 종이였다. 같은 네 줄. 마지막 줄이 제일 번진 것까지 같았다. 한 번만 읽었다. 외우고 있었다.\n\n뒤집었다. 백지였다. 뒤집어 볼 것도 없이 백지였다. 볼펜 자국도, 파인 데도 없었다. 손가락으로 쓸어 봤다. 매끈했다.\n\n1번과 2번을 봤다. 그때는 둘이 같이 있으면 안 됐다. 지금은 모르겠다. 첫 차가 오면 둘 다 맞는 말이 된다. 첫 차가 오면.\n\n벽시계. 03:47. 초침은 없었다. 그 자리에서 그 시각이었다.\n\n+ [핸드폰을 본다] -> a12_phone\n+ [매점을 본다] -> a12_kiosk\n+ [도로 쪽 출입문을 본다] -> a12_street_door\n\n=== a12_phone ===\n꺼냈다. 전파는 없고 배터리는 41이었다. 03:47.\n\n잠금화면. 두 사람. 한쪽 얼굴은 멀쩡했다. 다른 쪽은 —\n{\n- sibling_memory >= 12:\n    절반쯤 긁혀 있었다. 눈은 남아 있었다.\n- sibling_memory >= 6:\n    얼굴이 전부 긁혀 있었다. 어깨는 있었다.\n- else:\n    얼굴도 어깨도 없었다. 팔을 두른 손만 남아 있었다.\n}\n\n그 위에 \"메시지 1\". 보낸 사람 칸이 비어 있었다. 있을 필요가 없었다. 누군지 알았다.\n\n열지 않았다. 아직. 화면을 끄고 주머니에 넣었다.\n-> a12_t2\n\n=== a12_kiosk ===\n셔터가 끝까지 내려가 있었다. 바닥까지. 틈이 없었다. 틈이 없으니 불빛도 없었다. 귀를 대 봤다. 라디오도 없었다.\n\n안에 누가 있었던 적이 있다. 그 사람이 어디로 갔는지는 안다. 여기는 아니다.\n\n옆의 자판기. 캔이 전부 똑바로 꽂혀 있었다. 상표가 전부 이쪽을 보고 있었다. 이번엔 그게 이상했다.\n\n3번 규칙은 지키기 쉬웠다. 이용할 것이 없었다.\n-> a12_t2\n\n=== a12_street_door ===\n대합실 반대편에 문이 있었다. 그때는 보지 않았던 문이다. 승강장 쪽을 보고 앉아 있었으니까.\n\n셔터가 내려가 있었다. 아래 틈으로 바람이 들어왔다. 찬 바람. 밖에서 안으로.\n\n이 대합실에서 들어오는 방향으로 난 문은 이것 하나였다. 나가는 문이 아니다. 들어오는 문이다. 그걸 기억해 두기로 했다.\n-> a12_t2\n\n=== a12_t2 ===\n진동이 한 번 더 왔다. 이번엔 손이 갔다.\n\n03:47. 메시지. 보낸 사람 칸은 비어 있었다. 열었다.\n\n읽었다.\n-> fragment(12) -> a12_t2_msg\n\n=== a12_t2_msg ===\n형광등을 봤다. 그때도 그랬다. 화면에서 눈을 떼면 갈 데가 거기밖에 없었다.\n\n+ [답장한다] -> a12_reply\n+ [답장하지 않는다] -> a12_noreply\n\n=== a12_reply ===\n입력창을 열었다. 뭐라고 쳤는지는 여기 적지 않는다. 짧았다. 전송.\n\n> 전송되지 않았습니다.\n\n전파가 없었다. 아까 봤다. 알면서 눌렀다. 그 문장이 잠깐 떠 있다가 사라졌다. 쳐 둔 글은 남았다. 보내지지 않은 채로.\n~ a12_tried_reply = true\n-> a12_t3\n\n=== a12_noreply ===\n화면을 껐다. 그때와 같았다. 다른 게 있다면, 이번엔 끄는 손이 좀 느렸다는 것.\n-> a12_t3\n\n=== a12_t3 ===\n형광등을 보고 있었다. 그래서 유리문이 밝아지는 걸 유리가 아니라 바닥에서 봤다. 바닥에 빛이 깔렸다.\n\n헤드라이트였다. 그다음 엔진. 공회전으로 낮아졌다. 그다음, 문이 접히며 열리는 소리.\n\n그다음이었다. 띵동.\n\n> 첫 차가 3번 승강장에 도착하였습니다. {gender == \"m\":남성|여성} 승객 한 분, 승강장으로 나와 주시기 바랍니다.\n\n방송이었다. 그뿐이었다.\n\n순서를 되짚었다. 빛, 엔진, 문, 방송. 그때는 방송이 먼저였고 차는 없었다. 지금은 차가 먼저였고 방송이 뒤였다. 종이의 1번과 2번이 처음으로 같은 말을 하고 있었다.\n\n벽시계는 그대로였다. 시계는 그렇다 치기로 했다.\n\n+ {codex ? hold} [승강장으로 나간다 (도감: 보류)] -> a12_board\n+ {not (codex ? hold)} [승강장으로 나간다] -> a12_board\n+ {codex ? calling_voice} [앉아 있는다 (도감: 부르는 소리)] -> a12_death_chair\n+ {not (codex ? calling_voice)} [앉아 있는다] -> a12_death_chair\n\n=== a12_board ===\n일어났다. 종이는 손에 든 채로. 유리문 앞에 섰다. 밀었다. 열렸다.\n\n승강장. 찬 공기. 버스 한 대. 실내등이 켜져 있었다. 앞 유리 위 행선지 판에 □□행. 아는 데였다. 갈 데였다.\n\n문이 열려 있었다. 계단 세 개. 올랐다.\n-> a12_t4\n\n=== a12_t4 ===\n창가에 앉았다. 자리는 있었다. 사람도 몇 있었다. 세지 않았다. 셀 이유가 없었다.\n\n운전석에 형체가 있었다. 각도상 얼굴은 보이지 않았다. 보일 각도가 이 차에는 없었다.\n\n핸드폰은 손에 있었다. 주머니에 넣지 않았다. 볼 것도 없는데 쥐고 있었다.\n\n문이 닫혔다. 출발했다. 터미널 불빛이 뒤로 갔다. 국도. 가로등 사이가 길어졌다. 왼쪽 창 아래로 검은 것이 넓게 따라왔다. 강이었다.\n\n+ [창밖을 본다] -> a12_window\n+ [눈을 감는다] -> a12_eyes\n\n=== a12_window ===\n강은 검었고 군데군데 희었다. 흰 데는 얼음이었다. 가드레일이 창 아래를 따라 지나갔다. 끊긴 데가 있었다.\n\n도로가 강 쪽으로 붙었다. 흰 데가 넓어졌다. 강 위만이 아니었다.\n-> a12_tilt\n\n=== a12_eyes ===\n감았다. 엔진 소리만 남았다. 일정했다. 한참.\n\n그다음 바퀴가 다른 소리를 냈다. 구르는 소리에서 미끄러지는 소리로. 엔진은 그대로였다. 바퀴만 달랐다.\n-> a12_tilt\n\n=== a12_tilt ===\n기울어졌다. 창이 아래가 됐다.\n-> fragment(13) -> a12_t5\n\n=== a12_t5 ===\n물이었다.\n\n방향이 없었다. 위도 아래도. 핸드폰이 손에 있었다. 놓치지 않으려고 쥔 게 아니라 그냥 있었다. 화면이 켜져 있었다. 문자가 떠 있었다. 유일한 빛이었다.\n\n꺼졌다.\n-> fragment(14) -> a12_t5_sound\n\n=== a12_t5_sound ===\n검었다. 그리고 물소리가 왔다. 벽 너머도 바닥 밑도 발밑도 아니었다. 안이었다. 도착한 거였다.\n\n그리고 발소리. 물을 디디는 소리. 얕은 데를 골라 디디는 소리. 한 방향에서만 왔다. 방향이 없는 데에 방향이 하나 생겼다.\n\n+ [발소리 쪽으로 간다] -> a12_wade\n+ [가만히 있는다] -> a12_death_deep\n\n=== a12_wade ===\n갔다. 헤엄이 아니었다. 그쪽으로 몸을 두는 것에 가까웠다.\n\n얕아졌다. 발에 자갈이 닿았다. 무릎이 물 밖으로 나왔다. 서 있었다.\n-> a12_t6\n\n=== a12_t6 ===\n하류였다. 넓고 얕은 물가. 자갈. 조명은 없었다. 새벽 직전의 회색이 있었다. 물소리는 이제 발목 높이에서 났다. 배경이었다.\n\n검은 옷을 입은 사람이 고개를 숙이고 걷고 있었다. 얕은 데만 골라. 천천히. 물속을 보면서.\n\n{saw_downstream:낯익었다.}\n\n그 사람이 고개를 들었다.\n\n얼굴이었다. 잠금화면에서 멀쩡했던 쪽의 얼굴이었다. 그러면 긁힌 쪽은.\n\n동생이었다.\n\n검은 옷. 젖은 신발. 손에 뭘 쥐고 있었다. 작은 열쇠. 문갑 열쇠였다. {pulled_cabinet:그 문갑이었다. 당겨 본 적 있다.}\n-> fragment(15) -> a12_t6_route\n\n=== a12_t6_route ===\n{\n- sibling_memory >= 12:\n    -> a12_meet_exact\n- sibling_memory >= 6:\n    -> a12_meet_blur\n- else:\n    -> a12_meet_silent\n}\n\n=== a12_meet_exact ===\n동생이 나를 봤다. 알아보는 데는 시간이 걸리지 않았다. 말이 나오는 데 걸렸다.\n\n> ……{gender == \"m\":형|언니}.\n> {a11_heard:인터폰 말고 이렇게 보는 건 처음이지.|이렇게 보는 건 처음이지.} 여기서는.\n> 깊은 데 있었지. 알았어. 근데 얕은 데만 걸었어. 매일. 깊은 데는 못 가겠더라.\n\n열쇠를 든 손을 들어 보였다.\n\n> 이거. 그 집 문갑 열쇠. 집은 팔렸는데 안 비웠어. {gender == \"m\":형|언니} 거 거기 넣어 놨어. 아직.\n\n그다음 손을 내밀었다. 열쇠가 아닌 쪽 손을.\n\n> 핸드폰 줘.\n> 마지막 화면. 그거 내 거야. 내가 보낸 거잖아.\n\n핸드폰은 내 손에 있었다. 꺼진 채로. 마지막 화면이 뭔지 나도 알고 동생도 알았다.\n\n+ [돌려준다] -> a12_t7_return\n+ [갖고 있는다] -> a12_t7_refuse\n\n=== a12_t7_return ===\n건넸다. 동생이 받았다. 꺼진 화면을 봤다. 켜지 않았다.\n\n> ……읽었네. 읽었으면서.\n> 아니다. 됐어.\n\n그게 다였다. 더 나올 말이 있었는데 동생이 거기서 접었다. 받을 생각도 없었다.\n\n손에 종이가 남아 있었다. 대합실 이용 안내. 여기까지 들고 왔다. 놓았다. 물에 떴다. 뒤집히지 않고 떠서 갔다. 백지 쪽이 위였다.\n\n주머니에 아무것도 없었다. 손에도. 도감도 조각도 열리지 않았다. 볼 것이 없어서가 아니라, 돌려줘서.\n\n서랍은 있었다. 열쇠도 있었다. 내 손에 없었을 뿐이다.\n~ fragments_returned = true\n~ codex_locked = true\n-> a12_t8\n\n=== a12_t7_refuse ===\n손을 거뒀다. 동생이 그 손을 봤다. 오래 보지는 않았다.\n\n{sibling_memory >= 16:\n    ……그래. 알아서 하겠지. {gender == \"m\":형|언니}는. 맨날.\n- else:\n    ……그래. 알아서…… 뭐라 그랬더라. 니가 그랬나, 내가 그랬나.\n맨날 그랬어. 그거.\n}\n\n열쇠를 주머니에 넣었다.\n\n> 올라가.\n-> a12_alone_walk\n\n=== a12_meet_blur ===\n동생이 나를 봤다. 알아보는 데 시간이 걸렸다. 걸리고도 안 됐다.\n\n> ……{gender == \"m\":형|언니}?\n> ……맞지. 맞나. 잠깐만.\n\n젖은 주머니에서 지갑을 꺼냈다. 사진 한 장. 두 사람. 한쪽 얼굴이 긁혀 있었다. 잠금화면과 같은 사진이었다. 같은 데가 긁혀 있었다.\n\n사진을 봤다. 나를 봤다. 사진을 봤다.\n\n> ……사진이 이래서. 모르겠다. 맞는 거 같은데. 어두워서 잘……\n\n어둡지 않았다. 회색이었다. 볼 만큼은 됐다. 그 말은 하지 않았다. 4번 규칙 때문은 아니었다. 여기는 대합실이 아니니까. 그냥 하지 않았다.\n\n열쇠는 손에 쥔 채였다. 뭔지 말하지 않았다. 누구한테 설명해야 하는지 정하지 못한 채였다.\n\n> 올라가. 올라가서 보자. 밝은 데서.\n-> a12_alone_walk\n\n=== a12_meet_silent ===\n그 사람이 — 동생이 — 나를 봤다. 모르는 얼굴을 보는 눈이었다.\n\n> 거기 깊어요. 이쪽으로요. 얕은 데로.\n\n손을 내밀었다. 열쇠를 쥔 손이었다. 열쇠째로 내 손을 잡고 끌었다. 자갈 위로 올라섰다. 손을 놓았다. 열쇠는 그 손에 남았다. 뭔지 말하지 않았다. 모르는 사람한테 말할 이유가 없었다.\n\n> ……얕은 데로만 걸으세요. 깊은 데 가지 말고. 그거 하나만.\n> 저는…… 가 봐야 돼서.\n\n돌아섰다. 두 걸음. 멈췄다.\n\n> ……저기.\n\n그다음이 없었다. 부를 게 없어서 못 부르는 거였다. 알았다. 그 자리가 비는 걸 여러 번 들었다. 이번엔 눈앞이었다.\n\n갔다. 둑을 올라갔다. 돌아보지 않았다.\n\n부르려고 했다. 입을 열었다. 뭐라고 불러야 하는지 몰랐다. 있었을 텐데. 없었다. 나는 입을 다물었다.\n-> a12_ending_forgotten\n\n=== a12_alone_walk ===\n둑. 국도. 걸었다. 둘이. 동생은 반 걸음 앞에서 걸었다. 돌아보지 않았다. 터미널.\n\n도로 쪽 출입문이 열려 있었다. 안. 형광등. 의자. 03:47. 유리문 너머 검은 승강장.\n\n동생이 문을 잡았다. 문 안쪽에 서서.\n\n{sibling_memory >= 12:문이 하나씩만 열려. 먼저 가.|여기 문…… 하나씩만 열려. 먼저 가.}\n\n등을 밀었다. 세게는 아니었다. 그래도 밀린 건 밀린 거였다. 문턱을 넘었다.\n\n{sibling_memory >= 12:나 여기 더 있을게. 아직.|나 볼 데 있어. 조금만 더.}\n-> a12_ending_alone\n\n=== a12_t8 ===\n동생이 나를 봤다. 한참. 열쇠를 쥔 손이 내려갔다.\n\n> 한결.\n\n{a07_tried_answer:이번엔 목소리가 나왔다.}\n\n\"응.\"\n\n{a12_tried_reply:아까 안 갔던 게 지금 갔다.}\n-> fragment(16) -> a12_t8_go\n\n=== a12_t8_go ===\n> 나가자.\n-> a12_t9\n\n=== a12_t9 ===\n둑을 올라갔다. 국도. 걸었다. 둘이. 말은 없었다. 가로등 사이가 짧아졌다. 터미널.\n\n도로 쪽 출입문이 열려 있었다. 셔터는 올라가 있었다. 동생이 먼저 들어갔다. 따라 들어갔다.\n\n안은 그대로였다. 형광등 둘. 의자. 벽시계 03:47. 승강장 유리문. 너머는 검은 채였다.\n\n손에 종이가 없었다. 주머니에 핸드폰이 없었다. 처음으로 아무것도 안 들고 이 안에 서 있었다.\n\n동생이 도로 쪽 문을 잡았다.\n\n> 여기 매일 왔어. 저 문으로. 앉아 있다 갔어. 그 자리.\n> 문이 하나씩만 열리더라. 여기. 먼저 나갈게.\n> 부를게. 그럼 나와.\n\n나갔다. 문이 닫혔다. 셔터는 내려오지 않았다. 문만 닫혔다.\n\n혼자였다. 의자에 앉지 않았다. 서 있었다.\n-> a12_t10\n\n=== a12_t10 ===\n유리문이 밝아졌다. 바닥에 빛. 헤드라이트. 엔진. 문 열리는 소리. 첫 차였다. 다시.\n\n띵동.\n\n> 한결 님, 3번 승강장으로 나와 주시기 바랍니다.\n> 다시 한번 안내 말씀 드립니다. 한결 님, 3번 승강장으로.\n\n그 자리가 채워져 있었다. 비어 있던 자리. 처음이었다.\n\n목소리에 아무것도 없었다. 피로도, 지루함도, 사무도. 그런 것들이 다 빠져나간 뒤에 남는 목소리였다.\n\n종이가 없었다. 도감이 열리지 않았다. 앉아 있어라, 라고 적힌 것도 없었고 대답하지 마라, 라고 적힌 것도 없었다. 겪은 것만 있었다.\n\n+ [대답한다] -> a12_death_name\n+ [승강장으로 나간다] -> a12_death_bus_again\n+ [가만히 있는다] -> a12_t10_wait\n\n=== a12_t10_wait ===\n가만히 있었다. 서서. 방송이 한 번 더 불렀다. 그다음 그쳤다. 헤드라이트는 유리문에 그대로 있었다.\n-> a12_t11\n\n=== a12_t11 ===\n유리문 바로 밖에서 소리가 났다. 스피커를 거치지 않은 소리.\n\n> 한결 님.\n\n노크. 유리에. 같은 목소리가 그다음에도 불렀다. 님을 붙여서. 승강장으로, 를 붙여서.\n\n그리고 반대편.\n\n도로 쪽 출입문 밖에서. 한 번.\n\n> 한결.\n\n그뿐이었다. 다시 오지 않았다.\n\n유리문 쪽은 계속됐다. 도로 문 쪽은 한 번이었다. 강가에서 들은 목소리였다.\n\n+ [승강장 문으로 간다] -> a12_death_bus_again\n+ [앉아서 기다린다] -> a12_death_chair2\n+ [\"응.\" — 도로 쪽 문으로 간다] -> a12_t11_go\n\n=== a12_t11_go ===\n\"응.\"\n\n도로 쪽 문으로 갔다. 손잡이를 잡았다. 열렸다.\n-> a12_ending_true\n\n// ── 엔딩 3 ──\n\n=== a12_ending_forgotten ===\n혼자였다. 강가. 물소리는 발목 높이에서 났다. 이 소리는 여기까지였다.\n\n주머니에서 진동. 꺼진 핸드폰이 한 번 켜졌다. 03:48. 잠금화면. 두 사람. 두 얼굴 다 멀쩡했다. 긁힌 데가 없었다. 꺼졌다.\n\n얕은 데만 골라 하류로 걸었다. 어디로 가는지는 알았다. 다들 거기서 찾으니까.\n\n그게 나가는 거였다.\n\n(엔딩 화면: 잊힌)\n~ ending_reached = \"forgotten\"\n-> END\n\n=== a12_ending_alone ===\n밖이었다. 문이 닫혔다.\n\n유리 너머로 안이 보였다. 동생이 돌아섰다. 의자로 갔다. 앉았다. 그 자리. 고개를 숙였다.\n\n벽시계에 초침이 있었다. 움직이고 있었다. 유리 이쪽에서는 소리가 들리지 않았다.\n\n주머니에 핸드폰이 있었다. 꺼진 채였다. 켜지지 않았다. 마지막으로 본 사진이 마지막 사진이었다. 긁힌 채로.\n\n밖은 회색이었다. 걸었다. 혼자.\n\n(엔딩 화면: 홀로)\n~ ending_reached = \"alone\"\n-> END\n\n=== a12_ending_true ===\n밖이었다. 밝았다.\n\n동생이 서 있었다. 손에 핸드폰. 내밀었다.\n\n> 이거. 니 거.\n\n받았다. 화면이 켜졌다. 잠금화면. 두 사람. 두 얼굴 다 멀쩡했다. 어느 쪽이 누군지 이제 알았다.\n\n뒤에서, 대합실 안에서, 초침 소리가 났다. 하나. 둘. 보지 않았다. 들었다.\n\n걸었다. 둘.\n\n(엔딩 화면: 한결)\n~ ending_reached = \"true\"\n-> END\n\n// ── 사망 knot 6자리(도감 4항목 — (a)·(a-2)는 같은 항목 `chair`). 본문 §사망 그대로. ──\n\n=== a12_death_chair ===\n앉아 있었다. 헤드라이트가 유리문에서 물러났다. 엔진 소리가 멀어졌다. 방송은 다시 나오지 않았다.\n\n형광등 하나가 마저 죽었다. 시계는 03:47이었다. 초침이 없었다. 있을 이유가 없었다.\n-> die(\"당신은 앉아 있었습니다.\", chair)\n\n=== a12_death_deep ===\n가만히 있었다. 물은 차갑다는 것 말고 아무것도 없었다. 발소리가 멀어졌다. 얕은 데만 골라 디디는 발소리였다. 여기는 얕은 데가 아니었다.\n-> die(\"당신은 가만히 있었습니다.\", deep_water)\n\n=== a12_death_name ===\n\"네.\"\n\n> 확인되었습니다.\n\n그게 다였다. 이름이 있어서 대답할 수 있었다. 대답할 수 있어서 가져갔다.\n~ fragments_returned = false\n~ codex_locked = false\n~ fragments -= fragment_16\n-> die(\"당신은 이름에 대답했습니다.\", calling_voice_name)\n\n=== a12_death_bus_again ===\n유리문을 열었다. 첫 차가 있었다. 실내등. 문이 열려 있었다. 계단 세 개. 올랐다. 창가. 강이 보였다.\n\n이번엔 얼음이 보이기 전에 알았다.\n~ fragments_returned = false\n~ codex_locked = false\n~ fragments -= fragment_16\n-> die(\"당신은 첫 차에 다시 탔습니다.\", first_bus_again)\n\n=== a12_death_chair2 ===\n앉았다. 그 자리. 도로 쪽 문 밖은 조용했다. 다시 부르지 않았다. 한 번이었다.\n\n유리문 쪽 노크는 계속되다가 그쳤다. 형광등. 의자. 03:47. 손에 종이가 있었다. 뒷면에 뭐라도 써야 할 것 같았다.\n~ fragments_returned = false\n~ codex_locked = false\n~ fragments -= fragment_16\n-> die(\"당신은 앉아 있었습니다.\", chair)\n\n// ── /INCLUDE A12.ink ──\n// ── INCLUDE B01.ink ──\n// ink/B01.ink — B01. 편의점 (편의점 × 심리)\n// 원본: spaces/B01_편의점.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b01_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 main.ink에 아직 없는 shard() 함수를 fragment()와 같은 방식(tunnel)으로 호출한다.\n// (필요 함수·항목은 ink/B01.codex.txt 참고 — main.ink는 건드리지 않는다.)\n\n=== b01_gate ===\n~ current_space = \"B01\"\n~ current_weight = 1.0\n-> b01_intro\n\n=== b01_intro ===\n차임 소리에 눈을 떴다.\n\n> 어서 오세요.\n\n녹음된 목소리였다. 문이 닫히고, 조금 있다 다시 울리고, 또 닫혔다. 그 사이에 들어온 것은 없었다.\n\n손에 볼펜이 있었다. 종이는 카운터 위에 펼쳐져 있었다.\n-> b01_t1\n\n=== b01_t1 ===\n계산대 안이었다.\n\n등 뒤가 담배 진열장이고 앞이 유리문이었다. 형광등이 너무 밝았다. 밖은 밝지 않았다. 밝아질 기색도 없었다.\n\n진열장 위에 벽시계. 03:47. 초침이 없었다. 놀라지 않았다.\n\n카운터 위의 노트를 봤다. 표지에 유성펜으로 **야간 인수인계**. 필체가 급했다.\n\n\\**야간 인수인계 — 읽고 넘기세요** #rules:B01\n\n1. 두 수가 어긋나면 폐기로 맞춘다. #fake #dmg:ink\n2. 차임에 소리 내어 인사하지 않는다.\n3. 두 수를 빼거나 차이 칸을 채우지 않는다.\n4. 교대자에게 노트를 넘긴 뒤 나간다.\n\n야간 근무자에게. {gender == \"m\":남자|여자} 화장실 열쇠는 카운터 밑 고리에 있습니다.\n\n1번만 줄 간격이 좁고 잉크 색이 달랐다 — 나중에 끼워 넣은 글씨였다.\n\n어긋나면 맞춰라. 두 수를 빼지 마라. 어긋난 수를 알려면 빼야 한다.\n\n규칙이 둘로 갈려 있었다. 하라는 쪽과 하지 말라는 쪽. 어느 쪽이 나중에 쓰였는지는 종이가 알려줬다.\n\n+ [근무표를 본다] -> b01_t1_a\n+ [노트 뒷표지를 본다] -> b01_t1_b\n+ [매장을 한 바퀴 돈다] -> b01_t1_c\n\n=== b01_t1_a ===\n노트 뒤쪽 절반이 근무표였다. 날짜, [손님], [영수증], [차이].\n\n손님이 영수증보다 항상 하나 많았다. 여섯과 다섯. 열하나와 열. 아홉과 여덟. 차이 칸은 전부 비어 있었다.\n\n마지막 세 줄만 차이 칸이 채워져 있었다. **1**. **1**. **0**.\n\n0 아래로는 줄이 없었다. 줄은 있었다. 적힌 게 없었다.\n-> b01_t2\n\n=== b01_t1_b ===\n뒷표지 안쪽에 볼펜 글씨가 있었다.\n\n> 세는 건 괜찮다. 맞추는 게 문제다.\n\n그 밑에 다른 필체로, 더 작게.\n\n> 안 세면 더 좋다.\n\n두 사람 다 여기 있었다. 지금은 없었다.\n-> b01_t2\n\n=== b01_t1_c ===\n진열대 세 줄, 워크인 문 하나, 창고 문 하나. 창고 문은 열어 뒀다.\n\n워크인 옆 배수구로 물이 떨어졌다. 문에 맺힌 결로였다. 일정한 간격이었다. 세지 않았다.\n\n돌아오는 길에 유리문 안쪽을 봤다. 전단지가 한 장 붙어 있었다. 글자는 바깥을 향해 있어서 읽을 수 없었다. 카운터 위에 셀로판테이프가 있었다.\n\n> 전단지를 붙이려면 테이프가 필요하다\n-> shard(\"전단지를 붙이려면 테이프가 필요하다\") -> b01_t2\n\n=== b01_t2 ===\n차임.\n\n> 어서 오세요.\n\n이번엔 사람이 들어왔다. 모자를 쓴 손님이 진열대 사이로 갔다가 삼각김밥 하나를 들고 왔다. 바코드를 찍었다. 카드를 받았다. 영수증이 나왔다.\n\n손님이 나갔다. 문이 닫혔다.\n\n그리고 차임이 한 번 더 울렸다. 문은 움직이지 않았다.\n\n+ [\"어서 오세요.\"] -> b01_death_a\n+ {codex ? calling_voice} [말하지 않는다] (도감: 부르는 소리) -> b01_t2_b\n+ {not (codex ? calling_voice)} [말하지 않는다] -> b01_t2_b\n\n=== b01_t2_b ===\n아무 말도 하지 않았다. 자동음성이 혼자 말하고 혼자 끝냈다.\n\n2번 규칙이 왜 있는지 알 것 같았다. 인사는 사람에게 하는 것이다. 하면, 있는 게 된다.\n-> b01_t3\n\n=== b01_t3 ===\n차임이 아홉 번 울렸다. 영수증은 여덟 장이었다.\n\n세지 말라는 말은 어디에도 없었다. 그래서 셌다. 세는 동안 마음이 편했다. 그게 조금 이상했다.\n\n근무표를 폈다. 칸이 세 개였다. 손님. 영수증. 차이.\n\n앞의 두 칸은 쉬웠다. 아홉. 여덟. 볼펜이 세 번째 칸 앞에서 멈췄다.\n\n빼면 1이다. 이미 알고 있었다. 알고 있는 것과 적는 것은 다르다.\n\n+ [차이 칸에 1을 적는다] -> b01_death_b\n+ [차이 칸을 비워 둔다] -> b01_t3_b\n+ [노트를 덮는다] -> b01_t3_c\n\n=== b01_t3_b ===\n비워 뒀다. 3번이 채우지 말라고 했다.\n\n근무표를 다시 봤다. 빈 차이 칸을 가진 줄들은 전부 다음 줄이 있었다. 채운 세 줄만 다음이 없었다.\n-> b01_t4\n\n=== b01_t3_c ===\n노트를 덮었다. 아무것도 적지 않았다.\n\n덮어 놓으니 아홉과 여덟이 머릿속에 남았다. 종이에 안 적으면 다른 데 적힌다.\n-> b01_t4\n\n=== b01_t4 ===\n차임.\n\n> 어서 오세요.\n\n문은 그대로였다. 유리 너머로 아무것도 지나가지 않았다. 열 번째였다.\n\n영수증은 여덟 장. POS 화면에 폐기 등록 창이 열려 있었다. 내가 연 게 아니었다. 닫아도 다시 떴다.\n\n폐기 바구니에 유통기한이 지난 삼각김밥이 하나 있었다. 하나면 아홉이 된다. 두 개면 열이 된다.\n\n손이 바구니 쪽으로 가 있었다. 언제부터인지는 모르겠다.\n\n1번 규칙이 그러라고 했다. 1번 규칙은 나중에 끼워 넣은 것이었다.\n\n+ [폐기로 등록해서 맞춘다] -> b01_death_c\n+ [그대로 두고 카운터를 지킨다] -> b01_t4_b\n+ [진열대 사이를 돌아본다] -> b01_t4_c\n\n=== b01_t4_b ===\n손을 내렸다. 노트를 덮어 카운터 위에 놓고, 어긋난 채로 기다렸다.\n\n차임이 두 번 더 울렸다. 세지 않았다. 세지 않으니 두 번인지 세 번인지 알 수 없었고, 알 수 없으니 맞출 것도 없었다.\n\n밖은 그대로 어두웠다. 대신 워크인 압축기가 멎었다가 다시 돌았다. 근무가 끝나가는 건 그 소리로 알 수 있었다.\n-> b01_shift_change\n\n=== b01_t4_c ===\n진열대 사이를 돌았다. 세 줄 전부. 창고도, 워크인도 열어 봤다.\n\n아무도 없었다. 열 번째 손님은 없었다. 그러니 셈이 안 맞는 게 맞았다.\n\n카운터로 돌아왔다. 폐기 등록 창이 아직 떠 있었다. 닫고, 노트를 덮었다.\n-> b01_shift_change\n\n=== b01_shift_change ===\n문이 열렸다. 차임은 문이 다 열리고 나서야 울렸다. 들어온 사람이 카운터 안으로 들어와 앞치마를 집었다.\n\n\"야간 근무자분, 인수인계요.\"\n\n노트를 넘겼다. 그 사람이 표지를 보고, 차이 칸을 보고, 아무 말도 하지 않았다. 비어 있는 게 맞다는 뜻이었다.\n-> b01_clear\n\n=== b01_clear ===\n// 클리어. 다음 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b01_death_a ===\n자동음성 위에 내 인사가 얹혔다. 인사는 한 번이었는데 인사한 쪽이 둘이 되었다.\n\n차임이 곧바로 한 번 더 울렸다. 문은 닫힌 채였다. 그래도 들어온 수는 하나 늘었다.\n\n늘어난 하나가 어디 있는지는 세어 볼 것도 없었다. 카운터 안이 좁아졌다.\n-> die(\"당신은 인사를 했습니다.\", b01_chime)\n\n=== b01_death_b ===\n차이 칸에 1을 적었다. 볼펜이 종이를 눌렀다.\n\n숫자가 되자 그건 셀 수 있는 것이 되었다. 셀 수 있으면 채울 수 있다.\n\n채우는 데는 오래 걸리지 않았다. 다음 줄이 벌써 시작돼 있었다. 내 필체가 아니었다.\n-> die(\"당신은 차이를 적었습니다.\", b01_gap)\n\n=== b01_death_c ===\n삼각김밥 하나를 폐기로 등록했다. 화면의 여덟이 아홉이 되었다.\n\n손님 아홉. 영수증 아홉. 차이 없음.\n\n맞아떨어졌고, 차임이 울렸다. 나가는 소리였다. 나간 것은 문 쪽에 없었다.\n\n근무표의 다음 줄은 오래 비어 있었다.\n-> die(\"당신은 수를 맞췄습니다.\", b01_disposal)\n\n// ── /INCLUDE B01.ink ──\n// ── INCLUDE B02.ink ──\n// ink/B02.ink — B02. 호텔 (호텔 × 수량이상)\n// 원본: spaces/B02_호텔.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b02_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 shard(\"문구\") -> 다음knot (B01.ink 표본과 동일 — 인자는 파편 텍스트 문자열).\n// (필요 함수·항목은 ink/B02.codex.txt 참고 — main.ink는 건드리지 않는다.)\n//\n// 판단: 설계서 §6은 OUT 플래그로 `b02_unfixed`(수신 앵커 미구현)를 예산에 넣었으나,\n// 이 배치 브리프 지시(죽은 OUT 플래그를 만들지 않는다)에 따라 이 플래그는 만들지\n// 않았다. 클리어 텍스트(형광등 문장)는 원문 그대로 두고 대입줄만 생략했다.\n\n=== b02_gate ===\n~ current_space = \"B02\"\n~ current_weight = 1.0\n-> b02_intro\n\n=== b02_intro ===\n볼펜을 쥐고 있었다. 뚜껑이 열린 채였다.\n\n그걸 알고 나서 눈을 떴다. 카운터에 손을 짚고 서 있었다. 등 뒤 옷걸이에 {gender == \"m\":남성용|여성용} 조끼가 걸려 있었다. 사이즈가 맞지 않았다.\n-> b02_t1\n\n=== b02_t1 ===\n로비였다. 소파 두 개, 자동문, 엘리베이터 하나. 벽시계는 03:47이었고 초침이 없었다. 이번에도 놀라지 않았다.\n\n카운터 위, 아크릴 액자에 종이가 한 장 끼워져 있었다.\n\n\\**야간 프런트 근무 지침** #rules:B02\n\n1. 어긋난 수는 근무 중에 바로잡는다. #fake #dmg:ink\n2. 세 수를 확인하되 맞추지 않는다.\n3. 내선에는 인원표대로 답한다.\n4. 예비 키에 번호표를 달지 않는다.\n\n1번과 2번을 두 번 읽었다. 맞추라고 했다가 맞추지 말라고 한다. 이런 종이에는 항상 어느 한 줄이 나중에 끼어든다. 어느 줄인지는 아직 몰랐다.\n\n세는 것은 금지되어 있지 않았다. 금지된 건 그다음이었다.\n\n+ [명부를 본다] -> b02_t1_a\n+ [키함을 본다] -> b02_t1_b\n+ [조식 인원표를 본다] -> b02_t1_c\n\n=== b02_t1_a ===\n낡은 장부였다. 오늘 날짜 아래 열두 줄. 호수, 이름, 서명. 이름은 전부 같은 필체였다. 손님이 말하는 걸 프런트가 받아 적은 것이다. 열둘.\n\n고개를 드니 키함이 눈에 들어왔다. 걸이 스무 칸 중 비어 있는 칸이 열둘. 나간 키가 열둘. 맞았다.\n\n카운터 끝에 조식 인원표가 있었다. 오늘 칸에 13.\n-> b02_t2\n\n=== b02_t1_b ===\n벽에 붙은 키함. 걸이 스무 칸. 비어 있는 칸을 셌다. 열둘. 아래 칸에는 번호표가 달리지 않은 예비 키가 한 뭉치 놓여 있었다. 어느 방 것인지 알 수 없는 열쇠는 열쇠가 아니다.\n\n명부를 폈다. 오늘 열두 줄. 맞았다.\n\n조식 인원표에는 13이라고 적혀 있었다.\n-> b02_t2\n\n=== b02_t1_c ===\n카운터 끝, 주방으로 넘기는 쪽지 묶음. 맨 위 장에 오늘 날짜와 13.\n\n명부는 열두 줄이었다. 키함에서 나간 키는 열둘이었다.\n\n둘이 맞고 하나가 틀렸다. 틀린 쪽이 하나 많았다.\n-> b02_t2\n\n=== b02_t2 ===\n열둘, 열둘, 열셋.\n\n한 명이 명부에 없고 키도 받지 않았는데 아침을 먹는다. 아니면 아무도 그러지 않는데 아침이 하나 남는다. 둘 중 어느 쪽인지는 지침에 적혀 있지 않았다.\n\n+ [인계철을 넘겨본다] -> b02_t2_a\n+ [지침을 다시 읽는다] -> b02_t2_b\n+ [로비를 살핀다] -> b02_t2_c\n\n=== b02_t2_a ===\n명부 뒤쪽에 인계철이 끼워져 있었다. 밤마다 세 수를 적고 서명하는 양식지.\n\n> 12 / 12 / 13\n> 12 / 13 / 12\n> 13 / 12 / 12\n> 12 / 12 / 13\n\n계속 그런 식이었다. 항상 하나만 달랐고, 어느 자리가 다른지는 밤마다 바뀌었다. 스무 장쯤 넘겼을 때 한 줄이 나왔다.\n\n> 12 / 12 / 12\n\n그 줄 여백에만 볼펜으로 두 글자가 적혀 있었다. **맞음.**\n\n다음 줄부터 필체가 바뀌어 있었다.\n-> b02_t3\n\n=== b02_t2_b ===\n액자를 형광등 아래에서 기울여 봤다. 종이는 누렇게 바랬는데 첫 줄인 1번만 잉크가 진했다.\n\n나머지가 바래는 동안 그 줄만 바깥에 있지 않았던 것이다.\n-> b02_t3\n\n=== b02_t2_c ===\n천장 형광등 네 개 중 하나가 다른 것보다 어두웠다. 일정한 간격으로 조금씩 흐려졌다가 돌아왔다.\n\n카운터 안쪽으로 들어가 앉았다. 무릎 높이 벽에 볼펜 글씨가 있었다. 앉은 사람만 보이는 자리였다.\n\n> 맞추면 온다\n\n무엇을 무엇에 맞추는지는 적혀 있지 않았다. 적을 필요가 없었을 것이다. 여기 앉는 사람은 이미 세고 있으니까.\n-> b02_t3\n\n=== b02_t3 ===\n위층 어딘가에서 물이 내려갔다. 배관이 벽 안에서 한참 울리다가 그쳤다. 그 방 손님이 깬 모양이었다. 열두 명 중 하나가.\n\n카운터 전화가 울렸다. 액정에 객실 번호 대신 **주방**이라고 떴다.\n\n> 프런트. 조식 인원 확인 바랍니다.\n\n피곤한 목소리였다. 새벽마다 같은 걸 묻는 사람의 목소리.\n\n인원표에는 13. 명부에는 열둘. 둘 중 하나를 말해야 했다.\n\n+ [\"열세 명입니다.\"] -> b02_t3_a\n+ [\"열두 명입니다.\"] -> b02_death_a\n+ {codex ? calling_voice} [대답하지 않는다] (도감: 부르는 소리) -> b02_t3_c\n+ {not (codex ? calling_voice)} [대답하지 않는다] -> b02_t3_c\n\n=== b02_t3_a ===\n\"열세 명입니다.\"\n\n> 열세 명. 확인했습니다.\n\n그게 끝이었다. 하나 많다는 걸 이상하게 여기지 않았다. 열세 명분을 차려 본 적이 있는 사람 같았다.\n-> b02_t4\n\n=== b02_t3_c ===\n받은 채로 아무 말도 하지 않았다.\n\n> 프런트. 응답 바랍니다.\n\n같은 목소리, 같은 피로. 재촉하지 않았다. 잠시 뒤 저쪽에서 끊었다.\n\n인원표는 그대로 13이었다. 내가 아무 말도 하지 않았으므로 아무것도 고쳐지지 않았다.\n-> b02_t4\n\n=== b02_t4 ===\n자동문 유리가 밝아졌다. 창밖이 회색에서 흰색으로 바뀌는 동안 벽시계는 그대로였다.\n\n인계할 것들을 폈다.\n\n조식 인원표 13. 키함에서 나간 키 열둘. 명부를 폈다.\n\n열세 줄이었다.\n\n마지막 줄에 호수가 적혀 있었다. 이름 칸은 비어 있었다. 서명 칸도 비어 있었다. 숫자를 쓴 필체는 내 것이 아니었고, 앞의 열두 줄을 쓴 필체도 아니었다.\n\n밤새 한 자리에 있던 어긋남이 다른 자리로 옮겨 가 있었다. 이제 하나 모자란 건 키였다.\n\n볼펜을 들었다. 뚜껑은 아직 열려 있었다.\n\n+ [그대로 인계한다] -> b02_t4_a\n+ [열세 번째 줄을 지운다] -> b02_death_b\n+ [예비 키에 번호표를 달아 건다] -> b02_death_c\n\n=== b02_t4_a ===\n인계철에 세 수를 적었다. 13 / 12 / 13.\n\n서명 칸이 있었다. 쓸 것이 없어서 비워 뒀다. 여백에도 아무것도 적지 않았다. 맞음, 이라고 적을 일은 없었다.\n\n볼펜 뚜껑을 닫았다.\n\n카운터를 나오면서 천장을 봤다. 형광등 하나가 죽어간다. 나머지 셋은 멀쩡했고, 아무도 그걸 갈러 오지 않았다.\n\n자동문이 열렸다.\n-> shard(\"형광등 하나가 죽어간다\") -> b02_clear\n\n=== b02_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b02_death_a ===\n\"열두 명입니다.\"\n\n> 열두 명. 수정했습니다.\n\n수가 맞았다. 명부 열둘, 키 열둘, 조식 열둘.\n\n아침에 로비에 한 사람이 서 있었다. 소파도 아니고 자동문 앞도 아니고, 식당으로 들어가는 문 앞에. 등을 보이고. 열두 명은 전부 식당 안에 있었다.\n\n줄인 한 명분을 받으러 온 것이다. 나한테는 줄 게 없었다.\n-> die(\"당신은 수를 맞췄습니다.\", b02_extra)\n\n=== b02_death_b ===\n볼펜으로 그었다. 한 번, 두 번. 세 번째에 종이가 눌려 찢어졌다.\n\n열세 줄이 열두 줄이 됐다. 세 수가 전부 열둘이 됐다.\n\n이름 칸이 비어 있는 줄이었다. 이름이 없는 것을 명부에서 지우면, 그건 어디에도 없는 것이 된다. 어디에도 없는 것은 자기가 있던 자리로 돌아온다.\n\n엘리베이터가 내려오기 시작했다. 층수 표시등이 하나씩 꺼졌다.\n-> die(\"당신은 이름 없는 줄을 지웠습니다.\", b02_roster)\n\n=== b02_death_c ===\n아래 칸에서 예비 키를 하나 꺼냈다. 명부 마지막 줄의 호수를 번호표에 적어 달고, 열세 번째 자리에 걸었다.\n\n나간 키 열둘, 걸린 키 하나. 명부 열셋. 조식 열셋. 맞았다.\n\n십 초쯤 지나서 그 키가 없어졌다. 떨어진 게 아니었다. 걸이가 흔들리고 있었다.\n\n프런트에 서서 기다렸다. 손님이 키를 받아 갔으면 방으로 올라간다. 올라가려면 여기를 지나야 한다.\n-> die(\"당신은 자리를 만들었습니다.\", b02_key)\n\n// ── /INCLUDE B02.ink ──\n// ── INCLUDE B03.ink ──\n// ink/B03.ink — B03. 고속도로 터널 야간 점검 (터널 × 제도)\n// 원본: spaces/B03_터널.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b03_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 shard(\"문구\") -> 다음knot (B01.ink 표본과 동일 — 인자는 파편 텍스트 문자열).\n// (필요 함수·항목은 ink/B03.codex.txt 참고 — main.ink는 건드리지 않는다.)\n//\n// 공간 로컬 플래그: b03_marked_done(턴2-A). gate에서 리셋.\n// 판단: 설계서 §6은 OUT 플래그로 `b03_unsigned`(수신 앵커 미구현)를 예산에 넣었으나,\n// 이 배치 브리프 지시(죽은 OUT 플래그를 만들지 않는다)에 따라 이 플래그는 만들지\n// 않았다. 클리어 텍스트는 원문 그대로 두고 대입줄만 생략했다.\n//\n// 파서 메모(scripts/ink_walk.py 한계, A08.ink와 동일한 패턴):\n// - b03_t4_b의 \"{cond: -> a | -> b}\" 한 줄 라우팅은 이 파서가 진짜 분기로\n//   추적하지 못한다(텍스트로만 처리) — b03_t4_b가 \"미종료\"로, b03_death_c_variant가\n//   \"도달 불가\"로 잘못 표시될 수 있다. 실제 Ink 컴파일러 기준으로는 정상 문법이다.\n\nVAR b03_marked_done = false\n\n=== b03_gate ===\n~ current_space = \"B03\"\n~ current_weight = 1.0\n~ b03_marked_done = false\n-> b03_intro\n\n=== b03_intro ===\n손전등이 켜진 채로 손에 있었다.\n\n빛이 아래를 향하고 있어서 바닥부터 봤다. 아스팔트. 흰 차선. 차선이 젖어 있었다.\n\n반대 손에는 클립보드가 있었다.\n-> b03_t1\n\n=== b03_t1 ===\n터널이었다.\n\n갱구에서 스무 걸음쯤 안쪽. 나트륨등이 천장을 따라 켜져 있었다. 주황색. 그 색 아래에서는 내 손도 주황색이었다.\n\n갱구 옆에 점검 차량이 서 있었다. 회전등은 꺼져 있고 운전석 문이 열려 있었다. 계기판이 보였다. 03:47. 초침이 없었다.\n\n클립보드를 봤다. 위에 절차서, 아래에 일지.\n\n\\**○○터널 야간 점검 절차서** #rules:B03\n\n1. 비상전화는 받되 응답하지 않는다.\n2. 배수구 안을 들여다보지 않는다.\n3. 서명 없는 일지는 접수되지 않는다. #fake #dmg:strike\n4. 이상 항목은 이월하고 서명하지 않는다.\n\n□□고속도로 관리사무소. {gender == \"m\":남성|여성} 점검자 대기실은 관리동 1층입니다.\n\n3번만 인쇄가 두 줄로 지워지고 그 여백에 볼펜으로 새로 적혀 있었다.\n\n4번도 두 번 읽었다. 이상 항목이 있으면 서명하지 않는다. 3번은 서명이 없으면 접수가 안 된다고 한다. 둘 중 하나는 나중에 끼워 넣은 것이다.\n\n어느 쪽이 나중인지는 볼 것도 없었다. 문제는 그걸 쓴 손이 누구 손이냐는 거였다.\n\n+ [일지를 넘겨 본다] -> b03_t1_a\n+ [점검 차량을 살핀다] -> b03_t1_b\n+ [그냥 걷기 시작한다] -> b03_t1_c\n\n=== b03_t1_a ===\n날짜, 구간, 항목, 점검자. 점검자 칸의 이름이 매일 달랐다. 스무 개쯤 세다가 그만뒀다.\n\n이름은 전부 달랐고, 글씨는 전부 같았다. 한 사람이 스무 개의 이름을 썼거나, 스무 명이 같은 손을 빌렸다.\n\n뒷장으로 갈수록 적힌 게 줄었다. 배수구 완료, 이상 없음, 전 항목 완료. 서명은 매번 있었다.\n\n마지막 장만 달랐다. 배수구 이월, 한 줄. 점검자 칸이 비어 있었다.\n\n칸 아래 여백에 볼펜으로 쓴 게 있었다.\n\n> 다음 사람에게. 칸을 채우지 마.\n\n이름을 적지 않은 사람에게만 여백에 글씨를 쓸 시간이 있었다.\n-> b03_t2\n\n=== b03_t1_b ===\n안은 비어 있었다. 키가 꽂혀 있고 시동은 꺼져 있었다. 조수석에 안전모 하나.\n\n안전모 안쪽 이름표 자리에 접착제 자국만 네모나게 남아 있었다. 한 번 뜯은 자국이 아니라 여러 번 갈아 붙인 자국이었다.\n\n계기판 아래 클립보드 거치대가 비어 있었다. 클립보드는 내 손에 있었다. 그 순서가 마음에 들지 않았다.\n-> b03_t2\n\n=== b03_t1_c ===\n걸었다. 상행에서 하행 쪽으로.\n\n백 걸음쯤에서 조명 하나가 나가 있었다. 그 아래를 지날 때 발소리가 달라졌다. 젖은 소리였다.\n-> b03_t2\n\n=== b03_t2 ===\n측벽 아래에 배수구가 있었다. 쇠살대. 살대 위로 물이 넘쳐서 차선 쪽으로 얇게 퍼져 있었다.\n\n물소리가 났다. 살대 아래에서. 흐르는 소리가 아니라 고인 소리였다.\n\n막힌 것이다. 이상이 있는 항목이다.\n\n손전등을 비췄다. 각도가 얕아서 빛은 물 표면까지만 닿았다. 2번대로 안은 들여다보지 않았다. 살대 턱 바로 밑까지 차 있었다.\n\n웅덩이를 밟지 않으려고 돌아 디뎠다. 발이 젖지 않는 데로. 물이 얕은 데만.\n\n왜 그 말투가 먼저 떠올랐는지는 모르겠다.\n-> shard(\"물이 얕은 데만\") -> b03_t2_choice\n\n=== b03_t2_choice ===\n+ [배수구를 완료로 표시한다] -> b03_t2_a\n+ [이월로 적는다] -> b03_t2_b\n+ [살대 사이로 안을 본다] -> b03_death_a\n\n=== b03_t2_a ===\n완료 칸에 표시했다. 볼펜이 잘 나가지 않아서 두 번 그었다.\n\n그으면서 뭔가에 대답한 기분이 들었다. 물어본 사람은 없었다.\n~ b03_marked_done = true\n-> b03_t3\n\n=== b03_t2_b ===\n이월. 두 글자를 적었다.\n\n마지막 장의 \"배수구 이월\" 옆에 내 \"이월\"이 나란히 놓였다. 닮지 않았다. 아직은.\n-> b03_t3\n\n=== b03_t3 ===\n측벽에 노란 상자가 붙어 있었다. 비상전화함. 문이 반쯤 열려 있었다.\n\n벨이 울렸다. 상자 위에 붙은 확성기가 같이 켜졌다.\n\n> 점검자분. 관리사무소입니다. 점검자분.\n\n사무적인 목소리였다. 야간 근무 두 시간째쯤의 목소리. 억양이 없어서 나이도 짐작되지 않았다.\n\n{b03_marked_done: 그리고 이름을 하나 불렀다. 일지에서 본 이름이었다. 몇 번째 줄이었는지는 기억나지 않았다.}\n\n+ [수화기를 들고 응답한다] -> b03_death_b\n+ {codex ? calling_voice} [수화기를 들되 말하지 않는다] (도감: 부르는 소리) -> b03_t3_b\n+ {not (codex ? calling_voice)} [수화기를 들되 말하지 않는다] -> b03_t3_b\n\n=== b03_t3_b ===\n수화기를 들었다. 1번은 받으라고 했고, 대답하지 말라고 했다. 둘 다 지켰다.\n\n잡음. 그 사이에 숨소리 비슷한 게 있었다. 목소리가 한 번 더.\n\n> 점검자 확인 바랍니다.\n\n대답하지 않았다. 잠시 후 끊겼다.\n\n수화기를 걸고 나서 손잡이가 젖어 있는 걸 알았다. 내 손 때문인지는 알 수 없었다.\n-> b03_t4\n\n=== b03_t4 ===\n하행 갱구가 보였다. 바깥은 어두웠다. 밤이라서일 것이다. 그렇게 생각하기로 했다.\n\n갱구 옆에 콘크리트 건물. 관리동이었다. 창구 하나, 유리 아래에 접수함. 사람은 없고 형광등만 켜져 있었다.\n\n접수함 옆에 코팅된 팻말.\n\n> 점검 종료 후 일지를 제출하십시오.\n\n클립보드에서 일지를 뺐다. 하단 점검자란이 비어 있었다. 스무 명이 채운 네모 칸.\n\n3번: 서명 없는 일지는 접수되지 않는다. 손글씨.\n4번: 이상 항목은 이월하고 서명하지 않는다. 인쇄체.\n\n접수되지 않으면 어떻게 되는지는 어디에도 적혀 있지 않았다. 접수되면 어떻게 되는지도.\n\n+ [서명한다] -> b03_death_c\n+ [점검자란을 비운 채 제출한다] -> b03_t4_b\n+ {b03_marked_done} [완료 표시를 지우고 이월로 고쳐 적는다] -> b03_t4_c\n\n=== b03_t4_b ===\n{\n- b03_marked_done:\n    -> b03_death_c_variant\n- else:\n    -> b03_clear\n}\n\n=== b03_t4_c ===\n완료 표시를 볼펜으로 지웠다. 두 번 그은 자리라 잘 지워지지 않아서 네 번 그었다. 그 옆에 이월, 이라고 적었다.\n-> b03_clear\n\n=== b03_clear ===\n빈 칸인 채로 일지를 접수함에 밀어 넣었다. 철판이 한 번 여닫혔다.\n\n유리 안쪽은 조용했다. 확성기가 켜지는 소리가 났다. 잡음만 나다가 꺼졌다.\n\n부를 게 없으면 그렇게 되는 모양이었다.\n\n갱구 바깥으로 걸었다. 등 뒤에서 나트륨등이 꺼지는 것 같았지만 돌아보지 않았다. 돌아보라는 항목은 절차서에 없었고, 없는 건 하지 않기로 했다.\n-> cleared\n\n// ── 사망 knot 4종(트리거). 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n// (c)와 (c-변형)은 도감 항목을 공유한다(b03_signature).\n\n=== b03_death_a ===\n빛을 넣으려고 몸을 낮췄다. 이마가 살대에 닿았다.\n\n물이 고여 있었다. 깊이는 보이지 않았다. 배수구는 사람 어깨가 들어가는 폭이 아니다. 그런데 아래에서, 그 폭에 맞지 않는 것이 한 번 움직였다.\n-> die(\"당신은 배수구 안을 봤습니다.\", b03_drain)\n\n=== b03_death_b ===\n\"점검자입니다.\"\n\n잡음이 그쳤다.\n\n> 확인됐습니다. 금일 점검자 한 명.\n\n수화기 저쪽에서 볼펜 긋는 소리가 났다. 일지에 적히는 소리였다. 내 일지는 내 손에 있었다.\n-> die(\"당신은 점검자 확인에 응답했습니다.\", b03_checkin)\n\n=== b03_death_c ===\n뭘 적어야 할지 몰라서 칸에 선을 하나 그었다. 그것도 서명이었다.\n\n접수함에 넣자마자 안쪽에서 철판 소리가 났다. 유리 아래 틈으로 손이 나와 일지를 가져갔다. 볼펜을 쥔 손이었다. 내 선 위에 이름이 하나 적혔다. 처음 보는 이름이었다.\n\n유리 너머에서 목소리가 말했다. 수고하셨습니다.\n\n내일 일지에도 그 이름이 있을 것이다. 스물한 번째 줄에.\n-> die(\"당신은 일지에 서명했습니다.\", b03_signature)\n\n=== b03_death_c_variant ===\n점검자란은 비어 있었다. 비워 뒀으니 됐다고 생각했다.\n\n유리 아래 틈으로 손이 나와 일지를 가져갔다. 손이 배수구 항목의 완료 표시를 짚었다. 그리고 비어 있는 점검자란에 이름을 적었다.\n\n칸을 채운 건 서명이 아니었다. 완료였다.\n-> die(\"당신은 이상 항목을 완료로 제출했습니다.\", b03_signature)\n\n// ── /INCLUDE B03.ink ──\n// ── INCLUDE B04.ink ──\n// ink/B04.ink — B04. 야간 자습실 (학교 × 시간이상)\n// 원본: spaces/B04_학교.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b04_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 shard(\"문구\") -> 다음knot (B01.ink 표본과 동일 — 인자는 파편 텍스트 문자열).\n// (필요 함수·항목은 ink/B04.codex.txt 참고 — main.ink는 건드리지 않는다.)\n//\n// 공간 로컬 변수: logged(턴2-A, 텍스처 전용 — 생사에 관여하지 않고 밖으로 안 나감). gate에서 리셋.\n// 원본의 \"→ [선택 4]로(A/B)\" 되돌림 루프(턴4-C)는 무한 루프 방지를 위해 C 선택지를\n// 뺀 b04_t4_repeat(A/B 둘만)로 처리했다. 도착점은 b04_death_c·b04_t4_b를 그대로\n// 재사용한다(사망·클리어 문구가 완전히 같으므로 knot을 복제하지 않았다) — 그 대가로\n// ink_walk.py 정적 판정에서 merge 노드가 5개(설계서 §6 예산 2~3 밖)로 잡힌다.\n// 판단: knot을 복제해 merge는 3으로 맞출 수 있었으나(시도해 봄) 그러면 즉사 트리거가\n// (kn, reason, entry) 튜플 단위로 다시 세져 4개(예산 3 밖)로 잡히는 반대급부가\n// 생겨, 두 지표 중 하나만 벗어나는 이 구조(merge 5)를 택했다. 아래 codex.txt 메모\n// 참고.\n\nVAR logged = false\n\n=== b04_gate ===\n~ current_space = \"B04\"\n~ current_weight = 1.0\n~ logged = false\n-> b04_intro\n\n=== b04_intro ===\n종이 울리고 있었다.\n\n끝나가는 중이었다. 여운이 복도 쪽으로 빠져나가는 걸 들으면서 눈을 떴다.\n\n손에 클립보드가 있었다. 왼팔에 노란 완장이 있었다. 검은 글씨로 감독.\n-> b04_t1\n\n=== b04_t1 ===\n자습실이었다.\n\n앞문 위에 아크릴 명패. **제2자습실**. 형광등은 앞쪽 절반만 켜져 있었다.\n\n책상이 다섯 줄. 앉은 사람들이 있었다. 아무도 고개를 들지 않았다. 몇인지는 세지 않았다. 세라는 항목이 없었으니까.\n\n앞 벽에 시계. 03:47. 초침이 없었다.\n\n클립보드를 봤다. 위에 지침, 아래에 감독 일지.\n\n\\**야간 자율학습 감독 지침** #rules:B04\n\n1. 종과 종 사이에 문을 열지 않는다.\n2. 호출된 학생을 내보내지 않는다.\n3. 종료 종 세 번 전에는 퇴실하지 않는다. #fake #dmg:tape\n4. 짧아진 교시가 둘이면 뒷문으로 나간다.\n\n□□고등학교 학생부. {gender == \"m\":남|여}학생 자습실은 3층입니다.\n\n3번만 수정테이프 위에 볼펜으로 덧쓴 것이었다. 테이프 아래로 인쇄체가 비쳤다.\n\n3번과 4번을 두 번 읽었다. 종료 종 전에는 못 나간다. 짧아진 교시가 둘이면 나간다. 둘 다 지킬 방법은 없다.\n\n교시가 짧아지는 걸 알려면 재야 한다. 시계는 03:47에서 움직이지 않았다. 그러면 무엇으로 세라는 건가.\n\n방금 종이 울렸다. 다음 종까지가 이번 교시다. 그 사이를 재는 자가 이 방 어딘가에 있어야 했다.\n\n+ [감독 일지를 넘겨 본다] -> b04_t1_a\n+ [셋째 줄 창가 자리를 본다] -> b04_t1_b\n+ [순회한다] -> b04_t1_c\n\n=== b04_t1_a ===\n교시, 인원, 특이사항. 칸이 반듯했다.\n\n앞쪽 장은 빽빽했다. 뒤로 갈수록 비었다. 마지막 장은 4교시까지만 적혀 있고 그 아래가 전부 빈칸이었다.\n\n맨 아래 여백에 볼펜으로 한 줄.\n\n> 적을수록 짧아진다\n\n그 아래에 작대기가 두 개 그어져 있었다. 세 번째는 없었다.\n\n둘까지 세고 그만둔 사람이 있었다. 그만둔 이유는 두 가지 중 하나다. 다 세서 나갔거나, 다 세기 전에 끝났거나.\n-> b04_t2\n\n=== b04_t1_b ===\n비어 있었다. 의자만 반듯하게 밀어 넣어져 있었다.\n\n상판에 正자가 새겨져 있었다. 볼펜으로 눌러 판 것이었다. 세로로 열댓 개.\n\n위쪽 것들은 획이 다 차 있었다. 아래로 갈수록 획이 줄었다. 마지막은 한 획이었다.\n\n한 획 옆에 두 글자가 더 있었다.\n\n> 뒷문\n\n정자 하나에 획은 다섯이다. 획을 채우려면 시간이 있어야 한다. 아래로 갈수록 시간이 없었던 것이다.\n-> b04_t2\n\n=== b04_t1_c ===\n한 바퀴 돌았다. 다섯 줄 사이를 지나 뒤편 사물함까지 갔다가 돌아왔다.\n\n아무도 고개를 들지 않았다. 펜 소리는 났다. 종이 넘어가는 소리는 나지 않았다.\n\n한 바퀴에 드는 만큼을 몸에 새겨 뒀다. 셀 수 있는 게 그것뿐이었다.\n-> b04_t2\n\n=== b04_t2 ===\n종이 울렸다.\n\n아홉 바퀴였다. 첫 종에서 이 종까지 아홉 바퀴. 아홉이 긴 건지 짧은 건지는 알 수 없었다. 비교할 게 없으니 아홉은 그냥 아홉이었다.\n\n앞문 너머 복도 끝에서 물 떨어지는 소리가 났다. 정수기였다. 냉각기가 도는 소리도 같이 났다. 문이 닫혀 있는데 그렇게 또렷한 게 이상했다.\n\n일지의 5교시 칸이 비어 있었다. 볼펜은 클립보드에 끼워져 있었다.\n\n+ [교시를 기록한다] -> b04_t2_a\n+ [기록하지 않는다] -> b04_t2_b\n+ [복도로 나가 물을 마신다] -> b04_death_a\n\n=== b04_t2_a ===\n칸에 적었다. 인원 칸에는 사선을 그었다. 세지 않았으니까.\n\n적는 동안 볼펜 끝이 종이를 눌렀다. 눌린 자리가 아래 장까지 비쳤다. 여백의 한 줄이 그 아래에 있었다.\n~ logged = true\n-> b04_t3\n\n=== b04_t2_b ===\n칸을 비워 뒀다.\n\n비워 두는 것도 기록이라는 생각이 들었다. 앞사람이 작대기를 그은 이유를 알 것 같았다. 빈칸은 안 센 것과 못 센 것을 구별해 주지 않는다.\n-> b04_t3\n\n=== b04_t3 ===\n종이 울렸다.\n\n{logged: 다섯 바퀴였다.|여섯 바퀴였다.} 아홉보다 짧았다. 첫 번째다.\n\n칸을 비웠다. 적으면 줄어드는지 보기로 했다. 여백에 작대기를 하나 그었다. 앞사람의 두 개 아래에.\n\n순회를 돌았다.\n\n셋째 줄 빈자리를 지날 때 어깨에 무게가 한 번 걸렸다. 손바닥 하나만큼. 걸렸다가 없어졌다.\n\n지침에는 어깨에 대한 항목이 없었다. 없는 건 금지도 허가도 아니다.\n\n스피커가 켜졌다. 앞문 위였다.\n\n> 자습 중인 학생은. 자습 중인 학생은 교무실로 오십시오.\n\n또박또박한 발음이었다. 호명을 자주 해 본 사람의 속도였다. 이름이 들어갈 자리만 빠르게 넘어갔다.\n\n한 번 더.\n\n> 3층 제2자습실. 자습 중인 학생. 담당 선생님이 기다리십니다.\n\n이 방에서 자습 중이지 않은 사람은 나 하나였다. 그런데 방송은 나를 부르고 있는 것 같았다.\n-> shard(\"어깨에 손\") -> b04_t3_choice\n\n=== b04_t3_choice ===\n+ [교무실로 간다] -> b04_death_b\n+ {codex ? calling_voice} [자리에 앉히고 문 앞에 선다] (도감: 부르는 소리) -> b04_t3_b\n+ {not (codex ? calling_voice)} [자리에 앉히고 문 앞에 선다] -> b04_t3_b\n+ [방송을 무시하고 순회를 계속한다] -> b04_t3_c\n\n=== b04_t3_b ===\n아무도 일어나지 않았으므로 앉힐 것도 없었다. 대신 앞문 앞에 섰다.\n\n스피커가 세 번째로 켜졌다. 아무 말도 하지 않고 잡음만 내다가 꺼졌다.\n\n2번은 학생을 내보내지 말라고 했다. 나를 내보내지 말라는 말은 없었다. 그건 지침을 쓴 사람이 감독을 학생으로 세어 본 적이 없다는 뜻이다.\n-> b04_t4\n\n=== b04_t3_c ===\n계속 돌았다. 스피커는 같은 문장을 두 번 더 반복하고 꺼졌다.\n\n세 번째 반복에서 \"교무실로\" 뒤가 잘렸다. 오라는 말이 없는 호출은 호출이 아니다. 그렇게 생각하기로 했다.\n-> b04_t4\n\n=== b04_t4 ===\n종이 울렸다.\n\n{logged: 두 바퀴였다.|세 바퀴였다.} 두 번째다.\n\n여백에 작대기를 하나 더 그었다. 두 개가 됐다. 앞사람의 두 개와 나란히.\n\n4번: 짧아진 교시가 둘이면 뒷문으로 나간다.\n3번: 종료 종 세 번 전에는 퇴실하지 않는다. 수정테이프 위 볼펜.\n\n한 바퀴를 돌기 시작했다. 뒤편 사물함에 닿기 전에 종이 울렸다.\n\n그리고 또 울렸다. 그다음 것은 앞엣것이 끝나기 전에 시작됐다.\n\n1번이 떠올랐다. 종과 종 사이에 문을 열지 않는다.\n\n사이가 없었다.\n\n+ [앞문을 연다] -> b04_death_c\n+ [뒷문으로 퇴실한다] -> b04_t4_b\n+ [세 번째 종을 기다린다] -> b04_t4_c\n\n=== b04_t4_b ===\n뒷문 손잡이가 차가웠다.\n\n종은 겹쳐서 울리고 있었다. 셋인지 넷인지 세지 않았다. 셀 수 있는 것이었으면 셌을 것이다.\n\n일지를 감독 책상에 두고 나왔다. 마지막 두 칸은 비어 있었다. 여백에는 작대기가 넷.\n-> b04_clear\n\n=== b04_t4_c ===\n기다렸다.\n\n세 번째 종은 오지 않았다. 세 번째가 되려면 두 번째가 끝나야 하는데, 끝나지 않았다.\n\n종이 끊이지 않았다. 하나가 세 번 울리는 것과, 끊이지 않는 것은 다른 일이다. 3번을 쓴 사람은 그걸 몰랐거나, 알고 썼다.\n-> b04_t4_repeat\n\n=== b04_t4_repeat ===\n+ [앞문을 연다] -> b04_death_c\n+ [뒷문으로 퇴실한다] -> b04_t4_b\n\n=== b04_clear ===\n복도는 조용했다. 문 하나를 사이에 두고 그렇게 다를 수가 있나 싶었다.\n\n냉각기는 돌지 않았다.\n\n스피커가 켜졌다.\n\n> 자습 중인\n\n거기서 끊겼다. 뒤를 잇지 못하는 문장이었다.\n\n계단 쪽으로 걸었다. 완장은 팔에 그대로 있었다. 벗지 않았다. 벗으면 뭐가 되는지 알 것 같아서였다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b04_death_a ===\n문을 열었다. 복도는 어두웠고 정수기만 파랗게 켜져 있었다.\n\n종이컵에 물을 받는데 종이 울렸다. 컵이 반도 안 찼을 때 또 울렸다. 세 번째는 두 번째가 끝나기 전에 왔다.\n\n돌아왔을 때 자습실 불은 꺼져 있었다. 문은 안에서 잠겨 있었다. 유리창에 대고 봤더니 셋째 줄 창가 자리에 누가 앉아 있었다. 고개를 들지 않았다.\n\n복도에서 다음 종을 기다렸다. 종은 이미 울리고 있었다. 사이가 없어서 기다릴 자리가 없었다.\n-> die(\"당신은 종과 종 사이에 문을 열었습니다.\", b04_gap)\n\n=== b04_death_b ===\n계단을 내려갔다. 2층 교무실에만 불이 켜져 있었다.\n\n문을 열면서 감독입니다, 라고 말하려다 그만뒀다. 팔에 완장이 없었다. 언제부터 없었는지는 모르겠다.\n\n안쪽 책상에 사람이 앉아 있었다. 뒤통수만 보였다. 출석부를 한 장 넘기더니, 돌아보지 않은 채로 말했다.\n\n> 앉으세요. 자습 아직 안 끝났어요.\n\n의자가 하나 비어 있었다. 처음부터 비어 있었던 자리처럼 반듯하게 밀어 넣어져 있었다.\n-> die(\"당신은 호출에 응했습니다.\", b04_call)\n\n=== b04_death_c ===\n세 번 울렸다고 생각했다. 세었으니까.\n\n앞문을 열자 종이 그쳤다. 복도는 조용했다. 조용한 게 답인 것 같았다.\n\n돌아서서 자습실을 봤다. 다섯 줄이 전부 비어 있었다. 책상 상판마다 正자가 세로로 새겨져 있었다. 셋째 줄 창가만 획이 하나였다.\n\n내 손에 볼펜이 있었다. 언제부터 쥐고 있었는지는 모르겠다. 획을 하나 더 그으면 두 획이 된다. 그다음은 알 수 없었다.\n-> die(\"당신은 끊이지 않는 것을 세 번으로 셌습니다.\", b04_bell)\n\n// ── /INCLUDE B04.ink ──\n// ── INCLUDE B05.ink ──\n// ink/B05.ink — B05. 총무팀 자료실 (회사 × 규칙서자체)\n// 원본: spaces/B05_회사규정집.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b05_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편 없음(설계서 §1 표 \"·\") — shard() 호출 없음.\n// (필요 항목은 ink/B05.codex.txt 참고 — main.ink는 건드리지 않는다.)\n//\n// OUT 플래그 없음(설계서 §6에서도 이미 0 — 받는 앵커가 없어 만들지 않는다고 명시).\n// 내부 로컬 변수 없음.\n\n=== b05_gate ===\n~ current_space = \"B05\"\n~ current_weight = 1.0\n-> b05_intro\n\n=== b05_intro ===\n물방울 떨어지는 소리가 났다. 몇 초에 한 번씩, 같은 간격으로.\n\n품에 두꺼운 책이 있었다. 표지가 딱딱하고 모서리가 닳아 있었다. 손끝에서 종이 냄새가 났다.\n\n소리가 나는 쪽을 봤다. 벽에 붙은 제습기였다. 아래 배수통에 물이 반쯤 차 있었다.\n-> b05_t1\n\n=== b05_t1 ===\n자료실이었다.\n\n벽 전체가 서가였다. 서가는 천장까지 갔고, 통로는 어깨가 양쪽 책등에 닿을 만큼 좁았다. 형광등은 전부 켜져 있었다.\n\n문 옆에 안내판. **총무팀 자료실 / 문서고**. 그 아래 층수를 적는 자리는 긁혀서 지워져 있었다.\n\n가운데에 열람대가 하나 있었다. 거기에 책을 놓았다.\n\n목차를 봤다. 제1조부터 제3조까지. 세 줄이었다. 넘겼다.\n\n\\**□□ 사내 규정집 — 문서관리 편** #rules:B05\n\n1. 대장에 없는 자료는 열지 않는다.\n2. 개정분은 익일 적용하며 덧붙이지 않는다.\n3. 수화기에 대고 이름을 말하지 않는다.\n4. 신청자를 호명하여 확인한다. #fake #dmg:ink\n\n부칙. {gender == \"m\":남성|여성} 담당자는 야간 근무 시 지하 통용문을 이용한다.\n\n목차로 돌아갔다. 세 줄이었다. 다시 세지 않았다. 세지 않아도 세 줄이라는 건 보였다.\n\n본문은 넷이었다.\n\n목차를 만드는 사람과 본문을 만드는 사람이 같은 회사에 있다면 이런 일은 잘 일어나지 않는다. 그래도 일어난다. 그건 안다. 문제는 어느 쪽이 나중에 생겼느냐다.\n\n+ [개정 이력표를 본다] -> b05_t1_a\n+ [제4조가 실린 장을 만져 본다] -> b05_t1_b\n+ [서가 사이를 걸어 본다] -> b05_t1_c\n\n=== b05_t1_a ===\n뒤표지 안쪽에 종이 한 장이 붙어 있었다. 자로 그은 표. 개정일, 조항, 개정 사유, 개정자.\n\n날짜가 하루씩 내려갔다. 조항 칸은 제1조, 제2조, 제3조. 하루에 하나씩 늘었다. 사유 칸은 전부 비어 있었다. 개정자 칸도 전부 비어 있었다.\n\n맨 아래에서 두 번째 줄이 오늘이었다. 조항 칸에 제4조.\n\n그 아래 마지막 줄은 날짜가 비어 있었다. 조항 칸만 채워져 있었다. **제5조**.\n\n내일 것이 벌써 적혀 있었다. 적은 손은 이력표 어디에도 없었다.\n-> b05_t2\n\n=== b05_t1_b ===\n제4조가 실린 장만 매끄럽고 토너가 손끝에 묻었다. 페이지 번호도 앞장과 같은 12였고, 제본 실에 그 장만 걸려 있지 않았다.\n\n풀로 붙인 것도 아니었다. 그냥 거기 있었다.\n\n빼려고 하지는 않았다. 아직은.\n-> b05_t2\n\n=== b05_t1_c ===\n통로로 들어갔다. 자료철 등이 번호순으로 꽂혀 있었다. 어깨가 양쪽에 닿아서 옆으로 걸었다.\n\n한 칸이 비어 있었다. 라벨은 붙어 있는데 자료가 없었다.\n\n빈자리에 먼지 자국이 없었다. 오래 비어 있던 자리는 그렇지 않다.\n-> b05_t2\n\n=== b05_t2 ===\n열람대 옆에 반납대가 있었다. 서류철 하나가 올라와 있었다. 표지에 손글씨로 **열람 신청서**.\n\n그 옆에 반출 대장. 펼쳐져 있었다. 오늘 날짜 칸에 아무것도 없었다.\n\n대장에 없는 자료가 반납대에 있었다. 제1조는 그런 걸 열지 말라고 했다.\n\n+ [그대로 둔다] -> b05_t2_a\n+ [표지를 열어 본다] -> b05_death_c\n+ [반출 대장을 뒤부터 넘겨 본다] -> b05_t2_c\n\n=== b05_t2_a ===\n손을 뗐다. 서류철은 반납대에 그대로 있었다.\n\n돌아서면서 한 번 더 봤다. 위치가 조금 앞으로 나와 있는 것 같았다. 반납대 모서리에서 손가락 한 마디쯤.\n-> b05_t3\n\n=== b05_t2_c ===\n뒤에서부터 넘겼다. 반출 기록이 빽빽했다. 자료 번호, 반출일, 반납일. 반납일이 비어 있는 줄은 없었다. 성실한 자료실이었다.\n\n마지막 기록 아래 여백에 볼펜으로 한 줄이 있었다.\n\n> 목차는 늘지 않는다.\n\n인쇄된 표 바깥이었다. 대장을 쓰는 사람은 여백에 쓰지 않는다. 여백에 쓰는 사람은 표를 채울 시간이 없는 사람이다.\n-> b05_t3\n\n=== b05_t3 ===\n서고 안쪽 벽에 인터폰이 붙어 있었다. 회색 상자에 수화기 하나. 그 옆에 벽시계가 있었다.\n\n03:47. 초침 자리가 비어 있었다.\n\n인터폰이 울렸다. 두 번 울리고 스피커가 켜졌다.\n\n> 자료실 담당자. 열람 신청 접수됐습니다. 신청자 확인 바랍니다.\n\n사무적인 목소리였다. 하루에 같은 문장을 마흔 번쯤 말하는 사람의 목소리. 급하지 않았다.\n\n제3조는 수화기에 대고 이름을 말하지 말라고 했다.\n제4조는 안쪽에 대고 신청자를 부르라고 했다.\n\n제4조는 오늘 늘어난 것이다. 그리고 제2조는 오늘 것을 내일부터 적용하라고 했다.\n\n+ {codex ? calling_voice} [수화기를 들고 아무 말도 하지 않는다] (도감: 부르는 소리) -> b05_t3_a\n+ {not (codex ? calling_voice)} [수화기를 들고 아무 말도 하지 않는다] -> b05_t3_a\n+ [서고 안쪽에 대고 신청자를 호명한다] -> b05_death_a\n+ [수화기를 들지 않는다] -> b05_t3_c\n\n=== b05_t3_a ===\n수화기를 들었다. 귀에 댔다.\n\n잡음. 그 뒤에 종이 넘기는 소리. 사람이 있는 쪽에서 나는 소리였다.\n\n> 담당자. 신청자 확인 바랍니다. 반복합니다.\n\n말하지 않았다. 잡음이 길어지다가 끊겼다.\n\n수화기를 걸었다. 걸고 나서, 저쪽에서 먼저 끊었는지 이쪽에서 끊긴 건지 생각해 봤다. 알 수 없었다.\n-> b05_t4\n\n=== b05_t3_c ===\n들지 않았다. 스피커가 한 번 더 같은 말을 하고 조용해졌다.\n\n조용해진 다음에, 서가 안쪽에서 벨이 울렸다. 같은 소리였다. 더 안쪽에서 또 울렸다.\n\n문서고에 인터폰이 몇 대인지는 적혀 있지 않았다. 규정집에도, 안내판에도.\n-> b05_t4\n\n=== b05_t4 ===\n열람대로 돌아왔다. 규정집은 펼쳐진 채였다. 제4조가 있는 장.\n\n뒤표지 안쪽의 이력표를 다시 봤다. 오늘 줄의 사유 칸은 비어 있었다. 개정자 칸도 비어 있었다.\n\n그 아래 제5조 줄이 기다리고 있었다. 날짜만 넣으면 되는 줄이었다.\n\n옆에 인계대가 있었다. 빈 철제 선반 하나. 규정집 한 권이 딱 들어갈 넓이였다.\n\n+ [제4조가 실린 장을 뜯어낸다] -> b05_t4_a\n+ [규정집을 덮어 인계대에 올린다] -> b05_clear\n+ [여백에 다음 담당자 앞으로 한 줄 적는다] -> b05_death_b\n\n=== b05_t4_a ===\n장을 잡고 당겼다. 실에 걸린 데가 없어서 쉽게 빠졌다.\n\n빠진 자리를 봤다. 그 아래 장에 같은 조문이 있었다. 같은 문장, 같은 활자.\n\n손에 든 종이를 봤다. 백지였다.\n\n뜯을 수 있는 건 종이지 조항이 아니었다. 백지를 반납대에 놓고 규정집을 덮었다.\n-> b05_clear\n\n=== b05_clear ===\n규정집을 덮어 인계대에 올렸다. 표지가 위로 오게. 그게 어떤 규칙에 적혀 있어서가 아니라 그렇게 두는 게 맞아 보여서였다.\n\n목차는 셋이었고, 나는 셋만 지켰다. 네 번째는 내일부터 남의 일이다.\n\n인터폰 스피커가 켜지는 소리가 났다. 잡음만 나다가 꺼졌다.\n\n제습기는 돌고 있었다. 다음 방울은 기다리지 않고 나왔다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b05_death_a ===\n서고 안쪽에 대고 불렀다. 열람 신청하신 분.\n\n목소리가 좁은 통로를 따라 들어갔다. 돌아오지 않았다.\n\n안쪽에서 종이 넘기는 소리가 났다. 한 번, 두 번. 소리가 이쪽으로 오고 있었다.\n\n신청자는 열람실에 없었다. 처음부터 서고 안에 있었다. 확인은 그렇게 끝났다.\n-> die(\"당신은 신청자를 호명했습니다.\", b05_roll)\n\n=== b05_death_b ===\n제4조 아래 여백에 볼펜으로 적었다. *이 조항은 따르지 마십시오.*\n\n쓰고 나서 목차를 봤다. 세 줄이 네 줄이 되어 있었다. 제4조. 인쇄체로.\n\n이력표를 봤다. 오늘 줄의 개정자 칸이 채워져 있었다. 내 글씨였다. 그 칸에는 아무것도 쓰지 않았다.\n\n제2조는 덧붙이지 말라고 했다. 덧붙이는 쪽이 나뿐이라고는 하지 않았다.\n\n제5조 줄에 날짜가 들어갔다.\n-> die(\"당신은 규정집에 덧붙였습니다.\", b05_editor)\n\n=== b05_death_c ===\n표지를 넘겼다. 신청서 양식이었다.\n\n신청일, 자료 번호, 신청자. 위에서부터 다 채워져 있었다. 글씨가 반듯했다.\n\n맨 아래 두 칸이 비어 있었다. 처리, 그리고 담당자 확인.\n\n읽는 동안 처리 칸이 채워졌다. 내 손은 표지를 잡고 있었다.\n\n대장에 없는 자료는 열지 않는다. 열린 쪽이 서류철인지는 적혀 있지 않았다.\n-> die(\"당신은 대장에 없는 자료를 열었습니다.\", b05_request)\n\n// ── /INCLUDE B05.ink ──\n// ── INCLUDE B06.ink ──\n// ink/B06.ink — B06. 저수지 낚시터 야간 이용 (수변 × 부르는것)\n// 원본: spaces/B06_저수지.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b06_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 shard(\"문구\") -> 다음knot (B01.ink 표본과 동일 — 인자는 파편 텍스트 문자열).\n// (필요 함수·항목은 ink/B06.codex.txt 참고 — main.ink는 건드리지 않는다.)\n//\n// 공간 로컬 플래그: b06_answered_aloud(턴2-B, 텍스처 전용 — 생사에 관여하지 않고 밖으로\n// 안 나감). gate에서 리셋.\n// 턴4의 A(대답한다)·B(손을 든다)는 원본 그대로 같은 사망(b06_death_b)으로 합류한다.\n\nVAR b06_answered_aloud = false\n\n=== b06_gate ===\n~ current_space = \"B06\"\n~ current_weight = 1.0\n~ b06_answered_aloud = false\n-> b06_intro\n\n=== b06_intro ===\n케미라이트가 켜져 있었다.\n\n초록색 점 하나가 물 위에 서 있고, 그 아래에 같은 점이 하나 더 있었다. 반사였다. 두 점 사이가 조금도 흔들리지 않았다.\n\n수면이 거울 같았다. 저수지는 흐르지 않으니까 당연한 일이었다. 당연하다고 여기는 내가 어디서 그걸
