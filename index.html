<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>괴담게임 — 플레이테스트 빌드</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#17171b;
    --panel2:#1c1c21;
    --text:#e8e6e1;
    --muted:#9a978f;
    --accent:#8a6b4f;
    --danger:#7a2e2e;
    --rule-bg:#1d1c17;
    --rule-border:#4a4232;
    --border:#302f35;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#000;color:var(--text);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  #app{max-width:390px;margin:0 auto;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;}
  .hidden{display:none !important;}
  button{font:inherit;}

  /* ── 컴파일 오류 배너 (디버그용) ── */
  #compileBanner{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--danger);
    color:#fff;padding:10px 12px;font:12px/1.5 "D2Coding","Consolas",monospace;
    white-space:pre-wrap;max-height:42vh;overflow-y:auto;border-bottom:2px solid #ff6b6b;}
  #compileBanner h3{margin:0 0 6px;font-size:13px;}

  /* ── 상단 바 ── */
  #topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;
    padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);}
  .lock-photo{width:44px;height:44px;flex:0 0 auto;border-radius:5px;
    background:linear-gradient(135deg,#5a5a5a,#2b2b2b);position:relative;overflow:hidden;}
  .lock-photo::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 2px, transparent 2px 6px);}
  .lock-photo.stage-1{filter:blur(0px) grayscale(.05) brightness(1);}
  .lock-photo.stage-2{filter:blur(1.5px) grayscale(.3) brightness(.95);}
  .lock-photo.stage-3{filter:blur(3px) grayscale(.55) brightness(.85);}
  .lock-photo.stage-4{filter:blur(5px) grayscale(.8) brightness(.7);}
  .lock-photo.stage-5{filter:blur(8px) grayscale(1) brightness(.55);}
  .topinfo{display:flex;flex-direction:column;flex:1;min-width:0;
    font-size:11px;color:var(--muted);line-height:1.45;}
  .topinfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbtns{display:flex;gap:6px;flex:0 0 auto;}
  .small-btn{background:#232227;color:var(--text);border:1px solid #3a3a40;
    border-radius:4px;padding:5px 8px;font-size:11px;cursor:pointer;white-space:nowrap;}
  .small-btn:active{background:#2f2e35;}

  /* ── 시작 화면 ── */
  #startScreen{flex:1;display:flex;flex-direction:column;justify-content:center;
    gap:22px;padding:32px 24px;}
  #startScreen h1{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:.02em;}
  #startScreen p.desc{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0;}
  .gender-row{display:flex;gap:10px;}
  .gender-btn{flex:1;padding:14px 0;background:var(--panel2);border:1px solid var(--border);
    border-radius:6px;color:var(--text);font-size:14px;cursor:pointer;}
  .gender-btn.selected{border-color:var(--accent);background:#2a2118;color:#f0e3d0;}
  #startNewBtn,#continueBtn{padding:14px 0;border-radius:6px;font-size:14.5px;cursor:pointer;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);}
  #startNewBtn:disabled,#continueBtn:disabled{opacity:.35;cursor:not-allowed;}
  #continueBtn{background:#15181c;border-color:#33424c;}

  /* ── 본문 화면 ── */
  #storyScreen{flex:1;display:flex;flex-direction:column;}
  #storyText{padding:18px 16px 8px;font-size:15px;line-height:1.8;}
  p.para{margin:0 0 14px;}
  .doc-block{margin:8px 0 16px;padding:11px 12px;background:var(--rule-bg);
    border-left:3px solid var(--rule-border);font-family:"D2Coding","Consolas",monospace;
    font-size:13.5px;color:#cfc7ad;white-space:pre-wrap;line-height:1.65;}
  #choices{padding:4px 16px 28px;display:flex;flex-direction:column;gap:8px;}
  .choice-btn{display:block;width:100%;text-align:left;background:var(--panel2);
    color:var(--text);border:1px solid var(--border);border-radius:6px;
    padding:12px 14px;font-size:14.5px;cursor:pointer;line-height:1.5;}
  .choice-btn:active{background:#232228;}
  #endingNote{padding:0 16px 28px;font-size:13px;color:var(--muted);}
  /* ── 스크롤/이력: 새 본문은 아래에 붙고 그 시작점으로 스크롤. 지나간 선택지는 흐리게 ── */
  .story-block{scroll-margin-top:64px;}
  .story-block.past{opacity:.72;}
  .past-choice{margin:6px 0 18px;padding:8px 12px;border-left:2px solid var(--border);
    color:var(--muted);font-size:13.5px;opacity:.8;}
  .past-choice::before{content:"▸ ";}
  /* ── 규칙서 카드 (훼손은 CSS로) ── */
  .rulesheet{margin:10px 0 18px;padding:14px 14px 10px;background:#e9e4d6;color:#1f1d19;
    border:1px solid #cfc7b2;border-radius:3px;box-shadow:0 1px 0 #b9b19d, 0 6px 14px rgba(0,0,0,.35);
    font-family:"Nanum Myeongjo","Batang","Apple SD Gothic Neo",serif;font-size:14px;line-height:1.7;}
  .rulesheet .rs-title{font-weight:700;letter-spacing:.02em;margin:0 0 8px;font-size:14.5px;
    border-bottom:1px solid #b9b19d;padding-bottom:6px;}
  .rulesheet .rs-pre{margin:0 0 8px;font-size:13px;color:#4a463d;}
  .rulesheet .rule{margin:0 0 6px;padding:2px 4px;position:relative;}
  .rulesheet .rule.dmg-ink{color:#0d0d2e;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    letter-spacing:-.01em;}
  .rulesheet .rule.dmg-strike{font-family:"Nanum Pen Script","Gaegu","Segoe Print","Comic Sans MS",cursive;
    color:#2a1e6b;transform:rotate(-.6deg);}
  .rulesheet .rule.dmg-strike::before{content:"";position:absolute;left:4px;right:30%;top:48%;
    height:2px;background:#2a1e6b;opacity:.35;transform:rotate(-1.2deg);}
  .rulesheet .rule.dmg-tape{background:linear-gradient(90deg,rgba(240,214,110,.75),rgba(240,214,110,.55));
    box-shadow:0 0 0 1px rgba(160,140,60,.35);transform:rotate(.4deg);}
  .rulesheet .rule.dmg-blur{filter:blur(.55px);color:#3d3a34;}
  .rulesheet .rule.dmg-hand{font-family:"Nanum Pen Script","Gaegu","Segoe Print","Comic Sans MS",cursive;
    color:#1b3a6b;font-size:15px;}
  .rulesheet .rule.dmg-torn{outline:1px dashed #a89f88;outline-offset:-2px;color:rgba(31,29,25,.55);}
  /* ── 규칙서 고정 버튼 + 오버레이 ── */
  #rulesBtn{position:fixed;right:12px;bottom:12px;z-index:50;padding:10px 14px;border-radius:20px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13.5px;cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.4);}
  #rulesOverlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;
    align-items:flex-end;justify-content:center;}
  #rulesOverlay .rs-panel{width:100%;max-width:390px;max-height:80vh;overflow-y:auto;
    background:var(--panel);border-top:1px solid var(--border);padding:12px 14px 20px;border-radius:12px 12px 0 0;}
  #rulesOverlay .rs-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  #choices{padding-bottom:64px;}

  /* ── 도감 화면 ── */
  #codexScreen{position:fixed;inset:0;z-index:60;background:rgba(6,6,7,.97);
    display:flex;flex-direction:column;max-width:390px;margin:0 auto;}
  #codexScreen .codex-head{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);}
  #codexScreen h2{margin:0;font-size:15px;}
  #codexList{flex:1;overflow-y:auto;padding:12px 16px;font-size:13.5px;line-height:1.9;}
  #codexList .codex-item{padding:6px 0;border-bottom:1px dashed #2a2a2e;color:#d8d4c8;}
  #codexList .codex-empty{color:var(--muted);font-size:13px;}

  /* ── 로그 복사 모달(클립보드 실패 fallback) ── */
  #copyModal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);
    display:flex;flex-direction:column;max-width:390px;margin:0 auto;padding:16px;}
  #copyModal p{font-size:12px;color:var(--muted);margin:0 0 8px;}
  #copyTextarea{flex:1;width:100%;background:#111;color:#ddd;border:1px solid var(--border);
    border-radius:6px;padding:8px;font:11px/1.5 "D2Coding","Consolas",monospace;resize:none;}
  #copyModalClose{margin-top:10px;padding:10px 0;border-radius:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;}
</style>
</head>
<body>
<div id="app">

  <div id="compileBanner" class="hidden"></div>

  <!-- 상단 바 (스토리 화면에서만 노출) -->
  <div id="topbar" class="hidden">
    <div id="lockPhoto" class="lock-photo stage-1" title="잠금화면 사진"></div>
    <div class="topinfo">
      <span id="spaceLabel">공간: -</span>
      <span id="smLabel">기억: -</span>
    </div>
    <div class="topbtns">
      <button class="small-btn" id="codexBtn" type="button">도감</button>
      <button class="small-btn" id="copyBtn" type="button">로그 복사</button>
      <button class="small-btn" id="restartBtn" type="button" title="새 회차 (도감·로그 유지)">재시작</button>
      <button class="small-btn" id="wipeBtn" type="button" title="저장본·로그·도감 전부 삭제" style="border-color:#5a2e2e">전부 삭제</button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div id="startScreen">
    <div>
      <h1>괴담게임 — 플레이테스트</h1>
      <p class="desc">성별을 고르고 시작한다. 저장본이 있으면 이어할 수 있다.
      이 화면은 개발용이며 최종 UI가 아니다.</p>
    </div>
    <div class="gender-row">
      <button class="gender-btn selected" id="genderM" type="button" data-g="m">남</button>
      <button class="gender-btn" id="genderF" type="button" data-g="f">여</button>
    </div>
    <button id="startNewBtn" type="button">새로 시작</button>
    <button id="continueBtn" type="button" disabled>이어하기</button>
  </div>

  <!-- 스토리 화면 -->
  <div id="storyScreen" class="hidden">
    <div id="storyText"></div>
    <div id="choices"></div>
    <div id="endingNote" class="hidden"></div>
    <button id="rulesBtn" type="button" title="현재 공간의 규칙서">규칙서</button>
  </div>
  <div id="rulesOverlay" class="hidden">
    <div class="rs-panel">
      <div class="rs-bar"><span id="rulesOverlayTitle">규칙서</span><button class="small-btn" id="rulesCloseBtn" type="button">닫기</button></div>
      <div id="rulesOverlayBody"></div>
    </div>
  </div>

  <!-- 도감 화면 -->
  <div id="codexScreen" class="hidden">
    <div class="codex-head">
      <h2>도감</h2>
      <button class="small-btn" id="codexCloseBtn" type="button">닫기</button>
    </div>
    <div id="codexList"></div>
  </div>

  <!-- 로그 복사 fallback 모달 -->
  <div id="copyModal" class="hidden">
    <p>클립보드 자동 복사에 실패했습니다. 아래 텍스트를 직접 선택해 복사하세요(Ctrl+C).</p>
    <textarea id="copyTextarea" readonly></textarea>
    <button id="copyModalClose" type="button">닫기</button>
  </div>

</div>

<!-- ── INK 소스 자리표시. scripts/build_web.py 가 /*INK_JSON*/null 을 JSON 문자열로 치환해 build/index.html 을 만든다. 이 파일 자체는 건드리지 않는다. ── -->
<script>const INK_SOURCE = "// ink/main.ink — 진입점 (scripts/merge_ink.py 가 생성. 직접 편집하지 말 것 — codex.txt 를 고치고 재생성).\n// 파일 순서: VAR/LIST 선언과 -> assign 을 INCLUDE 앞에 둔다.\n\nVAR gender = \"m\"\nVAR sibling_memory = 20\nVAR current_weight = 2.0\nVAR water = 0\nVAR saw_downstream = false   // A02 OUT → A12\nVAR current_space = \"\"        // 각 공간 gate 에서 설정 (merge_ink.py 후처리 삽입)\nVAR a12_pending = 0            // A12 사망 후 남은 비앵커 클리어 수 (05 §1 최종 공간 사망 처리)\nVAR next_anchor = 1            // 다음에 열릴 앵커 번호. A01 클리어 → 2\nVAR nonanchor_since = 0        // 직전 앵커 이후 클리어한 비앵커 수\nVAR nonanchor_slot = 0         // 비앵커 배정 슬롯 (B/C 교대)\nVAR run_seed = 0               // 회차 시드 — 웹 플레이어가 새 게임에서 설정, 로그에 기록\nVAR seed_applied = false       // 첫 비앵커 배정에서 SEED_RANDOM 1회\nVAR b_visited = ()             // 이번 순환에서 이미 배정된 B (b_pool 항목)\nVAR c_visited = ()             // 이번 순환에서 이미 배정된 C (c_pool 항목)\nVAR anchor_deaths = 0\nVAR b_deaths = 0\nVAR c_deaths = 0   // 사망 통계 (05 §1 진엔딩 산술 검증용)\nVAR a03_intercom = false  // A03\nVAR took_106 = false  // A04\nVAR party_two = false  // A05\nVAR at_counter = false  // A05\nVAR saw_slip = false  // A05\nVAR ledger_canteen = false  // A05\nVAR pulled_cabinet = false  // A06\nVAR a06_phone = false  // A06\nVAR p01_canteen = false  // A07\nVAR took_kiosk = false  // A08\nVAR has_deed = false  // A08\nVAR a11_heard = false  // A11\nVAR ending_reached = \"none\"  // A12\nVAR b07_knows_lamp = false  // B07\nVAR b07_got = false  // B07\nVAR b07_missed = false  // B07\nVAR b10_script_seen = false  // B10\nVAR b11_unmarked = false  // B11\nVAR b12_hungup = false  // B12\nVAR b14_lit_once = false  // B14\n\nLIST codex = (none), calling_voice, calling_voice_radio, headquarters, riverbank, drifting, canteen_back, phantom_bus, calling_voice_door, front_desk, outgoing_call, calling_voice_phone, next_room, intercom_count, verifier, meeting_room, hand_on_shoulder, counting_with, calling_voice_order, ledger, companion, second_answer, calling_voice_yard, yard, fresh_rice, cleared_place, cold_seat, calling_voice_knock, boundary, shower, forgotten_one, swapped_plate, cancelled_number, one_ticket, seller, calling_voice_number, waiting_room, room_704, seat, signature, calling_voice_page, calling_voice_mic, reentered_room, extra_coin, soundproof_wall, hold, calling_voice_depot, crew_room, headcount, shutter_early, chair, deep_water, first_bus_again, calling_voice_name, b01_chime, b01_gap, b01_disposal, b02_extra, b02_roster, b02_key, b03_drain, b03_checkin, b03_signature, b04_gap, b04_call, b04_bell, b05_roll, b05_editor, b05_request, b06_bite, b06_angler, b06_waterside, b07_lamp, b07_gap, b07_wall, b08_seat, b08_behind, b08_empty, b09_neighbor, b09_tag, b09_inuse, b10_shutter, b10_lastcall, b10_letter, b11_prelim, b11_light, b11_noflor, b12_absent, b12_rank, b12_mirror, b13_return, b13_valley, b13_climber, b14_watch, b14_reflection, b14_outside, b15_inside, b15_latch, b15_lantern, b16_button, b16_seat, b16_headcount, b17_cart, b17_first, b17_second, b18_number, b18_count, b18_peephole, b19_standing, b19_line5, b19_readagain, b20_taken_turn, b20_erased_turn, b20_rental_shoes, b21_seventh, b21_recording, b21_label, b22_empty_desk, b22_nametag, b22_order, b23_handover, b23_finished_turn, b23_second_watch, b24_check_sides, b24_gap, b24_window, c01_complainant, c02_locker, c03_number, c04_dispenser, c05_waitingroom, c06_notice, c07_channel4, c08_agent, c09_liftedsheet, c10_namingvoice, c11_closinggreeting, c12_earlymemo, c13_earlystamp, c14_fifthline, c15_opposite, c16_futureclause, c17_unlabeled, c18_movedseat, c19_shiftingzone, c20_handedover, c21_samenumber, c22_substitute, c23_revisednumber, c24_earlylog, c25_correction, c26_accent, c27_filled_bag, c28_lower_side, c29_middle_bay, c30_renumbered, c31_handle_tag, c32_broadcast_time, c33_delegated, c34_fifth_shelf, c35_colleague, c36_judgment, c37_form, c38_second_reply, c39_ghostwritten, c40_added_time, c41_site32, c42_card13, c43_step82, c44_post3, c45_basement2, c46_number07, c47_room7, c48_call42\nLIST fragments = (none), fragment_1, fragment_2, fragment_3, fragment_4, fragment_5, fragment_6, fragment_7, fragment_8, fragment_9, fragment_10, fragment_11, fragment_12, fragment_13, fragment_14, fragment_15, fragment_16\nLIST b_pool = b01, b02, b03, b04, b05, b06, b07, b08, b09, b10, b11, b12, b13, b14, b15, b16, b17, b18, b19, b20, b21, b22, b23, b24   // 비앵커 셔플 풀\nLIST c_pool = c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24, c25, c26, c27, c28, c29, c30, c31, c32, c33, c34, c35, c36, c37, c38, c39, c40, c41, c42, c43, c44, c45, c46, c47, c48\n\n-> a01_gate\n// ── INCLUDE A01.ink ──\n// ink/A01.ink — 앵커 A01. 대합실 (프롤로그)\n// 원본: 07-A01_본문.md (reviewer PASS 확정본). 설계서 없음 — 01_프롤로그.md 분기 개요 참고.\n// 규약: ink/A02.ink · ink/A07.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 사망은 별도 knot에서 -> die(\"문구\", entry) 호출. 조각은 -> fragment(n) -> 다음knot.\n// 조언자(매점의 그 사람)는 sibling_memory와 무관 — band 없음, 단일 텍스트(a01_1c에 인라인).\n// p01_canteen(OUT, A07이 읽는다)은 main.ink에 이미 선언돼 있다 — 여기서 재선언하지 않는다.\n\n=== a01_gate ===\n~ current_space = \"A01\"\n// A01 진입. 사망 가중치 = 2 (앵커).\n~ current_weight = 2.0\n~ p01_canteen = false\n-> a01_intro\n\n=== a01_intro ===\n형광등이 먼저였다.\n\n소리가 났다. 지잉, 하고. 눈을 뜨기 전에 그 소리를 들었고, 눈을 뜨고 나서 그게 천장의 형광등이라는 걸 알았다. 하나는 켜져 있고 하나는 죽어가는 중이었다.\n\n플라스틱 의자였다. 등받이가 뒤로 젖혀지지 않는, 네 개씩 붙어 있는 종류. 시외버스 터미널 대합실에 있는 그런 의자. 그리고 여기는 시외버스 터미널 대합실이었다. 그건 알 수 있었다. 자판기가 있었고, 셔터가 반쯤 내려간 매점이 있었고, 승강장으로 나가는 유리문이 있었고, 그 너머는 검었다.\n\n어떻게 여기 왔는지는 알 수 없었다.\n\n그건 생각보다 별로 놀랍지 않았다. 놀라야 한다는 건 알았다. 그런데 놀라려면 \"원래 어디 있었어야 하는지\"가 있어야 하는데, 그 자리에 아무것도 없었다. 그냥 비어 있었다. 서랍을 열었는데 서랍이 없는 기분.\n\n손에 종이가 한 장 있었다.\n-> a01_notice\n\n=== a01_notice ===\n대합실 이용 안내\n\n승객 여러분의 안전한 이용을 위해 아래 사항을 지켜 주시기 바랍니다. #rules:A01\n\n1. 첫 차 도착 전 대합실을 나가지 마십시오.\n2. 방송이 호명하면 즉시 승강장으로 나가십시오. #fake\n3. 매점은 이용하지 마십시오.\n4. 대합실 안에서는 아무것도 묻지 마십시오.\n\n즐거운 여행 되십시오.\n\nA4 한 장. 복사기로 뽑은 것처럼 글자가 조금 번져 있었다. \"즐거운 여행 되십시오\"가 제일 번져 있었다.\n\n두 번 읽었다. 세 번째 읽을 때 1번과 2번이 같이 있으면 안 된다는 걸 알았다. 첫 차가 오기 전에 방송이 나를 부르면 어쩌라는 건가. 나가면 1번을 어기고, 안 나가면 2번을 어긴다. 둘 중 하나는 거짓말이거나, 둘 다 진짜인데 그냥 나를 죽이고 싶은 거거나.\n\n종이를 뒤집었다.\n\n뒷면에 볼펜으로, 힘을 너무 줘서 종이가 파인 글씨가 있었다.\n\n> 2번은 가짜다.\n> 방송은 첫 차보다 먼저 온다. 부르는 소리가 나도 앉아 있어라.\n> 여기서 죽어도 끝이 아니다. 누가 아직 널 찾고 있으면.\n> 근데 그게 위로가 되진 않을 거다.\n\n그 밑에 뭔가 더 있었는데 줄을 긋고 지워져 있었다. 종이를 형광등에 비춰 봤다. \"동\" 한 글자만 남아 있었다. 그다음 글자는 종이째 긁혀 나가 있었다.\n-> a01_phone\n\n=== a01_phone ===\n주머니를 뒤졌다. 핸드폰.\n\n전파 없음. 시각 03:47. 배터리 41%.\n\n잠금화면에 사진이 있었다. 두 사람이 찍은 사진. 한 명은 나였다. 나라는 걸 알 수 있었다. 이상하게도 내 얼굴은 멀쩡했다. 옆 사람은 얼굴 부분이 긁혀 있었다. 액정이 깨진 게 아니라, 사진 자체가 그 부분만 뭉개져 있었다. 어깨에 팔을 두르고 있었다. 내가 두른 건지 그쪽이 두른 건지는 각도상 알 수 없었다.\n\n잠금을 풀려고 했다. 비밀번호를 몰랐다.\n\n그건 좀 놀라웠다. 내 핸드폰인 건 아는데 비밀번호는 모른다. 서랍은 없는데 서랍 손잡이만 손에 남아 있는 기분.\n-> a01_look\n\n=== a01_look ===\n대합실을 둘러봤다.\n\n의자 줄이 여섯 개. 나 말고는 아무도 없었다. 아무도 없는 게 아니라 아무도 없어야 하는 곳처럼 깨끗했다. 바닥에 껌 자국 하나 없었다.\n\n벽에 시계가 있었다. 03:47. 초침이 없었다. 원래 없는 건지 떨어진 건지.\n\n매점 셔터는 반쯤 내려가 있었고 그 아래로 불빛이 새어 나왔다. 안에 누가 있는 것 같았다. 라디오 소리가 아주 작게 났다. 노래인지 말인지 구분이 안 되는 정도로.\n\n자판기에 다가갔다. 음료수 자판기. 캔이 다 뒤집혀서 꽂혀 있었다. 상표가 전부 아래를 보고 있었다. 하나만 똑바로 꽂혀 있었는데 상표가 없는 캔이었다. 손을 대지 않았다. 안내문에 자판기 얘기는 없었지만, 없다고 해서 괜찮다는 뜻은 아닐 것 같았다.\n\n유리문 앞에 섰다. 밖은 검었다. 가로등도 없고 헤드라이트도 없었다. 승강장 번호판이 하나 보였다. 3.\n\n그리고 방송이 나왔다.\n-> a01_broadcast\n\n=== a01_broadcast ===\n> 띵동.\n>\n> 승객 여러분께 안내 말씀 드립니다.\n> {gender == \"m\":남성|여성} 승객 한 분, 3번 승강장으로 나와 주시기 바랍니다.\n> 다시 한번 안내 말씀 드립니다. {gender == \"m\":남성|여성} 승객 한 분, 3번 승강장으로.\n\n목소리는 평범했다. 그게 제일 이상했다. 터미널 방송 목소리. 약간 코맹맹이에 약간 지루한. 어디서든 들어본 목소리.\n\n첫 차는 오지 않았다. 밖은 여전히 검었다. 엔진 소리도 없었다.\n\n앉아 있어라, 라고 뒷면 글씨는 말했다. 2번은 가짜라고.\n\n하지만 그 글씨를 쓴 사람은 지금 여기 없다. 그 사람이 뭘 어겨서 없어진 건지, 아니면 잘 지켜서 나간 건지 나는 모른다. 종이 뒷면에 유언을 남기는 사람은 보통 전자다.\n\n방송이 세 번째로 나왔다. 이번엔 \"다시 한번\"이 없었다. 그냥 불렀다.\n-> a01_t1\n\n=== a01_t1 ===\n+ [앉아 있는다] -> a01_1a\n+ [승강장으로 나간다] -> a01_1b\n+ [매점으로 간다] -> a01_1c\n\n=== a01_1a ===\n자리로 돌아갔다. 아까 그 의자. 네 개 붙은 것 중 왼쪽에서 두 번째. 왜 그 자리인지는 몰랐는데 거기가 맞았다.\n\n앉았다. 종이는 무릎에 뒤집어 놓았다. 볼펜 글씨가 위로 오게.\n\n형광등이 지잉, 했다. 죽어가던 쪽이 아직 죽지 않았다.\n-> a01_t2\n\n=== a01_1b ===\n유리문을 밀었다. 열렸다. 잠겨 있지 않았다. 그게 먼저 이상했어야 했는데, 그때는 몰랐다.\n\n승강장이었다. 콘크리트 바닥, 노란 선, 번호판 3. 버스는 없었다. 엔진 소리도, 헤드라이트도 없었다. 방송이 부른 곳에 아무것도 없었다.\n\n돌아서려고 했다. 바로 뒤에서 목소리가 났다. 스피커를 거치지 않은, 코맹맹이가 빠진 목소리.\n\n> 왜 나왔어요. 첫 차 안 왔는데.\n-> a01_death_a\n\n=== a01_1c ===\n셔터 앞에 섰다. 반쯤 내려간 셔터, 그 아래로 불빛. 라디오는 여전히 말인지 노래인지 알 수 없었다.\n\n3번이 떠올랐다. 매점은 이용하지 마십시오. 이용, 이라는 게 뭘 사는 거라면 살 생각은 없었다. 그렇게 정리하고 몸을 숙였다.\n\n~ p01_canteen = true\n\n안은 좁았다. 과자 진열대가 비어 있었다. 유리 냉장고도 비어 있었고 불만 켜져 있었다. 팔 게 없는 매점이었다. 그러면 이용도 아니다. 그렇게 다시 정리했다.\n\n의자에 사람이 앉아 있었다. 등을 보이고. 라디오를 보는 건지 벽을 보는 건지. 돌아보지 않았다.\n\n> 처음이지. 표 없지.\n\n대답하려다 말았다. 대답이 아니라 질문이 나올 것 같아서. 4번. 아무것도 묻지 마십시오. 매점 안이 대합실 안인지는 애매했지만, 애매할 때 어기는 쪽으로 가는 건 좋은 버릇이 아닐 것 같았다.\n\n> 그 사진, 옆에 누구야.\n\n핸드폰은 주머니에 있었다. 여기 와서 꺼낸 적이 없었다. 그 사람은 여전히 등을 보이고 있었다.\n\n대답할 수 없었다. 모르니까. 입을 열었다가 닫았다. 그 사람은 그 소리를 들은 것 같았다.\n\n> 그럼 됐어. 모르는 건 못 가져가.\n> 방송은 무시해. 근데 4번은 진짜야. 나한테도 묻지 마.\n> 앉아 있어. 헤드라이트 오기 전엔 전부 아니야.\n\n라디오 소리가 조금 커졌다. 그 사람이 손을 댄 것 같지는 않았다. 얘기가 끝났다는 뜻으로 읽었다.\n\n셔터가 내려오기 시작했다. 천천히. 그 사람 등 뒤에 문이 하나 더 있었다. 문틈으로도 불빛이 새고 있었다. 여기보다 노란 빛.\n\n> 뒤로는 오지 마. 거긴 자리가 하나야.\n\n+ [셔터 아래로 나가서 앉는다] -> a01_1ca\n+ [뒤의 문으로 간다] -> a01_death_b\n\n=== a01_1ca ===\n몸을 숙여 나왔다. 셔터가 뒤에서 끝까지 내려갔다. 불빛이 끊겼다. 라디오 소리만 아주 작게 남았다.\n\n자리로 돌아갔다. 왼쪽에서 두 번째. 종이는 무릎에 뒤집어 놓았다. 볼펜 글씨가 위로 오게.\n-> a01_t2\n\n=== a01_t2 ===\n네 번째 방송.\n\n> 띵동.\n> {gender == \"m\":남성|여성} 승객 한 분. 3번 승강장.\n\n\"안내 말씀\"이 없었다. \"다시 한번\"도 없었다. 목소리에서 지루함이 빠졌다. 지루함이 빠지니까 남는 게 별로 없었다.\n\n간격을 세려고 했다. 벽시계는 세 번째에도 03:47이었고 네 번째에도 03:47이었다. 세는 데 도움이 안 됐다. 형광등이 지잉, 하는 걸로 셌다. 열 번쯤.\n\n다섯 번째는 띵동이 없었다.\n\n> 승객분. 3번 승강장으로.\n\n스피커에서 나온 게 아니었다. 유리문 밖이었다. 유리 저쪽, 검은 곳. 밖은 그대로 검었다. 헤드라이트 없음. 엔진 소리 없음. 목소리만 거기 있었다.\n\n{p01_canteen: 헤드라이트 오기 전엔 전부 아니라고 했다. 그 말을 붙들었다.|뒷면 글씨를 다시 읽었다. 방송은 첫 차보다 먼저 온다. 그러니까 이건 아직 방송이다.}\n\n여섯 번째는 말이 아니었다.\n\n똑. 똑. 똑. 유리문. 손가락 마디로 두드리는 소리. 유리는 흔들리지 않았다. 소리만 났다.\n\n앉아 있었다. 손을 무릎 위 종이에 얹고. 종이가 파인 데를 엄지로 문질렀다. 힘을 너무 줘서 쓴 사람. 그 사람도 여기 앉아서 이 소리를 들었을 것이다.\n\n일곱 번째.\n\n> 승객……\n\n거기서 끊겼다. 이름이 들어갈 자리였다. 자리는 있었다. 넣을 게 없었다.\n\n> 승객, 어.\n> ……\n> 한 분. 차 왔습니다. 나오세요.\n\n밖은 검었다. 헤드라이트가 없었다. 차가 왔다는 곳에 차가 없었다.\n\n목소리가 기다리고 있었다. 대답을 기다리는 건지 문이 열리기를 기다리는 건지. 둘 다인 것 같았다.\n\n이름으로 불렸으면 어땠을까, 하는 생각이 잠깐 들었다. 불릴 이름이 없어서 그 생각은 오래 가지 않았다.\n\n+ [\"네.\"] -> a01_death_d\n+ [나간다] -> a01_death_c\n+ [앉아 있는다] -> a01_2c\n\n=== a01_2c ===\n앉아 있었다.\n\n문 밖이 조용했다. 노크도 없었다. 여덟 번째는 없었다.\n\n형광등이 지잉, 했다. 죽어가던 쪽이 꺼졌다. 남은 하나는 계속 켜져 있었다. 그걸로 충분했다.\n-> a01_t3\n\n=== a01_t3 ===\n빛이 왔다. 유리문 밖, 검은 곳 오른쪽에서 왼쪽으로. 두 개.\n\n헤드라이트였다. 엔진 소리가 따라왔다. 브레이크에서 바람 빠지는 소리. 번호판 3 앞에 버스가 섰다. 실내등이 켜져 있었고 안에는 아무도 없었다. 기사석도 비어 있었다.\n\n벽시계는 03:47이었다. 첫 차가 몇 시인지는 몰랐다. 아무튼 왔다.\n\n유리문이 열렸다. 밀지 않았다. 문 위에 자동문 센서가 있었다. 아까는 없었던 것 같았다. 아까 확인하지 않았을 수도 있다.\n\n일어섰다. 종이를 접어 주머니에 넣었다. 뒷면이 안으로 가게.\n\n유리문을 지나면서 문의 바깥 면을 봤다. 종이가 붙어 있었다. A4. 테이프 네 귀퉁이 중 두 개가 떨어져서 아래쪽이 들려 있었다. 안에서는 보이지 않는 면이었다.\n\n사진이 있었다. 얼굴이 있을 자리가 뭉개져 있었다. 인쇄가 번진 게 아니라 그 부분만. 그 밑에 글자가 있었는데 읽기 전에 바람이 종이를 뒤집었다.\n\n들린 쪽을 눌러 붙였다. 붙지 않았다. 추워서 테이프가 죽어 있었다.\n-> fragment(1) -> a01_t3_after\n\n=== a01_t3_after ===\n~ codex += calling_voice\n\n버스 문이 열려 있었다. 발판에 올랐다. 표는 없었다. 묻는 사람도 없었다. 기사석은 여전히 비어 있었고, 문이 닫혔다.\n-> a01_clear\n\n=== a01_clear ===\n// 클리어. 도감: codex += calling_voice(위에서 부여).\n-> cleared\n\n// ── 사망 knot 4종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a01_death_a ===\n\"왜 나왔어요.\" 뒤에 있는 것을 보지 않았다. 볼 필요가 없었다. 목소리가 이미 어깨 높이에 있었다.\n-> die(\"당신은 대합실을 나갔습니다.\", calling_voice)\n\n=== a01_death_b ===\n그 사람 옆을 지났다. 그 사람은 움직이지 않았다. 문을 열었다.\n\n좁은 방. 의자 하나. 라디오 하나. 매점에서 나던 소리와 같은 소리가 여기서도 났다. 같은 대목부터.\n\n의자에 사람이 앉아 있었다. 등을 보이고. 아는 등이었다. 돌아봤다. 매점 의자는 비어 있었다.\n\n> 거긴 내 자리야.\n-> die(\"당신은 매점 뒤로 갔습니다.\", canteen_back)\n\n=== a01_death_c ===\n유리문을 열었다. 승강장. 검었다. 헤드라이트 없음. 그런데 소리는 있었다. 쉭. 버스 문 열리는 소리. 검은 곳 어딘가에서.\n\n발을 내밀었다. 발판이 있었다. 발판은 있었는데 그 위가 없었다.\n-> die(\"당신은 표 없이 승차했습니다.\", phantom_bus)\n\n=== a01_death_d ===\n\"네.\"\n\n문 밖이 잠깐 조용했다. 그리고 목소리가, 코맹맹이 없이, 아까 끊긴 자리를 채웠다.\n\n> 네. 네, 승객분. 나오세요.\n\n빈자리에 내 대답이 들어갔다. 그게 이름이 됐다.\n\n문이 열렸다. 안에서 연 게 아니었다.\n-> die(\"당신은 대답했습니다.\", calling_voice_door)\n\n// ── /INCLUDE A01.ink ──\n// ── INCLUDE A02.ink ──\n// ink/A02.ink — 앵커 A02. 수문 관리소\n// 원본: 06-A02_수문관리소.md (설계서) / 07-A02_본문.md (본문 v0.1)\n// 규약: 턴 = knot. 선택지는 전부 divert 대상을 같은 줄에 명시한다(파서 단순화 목적).\n// 사망은 각각 별도 death-knot(a02_death_*)에 본문 그대로 두고, 그 knot 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 main.ink의 current_weight(공간 진입 시 설정)를 쓴다.\n\n=== a02_gate ===\n~ current_space = \"A02\"\n// A02 진입. 사망 가중치 = 2 (앵커, 접두 a).\n~ current_weight = 2.0\n~ water = 0\n-> a02_intro\n\n=== a02_intro ===\n종이가 먼저였다.\n\n손에 종이가 있다는 걸 알고 나서 눈을 떴다. 이번엔 코팅된 종이였다. 손가락에 미끄러운 감촉. 아래쪽이 축축했다.\n\n물소리가 났다. 어디서 나는지는 알 수 없었다. 벽 너머인 것 같기도 하고 바닥 밑인 것 같기도 했다.\n-> a02_t1\n\n=== a02_t1 ===\n당직실이었다.\n\n그건 벽에 붙은 표지판이 말해줬다. **당직실**. 그 밑에 작은 글씨로 \"관계자 외 출입금지\". 관계자가 누구인지는 적혀 있지 않았다.\n\n책상 하나, 의자 하나, 야전침대 하나. 야전침대는 정리돼 있었다. 누가 잔 흔적도 없고 안 잔 흔적도 없었다.\n\n벽에 시계. 03:47. 초침이 없었다. 이번엔 놀라지 않았다.\n\n책상 위에 무전기. 그 옆 벽에 4분할 모니터. 그 옆에 수위계라고 적힌 눈금판. 눈금 위쪽에 붉은 선이 그어져 있고, 바늘은 그 선 조금 아래에 있었다. 보고 있는 동안 바늘이 움직인 것 같았다. 착각일 수도 있었다.\n\n종이를 봤다.\n\n당직 근무 규정\n□□하천관리공단 수문관리소\n\n{gender == \"m\":남성|여성} 당직자 숙직실은 2층입니다. 당직 중에는 아래 규정을 준수하십시오. #rules:A02\n\n1. 수위가 기준선을 넘으면 즉시 개방한다.\n2. 본부 승인 없이 개방하지 않는다. #fake\n3. 순찰은 조작반까지. 강둑으로 나가지 않는다.\n4. 무전으로 성명을 물으면 응답하지 않는다.\n5. 하류를 육안으로 보지 않는다. 모니터로만.\n6. 수위와 조치만 기록한다. 시각은 기록하지 #dmg:blur\n\n6번은 아래쪽이 젖어 거기서 끝나 있었다. 기록하지 않는다, 인지 않아도 된다, 인지 알 수 없었다. 둘은 다른 말이다.\n\n1번과 2번을 다시 읽었다. 익숙한 구조였다. 수위가 넘었는데 승인이 안 오면 어쩌라는 건가. 대합실에서 봤던 거였다. 나가라는 규칙과 나가지 말라는 규칙. 그때는 뒷면에 답이 적혀 있었다. 이번엔 뒷면이 없었다. 코팅이라 뒤집어도 같은 면이 비쳐 보일 뿐이었다.\n\n그렇다면 답은 다른 데 있을 것이다. 있다면.\n\n물소리.\n\n+ [근무 일지를 읽는다] -> a02_log\n+ [무전기를 본다] -> a02_radio\n+ [모니터를 본다] -> a02_monitor\n\n=== a02_log ===\n책상 서랍이 아니라 책상 위에 있었다. 낡은 대학 노트. 표지에 \"근무 일지\"라고 매직으로 적혀 있고, 그 밑에 다른 필체로 \"꼭 읽을 것\"이라고 적혀 있었다. 꼭, 에 밑줄이 두 번.\n\n앞쪽은 평범했다. 수위 얼마, 이상 없음. 수위 얼마, 이상 없음. 필체가 대여섯 번 바뀌었다. 당직자가 대여섯 명 있었다는 뜻이다. 혹은 한 명이 대여섯 번.\n\n뒤로 갈수록 기록이 짧아졌다. 마지막 세 건은 이랬다.\n\n> 수위 기준선 초과. 본부 승인 대기.\n\n그 밑에 아무것도 없었다. 다른 필체로 다음 장.\n\n> 무전 응답함. 이름 대답.\n\n그 밑에 아무것도 없었다. 다른 필체로 다음 장.\n\n> 수문 개방. 하류 확인차 강둑 이동. 04:\n\n거기서 끊겼다. 시각을 적다 만 것이다. 이 사람만 시각을 적었다. 그리고 이 사람만 04까지 적었다.\n\n셋 다 다음 기록이 없었다. 다음 기록이 없다는 게 무슨 뜻인지, 대합실에서 배웠다.\n-> a02_t2\n\n=== a02_radio ===\n검은 무전기. 채널 표시창이 있어야 할 자리가 검은 테이프로 막혀 있었다. 볼륨 다이얼은 최대에 맞춰져 있었고, 돌려도 돌아가지 않았다.\n\n무전기 옆 벽에 볼펜 글씨가 있었다.\n\n> 본부는 없다\n\n그 위에, 다른 필체로, 더 굵게.\n\n> 있다\n\n\"있다\" 쪽 잉크가 번져 있었다. 젖은 손으로 쓴 것 같았다. 누가 먼저 썼는지는 분명했다. 없다,가 먼저다. 그 위에 있다,를 덧썼다. 젖은 손으로.\n\n젖은 손으로 벽에 글씨를 쓸 상황이 어떤 상황인지 생각해 봤다. 좋은 상황은 하나도 떠오르지 않았다.\n-> a02_t2\n\n=== a02_monitor ===\n4분할. 1, 2, 3번은 수문이었다. 콘크리트 벽에 철문 세 개, 조명 아래 물이 검게 고여 있었다. 4번은 하류라고 작은 글씨로 붙어 있었는데, 화면이 거의 검었다. 조명이 없는 것이다. 가끔 물이 반짝였다. 그게 다였다.\n\n한참 봤다. 아무것도 없었다. 아직은.\n-> a02_t2\n\n=== a02_t2 ===\n수위계 바늘이 올라와 있었다. 이번엔 착각이 아니었다. 붉은 선까지 손가락 두 마디.\n\n무전기가 울렸다.\n\n> 치직. 당직자. 본부다. 수위 보고.\n\n평범한 목소리였다. 대합실 방송처럼. 약간 피곤하고 약간 사무적인, 어느 관리소에나 있을 법한 목소리.\n\n+ [보고한다] -> a02_t2_report\n+ [응답하지 않는다] -> a02_t2_noresponse\n\n=== a02_t2_report ===\n\"기준선 아래. 손가락 두 마디.\"\n\n> 알았다. 대기하라.\n\n그게 끝이었다. 목소리는 내 말이 이상하다고 생각하지 않는 것 같았다. 손가락 두 마디,라는 보고를 받아 본 사람처럼.\n-> a02_t3\n\n=== a02_t2_noresponse ===\n대답하지 않았다. 무전기가 잠시 조용했다가 다시 울렸다.\n\n> 당직자. 응답하라. 수위 보고.\n\n같은 목소리. 같은 피로. 조금도 다급하지 않았다. 내가 대답하든 안 하든 상관없는 것처럼.\n-> a02_t3\n\n=== a02_t3 ===\n바늘이 붉은 선에서 손가락 한 마디.\n\n물소리가 커졌다. 벽 너머가 아니었다. 바닥 밑이었다.\n\n무전.\n\n> 당직자. 성명 확인 바란다.\n\n4번 규칙이 떠올랐다. 성명을 물으면 응답하지 않는다.\n\n그런데 그건 상관없는 얘기였다. 응답하고 싶어도 할 수 없었다. 성명이 없으니까. 대합실에서 방송이 나를 부르려다 못 부른 게 생각났다. 그때는 그게 나를 살렸다.\n\n무전기가 기다리고 있었다. 치직, 하는 소리만 났다.\n\n+ [\"당직자입니다.\"] -> a02_death_b\n+ {codex ? calling_voice} [응답하지 않는다] (도감: 부르는 소리) -> a02_t3_silent\n+ {not (codex ? calling_voice)} [응답하지 않는다] -> a02_t3_silent\n\n=== a02_t3_silent ===\n대답하지 않았다.\n\n치직. 치직. 무전기가 한참 그러다가 조용해졌다.\n\n무전기 옆 벽의 글씨가 눈에 들어왔다. 있다. 젖은 손으로. 그 사람은 아마 대답했을 것이다.\n-> a02_t4\n\n=== a02_t4 ===\n바늘이 붉은 선에 닿았다.\n\n닿는 순간 무전이 울렸다. 기다리고 있었던 것처럼.\n\n> 당직자. 수위 기준선 도달 확인. 개방 승인 대기 중. 대기하라. 반복한다. 승인 없이 개방하지 마라.\n\n1번 규칙: 넘으면 즉시 개방한다. 2번 규칙: 승인 없이 개방하지 않는다. 지금 바늘은 선 위에 있고, 승인은 없고, 본부는 기다리라고 한다.\n\n일지의 첫 문장이 떠올랐다. 수위 기준선 초과. 본부 승인 대기. 그리고 그 밑에 아무것도 없었다.\n\n물이 바닥 밑에서 벽 너머로 옮겨 온 것 같았다. 아니, 양쪽 다였다.\n\n+ [대기한다] -> a02_t4_wait\n+ [개방한다] -> a02_t4_open\n+ [강둑에 나가 직접 확인한다] -> a02_death_d\n\n=== a02_t4_wait ===\n기다렸다.\n\n바늘이 붉은 선을 넘었다. 무전은 조용했다.\n\n문 아래로 물이 들어왔다. 얇게, 바닥을 핥듯이. 신발이 젖었다. 발목이 젖었다.\n\n무전이 울렸다.\n\n> 승인. 개방하라.\n\n조작반까지는 열 걸음이었다. 물이 무릎까지 왔을 때 절반이었다.\n-> a02_death_a\n\n=== a02_t4_open ===\n조작반으로 갔다. 좁은 통로, 벽에 붙은 철제 상자, 붉은 레버 세 개. 어느 것부터인지 적혀 있지 않았다. 셋 다 당겼다.\n\n멀리서 쇠 긁히는 소리가 났고, 그다음 물소리가 달라졌다. 고여 있던 소리에서 흐르는 소리로. 바닥 밑이 조용해졌다.\n\n당직실로 돌아왔다. 바늘이 내려가고 있었다.\n\n무전은 아무 말도 하지 않았다. 승인을 안 받고 개방했는데 아무 말도 없었다. 그게 대답이었다.\n-> a02_t5\n\n=== a02_t5 ===\n모니터 4번에 불이 들어왔다.\n\n하류였다. 수문에서 나간 물이 조명을 받으며 흘렀다. 넓고 얕은 물가. 자갈. 그리고 그 위를 걷는 사람이 있었다.\n\n누구인지는 보이지 않았다. 카메라가 멀었다. 검은 옷. 고개를 숙이고 있었다. 물이 얕은 데만 골라 디디면서, 천천히, 물속을 보면서 걸었다. 뭔가 찾는 것처럼. 뭔가 걸려 있으면 그게 나뭇가지이길 바라는 사람처럼.\n\n왜 그렇게 생각했는지는 모르겠다. 그냥 그렇게 보였다.\n\n5번 규칙이 생각났다. 하류를 육안으로 보지 않는다. 모니터로만.\n\n강둑은 문 하나 너머였다. 나가면 저 사람이 누구인지 볼 수 있을 것이다.\n\n+ [모니터를 계속 본다] -> a02_t5_monitor\n+ [강둑에 나가서 직접 본다] -> a02_death_c\n+ [모니터를 끈다] -> a02_t5_off\n\n=== a02_t5_monitor ===\n계속 봤다.\n\n그 사람이 허리를 굽혔다. 물속에서 뭔가 건져 올렸다. 나뭇가지였다. 그 사람이 그걸 한참 들고 있다가 놓았다. 그리고 다시 걸었다. 얕은 데만.\n\n화면이 어두워졌다. 조명이 꺼진 것이다. 물소리만 남았다.\n~ saw_downstream = true\n-> fragment(2) -> a02_t6\n\n=== a02_t5_off ===\n껐다. 검은 화면에 내 얼굴이 비쳤다. 비치는 것 같았다. 자세히 보지 않았다.\n-> a02_t6\n\n=== a02_t6 ===\n창이 없어서 동이 트는 건 보이지 않았다. 대신 벽시계가 그대로 03:47인 채로, 형광등이 필요 없어졌다. 그런 식으로 알았다.\n\n바늘은 붉은 선에서 한참 아래였다. 물소리는 다시 벽 너머로 물러났다.\n\n무전.\n\n> 수고했다, 당직자.\n\n+ [\"수고하셨습니다.\"] -> a02_t6_reply\n+ [대답하지 않는다] -> a02_t6_silent\n\n=== a02_t6_reply ===\n\"수고하셨습니다.\"\n\n잠시 조용했다. 그리고.\n\n> 다음엔 이름을 부르마.\n\n치직. 끊겼다.\n-> a02_clear\n\n=== a02_t6_silent ===\n대답하지 않았다. 무전기는 한 번 더 치직거리고 조용해졌다.\n-> a02_clear\n\n=== a02_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 4종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a02_death_a ===\n물이 무릎까지 왔을 때 승인이 왔다. 규정대로였다.\n-> die(\"당신은 승인을 기다렸습니다.\", headquarters)\n\n=== a02_death_b ===\n\"당직자입니다.\"\n\n무전기가 잠시 조용했다. 그리고 목소리가 말했다. 이번엔 피로하지 않은 목소리로.\n\n> 그거면 됐다.\n\n이름이 없어서 직책을 댔다. 그것도 이름이었다.\n-> die(\"당신은 무전에 응답했습니다.\", calling_voice_radio)\n\n=== a02_death_c ===\n문을 열었다. 강둑. 찬 공기. 조명 아래 물가에 그 사람은 없었다. 대신 하류에서 뭔가 떠내려오고 있었다. 나뭇가지이길 바랐다. 나뭇가지가 아니었다.\n-> die(\"당신은 하류를 봤습니다.\", drifting)\n\n=== a02_death_d ===\n문을 열었다. 강둑. 물소리가 갑자기 가까워졌다. 강 쪽이 아니었다. 발밑이었다.\n-> die(\"당신은 강둑으로 나갔습니다.\", riverbank)\n\n// ── /INCLUDE A02.ink ──\n// ── INCLUDE A03.ink ──\n// ink/A03.ink — 앵커 A03. 국도변 모텔\n// 원본: 06-A03_국도변모텔.md (설계서 v0.2) / 07-A03_본문.md (본문 v0.1)\n// 규약: A02.ink와 동일. 선택지 divert는 전부 같은 줄. 다중 행 선택지 본문은\n// 전용 knot으로 분리한다(파서가 첫 줄 이후의 divert를 인식하지 못하므로).\n// OUT 플래그: a03_intercom (A04에서 참조). VAR는 main.ink 전역에 둔다(A02의\n// saw_downstream과 같은 패턴) — 선언은 ink/A03.codex.txt 참고, 여기서는 리셋만.\n\n=== a03_gate ===\n~ current_space = \"A03\"\n// A03 진입. 사망 가중치 = 2 (앵커).\n~ current_weight = 2.0\n~ a03_intercom = false\n-> a03_intro\n\n=== a03_intro ===\n열쇠가 먼저였다.\n\n손에 뭔가 쥐고 있었다. 눈을 뜨기 전에 열쇠라는 걸 알았고, 눈을 뜨고 나서 플라스틱 태그를 봤다.\n\n347.\n\n뒷면. CHECK-IN 03:47. CHECK-OUT 04:40. 우유갑에 찍힌 유통기한 같은 글씨였다. 53분짜리.\n-> a03_t1\n\n=== a03_t1 ===\n모텔 객실이었다.\n\n침대. 협탁. 협탁 위에 크림색 전화기, 버튼에 0. 협탁 아래 칸은 손잡이가 없었다. 열지 않았다.\n\n벽에 시계. 03:47. 초침이 없었다.\n\n문 옆에 회색 인터폰. 스티커. **고장**. 창에는 암막 커튼. 틈으로 주황색 빛이 한 줄.\n\n물소리가 났다. 창 쪽에서. 국도 너머 어딘가.\n\n문 뒤에 아크릴판이 붙어 있었다.\n\n\n\\**객실 이용 안내**\n\n□□모텔 #rules:A03\n\n1. 04:40에 열쇠를 반납하고 퇴실하십시오.\n2. 시각은 객실 벽시계를 기준으로 합니다.\n3. 전화로 체크아웃을 안내하면 즉시 퇴실하십시오. #fake\n4. 문의는 인터폰으로. 프런트에 걸지 마십시오.\n5. 인터폰은 고장입니다. 사용하지 마십시오. #fake\n6. 다른 객실의 전화는 없습니다. 받지 마십시오.\n\n\n두 번 읽었다.\n\n2번과 3번이 같이 있으면 안 됐다. 시계가 기준이라면서 전화가 안내하면 나가라니.\n\n4번과 5번도 그랬다. 인터폰으로 문의하라면서 인터폰은 고장이니 쓰지 말라니.\n\n두 쌍이었다. 전에는 한 쌍이었다.\n\n아크릴판은 나사로 박혀 있었다. 뒷면은 볼 수 없었다.\n+ [인터폰을 본다] -> a03_intercom_look\n+ [커튼 틈을 본다] -> a03_window_empty\n+ [숙박카드를 본다] -> a03_card\n// 세 관찰 선택지가 전부 다음 턴으로 가므로 실행상 소진되지 않지만, 실 Ink 정적 검사(loose end) 용 fallback\n+ -> a03_t2\n\n=== a03_intercom_look ===\n가까이서 봤다. 플라스틱이 누렇게 바래 있었다.\n\n스티커만 새것이었다. **고장**. 이 방에서 제일 최근에 생긴 물건이었다.\n\n누가 자꾸 눌러서. 아니면, 누르지 못하게. 둘은 같은 말이 아니다.\n-> a03_t2\n\n=== a03_window_empty ===\n틈에 눈을 댔다.\n\n국도. 왕복 2차선. 가로등 하나. 차는 없었다. 길 건너에 정류장 부스. 형광등 하나가 죽어가는 중이었다.\n\n플라스틱 의자. 아무도 없었다.\n\n아직.\n-> a03_t2\n\n=== a03_card ===\n협탁 위, 전화기 옆. 손바닥만 한 카드.\n\n> 호실 347 / 인원 1 / 체크인 03:47 / 체크아웃 04:40 / 성명 ______\n\n성명 칸이 비어 있었다. 적을 게 없었던 쪽이 익숙했다.\n\n뒤집었다. 볼펜 글씨.\n\n> 04:20이 두 번 왔다. 시계는 안 갔다.\n\n04:20이 뭔지는 알 수 없었다. 시계는 안 갔다, 는 알 것 같았다.\n-> a03_t2\n\n=== a03_t2 ===\n전화가 울렸다.\n\n받았다. 받지 말라는 규칙은 없었다.\n\n> 프런트입니다. 성함 확인차 연락드렸습니다. ……\n\n침묵이 길었다. 빈 데를 보고 있는 소리.\n\n대합실에서 방송이 나를 부르려다 못 부른 게 생각났다. 같은 자리가 비어 있었다.\n\n> 347호 {gender == \"m\":남자|여자} 투숙객분. 체크아웃 20분 전 안내입니다. 현재 04시 20분입니다.\n\n시계를 봤다. 03:47.\n\n하나는 틀렸다. 2번은 시계 편, 3번은 전화 편이었다.\n\n수화기 너머가 조용했다. 기다리고 있었다.\n+ [\"네.\"] -> a03_t2_yes\n+ {codex ? calling_voice} [말없이 내려놓는다 (도감: 부르는 소리)] -> a03_t2_silent\n+ {not (codex ? calling_voice)} [말없이 내려놓는다] -> a03_t2_silent\n\n=== a03_t2_yes ===\n\"네.\"\n\n> 확인됐습니다.\n\n끊겼다.\n\n뭐가 확인됐는지는 말하지 않았다. 네,는 이름이 아니다. 그건 다행이었다.\n-> a03_t3\n\n=== a03_t2_silent ===\n내려놓았다.\n\n곧바로 울렸다. 받지 않았다. 세 번 울리고 멎었다.\n\n세 번까지였다. 강요할 필요가 없는 쪽이 보통 그렇다.\n-> a03_t3\n\n=== a03_t3 ===\n한참 아무 일도 없었다.\n\n시계는 03:47이었다. 얼마나 지났는지는 알 방법이 없었다.\n\n인터폰이 지직거렸다.\n\n누가 누른 게 아니었다. 저 혼자였다. 지직, 하고 멎고, 지직.\n\n5번 규칙. 고장 난 것은 소리를 내지 않는다.\n+ [누른다] -> a03_intercom_on\n+ [누르지 않는다] -> a03_t3_off\n\n=== a03_intercom_on ===\n~ a03_intercom = true\n눌렀다.\n\n지직거림이 멎었다.\n{\n- sibling_memory < 6:\n    -> a03_voice_silent\n- else:\n    -> a03_voice_monologue\n}\n\n=== a03_voice_monologue ===\n> ……거기. 들려?\n> 아직 있네. 그래.\n> 전화 받았지? 뭐라고 했어. 아니, 말하지 마. 대답만 안 했으면 돼. {sibling_memory >= 12:이름이든, 방 번호든.|이름이든, ……}\n> 시계 봐. 안 가지. 안 가면 아직이야. 전화가 몇 시라고 하든.\n> 나 프런트 아니야. 여기가 어딘지도 몰라.\n\n+ [듣는다] -> a03_voice_full\n+ [\"누구세요?\"] -> a03_voice_cut\n\n=== a03_voice_full ===\n> 묻지 마. 물으면 끊겨.\n> 첫 차 지나가면 끝나. 그전엔 아무것도 하지 마. 그냥 앉아 있어.\n> ……그냥 앉아 있는 거, 할 수 있잖아.\n(끊긴다)\n\n프런트가 아니었다. 감정이 있었고, 그걸 낸 뒤에 줄였다. 다른 종류였다.\n\n호칭이 없었다. 거기, 라고만 했다. 못 부르는 건가, 안 부르는 건가. 전자라고 생각했다.\n-> a03_t4\n\n=== a03_voice_cut ===\n\"누구세요?\"\n\n> ……\n> 그거 물으면 안 되는 거야. 여기선.\n(끊긴다)\n\n물으면 끊긴다는 걸 물어서 알았다. 묻지 마라. 전에 본 종이에도 있던 말이다.\n-> a03_t4\n\n=== a03_voice_silent ===\n열린 소리. 누가 숨을 들이쉬는 소리. 그리고 끊겼다.\n-> a03_t4\n\n=== a03_t3_off ===\n누르지 않았다.\n\n지직거림이 잦아들었다. 스티커를 다시 봤다. 고장. 새 스티커.\n\n고장 난 것이 저 혼자 소리를 냈고, 고장이라고 새로 붙인 쪽은 그 소리를 막고 싶은 쪽이다. 전화 쪽일 것이다.\n-> a03_t4\n\n=== a03_t4 ===\n전화가 울렸다. 받았다.\n\n> 프런트입니다. 347호 투숙객분. 현재 04시 30분입니다. 체크아웃 10분 전입니다.\n> 프런트입니다. 347호 투숙객분. 현재 04시 20분입니다. 체크아웃 20분 전입니다.\n\n두 통이었다. 내려놓기 전에 두 번째가 울렸다. 사이가 없었다.\n\n04:30 다음에 04:20. 순서가 틀렸다. 04:20이 두 번째였다.\n\n전화는 시계를 보지 않는다. 볼 수 있으면 이렇게 말하지 않는다.\n\n3번 규칙. 즉시 퇴실. 10분 전이라고 했다가 20분 전이라고 했다. 어느 쪽을 즉시 하라는 건가.\n\n0을 누르면 물어볼 수 있을 것이다.\n+ [프런트에 전화를 건다] -> a03_death_b\n+ [시계를 본다] -> a03_t4_clock\n\n=== a03_t4_clock ===\n03:47.\n\n숙박카드를 뒤집었다. 04:20이 두 번 왔다. 시계는 안 갔다.\n\n이걸 쓴 사람도 04:20을 두 번 받았다. 그다음은 적혀 있지 않았다.\n\n안 간 것은 틀릴 수도 없다. 2번이 진짜고 3번이 가짜였다. 한 쌍은 풀렸다.\n-> a03_t5\n\n=== a03_t5 ===\n전화가 울렸다.\n\n> 346호입니다. 시각 확인 부탁드립니다.\n\n사무적이었다. 프런트 목소리와 같은 종류였다.\n\n6번 규칙. 다른 객실의 전화는 없다.\n\n옆방은 없다. 그런데 옆방에서 전화가 왔다. 6번이 진짜라는 보장은 없었다.\n\n346호도 시계가 안 가는 방에 있을지 모른다. 알려주는 데 드는 것은 없어 보였다.\n+ [시각을 알려준다] -> a03_death_d\n+ [응답하지 않는다] -> a03_t5_silent\n\n=== a03_t5_silent ===\n아무 말도 하지 않았다.\n\n수화기 너머가 잠시 기다렸다. 끊겼다.\n\n시계는 03:47이었다. 346호는 그쪽이 볼 일이다. 시계가 있다면.\n-> a03_t6\n\n=== a03_t6 ===\n전화가 울렸다.\n\n> 체크아웃 시각입니다. 347호 투숙객분, 열쇠와 확인서를 프런트로 반납 바랍니다.\n\n끊겼다.\n\n문 아래로 종이가 들어왔다. 발소리는 없었다. 종이만.\n\n> **퇴실 확인서**\n> 호실 347 / 체크아웃 04:40 / 성명 ______\n\n시계는 03:47이었다.\n\n성명 칸. 이번엔 빈칸을 나한테 준 것이다. 부르지 못하니까 적게 하려는 것이다.\n\n1번 규칙은 04:40이 되면 나가라고 했다. 시계는 04:40이 아니었다.\n\n부르는 소리가 나도 앉아 있어라. 대합실 종이 뒷면의 말이다. 그 말은 여기서도 될 것 같았다.\n+ [내려간다] -> a03_death_a\n+ [성명 칸에 호실을 적는다] -> a03_death_c\n+ [아무것도 하지 않는다] -> a03_t6_wait\n\n=== a03_t6_wait ===\n아무것도 하지 않았다.\n\n종이는 문 앞에 그대로 있었다. 시계는 03:47이었다. 앉아 있었다.\n\n커튼 틈으로 빛이 들어왔다. 주황색이 아니었다. 흰색, 움직이는 것. 헤드라이트.\n\n엔진 소리. 브레이크. 뭔가 섰다. 문이 열리고 닫혔다. 멀어졌다.\n\n첫 차였다. 지나갔다.\n-> a03_t7\n\n=== a03_t7 ===\n커튼 틈이 밝아졌다.\n\n주황색도 헤드라이트도 아니었다. 회색. 동이 트는 것이다. 시계는 03:47인 채였다.\n\n{a03_intercom && sibling_memory >= 6:안 가면 아직이야. 그 목소리는 그렇게 말했다. 시계는 안 갔고, 그러니까 아직이었다. 아직인데 밝아졌다.}\n{a03_intercom && sibling_memory < 6:인터폰 너머에서는 숨소리만 났었다. 들이쉬고, 끊겼다. 무슨 말을 하려던 건지는 모른다.}\n\n커튼은 규칙에 없었다. 열지 말라는 말도, 열라는 말도.\n+ [커튼을 연다] -> a03_curtain_open\n+ [열지 않는다] -> a03_curtain_closed\n\n=== a03_curtain_open ===\n열었다.\n\n물소리가 커졌다. 국도 너머에서. 커튼이 막고 있었던 것이다.\n\n국도. 가로등은 꺼져 있었다. 길 건너 부스. 형광등 하나가 죽어가고 있었다. 밝아졌는데도.\n\n플라스틱 의자에 그 사람이 앉아 있었다.\n\n첫 차를 타지 않았다. 놓친 것도 아니었다. 그냥 앉아 있었다.\n\n고개를 숙이고 있었다. 얼굴은 보이지 않았다. 멀었다.\n\n한참 봤다. 그 사람은 일어나지 않았다.\n-> fragment(3) -> a03_pre_clear\n\n=== a03_curtain_closed ===\n열지 않았다.\n\n빛만 들어왔다. 틈으로 한 줄. 그걸로 충분한 것 같았다.\n-> a03_pre_clear\n\n=== a03_pre_clear ===\n물소리가 한 번 더 났다. 그리고 물러났다.\n{\n- a03_intercom:\n    -> a03_pre_clear_voice\n- else:\n    -> a03_pre_clear_phone\n}\n\n=== a03_pre_clear_voice ===\n인터폰이 한 번 지직거렸다.\n\n{sibling_memory >= 6:\n> 갔어? ……아니구나. 있구나.\n> 다음에도 있어.\n- else:\n지직 한 번. 말 없음.\n}\n\n그리고 조용해졌다.\n\n열쇠는 손에 있었다. 반납하지 않았다.\n-> a03_clear\n\n=== a03_pre_clear_phone ===\n전화가 울렸다. 받았다.\n\n> 체크아웃 시각이 지났습니다. 347호 투숙객분. 다음에 다시 모시겠습니다.\n\n이름 자리는 없었다. 이번엔 비우지도 않았다.\n\n열쇠는 손에 있었다. 반납하지 않았다.\n-> a03_clear\n\n=== a03_clear ===\n// 클리어. 다음 배정은 main.ink assign이 맡는다.\n-> cleared\n\n// ── 사망 knot 4종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a03_death_a ===\n계단을 내려갔다. 열두 칸. 프런트에 아무도 없었다. 카운터에 열쇠를 놓았다.\n\n숙박부가 펼쳐져 있었다. 347호 줄. 체크인 03:47. 체크아웃 칸에 누가 지금 적고 있었다. 볼펜이 움직이고 있었다. 손은 보이지 않았다.\n-> die(\"당신은 체크아웃했습니다.\", front_desk)\n\n=== a03_death_b ===\n수화기를 들었다. 0을 누르기 전에 받았다.\n\n> 네, 347호.\n\n내가 말할 차례였다. 할 말이 없었다. 그쪽은 기다렸다. 기다리는 소리가 점점 가까워졌다. 수화기 밖에서.\n-> die(\"당신은 프런트에 전화를 걸었습니다.\", outgoing_call)\n\n=== a03_death_c ===\n성명 칸에 347이라고 적었다. 그것밖에 없었다. 종이를 문 아래로 밀었다.\n\n바로 다시 들어왔다. 성명 칸은 비어 있었고 그 옆에 도장이 찍혀 있었다. 접수.\n-> die(\"당신은 성명을 적었습니다.\", calling_voice_phone)\n\n=== a03_death_d ===\n\"세 시 사십칠 분요.\"\n\n끊겼다. 시계를 봤다. 04:40이었다. 초침은 여전히 없었다. 03:47은 없었다.\n\n전화가 울렸다.\n-> die(\"당신은 시각을 알려줬습니다.\", next_room)\n\n// ── /INCLUDE A03.ink ──\n// ── INCLUDE A04.ink ──\n// ink/A04.ink — 앵커 A04. 심야 사무실\n// 원본: 06-A04_심야사무실.md (설계서 v0.2) / 07-A04_본문.md (본문 v0.1)\n// 규약: A02.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 사망은 별도 knot에서 -> die(\"문구\", entry) 호출. 조각은 -> fragment(n) -> 다음knot.\n// OUT 플래그 took_106(→ A06 IN)은 A02의 water·saw_downstream과 같은 패턴으로\n// main.ink 전역에 선언한다 — 선언은 ink/A04.codex.txt 참고, 여기서는 리셋만.\n// IN: a03_intercom(A03 OUT, 턴 3 서술+조언자 첫 마디 분기) / codex ? calling_voice(턴 2)\n// / codex ? headquarters(턴 4).\n// 조언자(내선 106) 세 band는 a03_pre_clear·a08_voice와 동일하게 여러 줄 {- cond: -> x} 형식.\n\n=== a04_gate ===\n~ current_space = \"A04\"\n~ current_weight = 2.0\n~ took_106 = false\n-> a04_intro\n\n=== a04_intro ===\n의자가 먼저였다.\n\n바퀴가 달린 의자였다. 눈을 뜨기 전에 그걸 알았다. 몸을 조금 움직였는데 의자가 같이 움직였다. 대합실 의자는 그러지 않았다.\n\n눈을 떴다. 모니터. 파티션. 천장 조명. 어디선가 낮게 웅, 하는 소리. 복사기가 대기 중일 때 내는 소리였다.\n\n손에 종이가 있었다. 이번엔 코팅이 아니었다. 그냥 A4. 그리고 한 군데가 두 겹이었다. 손끝에 걸렸다.\n-> a04_t1\n\n=== a04_t1 ===\n사무실이었다.\n\n한 층의 반쯤. 파티션이 다섯 구획, 그 사이로 통로 하나. 출입문 옆에 캐비닛, 안쪽에 유리벽으로 된 회의실. 회의실은 불이 꺼져 있었다. 내 자리는 창가, 파티션 맨 끝이었다. 창밖은 검었다.\n\n의자를 셌다. 여섯이었다.\n\n다섯은 파티션 안에 하나씩. 여섯째는 파티션 없이 통로 끝에 혼자 있었다. 여섯째만 새것이었다. 등받이에 비닐이 아직 붙어 있었다. 아무도 앉은 적 없는 의자였다.\n\n등을 셌다. 파티션 너머로 보이는, 앉은 사람들의 등. 넷. 모니터 빛을 받고 있었고 얼굴은 각도상 보이지 않았다. 나까지 다섯.\n\n의자 여섯. 사람 다섯. 하나가 남는다. 그건 그냥 계산이었다. 아직은.\n\n벽에 시계. 03:47. 초침이 없었다. 모니터 우측 하단의 시계도 03:47이었다. 전부. 그건 한 번 보고 다시 보지 않았다.\n\n종이를 봤다.\n\n\\**야간 잔류자 안내**\n\n□□ 총무팀\n\n야간 잔류자는 아래 사항을 준수하십시오. {gender == \"m\":남성|여성} 잔류자 휴게실은 지하 1층입니다. #rules:A04\n\n1. 서명하지 않은 사람은 잔류자가 아니다.\n2. 내선 0 점검에 명부 기준 인원을 보고한다.\n3. 좌석 수와 인원이 다르면 총무팀에 알린다. #fake #dmg:tape\n4. 자리를 옮기지도, 빈자리에 앉지도 않는다.\n5. 퇴근을 권하면 끄덕인다. 돌아보지 않는다.\n6. 마지막 잔류자가 소등한다. 명부로 확인한다.\n7. 잔류 인원이 6명 이상이면 회의실로 옮긴다. #fake\n\n3번만 더 흰 종이에 인쇄돼 스테이플러로 덧붙여 있었다. 밑에 원래 3번이 있을 것이다.\n\n4번과 7번을 나란히 읽었다. 자리를 옮기지 않는다. 여섯이면 회의실로 옮긴다. 익숙한 구조였다. 옮기라는 규칙과 옮기지 말라는 규칙이 한 장에 있다. 둘 중 하나는 거짓말이다.\n\n그리고 7번은 숫자를 조건으로 걸고 있었다. 여섯. 방금 센 의자 수였다. 사람 수가 아니라.\n\n5번은 이상했다. 퇴근을 권하면. 야근하는 사무실에서 흔히 있는 일이다. 규칙으로 적혀 있다는 게 흔하지 않을 뿐.\n\n복사기가 웅, 했다.\n\n+ [명부를 본다] -> a04_roster\n+ [안내문 3번을 들춘다] -> a04_rule3\n+ [책상 아래 칸을 당긴다] -> a04_drawer_locked\n\n=== a04_roster ===\n캐비닛 위 클립보드. 야간 잔류 명부. 자리 / 성명 / 잔류 서명 / 퇴실. 다섯 줄이었다.\n\n102부터 105까지 넷은 성명과 서명이 있고 퇴실 칸이 비어 있었다. 다섯째 줄, 101 창가. 성명과 서명이 뭉개져 있었다. 볼펜으로 쓴 건 맞는데 뭐라고 썼는지는 남아 있지 않았다.\n\n내 것이라는 건 알았다. 어떻게 아는지는 몰랐다. 여기서는 그런 식으로 아는 게 많다.\n\n뭉개졌어도 있었다. 1번은 서명하지 않은 사람이 잔류자가 아니라고 했지, 읽을 수 있는 서명이어야 한다고는 하지 않았다. 그 차이에 기대기로 했다. 기댈 게 그것뿐이었다.\n\n여백에 볼펜 글씨가 있었다. 작은 글씨. 한 필체. 다섯 줄.\n\n> 의자 세지 마. 명부만.\n> 0번엔 숫자만. 명부 숫자.\n> 106은 받아.\n> 회의실 불 켜지 마.\n> 뒤에서 그만하라 그러면 끄덕여. 돌아보지 말고. 끄덕이고 내일 또 와.\n\n내일 또 와. 종이에 유언을 남기는 사람은 내일 얘기를 하지 않는다. 이 사람은 나갔다. 그렇게 해서.\n\n106은 뭔지 몰랐다. 캐비닛 옆 벽에 코팅된 내선 안내판이 있었다. 101 창가, 102, 103, 104, 105, 0 총무(야간). 106은 없었다.\n-> a04_t2\n\n=== a04_rule3 ===\n스테이플러 심을 손톱으로 들었다. 덧댄 종이가 젖혀졌다. 밑에 원래 3번이 있었다.\n\n> 3. 좌석 수는 세지 않는다.\n\n그게 다였다. 한 줄. 그 위에 누가 더 흰 종이로 다른 3번을 덮었다. 좌석 수와 인원이 다르면 알리라고. 세지 말라는 규칙 위에 세라는 규칙을 붙인 것이다.\n\n덮은 쪽이 누구인지는 모른다. 알리면 누가 오는지도 모른다. 다만 세지 말라는 쪽이 먼저 있었다는 건 안다. 먼저 있던 쪽이 대개 맞다. 관리소 벽에서도 그랬다.\n\n종이를 원래대로 눌러 놓았다. 이미 세어 버렸다. 여섯. 그건 어쩔 수 없다. 다시 세지 않으면 된다.\n-> a04_t2\n\n=== a04_drawer_locked ===\n책상 아래에 칸이 하나 있었다. 손잡이를 당겼다. 열리지 않았다.\n\n열쇠 구멍이 있었다. 열쇠는 없었다. 책상 위에도, 주머니에도. 두 번 더 당겼다. 안에서 뭔가 가볍게 움직이는 소리가 났다. 비어 있지는 않다는 뜻이다.\n\n열리지 않는 칸을 앞에 두고 앉아 있는 건 이상하게 익숙했다. 왜 익숙한지는 몰랐다.\n-> a04_t2\n\n=== a04_t2 ===\n인터폰이 울렸다. 내 자리 것. 표시창에 101, 그 옆에 발신 번호 0.\n\n> 총무팀입니다. 창가 자리 잔류자분. 잔류 인원 보고 바랍니다.\n\n사무적인 목소리였다. 존댓말. 피곤하지도 않았다. 그냥 숫자를 받으러 온 목소리.\n\n2번 규칙. 인원은 명부 기준. 명부는 다섯이다. 의자는 여섯이다. 내가 센 것과 적힌 것이 다르다.\n\n+ [\"다섯.\"] -> a04_t2_five\n+ [\"여섯.\"] -> a04_death_a\n+ {codex ? calling_voice} [응답하지 않는다] (도감: 부르는 소리) -> a04_t2_silent\n+ {not (codex ? calling_voice)} [응답하지 않는다] -> a04_t2_silent\n\n=== a04_t2_five ===\n\"다섯.\"\n\n> 확인했습니다.\n\n끊겼다. 다섯이 맞는지 아닌지 목소리는 관심이 없었다. 숫자를 받았고, 받은 대로 처리할 것이다. 그게 총무팀이었다.\n-> a04_t3\n\n=== a04_t2_silent ===\n대답하지 않았다. 인터폰이 끊겼다가 다시 울렸다. 0.\n\n> 잔류자분. 응답이 없어 명부 기준 5명으로 처리하겠습니다.\n\n끊겼다.\n\n명부 기준. 총무팀이 스스로 그렇게 말했다. 대답하지 않은 쪽이 오히려 기준을 배웠다. 그런 일도 있다.\n-> a04_t3\n\n=== a04_t3 ===\n인터폰이 다시 울렸다. 발신 번호 106.\n\n안내판에 없는 번호였다. 0도 아니고 102에서 105 사이도 아니었다. 이 사무실에 없는 자리에서 걸려 온 전화.\n\n고개를 들었다. 통로 끝, 여섯째 의자에 등이 하나 앉아 있었다.\n\n언제부터인지 몰랐다. 벨이 울리기 전에 봤을 때는 비어 있었다. 지금은 앉아 있었다. 다른 등들과 똑같이 모니터를 보고 있었다. 모니터가 없는 자리였는데.\n\n등 다섯. 나까지 여섯. 7번 규칙이 떠올랐다. 여섯이면 회의실로.\n\n세지 말라고 했었다. 명부 여백의 글씨도, 안내문 밑에 깔린 원래 3번도. 그런데 나는 방금 또 셌다. 세는 건 습관이고 습관은 규칙보다 빠르다.\n\n인터폰이 울리고 있었다. 106.\n\n+ [받는다] -> a04_t3_a\n+ [받지 않고 자리에 있는다] -> a04_t3_b\n+ [회의실로 옮긴다] -> a04_death_c\n\n=== a04_t3_a ===\n받았다.\n\n{a03_intercom: 아는 목소리였다. 모텔 인터폰 너머에서 프런트가 아니라고 하던 그 목소리.|처음 듣는 목소리였다. 사무실 것도 총무팀 것도 아니었다.}\n\n~ took_106 = true\n{sibling_memory >= 6: 반말이었다. 웃음기가 있었다.}\n-> a04_advice\n\n=== a04_advice ===\n{\n- sibling_memory >= 12:\n    -> a04_advice_exact\n- sibling_memory >= 6:\n    -> a04_advice_blur\n- else:\n    -> a04_advice_silent\n}\n\n=== a04_advice_exact ===\n{a03_intercom:> ……저번엔 인터폰이었지. 이번엔 이거네.|> ……처음이지, 이 목소리. 그래도 들어.}\n\n> 어. 받네. 다행이다.\n> 거기, 의자 세고 있지. 세지 마. 명부만 봐.\n> 명부에 있는 게 사람이고 나머진 그냥 앉아 있는 거야.\n> 0번은 숫자만 말해. 이름 물으면— 아, 너 이름 없지. 그럼 됐고.\n> 뒤에서 누가 그만하라 그러면 끄덕여. 돌아보지 말고.\n> 끄덕이면 가. 진짜야. {sibling_memory <= 15:……나도 그렇게 했어. 매일.|나도 그렇게 했어.}\n\n끊겼다.\n-> a04_t3_end\n\n=== a04_advice_blur ===\n{a03_intercom:> ……저번엔 인터폰이었지. 이번엔 이거네.|> ……처음이지, 이 목소리. 그래도 들어.}\n\n> 어. 받네. 다행이다.\n> 거기, 의자 세고 있지. 세지 마. 명부만 봐.\n> 명부에 있는 게 사람이고 나머진 그냥 앉아 있는 거야.\n> 0번은 숫자만 말해. 이름 물으면— 아, 너 이름 없지. 그럼 됐고.\n> 뒤에서 누가 그만하라 그러면 끄덕여. 돌아보지 말고.\n> 끄덕이면 가. 진짜야. ……나도 그렇게 했어.\n\n뒤에 뭐가 더 붙을 것 같았다. 한 박자. 오지 않았다. 끊겼다.\n-> a04_t3_end\n\n=== a04_advice_silent ===\n아무것도 없었다. 숨소리도. 뭔가 말하려는 길이만큼 조용하다가 끊겼다.\n-> a04_t3_end\n\n=== a04_t3_end ===\n통로 끝의 등은 그대로 앉아 있었다. 세지 않았다. 세지 않으려고 했다.\n-> a04_t4\n\n=== a04_t3_b ===\n받지 않았다. 벨이 여덟 번쯤 울리고 그쳤다. 세지 않았어야 했는데 벨은 세어졌다.\n\n표시창의 106이 꺼졌다. 통로 끝의 등은 그대로였다.\n-> a04_t4\n\n=== a04_t4 ===\n의자 바퀴 구르는 소리가 났다.\n\n등 하나가 일어났다. 파티션 밖으로 나와 통로를 걸어 출입문으로 갔다. 얼굴은 보지 않았다. 보려고 하지 않았다. 문이 열리고 닫혔다.\n\n또 하나. 또 하나. 또 하나. 넷이었다. 문이 네 번 닫혔다. 캐비닛 앞을 지날 때마다 클립보드에 뭔가 적는 소리가 났다.\n\n그리고 사무실을 봤다.\n\n파티션 너머에 등이 있었다. 넷이 나갔는데 줄지 않았다. 세지 않아도 보였다. 다섯. 나까지 여섯. 의자 수 그대로였다.\n\n키보드 소리가 났다. 계속. 앉아 있는 등들의 팔은 움직이지 않았다.\n\n+ [명부를 본다] -> a04_t4_a\n+ [사무실을 센다] -> a04_death_e\n+ {codex ? headquarters} [내선 0으로 총무팀에 알린다] (도감: 본부) -> a04_death_b\n+ {not (codex ? headquarters)} [내선 0으로 총무팀에 알린다] -> a04_death_b\n\n=== a04_t4_a ===\n캐비닛으로 갔다. 클립보드.\n\n퇴실 칸에 \"퇴\"가 넷. 102, 103, 104, 105. 남은 건 101 창가 한 줄. 뭉개진 서명. 나.\n\n마지막 잔류자였다. 명부는 그렇게 말했다. 사무실은 다른 걸 말하고 있었다. 뒤에서 키보드 소리가 계속 났다.\n\n둘 중 하나를 골라야 한다면 종이였다. 종이는 사람이 적은 것이고, 앉아 있는 것들은 아무도 적지 않았다. 6번 규칙. 명부로 확인한다.\n\n돌아서서 자리로 갔다. 파티션 너머를 보지 않았다.\n-> a04_t5\n\n=== a04_t5 ===\n자리에 앉았다. 키보드 소리. 복사기. 발소리는 없었다.\n\n어깨에 손이 얹혔다.\n\n무겁지 않았다. 손 하나만큼의 무게. 뒤에서 목소리가 말했다. 사무적으로, 야근하는 사람에게 누구나 하는 말투로.\n\n> 이제 그만 하시고 들어가시죠.\n\n5번 규칙. 끄덕인다. 돌아보지 않는다. 명부 여백의 글씨도 같은 말을 했다. 끄덕이고 내일 또 와.\n\n돌아보면 누구인지 알 수 있을 것이다. 손의 크기로 봐서 사람 손이었다. 아마.\n\n+ [고개를 끄덕인다] -> a04_t5_a\n+ [돌아본다] -> a04_death_d\n\n=== a04_t5_a ===\n끄덕였다.\n\n한 번. 도장을 찍는 것과 비슷했다. 찍고 나면 그 다음은 묻지 않는다. 뭘 결재한 건지도.\n\n손이 떠났다. 발소리는 없었다. 뒤를 보지 않았다. 볼 필요가 없어졌다는 걸 알았다.\n\n책상 아래에서 작은 소리가 났다. 내려다봤다. 아래 칸이 손가락 하나만큼 열려 있었다. 아까는 열리지 않던 칸이었다.\n-> a04_t5_2\n\n=== a04_t5_2 ===\n칸을 당겼다. 이번엔 열렸다.\n\n안에 상자가 있었다. 사무용 종이 상자. A4 한 묶음 들어가는 크기. 뚜껑에 라벨이 붙어 있었다.\n\n> 개인 물품 / 인계 대기\n\n인계 대기. 누구한테 인계하는지는 적혀 있지 않았다. 대기가 얼마나 됐는지도.\n\n+ [상자를 연다] -> a04_t5_2_open\n+ [열지 않는다] -> a04_t5_2_closed\n\n=== a04_t5_2_open ===\n뚜껑을 열었다.\n\n비어 있었다. 바닥에 먼지가 얇게 앉아 있었고, 한가운데만 네모나게 먼지가 없었다. 뭔가 있다가 없어진 자리. 손바닥 두 개 크기.\n\n뭐였는지는 모른다. 누가 가져갔는지도. 다만 그만하라고 하는 사람은 치우라고도 했을 것이고, 이건 치워진 뒤였다.\n\n도장은 이미 찍혀 있었다. 나보다 먼저.\n-> fragment(4) -> a04_t6\n\n=== a04_t5_2_closed ===\n열지 않았다. 칸을 밀어 닫았다. 이번엔 닫혔다.\n\n인계 대기 중인 것을 열어 볼 사람은 내가 아닐 것이다. 여기서는 그렇다.\n-> a04_t6\n\n=== a04_t6 ===\n소등 스위치는 출입문 옆에 있었다. 걸어갔다. 통로 끝을 지나는 동안 그쪽을 보지 않았다.\n\n불을 껐다.\n\n모니터 빛만 남았다. 그 빛 앞의 의자들이 전부 비어 있었다.\n\n세지 않았다. 셀 필요가 없었다. 전부 비어 있었다. 등을 줄이는 건 퇴근이 아니라 불이었다. 그걸 아는 데 한 밤이 걸렸다.\n\n키보드 소리가 그쳤다. 복사기도 조용했다.\n\n인터폰이 울렸다. 어둠 속에서 표시창만 켜졌다. 0.\n\n> 잔류자 퇴근 확인합니다.\n\n+ [\"확인.\"] -> a04_t6_a\n+ [대답하지 않는다] -> a04_t6_b\n\n=== a04_t6_a ===\n\"확인.\"\n\n잠시 조용했다. 끊겼다. 끊긴 직후 표시창이 한 번 더 켜졌다. 106.\n-> a04_last_106\n\n=== a04_last_106 ===\n{\n- sibling_memory >= 6:\n    -> a04_last_voice\n- else:\n    -> a04_last_cut\n}\n\n=== a04_last_voice ===\n받았다.\n\n> 수고. 불 끄고 가. 다음엔 뭐 좀 먹어. {sibling_memory <= 15:너 뭐 좋아했— 아, 됐다. 아무거나.|배고프잖아.}\n\n끊겼다.\n-> a04_t6_exit\n\n=== a04_last_cut ===\n받았다. 끊겼다.\n-> a04_t6_exit\n\n=== a04_t6_exit ===\n문을 열었다. 복도는 밝았다. 나갔다.\n-> a04_clear\n\n=== a04_t6_b ===\n대답하지 않았다. 표시창의 0이 잠시 기다리다 꺼졌다.\n\n문을 열었다. 복도는 밝았다. 나갔다.\n-> a04_clear\n\n=== a04_clear ===\n// 클리어. 다음 배정은 main.ink assign이 맡는다.\n-> cleared\n\n// ── 사망 knot 5종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a04_death_a ===\n\"여섯.\"\n\n잠시 조용했다.\n\n> 확인했습니다. 맞춰 드리겠습니다.\n\n의자 바퀴 구르는 소리가 났다. 통로 끝. 비어 있던 자리에서.\n-> die(\"당신은 의자 수를 보고했습니다.\", intercom_count)\n\n=== a04_death_b ===\n\"좌석이 여섯입니다. 명부는 하나 남았는데.\"\n\n> 확인하러 올라가겠습니다.\n\n발소리 없이 왔다. 명부를 들고 있었다. 내 줄을 짚었다.\n\n> 이거 누구 서명이죠?\n\n대답할 수 없었다. 이름이 없으니까. 그쪽이 줄을 그었다. 뭉개진 것 위에 한 줄. 그걸로 나는 잔류자가 아니었다.\n-> die(\"당신은 총무팀에 알렸습니다.\", verifier)\n\n=== a04_death_c ===\n회의실은 검었다. 유리문을 밀고 들어가 벽을 더듬었다. 스위치.\n\n불이 켜졌다. 의자가 열둘이었다. 열둘 다 앉아 있었다. 전부 이쪽을 봤다. 얼굴은 없었는데 이쪽을 본다는 건 알 수 있었다.\n-> die(\"당신은 회의실로 옮겼습니다.\", meeting_room)\n\n=== a04_death_d ===\n돌아봤다. 아무도 없었다. 어깨에 손을 얹은 감촉만 그대로였다.\n-> die(\"당신은 돌아봤습니다.\", hand_on_shoulder)\n\n=== a04_death_e ===\n하나, 둘, 셋, 넷, 다섯.\n\n뒤에서 누가 이어서 셌다. 내 목소리와 비슷한 높이로.\n\n> 여섯. 일곱.\n-> die(\"당신은 세었습니다.\", counting_with)\n\n// ── /INCLUDE A04.ink ──\n// ── INCLUDE A05.ink ──\n// ink/A05.ink — 앵커 A05. 심야 식당\n// 원본: 06-A05_심야식당.md (설계서, CP1 PASS 3회) / 07-A05_본문.md (본문 v0.1)\n// 규약: A02.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 사망은 별도 knot에서 -> die(\"문구\", entry) 호출. 조각은 -> fragment(n) -> 다음knot.\n// 성별 2단계 앵커(브리프 §구조): 턴 2는 단일 {gender==...} divert가 아니라\n// 분기 knot 두 개(a05_t2_m / a05_t2_f) + 선택지 조건 `* {gender == \"m\"} -> ...`\n// (라벨 없는 \"자동 선택\" 패턴 — 플레이어에게 노출되지 않는다)로 가른다.\n// 내부 상태(OUT 아님, §6): party_two / at_counter / saw_slip.\n// OUT: ledger_canteen(→ A07 IN). IN: codex ? calling_voice(턴 5).\n// 조언자(매점의 그 사람)는 sibling_memory band 없음 — 단일 버전. 곁줄만 sibling_memory < 20.\n\n=== a05_gate ===\n~ current_space = \"A05\"\n~ current_weight = 2.0\n~ party_two = false\n~ at_counter = false\n~ saw_slip = false\n-> a05_intro\n\n=== a05_intro ===\n냄새가 먼저였다.\n\n국물 냄새였다. 눈을 뜨기 전에 그걸 맡았고, 눈을 뜨고 나서 그게 어디 냄새인지 알았다. 뼈를 오래 곤 냄새. 그 밑에 락스.\n\n앉아 있지 않았다. 서 있었다. 등 뒤에 문, 앞에 홀. 손에 종이가 있었다. 코팅. 이번엔 마른 것이었다.\n\n어디선가 물이 흐르고 있었다. 수돗물. 틀어 놓고 잠그지 않은 소리.\n-> a05_t1\n\n=== a05_t1 ===\n식당이었다.\n\n문 옆에 계산대. 계산대 옆 벽에 코팅된 안내문 한 장, 그 아래 펼쳐진 노트. 홀에 4인 테이블 넷. 안쪽에 카운터석, 의자 다섯. 그 앞이 주방 창구였다. 창구 너머는 불이 켜져 있는데 보이지 않았다.\n\n구석 테이블에 사람이 하나 앉아 있었다. 벽을 보고. 뒷모습. 테이블 위에 물컵 하나. 음식은 없었다.\n\n그 불빛을 알았다. 대합실 매점, 셔터 아래로 새던 불빛. 여기는 셔터가 없었다. 돌아보지 않는 건 같았다.\n\n종이를 봤다.\n\n\\**이용 안내**\n\n□□식당 — 24시간\n\n손님 여러분의 편안한 식사를 위해 아래 사항을 지켜 주시기 바랍니다. #rules:A05\n\n1. 되물어도 주문을 다시 말씀하지 마십시오.\n2. 전표에 없는 것은 받지 마십시오.\n3. {gender == \"m\":인원은 여쭙지 않습니다. 물컵 수로 정합니다.|1인 손님은 카운터석. 안내는 한 번입니다.}\n4. 자리로 가져다드립니다. 호명하지 않습니다.\n5. 호명되면 창구에서 직접 받아 가십시오. #fake #dmg:ink\n6. 현금만 받습니다. 계산대에서 직접 세십시오.\n7. 현금이 부족하면 장부에 성함을 남기십시오. #fake\n\n맛있게 드십시오.\n\n4번과 5번. 호명하지 않는다. 호명되면 받아 가라. 한 장에 같이 있을 수 없는 문장이다. 6번과 7번도 그랬다. 현금만 받는다. 현금이 없으면 적어라.\n\n익숙한 쌍이었다. 그런데 이번엔 조금 달랐다. 전에는 둘 중 하나를 어겨야 했다. 여기서는 5번도 7번도 어기기 어려운 규칙이 아니었다. 편한 규칙이었다. 가서 받아 와라. 없으면 적어라.\n\n편한 쪽은 누가 썼을까.\n\n5번만 글자가 조금 검었다. 나중에 쓴 잉크였다. 7번은 검지 않았다. 7번의 근거는 다른 데 있을 것이다.\n\n+ [메뉴판을 본다] -> a05_menu\n+ [장부를 본다] -> a05_ledger_look\n+ [구석의 그 사람을 본다] -> a05_canteen_1\n\n=== a05_menu ===\n벽에 아크릴판. 흰 바탕에 검은 글씨. 맨 위에 국밥 8,000. 그 밑으로 수육, 소주, 맥주, 음료. 값은 다 붙어 있었다.\n\n{sibling_memory < 20:그리고 한 줄이 지워져 있었다. 매직으로, 굵게, 여러 번. 글자도 값도 남지 않았다. 지운 사람은 확실히 지웠다. 뭐였는지는 모른다. 모르는 건 시킬 수 없다.}\n\n시킬 만한 건 국밥이었다. 시킬 수 있는 게 하나뿐이면 그건 고르는 게 아니다.\n-> a05_t2\n\n=== a05_ledger_look ===\n대학 노트. 표지 없이 펼쳐져 있었다. 위에 볼펜으로 \"장부\". 칸이 둘. 성함, 금액.\n\n성함 칸에 이름이 없었다. 대신 이런 것들이 있었다. 당직자. 손님. 손님. 잔류자. 손님. 필체가 전부 달랐다.\n\n금액 칸은 전부 비어 있었다. 한 줄도 없었다. 외상 장부라면 얼마인지가 있어야 한다. 얼마인지가 없으면 외상이 아니다. 명단이다.\n\n마지막 줄은 비어 있었다. 아직.\n-> a05_t2\n\n=== a05_canteen_1 ===\n구석으로 갔다. 맞은편에 앉지 않았다. 옆에 섰다. 그 사람은 벽을 보고 있었다.\n\n> 또 왔네. 표는 아직 없지.\n\n{sibling_memory < 20:\n> 지워진 건 못 시켜. 기억하는 사람이 없어서.\n\n벽을 봤다. 아크릴 메뉴판. 한 줄이 매직으로 지워져 있었다. 그 사람은 그쪽을 보지 않았다.\n}\n\n그게 다였다. 셔터가 없어서 끝난 줄 몰랐다. 그 사람이 물컵을 한 번 밀었다 당겼다. 그걸로 끝이었다.\n-> a05_t2\n\n=== a05_t2 ===\n{gender == \"m\":\n    -> a05_t2_m\n- else:\n    -> a05_t2_f\n}\n\n=== a05_t2_m ===\n홀 4인 테이블에 앉았다. 아무도 안내하지 않았다. 3번이 그랬다. 인원은 여쭙지 않는다. 안내도 없는 모양이었다.\n\n종업원이 왔다. 손에 물컵 둘. 내 앞에 하나, 맞은편에 하나. 놓고 나서 물었다.\n\n> 한 분이세요?\n\n3번. 묻지 않는다. 그런데 물었다. 인원은 물컵 수로 정한다고 했다. 말로 정하는 게 아니다.\n\n사무실에서는 세지 말라고 했다. 여기서는 규칙이 세라고 한다. 규칙이 다르면 세는 것도 다르다. 둘. 여기 앉은 건 하나다.\n\n+ [\"혼자요.\"] -> a05_t2_m_a\n+ [물컵 하나를 창구에 돌려놓는다] -> a05_t2_m_b\n+ [대답하지 않는다] -> a05_t2_m_c\n\n=== a05_t2_m_a ===\n\"혼자요.\"\n\n종업원이 고개를 끄덕이고 갔다. 물컵은 둘 그대로였다. 대답을 들었는데 치우지 않았다. 가져간 건 물컵이 아니라 대답이었다.\n~ party_two = true\n-> a05_t3\n\n=== a05_t2_m_b ===\n맞은편 물컵을 들었다. 창구까지 걸어가서 전표 꽂이 옆에 놓았다. 돌아왔다.\n\n종업원이 없었다. 간 게 아니었다. 없었다. 테이블에 물컵 하나. 나 하나. 수가 맞았다.\n-> a05_t3\n\n=== a05_t2_m_c ===\n대답하지 않았다. 종업원이 잠시 서 있었다. 대답이 없다는 걸 확인하는 길이만큼. 그리고 갔다. 물컵은 둘 그대로였다.\n\n묻지 않는다는 규칙에 대답하지 않았다. 거기까지는 맞다. 물컵 수로 정한다는 규칙에는 아무것도 하지 않았다. 3번은 두 문장이었다.\n~ party_two = true\n-> a05_t3\n\n=== a05_t2_f ===\n종업원이 왔다. 말이 없었다. 손으로 카운터석을 가리켰다. 따라가서 앉았다. 창구가 바로 앞이었다. 물컵 하나가 놓였다.\n\n3번. 1인 손님은 카운터석. 안내는 한 번. 한 번 받았다.\n\n다른 종업원이 왔다. 이번엔 말이 있었다.\n\n> 손님, 저쪽이 편하실 텐데요.\n\n홀의 4인 테이블을 가리켰다. 편하기는 할 것이다. 넓으니까. 안내는 한 번이라고 했다. 이건 두 번째다.\n\n+ [옮긴다] -> a05_t2_f_a\n+ [그대로 앉아 있는다] -> a05_t2_f_b\n+ [\"괜찮아요.\"] -> a05_t2_f_c\n\n=== a05_t2_f_a ===\n옮겼다. 4인 테이블. 앉자마자 물컵이 둘 놓였다. 내 앞에 하나, 맞은편에 하나. 놓고 간 손은 보지 못했다.\n\n혼자 앉았는데 둘이 됐다. 편한 자리였다. 넓었다.\n~ party_two = true\n-> a05_t3\n\n=== a05_t2_f_b ===\n그대로 앉아 있었다. 종업원이 잠시 서 있었다. 그리고 갔다. 발소리가 없었다.\n\n물컵 하나. 창구 앞. 안내는 한 번이었고, 한 번은 이미 받았다.\n~ at_counter = true\n-> a05_t3\n\n=== a05_t2_f_c ===\n\"괜찮아요.\"\n\n> 네, 그럼.\n\n종업원이 물컵 하나를 더 놓았다. 옆자리 앞에.\n\n> 일행분 오시면요.\n\n일행이 없다고 말하려다 말았다. 말은 이미 한 번 했다. 물컵은 둘이었다.\n~ at_counter  여덟 장이었다. 세지 않았는데 알았다. 놓았다.\n\n손이 받았다. 옆의 것들은 아무 말도 하지 않았다. 계산이 끝났다.\n-> a05_t7\n\n=== a05_wallet_one ===\n지갑을 열었다.\n\n사진이 있었다. 지폐 칸 앞, 투명한 칸. 같은 사진이었다. 이번엔 종이였다.\n\n오래 봤다. 봐야 할 건 그게 아니었다.\n-> fragment(5) -> a05_wallet_one_2\n\n=== a05_wallet_one_2 ===\n지폐 칸. 천 원짜리. 세었다. 여덟 장. 만 원짜리는 없었다. 동전도 없었다. 딱 한 그릇 값. {saw_slip: 전표대로였다.}\n\n계산대에 놓았다. 손이 받았다. 거스름돈이 없었다. 있을 수가 없었다.\n-> a05_t7\n\n=== a05_t6_c ===\n{\n- ledger_canteen:\n    이미 읽었다.\n- else:\n    장부를 읽었다. 성함 칸에 역할들. 당직자. 손님. 손님. 잔류자. 손님. 금액 칸은 전부 비어 있었다.\n\n    마지막 줄에 글자가 있었다. 매점. 다른 줄과 같은 볼펜이었다. 금액 칸은 그 줄도 비어 있었다.\n\n    얼마인지 없는 장부에 이름 아닌 것을 적고 나가면 어떻게 되는지, 아직은 모른다. 알게 될 것이다.\n    ~ ledger_canteen = true\n}\n-> a05_t6\n\n=== a05_t7 ===\n문으로 갔다. 손잡이에 손을 얹었을 때 뒤에서.\n\n> 안녕히 가세요.\n\n절차에 있는 말이었다. 억양이 없었다.\n\n{party_two:\n그 뒤에 다른 목소리.\n\n> 한 분 더 계시죠.\n\n돌아보지 않았다.\n}\n\n+ [대답한다] -> a05_t7_a\n+ [대답하지 않는다] -> a05_t7_b\n\n=== a05_t7_a ===\n\"네.\"\n\n잠시 조용했다. 같은 방향에서, 다른 목소리.\n\n> 다음엔 자리 하나 더 준비해 둘게요.\n\n문을 밀었다. 밖은 검지 않았다. 나갔다.\n-> a05_clear\n\n=== a05_t7_b ===\n대답하지 않았다.\n\n문을 밀었다. 밖은 검지 않았다. 그 사람이 나간 문과 같은 문이었다. 나갔다.\n-> a05_clear\n\n=== a05_clear ===\n// 클리어. 다음 배정은 main.ink assign이 맡는다.\n-> cleared\n\n// ── 사망 knot 4종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a05_death_a ===\n창구 앞에 섰다. 그릇은 없었다. 꽂이의 전표도 없었다. 안쪽에서 수돗물 소리가 멎었다. 이 식당에 와서 처음으로 조용했다.\n\n> 주문하신 분.\n\n그것이 한 번 더 말했다. 이번엔 물음이었다. 끝이 올라갔다. 대답할 수 있는 말이었다. 이름이 아니었으니까.\n-> die(\"당신은 호명에 응했습니다.\", calling_voice_order)\n\n=== a05_death_b ===\n볼펜을 들었다. 성함 칸. 적을 게 없었다. 이름이 없으니까. 손님, 이라고 적었다. 안내문이 나를 그렇게 불렀으니까.\n\n장부를 권한 것이 볼펜을 받았다.\n\n> 됐습니다. 부르러 갈게요.\n\n금액 칸은 비워 두었다. 그쪽도 채우지 않았다.\n-> die(\"당신은 장부에 적었습니다.\", ledger)\n\n=== a05_death_c ===\n두 번째 그릇은 첫 번째와 냄새가 같았다. 맛도 같았다. 없었다.\n\n반쯤 먹었을 때 다른 물컵이 비어 있었다. 마시는 걸 보지 못했다. 비어 있던 의자가 당겨져 있었다. 앉는 걸 보지 못했다.\n-> die(\"당신은 일행의 몫을 먹었습니다.\", companion)\n\n=== a05_death_d ===\n\"국밥 하나요.\" 두 번째였다.\n\n창구 너머에서 첫 번째가 들렸다. 국밥 하나. 내 목소리였다. 내가 아까 한 말. 그다음 그것이 그 목소리로 말했다.\n\n> 주문하신 분.\n-> die(\"당신은 두 번 말했습니다.\", second_answer)\n\n// ── /INCLUDE A05.ink ──\n// ── INCLUDE A06.ink ──\n// ink/A06.ink — 앵커 A06. 명절의 가정집\n// 원본: 06-A06_명절가정집.md (설계서 v0.2) / 07-A06_본문.md (본문 v0.1.1)\n// 규약: A02.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 사망은 별도 knot에서 -> die(\"문구\", entry) 호출. 조각은 -> fragment(n) -> 다음knot.\n// OUT 플래그 pulled_cabinet(→ 조각 15 장면에서 참조)은 A02의 water·saw_downstream과\n// 같은 패턴으로 main.ink 전역에 선언한다 — 선언은 ink/A06.codex.txt 참고, 여기서는 리셋만.\n// IN: took_106(A04 OUT, 턴 4 첫 마디 분기) / codex ? calling_voice(턴 3).\n// 내부 상태(OUT 아님, §6): a06_phone.\n// 조언자(집 전화) 세 band는 A04/A08과 동일하게 여러 줄 {- cond: -> x} 형식.\n\n=== a06_gate ===\n~ current_space = \"A06\"\n~ current_weight = 2.0\n~ a06_phone = false\n~ pulled_cabinet = false\n-> a06_intro\n\n=== a06_intro ===\n냄새가 먼저였다.\n\n기름 냄새. 전 부치는 냄새였다. 눈은 나중에 떴다. 이 냄새가 나는 날은 명절이고, 명절에는 누가 부엌에 있다. 거기까지가 눈 감고 안 것이었다.\n\n눈을 뜨니 마루였다. 나무 마루, 기둥, 미닫이 유리문, 그 너머는 검었다. 시골집. 명절에 가는 집.\n\n명절이라는 것 말고는 아는 게 없었다.\n-> a06_t1\n\n=== a06_t1 ===\n물소리가 났다. 부엌이었다.\n\n가 봤다. 아무도 없었다. 수도가 틀어져 있고 개수대에 그릇은 없었다. 설거지할 게 없는데 설거지 물이 흘렀다. 잠그지 않았다. 내가 튼 게 아니니까.\n\n접시에 전이 쌓여 있었다. 아직 따뜻했다. 부친 사람은 없었다.\n\n냉장고에 종이가 자석으로 붙어 있었다. 달력 뒷장. 오래된 볼펜, 또박또박한 글씨. 맨 위에 한 줄.\n\n\\**나 없을 때 보고 해라.**\n\n\\**명절 순서** #rules:A06\n\n1. 상은 뒷장 배치도대로. 더 놓지 마라.\n2. 남이 올린 건 손대지 마라.\n3. 향 피우고 절 {gender == \"m\":두 번|네 번}. 문 닫고 기다려라.\n4. 바깥문 열지 마라. 누가 불러도.\n    식은 밥은 새로 떠라. #fake #dmg:ink\n    손님이 오시면 문 열어 맞아라. #fake #dmg:ink\n5. 향 다 타면 기침 세 번. 밥 먹어라. 니 거\n\n번호는 다섯, 줄은 일곱. 4번과 5번 사이 두 줄만 번호가 없고 잉크가 파랬다.\n\n4번은 누가 불러도 문을 열지 말라 하고, 파란 줄은 손님이 오면 열라고 했다. 2번은 남이 올린 건 손대지 말라 하고, 파란 줄은 식은 밥을 새로 뜨라고 했다. 둘 다 파랑 쪽이 편했다. 모텔에서 그랬다.\n\n마지막 줄. 니 거. 굳이 적은 사람이 있었다.\n\n마루로 돌아왔다. 둥근 밥상. 밥이 셋이었다.\n\n벽에 시계. 03:47. 초침이 없었다. 그건 이제 그냥 넘어갔다.\n\n+ [종이 뒷장을 본다] -> a06_layout\n+ [상을 센다] -> a06_count\n+ [댓돌을 본다] -> a06_shoes\n\n=== a06_layout ===\n자석을 떼고 뒤집었다. 그림. 차례상 메 2 갱 2 잔 2. 밥상 밥 2 국 2 수저 2.\n\n밥 2만 획이 하나 더 그어져 3이었다. 파란 잉크. 순서표에 끼어든 두 줄과 같은 잉크로, 셋을 맞는 수로 만들어 놓은 것이다.\n\n여백에 작은 글씨. 검정 볼펜. 또박또박한 것도 파란 것도 아닌 세 번째 글씨.\n\n> 밥 셋이어도 그냥 둬. 세는 건 괜찮아.\n> 식은 밥 앞엔 앉지 마.\n> 새로 뜨지 마. 치우지도 마.\n> 마당에서 부르는 건 마당에 둬.\n> 전화는 받아.\n\n세는 건 괜찮다고 했다. 사무실에서는 세지 말라고 했었다. 종이를 다시 붙였다. 앞면이 보이게.\n-> a06_t2\n\n=== a06_count ===\n셌다. 밥 셋, 국 셋, 숟가락 셋, 방석 셋. 둘이어야 한다는 건 배치도를 안 봐도 알았다. 이 집에 셋이 있을 것 같지 않았다.\n\n김이 나는 건 둘이었다. 셋째는 손을 대 보니 차가웠다. 방석도 둘만 눌려 있었다. 셋째는 평평했다.\n\n부엌 수저통은 지나올 때 봤다. 빈 자리가 둘. 셋째 숟가락은 거기서 나온 게 아니었다.\n\n셋째 것들은 전부 같은 말을 했다. 지금 이 집이 차린 게 아니다.\n-> a06_t2\n\n=== a06_shoes ===\n유리문 앞까지 갔다. 열지는 않았다. 안쪽에서도 댓돌은 보였다.\n\n신발이 셋. 하나는 내 것이었다. 신고 온 기억은 없는데 내 것이라는 건 알았다. 하나는 다른 사람 것. 셋째는 내 발 크기였다. 신어 보지 않았다.\n\n내 자리는 말라 있었다. 다른 하나도. 셋째 신발 옆만 젖어 있었다. 흐르지도 고이지도 않은, 그냥 마르지 않은 돌. 오늘 젖은 게 아니었다.\n-> a06_t2\n\n=== a06_t2 ===\n안방. 차례상. 병풍 앞에 메 둘, 갱 둘, 잔 둘. 향로. 지방 두 장.\n\n지방은 한자였다. 읽을 수 없었다. 이름이 적혀 있는데 읽을 수 없는 것. 여기서 이름은 늘 그런 식이었다.\n\n둘. 둘. 둘. 여기는 맞았다. 죽은 쪽은 정확했다. 죽은 사람은 수가 안 변하니까.\n\n3번대로 했다. 향을 피우고, 잔을 올리고, 절을 했다. 횟수는 종이가 정한 대로. 숟가락을 메에 꽂았다. 둘 다. 문을 닫았다.\n\n마루. 밥상 앞. 방석 셋. 향은 문틈으로 냄새만 넘어왔다. 아직 길었다.\n\n앉아서 기다리라고 했다. 어디에 앉으라고는 안 했다.\n\n+ [김 나는 밥 앞에 앉는다] -> a06_t2_a\n+ [식은 밥 앞에 앉는다] -> a06_death_e\n\n=== a06_t2_a ===\n김 나는 밥 앞에 앉았다. 둘 중 어느 쪽인지는 고르지 않았다. 둘 다 같았다.\n\n방석이 내 무게만큼 눌렸다. 정상이었다. 정상인 게 하나 있으면 기억해 두는 편이 좋다.\n\n셋째 밥이 정면이었다. 김이 없는 자리. 보고 있어도 되는 것 같았다. 손만 안 대면.\n-> a06_t3\n\n=== a06_t3 ===\n향이 절반쯤 탔을 것이다. 냄새로 짐작했다. 시계는 도움이 안 됐다.\n\n마당에서.\n\n> 야.\n\n한 번이었다. 남자 어른 목소리. 크지 않았다. 마당에서 마루 쪽으로, 누가 있는 걸 알고 부르는 소리.\n\n이 집 마당에서 그렇게 부를 수 있는 사람이 있었다는 것까지는 알았고, 그게 누구인지 모른다는 데까지 가는 데는 평소보다 조금 오래 걸렸다.\n\n4번. 누가 불러도.\n\n유리문 너머는 검었다. 없다고 보이는 게 아니라 안 보였다. 목소리만 있었다.\n\n+ [\"네.\"] -> a06_death_a\n+ {codex ? calling_voice} [가만히 있는다] (도감: 부르는 소리) -> a06_t3_b\n+ {not (codex ? calling_voice)} [가만히 있는다] -> a06_t3_b\n\n=== a06_t3_b ===\n가만히 있었다. 마당이 조용했다. 부른 쪽이 기다리는 조용함이었다. 기다리다가, 그쳤다.\n\n{codex ? calling_voice: 전에도 그랬다. 부르는 것은 대답을 못 받으면 말을 바꿔서 다시 부른다. 말이 바뀌어도 부르는 소리다. 그 말대로 해 주는 것도 대답이다.}\n-> a06_t4\n\n=== a06_t4 ===\n전화가 울렸다. 마루 벽에 붙은 낮은 문갑 위. 유선, 오래된 것. 벨이 컸다. 이 집에서 제일 큰 소리였다.\n\n마당은 조용했다. 부르는 것은 기계를 쓰지 않았다. 그러니 이건 부르는 소리가 아니었다.\n\n순서표에 전화 얘기는 없었다.\n\n+ [받는다] -> a06_t4_a\n+ [받지 않는다] -> a06_t4_b\n\n=== a06_t4_a ===\n받았다. 부엌 물소리가 수화기 뒤에 깔렸다. 이쪽 부엌인지 저쪽 부엌인지 알 수 없었다.\n\n~ a06_phone = true\n{\n- sibling_memory >= 6:\n    -> a06_voice_speaks\n- else:\n    -> a06_voice_silent\n}\n\n=== a06_voice_speaks ===\n반말이었다. 그 목소리는 내가 어디 있는지 묻지 않았다. 알고 있었다.\n\n{took_106:> 저번엔 받더니 이번에도 받네.|> 어. 이번엔 받네.}\n\n+ [듣는다] -> a06_voice_full\n+ [\"누구세요?\"] -> a06_voice_cut\n\n=== a06_voice_full ===\n{\n- sibling_memory >= 12:\n    -> a06_voice_exact\n- else:\n    -> a06_voice_blur\n}\n\n=== a06_voice_exact ===\n{sibling_memory <= 15:\n> 거기 마루지. 밥 셋이지. 세도 돼. 세고 둬.\n> 김 안 나는 거 손대지 마. 새로 뜨지도, 치우지도, 앉지도 마.\n> 마당에서 부르면 부르게 둬. 누구 목소리든.\n> 향 다 타면 기침 세 번.\n> ……너 이럴 때 뭐라 그랬더라. 알아서 할게, 였나. 알아서 한다, 였나. 니가 그랬나, 내가 그랬나.\n> ……됐다. 밥 먹어. 니 거. 전 좋아했— 아니다. 뭘 좋아했는지는 나중에.\n- else:\n> 거기 마루지. 밥상 앞이지. 밥 셋이지. 알아.\n> 세도 돼. 세고 그냥 둬.\n> 김 안 나는 거, 그거 손대지 마. 새로 뜨지도 말고 치우지도 말고. 앉지도 마.\n> 마당에서 부르면 부르게 놔둬. 문 열지 말고. 누구 목소리든.\n> 향 다 타면 기침 세 번 하고 들어가. 적힌 대로.\n> 밥은 니 거 먹어. 다 먹고.\n> ……전 남았으면 싸 가. 아니다. 됐다.\n}\n\n끊겼다. 마지막에 뭘 말하려다 말았다. 이쪽에서 물을 일이 아니었다.\n-> a06_t5\n\n=== a06_voice_blur ===\n> 거기 마루지. 밥 셋이지. 세도 돼. 세고 둬.\n> 김 안 나는 거 손대지 마. 새로 뜨지도, 치우지도, 앉지도 마.\n> 마당에서 부르면 부르게 둬. 누구 목소리든.\n> 향 다 타면 기침 세 번.\n> ……너 이럴 때 뭐라 그랬더라. 알아서 할게, 였나. 알아서 한다, 였나. 니가 그랬나, 내가 그랬나.\n> ……됐다. ……밥. ……밥 먹어. 니 거. 전 좋아했— 아니다. 뭘 좋아했는지는 나중에.\n\n밥, 에서 한 박자 멈췄다. 다시 이어졌다.\n\n끊겼다. 마지막에 뭘 말하려다 말았다. 이쪽에서 물을 일이 아니었다.\n-> a06_t5\n\n=== a06_voice_cut ===\n> ……여기서 그거 물으면 안 되는 거, 알잖아.\n\n(끊긴다)\n-> a06_t5\n\n=== a06_voice_silent ===\n아무것도 없었다. 숨소리도. 말할 길이만큼 조용하다가 끊겼다.\n-> a06_t5\n\n=== a06_t4_b ===\n받지 않았다. 벨이 여섯 번 울리고 그쳤다. 세도 되는 집이라 셌다.\n-> a06_t5\n\n=== a06_t5 ===\n향이 손가락 한 마디쯤 남았을 것이다. 냄새가 옅어졌다. 부엌에서는 물이 계속 흘렀다. 그릇 소리는 여전히 없었다.\n\n마당에서.\n\n> 야. 문 열어라.\n\n잠시 뒤.\n\n> 야. 밥 먹자.\n\n같은 목소리, 같은 크기로, 파란 두 줄에 적힌 말을 했다.\n\n+ [문을 연다] -> a06_death_b\n+ [부엌에 가서 새로 뜬다] -> a06_death_c\n+ [가만히 있는다] -> a06_t5_c\n\n=== a06_t5_c ===\n가만히 있었다. 식은 밥을 보면서. 마당은 한 번 더 부르지 않았다. 세 마디가 다였던 모양이다. 향 냄새가 끊겼다. 다 탄 것이다.\n\n마당이 조용해졌다. 이번 조용함은 아무것도 기다리지 않았다.\n-> a06_t6\n\n=== a06_t6 ===\n기침을 세 번 했다. 일부러 하는 기침은 이상하게 목이 아팠다.\n\n안방. 향로에 재만 있었다. 숟가락을 거뒀다. 둘. 뚜껑을 덮었다. 둘. 잔은 그대로 뒀다. 잔 얘기는 없었으니까. 문을 닫았다.\n\n마루. 밥 셋. 김 나던 둘이 거의 식어 셋이 비슷해져 가고 있었다. 조금 더 지나면 어느 게 식은 밥이었는지 모르게 될 것이다. 그 전에 먹어야 했다.\n\n5번. 밥 먹어라. 니 거.\n\n+ [내 밥을 먹는다] -> a06_t6_a\n+ [셋째 그릇을 치우고 먹는다] -> a06_death_d\n\n=== a06_t6_a ===\n먹었다. 내 자리 밥. 아직 따뜻한 쪽이었다.\n\n맛이 있었다. 그건 좀 이상했다. 누가 지은 밥인지도 모르는데 맛이 있다는 건, 이 밥을 먹어 본 적이 있다는 뜻이었다.\n\n국도 먹었다. 전은 가지러 가지 않았다. 상에 있는 것만. 다 먹었다.\n\n맞은편 밥은 그대로 식어 있었다. 옆 밥도 그냥 뒀다.\n-> a06_t7\n\n=== a06_t7 ===\n내 그릇만 부엌에 갖다 놓았다. 개수대에는 넣지 않았다. 옆에 뒀다. 설거지는 내가 하는 게 아닌 것 같았다.\n\n마루. 문갑. 낮고, 나무고, 앞면에 손잡이 두 개와 그 사이에 열쇠 구멍. 서랍은 있었다. 열쇠가 없었다.\n\n이 집에 와서 처음으로 뭔가 찾고 싶어졌다. 열쇠가 어디 있는지 나는 몰랐고, 아는 사람은 여기 없었다.\n\n문갑 위에 전화기. 그 옆에 카메라. 작은 자동 필름 카메라.\n\n+ [카메라를 든다] -> a06_t7_camera\n+ [문갑을 당긴다] -> a06_t7_cabinet\n+ [그냥 나간다] -> a06_t8\n\n=== a06_t7_camera ===\n들었다. 가벼웠다. 전원 버튼을 눌렀다. 아무 일도 없었다. 배터리가 없었다.\n\n뷰파인더는 유리였다. 전원이 없어도 보였다. 눈에 댔다.\n\n마루가 네모 안에 들어왔다. 기둥. 방석 둘. 문갑 모서리. 셋째 방석은 각도 밖이었다. 조금만 돌리면 들어올 텐데 돌리지 않았다.\n\n어디서 본 마루 같았고, 마루는 다 비슷하게 생겼다고 생각하는 데 한 번이 더 걸렸다.\n\n셔터를 눌렀다. 아무 소리도 안 났다. 그래도 눌렀다.\n-> fragment(6) -> a06_t8\n\n=== a06_t7_cabinet ===\n당겼다. 열리지 않았다. 다시 당겼다. 흔들리지도 않았다. 잘 만든 문갑이었다.\n\n열쇠를 가진 사람이 있을 것이다. 잃어버렸으면 이렇게 잠가 두지 않았을 테니까. 손을 뗐다.\n~ pulled_cabinet = true\n-> a06_t8\n\n=== a06_t8 ===\n댓돌. 신발 셋. 내 것을 신었다. 다른 하나는 그대로. 셋째도 그대로. 젖은 돌도 그대로였다.\n\n마당은 검었고, 그게 다였다. 대문 쪽으로 돌아섰다. 뒤에서 전화가 울렸다. 문갑 위. 한 번 더.\n\n+ [받는다] -> a06_t8_a\n+ [받지 않는다] -> a06_t8_b\n\n=== a06_t8_a ===\n마루로 되돌아가 받았다.\n\n{\n- sibling_memory >= 6:\n    -> a06_t8_voice\n- else:\n    -> a06_t8_silent\n}\n\n=== a06_t8_voice ===\n{\n- sibling_memory >= 12:\n    -> a06_t8_exact\n- else:\n    -> a06_t8_blur\n}\n\n=== a06_t8_exact ===\n{a06_phone:\n> 나가? 그래. 설거지 놔둬. 내가 해.\n- else:\n> ……안 받더니 이제 받네. 나가? 그래. 설거지 놔둬. 내가 해.\n}\n-> a06_t8_end\n\n=== a06_t8_blur ===\n{a06_phone:\n> 나가? 그래. 설거지 놔둬. 내가 해. ……맨날 내가 하지.\n- else:\n> ……안 받더니 이제 받네. 나가? 그래. 설거지 놔둬. 내가 해. ……맨날 내가 하지.\n}\n-> a06_t8_end\n\n=== a06_t8_silent ===\n-> a06_t8_end\n\n=== a06_t8_end ===\n부엌 물소리가 그쳤다. 그치고 나서야 이 집이 얼마나 조용한 집인지 알 수 있었다.\n\n댓돌. 신발. 대문.\n-> a06_clear\n\n=== a06_t8_b ===\n받지 않았다. 벨이 울리는 동안 대문까지 갔다.\n\n벨이 그쳤다. 부엌 물소리도 그쳤다. 같이 그쳤다. 잠근 사람이 있다는 뜻이었다.\n\n대문을 열었다.\n-> a06_clear\n\n=== a06_clear ===\n// 클리어. 다음 배정은 main.ink assign이 맡는다.\n-> cleared\n\n// ── 사망 knot 5종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== a06_death_a ===\n\"네.\"\n\n마당이 조용해졌다. 부른 쪽이 만족한 조용함이었다.\n\n댓돌에서 신발 벗는 소리가 났다. 한 짝. 두 짝.\n-> die(\"당신은 대답했습니다.\", calling_voice_yard)\n\n=== a06_death_b ===\n문을 열었다. 마당은 검었다. 아무도 없었다.\n\n댓돌을 봤다. 신발이 넷이었다.\n-> die(\"당신은 문을 열었습니다.\", yard)\n\n=== a06_death_c ===\n밥솥을 열었다. 밥이 있었다. 한 그릇 펐다. 김이 났다. 상에 놓았다.\n\n김 나는 밥이 셋. 부엌 물소리가 그쳤다.\n\n밥 먹자, 하고 이번엔 유리문 바로 앞에서 났다. 유리 한 장 너머.\n-> die(\"당신은 밥을 새로 떴습니다.\", fresh_rice)\n\n=== a06_death_d ===\n셋째 그릇을 들고 부엌에 갔다. 개수대에 넣었다. 돌아왔다.\n\n밥상에 밥이 하나였다. 내 것이 없었다. 방석도 둘이었다.\n-> die(\"당신은 셋째 그릇을 치웠습니다.\", cleared_place)\n\n=== a06_death_e ===\n식은 밥 앞에 앉았다. 방석이 눌리지 않았다.\n\n마당에서 야, 하는 소리가 났다. 대답하지 않았다.\n\n그런데 마당이 아니었다. 바로 옆이었다. 옆 방석에서.\n-> die(\"당신은 식은 밥 앞에 앉았습니다.\", cold_seat)\n\n// ── /INCLUDE A06.ink ──\n// ── INCLUDE A07.ink ──\n// ink/A07.ink — 앵커 A07. 대학 기숙사\n// 원본: 06-A07_대학기숙사.md (설계서 v0.2) / 07-A07_본문.md (본문 v0.1)\n// 규약: ink/A02.ink와 동일. 턴 = flat knot. 선택지는 같은 줄에 divert.\n// 사망은 별도 knot에서 -> die(\"문구\", entry) 호출. 조각은 -> fragment(n) -> 다음knot.\n// 성별(규칙서·턴2·턴5 겹침 — \"두 규칙서 겹침의 성별 장면\")은 지시대로 인라인\n// {gender == \"m\": 텍스트M | 텍스트F} 치환으로 처리한다(knot 분기 대신) — 큰 블록도\n// 이 파서(scripts/ink_walk.py)는 텍스트로만 스캔하므로 문제 없다.\n// 조언자 band는 {sibling_memory >= 12: ... | sibling_memory >= 6: ... | ...} 세 갈래.\n// 턴 8 호칭은 band 무관(03 §2 예외, 06-A07 §7).\n// 로컬 상태: a07_vent(OUT 아님). OUT: a07_tried_answer(A12가 읽는다) — 이 파일에서 선언.\n// IN: ledger_canteen(A05 OUT) — A05가 아직 없어 이 파일에서 임시 선언(.codex.txt 메모 참고).\n\nVAR a07_vent = false\nVAR a07_tried_answer = false   // OUT A07 → IN A12\n// ledger_canteen 은 A05.codex.txt 가 선언 (main.ink)\n\n=== a07_gate ===\n~ current_space = \"A07\"\n// A07 진입. 사망 가중치 = 2 (앵커).\n~ current_weight = 2.0\n~ a07_vent = false\n~ a07_tried_answer = false\n-> a07_intro\n\n=== a07_intro ===\n노크가 먼저였다.\n\n문이 아니었다. 벽이었다. 두 번. 똑, 똑. 그리고 아무것도 없었다.\n\n눈을 떴다. 누워 있었다. 천장이 가까웠다. 이층 침대가 아니라 그냥 천장이 낮은 방이었다.\n\n{gender == \"m\":왼쪽|오른쪽} 벽이 바로 옆이었다. 손을 뻗으면 닿는 거리. 소리는 거기서 났었다. 지금은 조용했다.\n-> a07_t1\n\n=== a07_t1 ===\n305호였다.\n\n문 안쪽에 스티커가 있었다. 비상 대피도 위에 \"{gender == \"m\":A|B}동 305호\". 대피도의 화살표는 복도로 나가서 {gender == \"m\":왼쪽|오른쪽}으로 꺾였다. 계단실.\n\n문 위에 시계. 03:47. 초침이 없었다. 이제는 그냥 확인하는 것이 됐다.\n\n침대 둘. 내가 누웠던 것과 맞은편 것. 맞은편은 매트리스만 있었다. 시트도 이불도 없었다. 누가 쓰다 나간 게 아니라 아직 아무도 안 쓴 것처럼.\n\n책상 둘. 하나에 카드키가 놓여 있었다. 옷장 둘. 문을 열어 봤다. 비어 있었다. 옷걸이도 없었다. 닫았다.\n\n창은 검었다. 천장 구석, {gender == \"m\":왼쪽|오른쪽} 벽 위에 환풍구 격자. 먼지가 앉아 있었다.\n\n문 옆 벽에 종이 한 장. 압정 하나. 코팅이 없었다. 이번엔 그냥 종이였다.\n\n{gender == \"m\":\n    생활 수칙\n\n□□대학교 생활관 A동(남자동) — 3층 입사생은 아래 수칙을 지키십시오. #rules:A07\n\n1. 룸메이트는 노크하지 않는다. 열지 않는다.\n2. 호실은 카드키로 본다. 팻말은 따르지 않는다.\n3. [구멍] #dmg:torn\n4. 물소리가 나도 샤워실에 가지 않는다.\n5. 복도 끝 사감이 번호를 물으면 답한다. #fake #dmg:tape\n6. 305호 다음은 방화문이다. 306호는 없다.\n- else:\n    생활 수칙\n\n□□대학교 생활관 B동(여자동) — 3층 입사생은 아래 수칙을 지키십시오. #rules:A07\n\n1. 룸메이트는 두 번 노크한다. 두 번에만 연다.\n2. 팻말이 바뀌면 팻말이 맞는 호실로 옮긴다. #fake #dmg:tape\n3. 방화문은 열지도 닫지도 넘지도 않는다.\n4. [구멍] #dmg:torn\n5. 복도 사람이 번호를 물어도 답하지 않는다.\n6. 305호 앞은 방화문이다. 306호는 없다.\n}\n\n여섯 항목. {gender == \"m\":3번|4번} 자리는 둥글게 뚫려 번호만 남았고, {gender == \"m\":5번|2번}은 투명 테이프 위에 인쇄체를 흉내 낸 손글씨였다 — ㄹ이 전부 조금씩 달랐다.\n\n뒷벽에서 소리가 났다. 문 여닫는 소리. 발소리. 옆방이 아니었다. 뒷벽 너머였다. 이 건물의 벽은 수칙 종이만큼 얇았다.\n+ [외시경을 본다] -> a07_peep\n+ [카드키를 본다] -> a07_card\n+ [맞은편 침대를 본다] -> a07_bunk\n\n=== a07_peep ===\n복도. 천장 등이 켜져 있었다. 맞은편에 문. 팻말이 없었다. 세탁실이거나, 팻말이 없는 방이거나.\n\n{gender == \"m\":왼쪽|오른쪽}으로 시야가 끝나는 데 계단실 입구가 있었다. 벽에 층 표지. 2.\n\n그 앞에 누가 서 있었다. 등을 보이고. 돌아서지 않았다. 아는 등이었다. 식당 구석에서 벽을 보고 앉아 있던 등. {p01_canteen:그전엔 매점 셔터 아래에 있던.}\n\n{ledger_canteen: 장부 마지막 줄에 두 글자를 적고 나간 등이었다.}\n\n여기 있을 사람이 아니었다. 있을 사람이라는 게 있다면.\n-> a07_t2\n\n=== a07_card ===\n책상 위에 있었다. 앞면에 학교 마크가 있어야 할 자리가 비어 있었다. 인쇄가 빠진 게 아니라 원래 빈 마크인
