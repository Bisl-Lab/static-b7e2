 가로로 한 번. 글자 쪽은 안으로 들어갔다.\n\n못에 걸었다. 종이가 벽에 붙어 조금 흔들리다 멈췄다.\n\n종소리가 났다. 길게 한 번.\n\n문을 밀었다. 복도는 비어 있었고 문들은 다 닫혀 있었다. 어느 문 아래에도 그림자가 없었다.\n-> cleared\n\n=== b19_t4_c ===\n손에 든 것을 벽의 손글씨 옆에 나란히 들었다.\n\n1번부터 3번까지 같았다. 넷째 줄에서 갈렸다. 손으로 쓴 쪽은 아무것도 하지 말라고 했고, 인쇄된 쪽은 확인을 받으라고 했다.\n\n같은 순서지를 옮겨 적은 것인데 한 장만 달라져 있었다. 달라진 쪽은 못에 걸리고, 다음 사람이 그걸 편다.\n\n접었다. 글자 쪽을 안으로 넣어서. 못에 걸고, 압정은 건드리지 않았다.\n\n종소리가 났다. 길게 한 번.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b19_death_a ===\n\"예.\"\n\n한 마디였는데 복도 쪽이 조용해졌다. 그림자는 물러나지 않았다.\n\n> 확인했습니다. 기도자 계십니다.\n\n문은 열리지 않았다. 2번 줄에도 문을 연다는 말은 없었다. 열 이유가 없었다.\n\n유리창이 어두워졌다. 그림자가 유리를 다 채운 것이다.\n\n손안의 종이에서 아무 소리도 나지 않았다. 그런데 첫 줄이 이랬다.\n\n> 1. 이 칸에는 사람이 있습니다.\n-> die(\"당신은 문 앞에 선 것에게 대답했습니다.\", b19_standing)\n\n=== b19_death_b ===\n넷째 줄을 소리 내어 읽었다. 읽고 나서 확인을 부탁드린다고 했다.\n\n> 확인합니다.\n\n문밖에서 종이 펴는 소리가 났다. 밖에도 한 장이 있었던 것이다.\n\n목소리가 읽기 시작했다. 첫 줄부터, 내가 읽은 그대로. 순서지는 한 번만 읽고 표시를 남깁니다.\n\n넷째 줄까지 왔을 때 그 줄은 내가 읽은 문장이 아니었다. 읽은 사람이 문밖에 있어서였다.\n\n내 손의 종이는 이제 세 줄이 남의 순서였다.\n-> die(\"당신은 바뀐 줄을 소리 내어 읽었습니다.\", b19_line5)\n\n=== b19_death_c ===\n접기 전에 폈다. 네 줄이 있었다.\n\n첫 줄이 달랐다.\n\n> 1. 이 칸을 쓰던 기도자는 나갔습니다. 다음 사람이 앉을 때까지 칸을 지킵니다.\n\n줄 끝에 빗금이 있었다. 내가 그은 것이었다.\n\n종소리가 났다. 길게 한 번. 문은 열려 있었는데 무릎이 펴지지 않았다.\n\n복도에서 슬리퍼 소리가 났다. 문 하나를 지나 다음 문으로. 간격이 일정했다.\n-> die(\"당신은 마지막에 한 번 더 읽었습니다.\", b19_readagain)\n\n// ── /INCLUDE B19.ink ──\n// ── INCLUDE B20.ink ──\n// ink/B20.ink — B20. 심야 볼링장 (오락시설 × 수량이상)\n// 원본: spaces/B20_볼링장.md (§4 턴 / §6 예산 / 본문 / 사망)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b20_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편 없음(설계서 §1 표 \"·\"). 조각 없음. OUT/IN 플래그: IN 1(codex ? calling_voice, 턴 3-A).\n// 공간 로컬 변수 없음(내부 상태 0).\n// (필요 항목은 ink/B20.codex.txt 참고 — main.ink는 건드리지 않는다.)\n//\n// 메모(무조건 역참조 후보 — 문장 무변경, 원문 그대로 이식):\n// 턴3-A \"벽에 긁혀 있던 줄이 떠올랐다\" (1-C 미방문이어도 서술), 턴4 \"지난 판들과 같았다\"\n// (1-A 미방문이어도 서술), 4-C \"표시가 셋, 반납 칸까지 표시된 줄은 아직 하나\"(1-B 미방문이어도\n// 서술) — 셋 다 조건 처리 후보. 브리프 지시대로 문장은 고치지 않았다.\n\n=== b20_gate ===\n~ current_space = \"B20\"\n~ current_weight = 1.0\n-> b20_intro\n\n=== b20_intro ===\n손가락 세 개가 구멍에 들어가 있었다.\n\n빼는 데 잠깐 걸렸다. 검은 공이었다. 표면에 긁힌 자국이 많고, 무게를 찍어 둔 자리는 닳아서 숫자가 없었다.\n\n공을 레일 위에 올려놓고 발을 봤다. 붉고 흰 가죽 신발. 밑창이 매끄러웠다.\n-> b20_t1\n\n=== b20_t1 ===\n볼링장이었다.\n\n레인이 벽 끝까지 늘어서 있었다. 조명이 켜진 건 하나였다. 어프로치 위 표시등에 7이 떠 있었다. 나머지는 어두웠고, 어두운 쪽에는 핀도 서 있지 않았다.\n\n레인 위쪽에 모니터가 매달려 있었다. 점수판이었다. 줄이 셋이었다.\n\n카운터 뒤 벽에 시계가 걸려 있었다. 03:47. 초침이 없었다.\n\n카운터 유리에 종이가 한 장 붙어 있었다.\n\n심야 이용 안내\n\n심야 운영 시간에는 관리 인원이 상주하지 않습니다. 아래는 이용객이 직접 지키는 사항입니다. #rules:B20\n1. 순서대로 투구하며 앞 순서를 기다립니다.\n2. 30초 이상 멈춘 순서는 대신 투구합니다. #fake #dmg:tape\n3. 점수판의 순서를 지우지 않습니다.\n4. 대여화는 반납대에 벗어 둡니다.\n\n부칙. {gender == \"m\":남성용|여성용} 대여화는 A열에서 받고 반납대 A칸에 벗어 둡니다.\n\n2번 줄만 종이 위에 라벨이 한 장 더 붙어 있었고, 들뜬 가장자리 밑으로 원래 문장 끝이 비쳤다 — 끝납니다. 기다리십시오.\n\n1번과 2번을 나란히 읽었다. 하나는 기다리라 하고 하나는 대신 굴리라 했다. 대신 굴리려면 레인 위에 멈춰 선 공을 집어야 하는데, 그건 이 종이 어디에도 시켜 놓지 않은 일이었다.\n\n+ [점수판을 본다] -> b20_t1_a\n+ [신발장을 본다] -> b20_t1_b\n+ [반납구 옆 벽을 본다] -> b20_t1_c\n\n=== b20_t1_a ===\n줄이 셋이었다. 왼쪽에 1, 2, 3. 이름 칸은 아예 없었다. 번호 옆으로 프레임 칸이 열 개씩 비어 있고, 2번 줄 앞에 작은 화살표가 붙어 있었다.\n\n화면 아래쪽에 지난 판 기록이 접혀 있었다. 폈다. 판이 여럿이었다. 어느 판이든 줄이 셋이었고, 어느 판이든 3번 줄은 열 칸이 전부 0이었다.\n\n0은 굴려서 못 맞춘 것이다. 열 번을 그렇게 하는 사람은 없다.\n-> b20_t2\n\n=== b20_t1_b ===\n카운터 옆에 신발장. 칸마다 사이즈가 찍혀 있었다. 대부분 차 있었고, 빠진 칸이 둘이었다. 하나는 내가 신은 것이다.\n\n신발장 위에 공책이 얹혀 있었다. 대여 대장. 날짜 칸은 비었고 줄만 그어져 있었다. 마지막 장에 표시가 셋. 그중 반납 칸까지 표시된 줄은 하나였다.\n\n셋이 받아 갔고 하나가 돌려놨다.\n-> b20_t2\n\n=== b20_t1_c ===\n반납구 옆, 페인트가 벗겨진 자리에 볼펜 글씨가 있었다.\n\n> 비면 그냥 둬.\n\n그 밑에 다른 글씨. 못 같은 것으로 긁어서 쓴 것.\n\n> 두 번 기다렸다. 두 번 다 넘어갔다.\n\n긁은 쪽이 나중이었다. 볼펜 획 위를 지나가면서 그쪽이 파여 있었다.\n-> b20_t2\n\n=== b20_t2 ===\n스피커에서 잡음이 한 번 났다.\n\n> 7번 레인 이용객. 1프레임 시작합니다.\n\n사무적이었다. 미리 녹음해 둔 것 같지도 않았다. 그때그때 말하면서 그때그때 아무 관심이 없었다.\n\n점수판 화살표가 1번 줄 앞에 있었다.\n\n어프로치는 비어 있었다. 그런데 나무 위로 뭔가 굴러가는 소리가 났다. 무겁고 느린 소리였다. 레인 끝에서 핀이 쓰러졌다.\n\n1번 줄 첫 칸에 숫자가 찍혔다.\n\n+ [어프로치를 본다] -> b20_t2_a\n+ [반납구를 본다] -> b20_t2_b\n+ [카운터로 가 본다] -> b20_t2_c\n\n=== b20_t2_a ===\n파울 라인 앞 나무가 반들거렸다. 그 위에 미끄러진 자국이 하나 있었다. 뒤꿈치가 아니라 앞쪽이 끌린 자국이었다. 밑창 무늬가 격자였다.\n\n한쪽 발을 들어 내 밑창을 봤다. 작은 원이 여러 개였다.\n-> b20_t3\n\n=== b20_t2_b ===\n검은 공 옆으로 공이 하나 밀려 올라왔다. 붉은 공이었다.\n\n손가락 구멍 언저리가 젖어 있었다. 세 개 다.\n\n내 손은 말라 있었다.\n-> b20_t3\n\n=== b20_t2_c ===\n안쪽에 사람이 없었다. 앉을 것도 없었다.\n\n조작 패널이 하나 켜져 있었다. 레인 07 / 등록 3. 그 밑에 버튼이 셋. 순서 추가, 순서 삭제, 종료.\n\n옆에 음수대가 있었다. 꼭지에서 물이 한 방울씩 떨어져 배수구로 들어갔다. 간격이 일정했다.\n-> b20_t3\n\n=== b20_t3 ===\n화살표가 2번 줄로 왔다.\n\n반납구에서 검은 공을 집었다. 어프로치에 올라섰고, 굴렸고, 핀이 몇 개 남았다. 공이 돌아오기를 기다렸다가 한 번 더 굴렸다. 남은 것 중 하나가 더 넘어갔다.\n\n2번 줄 첫 칸에 숫자가 들어갔다. 손이 하는 일이었다.\n\n화살표가 3번 줄로 갔다.\n\n붉은 공이 레일 위로 올라왔다가 저 혼자 반납구 밖으로 굴러 나왔다. 어프로치를 지나 레인 위로 올라갔다.\n\n소리가 났다. 그러다 멎었다. 레인 중간이었다. 조명 끝에 걸린 자리에 붉은 것이 서 있었다.\n\n핀은 그대로였다. 3번 줄 첫 칸은 비어 있었다.\n\n셌다. 서른까지 세고, 계속 셌다.\n\n+ {codex ? calling_voice} [기다린다] (도감: 부르는 소리) -> b20_t3_a\n+ {not (codex ? calling_voice)} [기다린다] -> b20_t3_a\n+ [레인에 들어가 공을 집어 대신 굴린다] -> b20_death_a\n+ [카운터에서 순서 삭제를 누른다] -> b20_death_b\n\n=== b20_t3_a ===\n어프로치 뒤에 서 있었다. 발을 선 밖에 두고.\n\n스피커는 아무 말도 하지 않았다. 대신 굴리라는 말도 없었고 기다리라는 말도 없었다. 저쪽은 시키지 않은 것을 시키지 않는다.\n\n붉은 공이 움직였다. 멎었던 자리에서, 멎었던 속도로.\n\n끝까지 굴러가서 핀 사이 홈으로 빠졌다. 하나도 쓰러지지 않았다.\n\n3번 줄 첫 칸에 0이 찍혔다. 화살표가 1번 줄로 넘어갔다.\n\n벽에 긁혀 있던 줄이 떠올랐다. 두 번 다 넘어갔다.\n-> b20_t4\n\n=== b20_t4 ===\n열 번째 칸까지 갔다. 1번 줄과 2번 줄에 총점이 붙었고, 3번 줄은 열 칸이 전부 0이었다. 지난 판들과 같았다.\n\n조명이 반쯤 어두워졌다.\n\n> 7번 레인 이용 종료. 대여화 반납 바랍니다.\n\n같은 목소리, 같은 무관심이었다.\n\n+ [대여화를 벗어 반납대에 두고 나간다] -> b20_clear\n+ [신은 채로 나간다] -> b20_death_c\n+ [대여 대장을 보고 나간다] -> b20_t4_c\n\n=== b20_t4_c ===\n공책을 다시 폈다. 마지막 장에 표시가 셋, 반납 칸까지 표시된 줄은 아직 하나.\n\n내가 벗어 두면 둘이 된다. 하나는 남는다.\n\n쓸 것을 찾다가 그만뒀다. 카운터에 펜이 없었고, 있어도 어느 줄이 내 줄인지 알 수 없었다.\n-> b20_clear\n\n=== b20_clear ===\n반납대 A칸에 신발을 벗어 놓았다. 옆 칸은 비어 있었다.\n\n신발장에서 내 것을 꺼내 신었다. 빠져 있던 칸 둘 중 하나가 차 있었다. 손대지 않은 쪽이었다.\n\n출입구 쪽으로 걷는 동안 뒤에서 레인 조명이 꺼졌다. 7번이 마지막이었다.\n\n점수판은 켜져 있었다. 줄이 셋인 채로.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b20_death_a ===\n레인에 발을 디뎠다. 나무가 기름을 먹여 놓은 것처럼 미끄러웠다. 붉은 공을 두 손으로 들었다. 무거웠고 젖어 있었다.\n\n어프로치까지 들고 나와 굴렸다. 공은 끝까지 갔고 핀이 전부 넘어갔다. 3번 줄 첫 칸에 표시가 들어갔다. 그 줄에 0이 아닌 게 들어간 건 처음이었다.\n\n화살표를 봤다. 3번 줄 앞이었다. 다음 프레임이 시작됐는데도 그대로였다.\n\n반납구에서 붉은 공이 올라왔다. 손가락 구멍이 젖어 있었다. 이번엔 내 손도 젖어 있었다.\n-> die(\"당신은 다른 순서를 대신 굴렸습니다.\", b20_taken_turn)\n\n=== b20_death_b ===\n카운터로 갔다. 순서 삭제를 눌렀다. 화면이 물었다. 삭제할 순서. 3을 눌렀다.\n\n등록 2. 점수판에서 3번 줄이 사라졌다.\n\n다음 프레임이 1번 줄에서 시작해 2번 줄로 왔다. 굴렸다. 그리고 화살표가 1번 줄로 가지 않았다.\n\n2번 줄이었다. 반납구에 공이 없었다. 어프로치에 올라서지도 않았는데 다음 칸에 숫자가 찍혔다. 그리고 또 2번이었다.\n\n지운 순서는 없어지지 않는다. 어디로 갈지가 정해져 있을 뿐이다.\n-> die(\"당신은 순서를 지웠습니다.\", b20_erased_turn)\n\n=== b20_death_c ===\n신은 채로 출입구를 밀었다. 밖은 골목이었고 아스팔트였다.\n\n걸을 때마다 밑창이 나무 바닥 소리를 냈다. 아스팔트 위에서.\n\n돌아봤다. 출입구가 열려 있었고, 안쪽에 조명이 하나 켜져 있었다. 7번이었다.\n\n> 7번 레인 이용객. 대여화 반납 바랍니다.\n\n한 골목을 더 가서도 같은 크기로 들렸다. 거리와 상관이 없었다. 반납대에 벗어 두지 않은 것은 아직 레인에 있는 것이고, 판은 그렇게 센다.\n-> die(\"당신은 대여화를 신고 나갔습니다.\", b20_rental_shoes)\n\n// ── /INCLUDE B20.ink ──\n// ── INCLUDE B21.ink ──\n// ink/B21.ink — B21. 야간 관제실 (회사 × 보면안되는것)\n// 원본: spaces/B21_관제실.md (§4 턴 / §6 예산 / 본문 / 사망)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b21_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편 없음(설계서 §1 표 \"·\"). 조각 없음. OUT/IN 플래그 둘 다 0(설계서 §6).\n// 공간 로컬 변수: b21_counted(턴 2-C, 턴 3 한 문장만 바꾸고 밖으로 안 나간다). gate에서 리셋.\n// 원문의 \"*(`b21_counted`이면 한 줄 대체)*\" 메모 표기는 Ink 조건부 텍스트\n// {b21_counted: ...} 한 갈래로 옮겼다(참이면 그 문장이 추가되고, 아니면 그 자리에\n// 아무것도 나오지 않는다 — 원문에 대체 문구가 따로 없으므로 단일 분기).\n// (필요 항목은 ink/B21.codex.txt 참고 — main.ink는 건드리지 않는다.)\n\nVAR b21_counted = false\n\n=== b21_gate ===\n~ current_space = \"B21\"\n~ current_weight = 1.0\n~ b21_counted = false\n-> b21_intro\n\n=== b21_intro ===\n천장에서 물이 도는 소리가 났다.\n\n배관 하나가 방을 가로질러 지나갔고, 소리는 그 안에서 한 바퀴 돌고 잦아들었다. 배관에 노란 페인트로 스프링클러라고 적혀 있었다. 물이 어디로 가는지는 적혀 있지 않았다.\n\n손에 아크릴 액자가 들려 있었다. 얇고 가벼웠다. 모서리가 하얗게 닳아 있었다.\n-> b21_t1\n\n=== b21_t1 ===\n창이 없는 방이었다.\n\n벽 하나를 화면이 다 차지하고 있었다. 세 줄에 세 대씩, 아홉 대. 각 화면 아래 흰 라벨이 붙어 있고 라벨마다 두 자리 번호가 찍혀 있었다.\n\n화면들은 전부 켜져 있었다. 회색과 검정이 구역마다 조금씩 다른 농도로 나뉘어 있을 뿐, 무엇이 어디인지는 라벨을 읽어야 알 수 있었다.\n\n맞은편에 콘솔. 큰 화면 한 대가 따로 있었고, 그것만 내용이 계속 바뀌었다. 화면 아래쪽 구석에 번호가 떴다가 함께 바뀌었다.\n\n콘솔 위 벽에 시계. 03:47. 초침이 없었다.\n\n액자를 봤다.\n\n야간 관제 근무 지침\n\n□□빌딩 방재센터 / 시설관리팀\n\n게시 시설-14. 관제 근무자용. 근무 중 콘솔 옆에 세워 둔다. #rules:B21\n1. 이상 채널은 주화면에 고정한다. #fake #dmg:tape\n2. 배치도 순서로 순회하고 07은 올리지 않는다.\n3. 저장 영상은 재생하지 않는다.\n4. 라벨이 아니라 배치도 순번을 따른다.\n\n부칙. 항목 번호는 채널 번호와 무관하다. 07 채널은 결번이다.\n\n비고. 일지 서명란은 {gender == \"m\":왼쪽|오른쪽} 칸을 쓴다.\n\n1항만 액자 유리 바깥면에 붙은 라벨프린터 테이프였고, 기울이면 그 밑에 눌린 원문이 비쳤다 — 고정하지 않는다.\n\n2항은 07을 올리지 말라고 하고 1항은 이상한 것을 올리라고 한다. 부칙은 07이 결번이라고 한다. 없는 번호를 금지하는 조항을 굳이 쓰는 사람은 없다.\n\n+ [채널 배치도를 본다] -> b21_t1_a\n+ [인계 일지를 넘겨 본다] -> b21_t1_b\n+ [벽면 라벨과 콘솔을 살핀다] -> b21_t1_c\n\n=== b21_t1_a ===\n콘솔 옆 아크릴판 밑에 도면이 끼워져 있었다. 건물 단면에 카메라 자리가 아홉 군데, 자리마다 네모 칸.\n\n칸에 적힌 번호는 여덟 개였다. 01 지하주차장 램프. 02 지하주차장 B구역. 03 방재센터 통로. 04 화물 승강기. 05 기계실. 06 옥탑 물탱크실. 그리고 08 계단실. 09 통용문.\n\n일곱 번째 자리만 번호 칸이 비어 있었다. 지운 자국이 아니라 처음부터 비운 자리였다. 인쇄된 네모 안이 그냥 흰색이었다.\n-> b21_t2\n\n=== b21_t1_b ===\n시각 칸이 두 시간 간격으로 인쇄된 양식이었다.\n\n02:00 칸에만 두 줄이 있었다. 손이 달랐다.\n\n> 02:00 라벨 정정함. 03 자리에 07 붙임.\n> 02:00 라벨 정정 취소.\n\n뒷줄이 앞줄을 자로 그어 지웠고, 그 선이 칸 밖까지 나가 더 작은 글씨가 됐다.\n\n> 일곱 번째를 고정하지 마\n\n다음은 04:00 칸을 반으로 갈라 손으로 만든 자리였다.\n\n> 03:00 이상 채널 고정. 지침 1항에 따름.\n\n그 칸 오른쪽이 뜯겨 나가고 없었다.\n-> b21_t2\n\n=== b21_t1_c ===\n아홉 대의 라벨은 전부 같은 프린터로 뽑은 것이었다. 하나만 달랐다.\n\n왼쪽 줄 가운데 화면. 프린터 라벨 위에 종이테이프가 덧붙어 있고, 매직으로 07이라고 눌러 썼다. 테이프 가장자리로 밑에 깔린 인쇄 번호가 조금 나와 있었다. 03이었다.\n\n콘솔 상판 앞 모서리에 볼펜 자국이 있었다. 여러 번 덧그어서 상판이 파여 있었다.\n\n> 자리 말고 순서\n-> b21_t2\n\n=== b21_t2 ===\n차임이 두 번 울렸다.\n\n> 관제실. 정시. 이상 유무.\n\n낮고 짧은 목소리였다. 관제실, 다음에 아무것도 붙이지 않았다. 방을 부른 것이지 사람을 부른 것이 아니었다.\n\n+ [\"이상 없음.\"] -> b21_t2_a\n+ [응답하지 않는다] -> b21_t2_b\n+ [주화면 순회를 처음부터 세어 본다] -> b21_t2_c\n\n=== b21_t2_a ===\n\"이상 없음.\"\n\n> 확인.\n\n인터폰이 닫혔다. 이쪽이 이상 없다고 하니까 이상이 없는 모양이었다.\n-> b21_t3\n\n=== b21_t2_b ===\n대답하지 않았다. 인터폰은 닫히지 않았다.\n\n콘솔 옆 라벨프린터가 짧게 돌았다. 흰 테이프가 한 마디 나오다 멈췄다. 찍힌 것은 없었다.\n\n인터폰이 그제야 닫혔다. 번호는 나중에 찍으면 된다.\n-> b21_t3\n\n=== b21_t2_c ===\n주화면이 바뀌는 것을 세었다. 십오 초에 하나씩.\n\n01, 02, 03, 04, 05, 06. 여기까지는 아래 구석에 번호가 떴다.\n\n일곱 번째에서 번호 자리가 비었다. 화면은 다른 것들과 똑같이 회색이었고 십오 초 뒤에 08로 넘어갔다.\n\n배치도의 빈 칸이 화면에서도 빈 칸이었다. 자리가 없는 게 아니라 번호가 없는 것이다.\n~ b21_counted = true\n-> b21_t3\n\n=== b21_t3 ===\n주화면이 넘어가지 않았다.\n\n십오 초가 지나고, 또 십오 초가 지났다. 아래 구석의 번호 자리가 비어 있었다.\n\n배치도를 봤다. 번호 칸이 빈 자리는 하나뿐이었다. 지금 멈춘 것이 그 자리다.\n\n{b21_counted: 아까 세었을 때 여섯 다음에 왔던 그 화면이었다.}\n\n> 관제실. 이상 채널 고정 확인 바람.\n\n1항이 그 말을 하고 있었다. 2항은 반대를 말하고 있었다. 둘 중 하나는 유리 바깥면에 붙어 있다.\n\n+ [고정 키를 누른다] -> b21_death_a\n+ [순회 키를 눌러 다음으로 넘긴다] -> b21_t3_b\n+ [저장 영상으로 그 채널을 되감아 본다] -> b21_death_b\n\n=== b21_t3_b ===\n순회 키를 눌렀다.\n\n2항은 배치도 순서로 순회하라고 했다. 정지된 쪽은 이미 순회였으니, 넘기는 것은 순서를 바꾸는 게 아니라 되돌리는 것이었다.\n\n화면이 08로 넘어갔다. 09, 01, 02. 십오 초에 하나씩. 눈금이 다시 돌기 시작한 것 같았다.\n\n인터폰은 같은 말을 두 번 더 했다. 세 번째는 없었다.\n\n일지에 채널 번호를 적었다. 시각은 적지 않았다. 벽시계가 인쇄된 칸의 어느 시각과도 이어지지 않았다.\n-> b21_t4\n\n=== b21_t4 ===\n순회가 한 바퀴를 돌았다.\n\n빈 번호 자리가 다시 왔다가 십오 초 뒤에 넘어갔다. 이번에는 멈추지 않았다.\n\n차임이 울리지 않았다. 목소리만 먼저 왔다.\n\n> 관제실. 07 상태 보고 바람.\n\n07을 보고하려면 07을 봐야 한다. 보는 순간 2항이 깨진다. 4항은 07의 판별을 라벨이 아니라 배치도 순번으로 하라고 했고, 순번으로 판별하는 것과 화면으로 확인하는 것은 다른 일이다.\n\n부칙에는 07이 결번이라고 적혀 있었다. 결번의 상태를 묻는 것은 지침 어디에도 없는 절차였다.\n\n벽면 왼쪽 줄 가운데에서 매직으로 쓴 07이 이쪽을 향하고 있었다. 4항이 그것 때문에 있는 항목이었다.\n\n+ [07을 확인하고 보고한다] -> b21_death_c\n+ [\"07은 결번입니다.\"] -> b21_t4_b\n\n=== b21_t4_b ===\n\"07은 결번입니다.\"\n\n말하면서 콘솔 키패드만 봤다. 숫자가 열두 개 있었고 그중 0과 7이 다른 키보다 반들거렸다.\n\n인터폰이 한참 조용했다.\n\n> 확인.\n-> b21_clear\n\n=== b21_clear ===\n주화면이 계속 돌았다.\n\n01부터 09까지, 중간에 번호 없는 자리를 하나 끼운 채로. 그 자리에서 화면은 항상 십오 초만 있었고 늘 다음으로 넘어갔다.\n\n벽면 아홉 대는 처음과 같았다.\n\n> 관제실. 근무 종료.\n\n일지에 인계를 적었다. 이상 없음, 순회 정상. 손이 멈춘 김에 한 줄 더 적었다.\n\n> 라벨 정정하지 말 것\n\n적어 놓고 보니 앞사람이 여백에 쓴 것과 같은 자리, 같은 크기였다. 이 일지에는 줄 밖에 쓰는 칸이 따로 없는데도 그랬다.\n\n문을 열었다. 방재센터 복도는 밝았고 지하 2층 표지가 붙어 있었다.\n\n나오면서 벽면을 한 번 더 봤다. 왼쪽 줄 가운데 화면의 종이테이프가 반쯤 떨어져 말려 있었다. 밑에서 03이 나와 있었다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b21_death_a ===\n고정 키를 눌렀다.\n\n그다음에 대해서는 적을 것이 없다. 화면은 십오 초 뒤에도 넘어가지 않았고, 넘어갈 때가 되자 대신 벽면 쪽에서 뭔가가 한 칸 옮겨 갔다.\n\n배치도를 봤다. 빈 번호 칸이 일곱 번째가 아니었다. 여덟 번째로 내려가 있었다. 내가 앉은 자리가 도면에 없던 네모로 하나 늘어 있었다.\n\n인터폰이 열렸다.\n\n> 07. 상태 보고 바람.\n\n관제실, 이라고 하지 않았다.\n-> die(\"당신은 이상 채널을 고정했습니다.\", b21_seventh)\n\n=== b21_death_b ===\n목록을 열었다. 파일이 시각순으로 쌓여 있었다. 맨 위 것을 재생했다.\n\n재생 중에는 아래 구석에 번호가 뜨지 않았다. 저장된 것에는 채널이 없고 시각만 있다. 그래서 다음으로 넘길 데가 없었다.\n\n정지 키를 눌렀다. 화면은 계속 재생됐다. 순회 키를 눌렀다. 넘어갈 다음이 없었다.\n\n목록에 파일이 하나 더 생겼다. 방금 시각이었다. 지금 이 방을 저장하고 있다는 뜻이었고, 저장된 것에는 다음이 없다는 뜻이기도 했다.\n-> die(\"당신은 저장 영상을 재생했습니다.\", b21_recording)\n\n=== b21_death_c ===\n확인하려고 주화면에 올렸다.\n\n\"07 이상 없음.\"\n\n> 확인 감사합니다.\n\n그 말을 근무 내내 한 적이 없었다. 감사할 일이 있으려면 이쪽이 사람이어야 한다.\n\n콘솔 옆 라벨프린터가 돌아갔다. 테이프가 한 뼘 뽑혀 나왔다. 두 자리 숫자가 찍혀 있었고, 잉크가 마르는 동안 내가 그것을 어디에 붙여야 하는지 이미 알고 있었다.\n-> die(\"당신은 07을 확인했습니다.\", b21_label)\n\n// ── /INCLUDE B21.ink ──\n// ── INCLUDE B22.ink ──\n// ink/B22.ink — B22. 제1어학실 (학교 × 수량이상)\n// 원본: spaces/B22_야자출석부.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b22_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 shard(\"문구\") -> 다음knot (B01.ink 표본과 동일 — 인자는 파편 텍스트 문자열).\n// OUT/IN 플래그 둘 다 0(설계서 §6). IN 힌트(codex ? calling_voice) 없음 — 이 방은\n// 부르는 소리 축이 아니다.\n//\n// 원본의 \"→ [선택 4]로 (A / B)\" 되돌림 루프(턴4-C)는 브리프 지시대로 `+` 선택지 +\n// 소거 조건으로 처리한다: b22_t4_c_seen 플래그가 서면 C가 다시 뜨지 않는다.\n// (필요 항목은 ink/B22.codex.txt 참고 — main.ink는 건드리지 않는다.)\n\nVAR b22_t4_c_seen = false\n\n=== b22_gate ===\n~ current_space = \"B22\"\n~ current_weight = 1.0\n~ b22_t4_c_seen = false\n-> b22_intro\n\n=== b22_intro ===\n딸깍, 하는 소리가 스물 몇 번 났다.\n\n마지막 소리까지 세지는 못했다. 세다가 눈을 떴다.\n\n손에 얇은 파일철이 있었다. 표지에 야간 자율학습 출석부.\n-> b22_t1\n\n=== b22_t1 ===\n어학실이었다.\n\n책상이 네 열, 열마다 여섯. 상판마다 손바닥만 한 스탠드가 놓여 있었다. 스물넷이 전부 켜져 있었다.\n\n앉은 사람은 그보다 적었다. 넷째 열 창가 끝이 비어 있었다. 의자는 밀어 넣어져 있고 불만 켜져 있었다.\n\n교탁 위 벽에 시계. 03:47에서 멎어 있었고, 초침이 있어야 할 자리에는 아무것도 붙어 있지 않았다.\n\n뒷벽에 아크릴 액자가 걸려 있었다.\n\n제1어학실 야간 자율학습 안내\n\n□□고등학교 교과교실 운영 #rules:B22\n1. 이름표의 성명을 읽지 않는다.\n2. 남는 책상의 이름표를 성명 칸과 대조한다. #fake\n3. 책상 하나를 남기고 앉지 않는다.\n4. 마지막 사선 뒤 이름표부터 정리한다.\n\n※ 소등 후 {gender == \"m\":남|여}자 사물함 구역은 통과할 수 없습니다.\n\n네 줄이 같은 활자였다. 덧댄 종이도, 지운 자국도 없었다. 한 번에 인쇄해서 한 번에 끼운 안내였다.\n\n그런데 1번은 읽지 말라고 했고 2번은 읽어서 대조하라고 했다. 나란히 인쇄된 두 줄이 서로 반대였다. 나중에 낀 줄이라면 자국이 남았을 텐데 자국이 없었다.\n\n책상을 하나 남기라는 것도 이미 적혀 있었다. 맞추라는 말은 어디에도 없었다. 하나 남긴 채로 두라고 했으니, 이 방에서 세는 일은 잘못이 아니었다.\n\n잘못이 될 수 있는 건 하나뿐이었다. 남는 게 어느 책상인가.\n\n+ [출석부를 편다] -> b22_t1_a\n+ [넷째 열 창가 끝 책상을 본다] -> b22_t1_b\n+ [교탁 아래를 본다] -> b22_t1_c\n\n=== b22_t1_a ===\n번호가 스물셋. 그 옆에 성명 칸이 인쇄돼 있었는데 스물세 줄이 전부 비어 있었다.\n\n오른쪽은 사선 칸이었다. 아직 하나도 없었다.\n\n여백에 볼펜으로 세 글자.\n\n> 번호까지만\n\n쓴 사람은 뒤를 잇지 않았다. 잇지 않아도 되는 문장이었다.\n-> b22_t2\n\n=== b22_t1_b ===\n이름표 꽂이가 비어 있었다. 투명한 홈만 있고 종이는 없었다.\n\n스탠드는 켜져 있었다. 상판에는 아무것도 없었다. 지우개 가루도 없었다.\n\n여기가 남는 책상이겠구나 싶었다. 4번은 마지막 사선 뒤에 정리하라고 했다. 그전까지는 어느 책상이 남는지도 정해지지 않는다는 뜻이다.\n-> b22_t2\n\n=== b22_t1_c ===\n뚜껑 없는 플라스틱 상자가 하나 들어 있었다. 비어 있었다.\n\n안쪽 바닥에 유성펜 글씨가 있었다. 상자를 기울여야 읽혔다.\n\n> 글자 쪽 아래로\n\n옆 벽에 방송 단자함. 빨간 버튼이 하나 튀어나와 있었다.\n-> b22_t2\n\n=== b22_t2 ===\n스피커가 켜졌다.\n\n> 제1어학실 감독.\n\n거기서 한 번 멈췄다. 뭔가 들어갈 자리였는데 들어가지 않았다.\n\n> 자습 종료 후 정리 완료만 회신하십시오. 인원은 회신하지 않습니다.\n\n인원은 회신하지 않는다. 그 말을 두 번 생각했다. 묻지 않겠다는 게 아니라, 물어도 소용없다는 쪽으로 들렸다.\n\n딸깍.\n\n둘째 열에서 스탠드 하나가 꺼졌다. 그 자리 사람이 가방을 들고 뒷문으로 나갔다. 문은 소리 없이 닫혔다.\n\n+ [출석부에 사선을 긋는다] -> b22_t2_a\n+ [비어 있는 책상에 앉아 기다린다] -> b22_death_a\n+ [켜진 스탠드를 센다] -> b22_t2_c\n\n=== b22_t2_a ===\n첫 칸에 사선을 그었다. 볼펜이 잘 나갔다.\n\n사선 하나, 꺼진 불 하나. 셈이 필요한 일이 아니었다. 소리를 듣고 손을 움직이면 되는 일이었다.\n-> b22_t3\n\n=== b22_t2_c ===\n스물셋이었다. 꺼진 하나를 빼면 그렇게 됐다.\n\n앉은 사람은 스물둘이었다. 하나가 더 켜져 있었다.\n\n세고 나서 잠깐 기다렸다. 아무 일도 일어나지 않았다. 스탠드도 그대로였고 문도 그대로였다.\n\n세는 게 금지된 방이 아니었다. 세도 아무것도 알 수 없는 방이었다.\n-> b22_t3\n\n=== b22_t3 ===\n딸깍이 이어졌다. 규칙적이지 않았다. 한참 없다가 둘이 붙어서 나기도 했다.\n\n사선이 늘었다. 손이 먼저 움직였다.\n\n칠판은 지워져 있었다. 지운 자국 위에 분필 글씨가 한 줄 남아 있었다. 물걸레가 닿지 않은 구석이었다.\n\n> 학교에 있을 사람\n-> shard(\"학교에 있을 사람\") -> b22_t3_body\n\n=== b22_t3_body ===\n넷째 열 창가 끝을 봤다.\n\n사람이 앉아 있었다. 고개를 숙이고 있었고 스탠드가 켜져 있었다. 아까 비어 있던 자리였다.\n\n대신 둘째 열 가운데가 비어 있었다. 의자가 반듯하게 밀어 넣어져 있고 불은 켜져 있었다.\n\n남는 책상이 옮겨 다녔다. 수는 하나도 달라지지 않았다.\n\n+ [지금 비어 있는 책상을 미리 정리한다] -> b22_death_c\n+ [교탁 상판의 긁힌 자국을 본다] -> b22_t3_b\n+ [사선과 스탠드를 계속 대조한다] -> b22_t3_c\n\n=== b22_t3_b ===\n출석부를 내려놓다가 상판 모서리의 흠집을 봤다. 컴퍼스 끝으로 긁어 판 글씨였다. 각도를 바꾸니 읽혔다.\n\n> 읽으면 대답하게 된다\n\n여백의 번호까지만. 상자 바닥의 글자 쪽 아래로. 필체가 셋 다 달랐고 하는 말은 셋 다 같았다.\n\n안내에서 읽으라고 시키는 항목은 2번 하나였다. 그런데 성명 칸은 스물세 줄이 전부 비어 있다. 대조할 것이 없는 대조를 시키는 줄이었다.\n\n4번은 이름표부터 엎어 넣으라고 순서까지 정해 놓았다. 2번을 먼저 하면 그 순서는 쓸 데가 없다.\n\n목적은 대조가 아니었다. 그 한 줄이 뭘 원하는지는 알 것 같았다.\n-> b22_t4\n\n=== b22_t3_c ===\n사선 열여덟. 켜진 스탠드 여섯. 스물넷에서 열여덟을 빼면 여섯이었다.\n\n앉은 사람은 다섯이었다.\n\n한 번도 틀린 적이 없었다. 매번 하나가 남았고, 매번 다른 자리가 남았다.\n-> b22_t4\n\n=== b22_t4 ===\n마지막 딸깍이 났다.\n\n사선을 그었다. 스물셋이었다. 번호도 스물셋이니 칸이 딱 찼다.\n\n뒷문이 닫히고 교실이 조용해졌다. 창밖 홈통으로 물 내려가는 소리가 났다. 비는 오지 않았다.\n\n켜진 스탠드는 하나였다. 셋째 열 앞에서 두 번째. 처음 비어 있던 자리도 아니고, 아까 사람이 앉아 있던 자리도 아니었다.\n\n그 책상의 꽂이에 이름표가 들어 있었다. 글자 쪽이 위였다. 고개를 조금만 숙이면 읽혔다.\n\n+ [이름표를 읽고 출석부와 대조한다] -> b22_death_b\n+ [글자를 보지 않고 상자에 넣는다] -> b22_clear\n+ {not b22_t4_c_seen} [스탠드부터 끈다] -> b22_t4_c\n\n=== b22_t4_c ===\n~ b22_t4_c_seen = true\n스위치를 눌렀다. 딸깍 소리는 났는데 불이 그대로였다.\n\n한 번 더 눌렀다. 그대로였다.\n\n4번은 이름표부터라고 적어 놓았다. 이름표, 스탠드, 의자. 순서가 적혀 있으면 그건 순서가 지켜지지 않은 적이 있다는 뜻이다.\n-> b22_t4\n\n=== b22_clear ===\n손바닥으로 이름표를 덮은 채 꽂이에서 뺐다. 뒤집지 않고 그대로 상자에 넣었다.\n\n상자 바닥의 유성펜 글씨가 이름표에 덮여 보이지 않게 됐다.\n\n스탠드를 껐다. 교실이 한꺼번에 어두워졌다.\n\n의자를 밀어 넣었다. 상판 높이가 나머지 스물셋과 같아졌다.\n\n빨간 버튼을 눌렀다.\n\n> 확인.\n\n그게 전부였다. 방송은 더 이상 멈추지 않았다. 멈출 자리가 없는 문장이었으니까.\n\n앞문으로 나왔다. 복도는 어두웠고, 사물함 구역 쪽으로는 가지 않았다.\n\n계단 앞에서 출석부를 폈다. 번호 스물셋, 사선 스물셋. 방금 정리한 책상은 어디에도 없었다.\n\n적을 칸이 없어서 적지 않았다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b22_death_a ===\n의자를 빼고 앉았다. 상판이 찼다.\n\n딸깍, 소리가 났다. 그 책상의 스탠드가 꺼졌다.\n\n출석부를 봤다. 사선이 하나 늘어 있었다. 번호 줄도 하나 늘어 있었다. 스물넷째 줄. 인쇄된 칸이 아니라 볼펜으로 그은 칸이었다.\n\n볼펜은 내 손에 있었다.\n\n3번은 책상 하나를 남기고 앉지 말라고 했다. 앉은 자리는 남는 책상이 아니다. 그러면 남는 쪽이 어디로 갔는지, 일어서기 전에 알아 버렸다.\n-> die(\"당신은 남는 책상에 앉았습니다.\", b22_empty_desk)\n\n=== b22_death_b ===\n꽂이에서 뽑아 뒤집었다. 글자가 있었다.\n\n읽는 동안에는 분명히 읽고 있었다. 다 읽고 나니 몇 글자였는지 기억나지 않았다. 기억나지 않는데도 아는 것 같았다.\n\n벽의 빨간 버튼이 저 혼자 들어갔다. 스피커가 켜졌다.\n\n> 제1어학실. 정리 완료.\n\n거기서 멈추지 않았다. 아까 비어 있던 자리에 이번에는 뭔가가 들어갔다. 방송이 그것을 또박또박 발음했다.\n\n대답하고 나서야 그게 대답이라는 걸 알았다.\n-> die(\"당신은 이름표를 읽었습니다.\", b22_nametag)\n\n=== b22_death_c ===\n둘째 열 가운데 책상의 스탠드를 껐다. 의자를 밀어 넣었다. 상자에 넣을 이름표는 없었지만 없는 대로 정리는 정리였다.\n\n남은 딸깍이 갑자기 빨라졌다. 사선을 그을 틈이 없었다. 뒷문이 몇 번 여닫히더니 교실이 비었다.\n\n켜진 스탠드는 없었다. 4번은 마지막 사선 뒤에 정리하라고 했는데 정리할 책상이 없었다.\n\n방금 정리한 둘째 열 가운데로 돌아갔다. 밀어 넣은 의자가 도로 빠져 있었다.\n\n비었던 꽂이에 이름표가 꽂혀 있었다. 글자 쪽이 위였다. 고개를 숙이지 않아도 읽히는 높이였다.\n-> die(\"당신은 정해지기 전에 정했습니다.\", b22_order)\n\n// ── /INCLUDE B22.ink ──\n// ── INCLUDE B23.ink ──\n// ink/B23.ink — B23. 불침번 교대 (군대 × 시간이상)\n// 원본: spaces/B23_불침번.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b23_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 shard(\"문구\") -> 다음knot (B01.ink 표본과 동일).\n//\n// 성별 2단계(브리프 지시, A09.ink 표본과 동일 관례): 턴3(원본 #### 3-m/3-f)은\n// knot 둘 + 선택지 조건 `* {gender == \"m\"} …` / `* {gender == \"f\"} …` 로 분기한다.\n// 다른 자잘한 치환(수칙 3번, 턴4 두 번째 호명, 사망 (b))은 인라인\n// {gender == \"m\":…|…}.\n//\n// 공간 로컬 변수: b23_unasked(턴2-C, 턴4 한 문장만 바꾸고 밖으로 안 나간다),\n// b23_t4_c_seen(턴4-C 되돌림 루프 소거용, 브리프 지시대로 `+` 선택지 + 소거 조건).\n// gate에서 둘 다 리셋.\n// OUT 플래그 0(설계서 §6). IN 1 — `codex ? calling_voice` (턴4-B 선택지 힌트).\n// (필요 항목은 ink/B23.codex.txt 참고 — main.ink는 건드리지 않는다.)\n\nVAR b23_unasked = false\nVAR b23_t4_c_seen = false\n\n=== b23_gate ===\n~ current_space = \"B23\"\n~ current_weight = 1.0\n~ b23_unasked = false\n~ b23_t4_c_seen = false\n-> b23_intro\n\n=== b23_intro ===\n손전등이 손에 쥐여 있었다.\n\n자루가 미지근했다. 오래 쥐고 있던 사람의 온도였다. 눈은 그다음에 떴다.\n\n복도였다. 바닥에 노란 페인트로 네모가 그려져 있고 그 안에 서 있었다. 네모 안쪽에 같은 페인트로 근무 위치.\n\n왼쪽에 미닫이문. 반쯤 열려 있었고 안은 어두웠다. 숨소리가 여럿 났다. 몇인지 세지는 않았다. 세라고 적힌 데가 없었다.\n\n벽에 시계. 03:47. 초침이 꽂혀 있어야 할 축에 아무것도 없었다.\n\n시계 옆 벽에 페인트 스텐실로 찍힌 수칙이 있었다.\n\n불침번 근무 수칙 #rules:B23\n1. 순번을 듣고 아래 칸에만 넘긴다.\n2. 오지 않으면 가까운 침상을 깨운다. #fake #dmg:tape\n3. {gender == \"m\":발치를 두 번 두드려 깨운다.|손전등을 두 번 깜빡여 깨운다.}\n4. 두 번째 호명에는 일어나지 않는다.\n\n2번 자리만 벽이 아니라 압정으로 붙인 종이였고, 그 아래로 페인트 획 끝이 나와 있었다.\n\n2번은 가까운 침상을 깨우라고 했고, 1번은 아래 칸에만 넘기라고 했다. 가까운 순서와 적힌 순서가 같을 이유는 없다. 둘 중 하나는 교대가 아니다.\n\n그 옆이 순번표였다. 여섯 칸.\n\n> 1　22:00\n> 2　23:20\n> 3　00:40\n> 4　02:00\n> 5　03:20\n> 6　04:40\n\n4번 칸에 사선이 그어져 있었다. 그은 기억이 없었다. 5번과 6번 칸은 비어 있었다.\n-> shard(\"04:40\") -> b23_t1\n\n=== b23_t1 ===\n+ [순번표를 자세히 본다] -> b23_t1_a\n+ [덧붙인 종이를 들춘다] -> b23_t1_b\n+ [손전등 자루를 본다] -> b23_t1_c\n\n=== b23_t1_a ===\n사선은 넘겨받은 사람이 긋는 표시였다. 1번부터 4번까지 그어져 있었고 필체가 넷 다 달랐다.\n\n표 여백에 볼펜 글씨가 있었다.\n\n> 아래 칸만\n> 번호를 먼저 듣는다\n\n그 밑에 다른 필체로, 더 눌러 쓴 글씨.\n\n> 내 순번도 있다\n\n세 줄 다 표 바깥에 적혀 있었다. 표 안에 적을 자리가 없는 사람이 쓴 것이다.\n-> b23_t2\n\n=== b23_t1_b ===\n압정을 뽑고 종이를 들췄다. 벽에 찍힌 2번이 나왔다.\n\n> 2. 오지 않으면 아래 칸을 깨운다.\n\n종이를 다시 대 봤다. 덮으니 페인트 문장은 한 글자도 보이지 않았다. 크기를 재고 자른 사람이 있었다는 뜻이다.\n-> b23_t2\n\n=== b23_t1_c ===\n자루에 매직으로 번호가 세로로 줄줄이 적혀 있었다. 넘겨받은 사람이 자기 순번을 적는 모양이었다.\n\n1 2 3 4 5 6. 다시 1 2 3 4 5 6. 그렇게 몇 바퀴.\n\n한 군데에서 4가 두 번 연달아 있었다. 두 번째 4는 획이 눌려 있었다.\n\n맨 끝도 4였다. 그 밑으로 5를 적을 자리가 남아 있었다.\n-> b23_t2\n\n=== b23_t2 ===\n미닫이 안쪽에서 소리가 났다.\n\n> 다음 근무.\n\n사무적이었다. 부르는 쪽이 아니라 알리는 쪽에 가까웠다.\n\n어둠에서 하나가 걸어 나와 노란 네모 앞에 섰다. 손전등을 들어 올리면 얼굴이 보일 것이었다. 비추라고 적힌 항목은 없었다.\n\n1번은 순번을 듣고 아래 칸에만 넘기게 되어 있었다. 그것은 아무 순번도 말하지 않았다.\n\n+ [손전등을 넘긴다] -> b23_death_a\n+ [순번을 묻는다] -> b23_t2_b\n+ [넘기지 않고 그대로 서 있는다] -> b23_t2_c\n\n=== b23_t2_b ===\n\"순번.\"\n\n잠깐 있다가 대답이 왔다.\n\n> 4번.\n\n내 칸이었다. 사선이 이미 그어진 칸이다.\n\n아래 칸은 5번이다. 4번은 아래 칸이 아니다. 1번대로 넘기지 않았다.\n\n그것이 한 걸음 물러났다. 물러나는 데 대한 항목은 없었다.\n-> b23_t3\n\n=== b23_t2_c ===\n아무 말도 하지 않았다.\n\n그것도 아무 말을 하지 않았다. 한참 그러고 있다가 어둠 쪽으로 물러났다. 묻지 않았으므로 몇 번인지는 모르는 채로 남았다.\n~ b23_unasked = true\n-> b23_t3\n\n=== b23_t3 ===\n복도가 조용해졌다.\n\n벽 속에서 물 내려가는 소리가 났다. 배수관이 그 자리를 지나는 모양이었다. 한 번 나고 그쳤다.\n\n순번표를 봤다. 4번은 02:00이고 5번은 03:20이다. 시계는 아까 그대로였다. 시계로 알 수 있는 것은 지났다는 것뿐이었다. 얼마나 지났는지는 알 수 없었다.\n\n교대자는 오지 않았다.\n\n미닫이를 밀고 침상으로 들어갔다. 머리맡 관물대마다 카드 꽂이가 있었고 카드에 순번이 적혀 있었다. 문에서 가장 가까운 자리가 3번, 안쪽 끝이 5번이었다.\n\n{gender == \"m\":\n\n    -> b23_t3_m\n\n- else:\n\n    -> b23_t3_f\n\n}\n\n=== b23_t3_m ===\n5번 카드 앞에 섰다. 담요 끝에 발이 있었다.\n\n수칙은 발치를 두 번 두드려 깨우게 되어 있다. 소리는 내지 않는다.\n\n+ [문에서 가장 가까운 자리를 깨운다] -> b23_death_b\n+ [안쪽 끝 5번 자리를 깨운다] -> b23_t3_m_ok\n\n=== b23_t3_m_ok ===\n발치를 두 번 두드렸다.\n\n담요가 움직였다. 일어나 앉는 데 시간이 걸렸다. 그것은 아무 말도 하지 않고 복도 쪽으로 나갔다. 소리를 내지 않은 것은 나였는데, 나가는 쪽도 소리를 내지 않았다.\n-> b23_t4\n\n=== b23_t3_f ===\n5번 카드 앞에 섰다. 담요 끝에 발이 있었다.\n\n수칙은 발치에서 손전등을 두 번 깜빡여 깨우게 되어 있다. 몸에는 손을 대지 않는다.\n\n+ [문에서 가장 가까운 자리를 깨운다] -> b23_death_b\n+ [안쪽 끝 5번 자리를 깨운다] -> b23_t3_f_ok\n\n=== b23_t3_f_ok ===\n발치를 향해 두 번 켰다 껐다.\n\n두 번째 불빛이 꺼지기 전에 담요가 움직였다. 일어나 앉는 데 시간이 걸렸다. 그것은 아무 말도 하지 않고 복도 쪽으로 나갔다. 손이 닿지 않았는데도 깨어났다.\n-> b23_t4\n\n=== b23_t4 ===\n노란 네모 앞에 5번이 서 있었다. 들어서기 전에 말했다.\n\n> 5번.\n\n1번대로였다.\n\n손전등을 넘겼다. 자루가 손에서 빠져나갈 때까지 미지근했다. 그것이 순번표 5번 칸에 사선을 그었다. 필체가 또 달랐다.\n\n침상으로 들어가 4번 카드가 꽂힌 자리에 누웠다. 담요가 차가웠다. 오래 비어 있던 자리의 온도였다.\n\n눈을 감고 얼마 지나지 않아 {gender == \"m\":발치가 두 번 눌렸다|눈꺼풀 위로 불빛이 두 번 지나갔다}. 깨우는 형식 그대로였다. {b23_unasked: 두 번에서 그치지 않았다. 같은 간격으로, 멈추지 않고 계속됐다.}\n\n> 다음 근무.\n\n4번은 두 번째 호명에는 일어나지 말라고 했다. 순번표에서 내 칸은 이미 지나간 칸이었다.\n\n+ [일어나 근무 위치로 간다] -> b23_death_c\n+ {codex ? calling_voice} [일어나지 않는다] (도감: 부르는 소리) -> b23_t4_b\n+ {not (codex ? calling_voice)} [일어나지 않는다] -> b23_t4_b\n+ {not b23_t4_c_seen} [눈을 감은 채 순번을 묻는다] -> b23_t4_c\n\n=== b23_t4_b ===\n일어나지 않았다.\n\n{gender == \"m\":두드림|불빛}이 몇 번 더 오다가 그쳤다. 담요 밖으로는 손을 내밀지 않았다.\n\n복도 쪽에서는 아무 일도 일어나지 않았다. 손전등은 5번이 들고 있고, 순번표의 내 칸에는 사선이 그어져 있다. 그 칸에서 할 일은 끝났다.\n\n문틀 아래로 들어오던 복도 불빛이 얇아졌다. 얇아지는 데 걸린 시간은 재지 않았다.\n-> b23_clear\n\n=== b23_t4_c ===\n~ b23_t4_c_seen = true\n\"순번.\"\n\n> 4번.\n\n내 칸이었다. 복도에서 들은 것과 같은 번호였고 같은 높이였다.\n\n번호를 듣고 나니 남는 것은 둘뿐이었다.\n-> b23_t4\n\n=== b23_clear ===\n// 원 설계서에는 이 방의 별도 \"### 클리어\" 절이 없다(턴4-B 본문이 곧 클리어 서술).\n// 문장을 새로 짓지 않고 그대로 END로 종료한다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b23_death_a ===\n손전등을 넘겼다. 자루가 그쪽 손에 들어가는 순간 차가워졌다.\n\n그것이 노란 네모 안으로 들어섰다. 순번표로 가서 4번 칸의 사선 위에 자기 사선을 겹쳐 그었다. 겹치니 그냥 X였다.\n\n침상으로 들어갔다. 4번 카드가 꽂혀 있던 꽂이가 비어 있었다. 어느 자리가 누울 자리인지 표시할 것이 없었다.\n\n복도로 나왔다. 네모 안에 4번이 서서 손전등을 들고 있었다.\n\n순번이 없으면 근무도 없고 누울 자리도 없다. 서 있는 것만 남는다.\n-> die(\"당신은 순번을 듣지 않고 넘겼습니다.\", b23_handover)\n\n=== b23_death_b ===\n{gender == \"m\":문에서 가장 가까운 자리의 발치를 두 번 두드렸다.|문에서 가장 가까운 자리의 발치를 향해 두 번 켰다 껐다.}\n\n꽂이에 3번이 꽂힌 자리였다. 3번은 00:40이고 사선은 이미 그어져 있었다.\n\n담요가 들렸다. 안은 비어 있었다. 눌린 자국도 없었다.\n\n꽂이를 다시 봤다. 카드가 3번이 아니었다. 4번이었다.\n\n마친 칸을 깨우면 그 칸은 다시 돌아온다. 누가 서든. 담요가 내려오는 동안 그 생각만 했다.\n-> die(\"당신은 마친 순번을 깨웠습니다.\", b23_finished_turn)\n\n=== b23_death_c ===\n일어나 복도로 나갔다. 노란 네모는 비어 있었고, 그 한가운데 순번 카드 한 장이 글자 쪽을 위로 하고 놓여 있었다.\n\n순번표를 봤다. 사선이 하나도 없었다. 1번부터 6번까지, 아직 아무도 근무하지 않은 표였다.\n\n손전등을 집었다. 자루가 미지근했다.\n\n한 바퀴가 다시 시작됐다. 두 바퀴째에 대해서는 벽에도 종이에도 적혀 있지 않았다.\n-> die(\"당신은 두 번째 호명에 일어났습니다.\", b23_second_watch)\n\n// ── /INCLUDE B23.ink ──\n// ── INCLUDE B24.ink ──\n// ink/B24.ink — B24. 폐점 후 창고 정리 (상점(마트) × 보면안되는것)\n// 원본: spaces/B24_마트창고.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b24_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편은 shard(\"문구\") -> 다음knot (B01.ink 표본과 동일).\n// OUT 0 / IN 0(설계서 §6 — 이 방의 판정축은 부름이 아니라 시선이라 calling_voice 힌트를\n// 걸 자리가 없다는 설계 판단).\n// 공간 로컬 변수: b24_counted(턴2-C, 턴3 한 문장만 바꾸고 밖으로 안 나간다). gate에서 리셋.\n// 원문의 마크다운 코드백틱 조건 표기 {`b24_counted`: ... | ...}는 백틱을 제거하고\n// Ink 조건부 텍스트 {b24_counted: ... | ...}로 옮겼다(문장 자체는 무변경).\n// (필요 항목은 ink/B24.codex.txt 참고 — main.ink는 건드리지 않는다.)\n\nVAR b24_counted = false\n\n=== b24_gate ===\n~ current_space = \"B24\"\n~ current_weight = 1.0\n~ b24_counted = false\n-> b24_intro\n\n=== b24_intro ===\n랙 사이에서 비닐이 부스럭거렸다.\n\n소리가 난 쪽은 왼쪽이었다. 고개를 돌리기 전에 손에 뭔가 들려 있다는 걸 알았다. 클립보드였다. 집게에 카운트 시트가 물려 있고 볼펜이 고무줄로 묶여 있었다.\n\n시트 맨 위 칸에 인쇄된 글씨. 야간 창고조({gender == \"m\":남성|여성}). 그 옆 성명 칸은 비어 있었다.\n-> b24_t1\n\n=== b24_t1 ===\n창고였다.\n\n천장이 높고 조명은 랙 위쪽에만 달려 있었다. 파렛트 랙 다섯 줄, A열부터 E열까지. 줄과 줄 사이에 통로가 넷.\n\n통로 끝마다 벽에 흰 표찰이 붙어 있었다. 그 통로를 낀 두 열 이름이 위아래로 적혀 있고, 통로 안은 어두운데 표찰만 밝았다.\n\n랙에는 등판이 없었다. 선반에 얹힌 물건 사이로 옆 통로가 조각조각 보였다. 물건이 빠진 단은 그냥 뚫려 있었다.\n\n구석에 지게차 두 대. 둘 다 충전기에 코드가 꽂혀 있었고 초록불이 켜져 있었다.\n\n벽에 시계. 03:47. 초침이 있어야 할 자리가 비어 있었다.\n\n등 뒤가 철문이었고, 안쪽에 페인트로 찍은 글씨가 있었다.\n\n야간 창고 정리 수칙\n\n물류관리 #rules:B24\n1. 걷는 동안 표찰에서 시선을 떼지 않는다.\n2. 틈을 들여다보지도 세지도 않는다.\n3. 지게차가 오므로 좌우를 확인한다. #fake #dmg:hand\n4. 감시창으로 매장을 보지 않는다.\n\n3번만 앞 절반이 매직 손글씨였고, 항목 끝 세 글자쯤이 흰 페인트로 얇게 덮여 밑의 획이 비쳤다.\n\n1번과 2번은 앞만 보라고 했다. 3번은 들어가기 전에 옆을 보라고 했다. 셋 중 둘이 한편이었다.\n\n지게차는 둘 다 코드가 꽂혀 있었다.\n\n+ [카운트 시트 뒷장을 넘긴다] -> b24_t1_a\n+ [B열 끝 기둥을 본다] -> b24_t1_b\n+ [냉장 창고 쪽으로 가 본다] -> b24_t1_c\n\n=== b24_t1_a ===\n지난 기록이 남아 있었다. 열, 단, 수량 세 칸.\n\n> C열 3단 12\n> D열 3단 12\n> C-D 사이 1\n\n세 줄 아래로는 칸만 있고 적힌 게 없었다.\n\n사이,는 열 이름이 아니다. 2번이 들여다보지도 세지도 말라고 한 자리를 앞사람은 셌다. 세려면 봐야 한다. 봤으면 뭘 봤는지 적었어야 하는데, 적은 건 1이었다.\n-> b24_t2\n\n=== b24_t1_b ===\nB열 끝 기둥에 유성펜 글씨가 있었다.\n\n> 여섯 걸음이면 끝난다. 여섯 번 다 앞을 봐라\n\n그 밑에 다른 필체로, 더 굵게.\n\n> 지게차는 안 온다\n\n두 줄 다 앉은 높이였다. 쪼그리고 앉아서 썼다는 뜻이다. 통로 입구에 앉아 있는 동안에는 걷지 않아도 된다.\n-> b24_t2\n\n=== b24_t1_c ===\n냉장 창고 문은 D열 끝에 있었다. 문틀에 성에가 두껍고, 녹은 물이 아래 배수 호스를 타고 바닥 배수구까지 갔다. 떨어지는 소리가 일정했다.\n\n그 옆이 관리자실이었다. 문은 잠겨 있었다. 옆 벽에 열쇠판이 있고 고리가 여섯 개였다. 여섯 개 다 비어 있었다.\n\n판 밑에 접힌 종이가 테이프로 붙어 있었다. 펴 봤다.\n\n> 열쇠는 나한테 없다\n-> shard(\"열쇠는 나한테 없다\") -> b24_t2\n\n=== b24_t2 ===\n인터폰에 불이 들어왔다.\n\n> 야간 창고조. C열 3단 파렛트 반출 바랍니다. 반출구는 D열 끝.\n\n사무적인 목소리였다. 창고조, 다음에 한 박자 비었다가 다음 말로 넘어갔다. 그 자리에 뭘 넣을 수 있었는데 넣지 않았다.\n\nC열과 D열 사이가 세 번째 통로였다. 통로 끝 표찰이 밝았다. 위에 C, 아래에 D.\n\n+ [표찰만 보고 걸어 들어간다] -> b24_t2_a\n+ [들어가기 전에 좌우를 확인한다] -> b24_death_a\n+ [들어가서 멈춰 서서 3단부터 센다] -> b24_t2_c\n\n=== b24_t2_a ===\n표찰 두 글자를 보고 걸었다. 기둥에는 여섯 걸음이라고 적혀 있었는데 여덟 걸음이었다. 보폭은 사람마다 다르다.\n\n걷는 동안 왼쪽 랙에서 비닐 소리가 났다. 걸음에 맞춰 났다. 멈추면 같이 멈추는지는 확인하지 않았다.\n\n파렛트에 손을 걸었다. 시선은 계속 표찰에 뒀다.\n-> b24_t3\n\n=== b24_t2_c ===\n통로 가운데서 멈췄다. 몸은 표찰 쪽으로 두고 고개만 아래로 내렸다. 3단에 종이컵 상자. 열둘.\n\n물건이 빠진 단이 눈 옆에 있었다. 뚫린 자리로 옆 통로가 통째로 보였다. 거기 파렛트가 하나 서 있는 것 같았다.\n\n서 있다,는 파렛트에 쓰는 말이 아니다.\n\n시트에는 12만 적었다.\n~ b24_counted = true\n-> b24_t3\n\n=== b24_t3 ===\n파렛트를 D열 끝까지 끌고 갔다. 반출구 셔터는 내려가 있었다. 셔터 앞에 놓으라는 지시였으니 거기까지가 근무였다.\n\n인터폰.\n\n> 야간 창고조. 반출 확인 바랍니다. C-D 사이 확인.\n\n앞의 두 문장과 같은 억양이었다. 셋째 문장만 다른 걸 시켰다.\n\n{b24_counted: 아까 세지 않은 자리다.|시트 뒷장에서 본 자리다.}\n\n2번은 틈을 들여다보지 말라고 했다. 인터폰은 확인하라고 했다. 인터폰은 벽에 붙어 있고 수칙은 문에 찍혀 있었다.\n\n+ [랙 틈으로 확인한다] -> b24_death_b\n+ [통로 입구에 서서 정면으로 확인한다] -> b24_t3_b\n+ [철문으로 돌아가 3번을 다시 본다] -> b24_t3_c\n\n=== b24_t3_b ===\n통로 입구까지 걸어가서 표찰을 보고 섰다. 그대로 통로 안을 봤다. 입구에서 보면 통로는 정면이다.\n\n바닥에 아무것도 없었다. 파렛트 자국도 없었다.\n\n확인했다고 대답하지는 않았다. 인터폰은 확인하라고 했지 보고하라고 하지 않았다.\n-> b24_t4\n\n=== b24_t3_c ===\n철문 앞까지 돌아가 3번을 코앞에서 봤다.\n\n흰 페인트 밑의 획이 아까보다 잘 보였다. 세 글자였고, 그중 마지막 글자에 받침이 두 개 있었다.\n\n확인한다, 의 끝 글자에는 받침이 없다.\n\n앞 절반을 매직으로 쓴 사람은 뒤 절반을 덮었다. 지우지 않고 덮은 건, 지울 수 없어서였을 것이다. 스텐실은 페인트로 찍은 것이라 긁으면 벽이 같이 벗겨진다.\n-> b24_t4\n\n=== b24_t4 ===\n인터폰.\n\n> 야간 창고조. 정리 종료. 퇴근은 A·B 통로 끝 문으로.\n\n첫 번째 통로였다. 표찰에 위는 A, 아래는 B.\n\n매장 통용문 쪽이 밝았다. 손바닥만 한 감시창에 불빛이 들어와 있었다. 아까는 어두웠다. 매장 조명이 켜진 것이다.\n\n폐점한 매장에 조명이 켜질 일은 없다. 4번은 그걸 보지 말라고만 했고, 왜 켜지는지는 적어 두지 않았다.\n\n통로 입구에 섰다. 틈에서 비닐 소리가 났다. 이번엔 앞쪽이었다. 먼저 들어가 있었다.\n\n+ [감시창을 본다] -> b24_death_c\n+ [표찰만 보고 걷는다] -> b24_t4_b\n\n=== b24_t4_b ===\n표찰 두 글자만 봤다. 위에 A, 아래에 B. 여덟 걸음.\n\n넷째 걸음쯤에 왼쪽에서 나던 소리가 오른쪽으로 옮겼다. 통로를 가로지르려면 내 앞이나 뒤로 지나가야 하는데, 앞으로는 아무것도 지나가지 않았다. 뒤는 모른다.\n-> b24_clear\n\n=== b24_clear ===\n문은 열려 있었다. 열쇠 없는 문은 열 수 없고, 이 문에는 열쇠가 필요 없었다.\n\n밖은 복도였다. 형광등이 켜져 있고 끝에 계단이 있었다. 창고 쪽에서는 아무 소리도 따라 나오지 않았다.\n\n시트를 집게에서 뺐다. 열, 단, 수량은 채웠고 그 아래는 비워 뒀다.\n\n이 시트에는 사이,를 적을 칸이 없다. 앞사람은 칸을 하나 만들어서 적었다. 만들려면 먼저 봤어야 했을 것이다.\n\n끝까지 옆을 보지 않았으니, 옆에 뭐가 있었는지는 여기 적을 것이 없다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b24_death_a ===\n통로에 들어가기 전에 왼쪽을 보고 오른쪽을 봤다. 지게차는 없었다.\n\n왼쪽 통로 입구에 창고조가 하나 서 있었다. 오른쪽 통로 입구에도 하나. 둘 다 클립보드를 들고 고개를 좌우로 돌리는 중이었다.\n\n확인하는 쪽을 보면 그쪽도 확인하는 중이다. 그래서 셋 다 아직 아무 통로에도 들어가지 못했다.\n\n다음 통로 앞에서도 좌우를 확인해야 했다. 확인할 것이 늘 양쪽에 있었다.\n-> die(\"당신은 좌우를 확인했습니다.\", b24_check_sides)\n\n=== b24_death_b ===\n물건이 빠진 단으로 옆 통로가 보였다. 얼굴을 대고 봤다.\n\n틈 저쪽 통로에 창고조가 하나 서 있었다. 등을 보이고, 통로 끝 표찰을 똑바로 보고 있었다. 수칙대로였다. 수칙대로라서 이쪽을 보지 못했다.\n\n어느 쪽이 옆인지는 보는 쪽이 정한다.\n\n눈을 떼자, 등을 보이고 표찰을 보고 선 쪽이 나였다. 틈 저쪽에서 누가 얼굴을 대고 있었다. 시선을 떼면 안 되는 규칙이라 돌아볼 수 없었다.\n-> die(\"당신은 틈을 들여다봤습니다.\", b24_gap)\n\n=== b24_death_c ===\n감시창은 작아서 얼굴을 대야 보였다.\n\n매장에 조명이 들어와 있었다. 진열대가 줄줄이 서 있고 그 사이 통로가 끝까지 보였다. 통로 안은 전부 어두웠다. 창고와 같은 간격이었다.\n\n진열대 사이 어딘가에서 뭐가 움직였다. 어느 사이였는지는 짚을 수 없었다. 사이는 전부 같게 생겼다.\n\n돌아섰더니 통로 끝 표찰이 없었다. 볼 데가 없으면 남는 건 전부 옆이다.\n-> die(\"당신은 감시창으로 매장을 봤습니다.\", b24_window)\n\n// ── /INCLUDE B24.ink ──\n// ── INCLUDE C01.ink ──\n// ink/C01.ink — C01. 층간소음접수대 (주거(아파트/빌라) × 인간)\n// 원본: spaces/C01_층간소음접수대.md\n// 규약: 단일 화면 경유지(C). c01_gate -> c01_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c01_gate ===\n~ current_space = \"C01\"\n~ current_weight = 0.5\n-> c01_main\n\n=== c01_main ===\n관리사무소 야간 접수대였다. 층간소음 신고서 양식이 창구 위에 쌓여 있었다. 벽시계 바늘이 03:47에 붙박여 있었다. 접수대 옆 스피커에 신고 대기 표시등이 깜빡였다. 창밖 배수관에서 물소리가 간간이 났다. 신고서 맨 위 칸에 도장이 찍혀 있었다 — \"입주민 확인 후 응대\".\n\n규칙 #rules:C01\n> 1. 동호수 확인 못하면 문을 열지 않는다.\n> 2. 민원이 세 번째면 직접 확인한다. #fake #dmg:ink\n\n2번 항목만 잉크색이 진하고 줄 간격이 좁았다 — 나중에 끼워 넣은 글씨였다.\n\n+ [세 번째 민원을 직접 찾아간다] -> c01_a\n+ [창구에 앉아 신고서만 받는다] -> c01_b\n\n=== c01_a ===\n복도 끝까지 걸었다. 신고서의 동호수 칸을 다시 봤다. 관리사무소, 라고 적혀 있었다. 이 접수대였다.\n-> die(\"뒤를 돌아봤다. 아무도 없는 복도에서 발소리가 멎어 있었다. 다음 발소리는 내 것이 아니었다.\", c01_complainant)\n\n=== c01_b ===\n창구를 지켰다. 세 번째 신고음이 울리다 그쳤다. 신고서 칸을 비운 채 다음 근무자에게 넘겼다.\n-> cleared\n\n// ── /INCLUDE C01.ink ──\n// ── INCLUDE C02.ink ──\n// ink/C02.ink — C02. 택배보관함 (주거(아파트/빌라) × 제도)\n// 원본: spaces/C02_택배보관함.md\n// 규약: 단일 화면 경유지(C). c02_gate -> c02_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c02_gate ===\n~ current_space = \"C02\"\n~ current_weight = 0.5\n-> c02_main\n\n=== c02_main ===\n관리사무소 1층 로비, 무인 택배 보관함 앞이었다. 입주민 대상 이번 주 관리규약 공고문이 게시판에 붙어 있었다. 보관함 문에도 같은 제목의 종이가 테이프로 덧붙어 있었다. 벽시계는 03:47에서 움직이지 않았다. {gender == \"m\":점퍼|코트} 주머니에서 종이 수령증을 꺼냈다. 수령증에 찍힌 비밀번호가 손에 익지 않았다. 관리사무소 야간 근무자는 아직 오지 않았다.\n\n규칙 #rules:C02\n> 1. 문의 규약은 원본으로 안 본다.\n> 2. 비밀번호는 게시판 것만 쓴다.\n\n문에 붙은 종이만 접힌 자국이 없었다 — 오늘 처음 붙은 것이었다.\n\n+ [보관함 문에 붙은 번호로 연다] -> c02_a\n+ [게시판 원본 규약의 번호로 연다] -> c02_b\n\n=== c02_a ===\n번호가 맞았다. 문이 열렸다. 안에 있던 상자는 내 것이 아니었다.\n-> die(\"상자를 꺼냈다. 그 밑에 상자가 하나 더 있었다. 밑에도 있었다. 문은 처음 연 곳으로 다시 닫히지 않았다.\", c02_locker)\n\n=== c02_b ===\n원본 번호로 열었다. 상자를 꺼내고 문을 닫았다. 문에 붙었던 종이는 다음 날 떼어져 있었다.\n-> cleared\n\n// ── /INCLUDE C02.ink ──\n// ── INCLUDE C03.ink ──\n// ink/C03.ink — C03. 접수창구대기라운지 (추상공간(방/복도) × 제도)\n// 원본: spaces/C03_접수창구대기라운지.md\n// 규약: 단일 화면 경유지(C). c03_gate -> c03_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c03_gate ===\n~ current_space = \"C03\"\n~ current_weight = 0.5\n-> c03_main\n\n=== c03_main ===\n대기 라운지였다. 플라스틱 의자가 줄지어 있고 정면에 순번 안내 화면이 걸려 있었다. 벽시계는 03:47에서 초침 없이 멈춰 있었다. 안내문에 대기자 순번 규정이 붙어 있었다. 규정 아래쪽에 손으로 덧붙인 줄이 하나 있었다. 창구는 아직 닫혀 있었다. 대기자 몇 명이 자리를 지키고 있었다.\n\n규칙 #rules:C03\n> 1. 순번대로만 창구에 다가간다.\n> 2. 번호 2연속 뜨면 넘어간다. #fake #dmg:hand\n\n2번 줄만 안내문 본문과 필체가 달랐다 — 규정 원문에는 없던 문장이었다.\n\n+ [같은 번호가 두 번 뜨자 다음 순번으로 넘어간다] -> c03_a\n+ [같은 번호가 다시 불릴 때까지 자리를 지킨다] -> c03_b\n\n=== c03_a ===\n다음 순번으로 창구에 다가갔다. 등 뒤 의자에서 누군가 일어나는 소리가 났다.\n-> die(\"창구 앞에 섰다. 번호를 불렀다. 대답한 목소리는 창구 안쪽에서 났다. 내 목소리가 아니었다.\", c03_number)\n\n=== c03_b ===\n자리를 지켰다. 같은 번호가 세 번째로 뜨고서야 창구 불이 켜졌다. 대기자 이름이 불렸다.\n-> cleared\n\n// ── /INCLUDE C03.ink ──\n// ── INCLUDE C04.ink ──\n// ink/C04.ink — C04. 번호표발권기 (추상공간(방/복도) × 시간이상)\n// 원본: spaces/C04_번호표발권기.md\n// 규약: 단일 화면 경유지(C). c04_gate -> c04_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c04_gate ===\n~ current_space = \"C04\"\n~ current_weight = 0.5\n-> c04_main\n\n=== c04_main ===\n복도 끝 발권기 앞이었다. 번호표를 뽑자 화면에 남은 대기 시간이 떴다. 십칠 분. 벽시계는 03:47을 가리킨 채 바늘이 붙어 있었다. 잠시 후 화면을 다시 보니 대기 시간이 십구 분으로 늘어 있었다. 발권기 옆 안내문에 대기자 유의 사항이 붙어 있었다. 복도는 조용했다.\n\n규칙 #rules:C04\n> 1. 시간 늘면 새로 안 뽑는다.\n> 2. 10분 넘으면 다시 뽑는다.\n\n안내문 조항 번호가 1, 2, 4로 이어져 있었다 — 3번이 있던 자리만 비어 있었다.\n\n+ [늘어난 시간을 보고 번호표를 새로 뽑는다] -> c04_a\n+ [처음 뽑은 번호표를 쥔 채 자리를 지킨다] -> c04_b\n\n=== c04_a ===\n새 번호표를 뽑았다. 화면 시간이 다시 십칠 분으로 시작됐다. 몇 번을 뽑아도 시작 지점은 같았다.\n-> die(\"몇 번째 번호표인지 셀 수 없었다. 화면은 여전히 십칠 분이었다. 손에 쥔 번호표만 자꾸 늘어났다.\", c04_dispenser)\n\n=== c04_b ===\n손에 쥔 번호표만 보고 기다렸다. 시간은 늘었다 줄었다 하다가, 결국 0에서 멈췄다.\n-> cleared\n\n// ── /INCLUDE C04.ink ──\n// ── INCLUDE C05.ink ──\n// ink/C05.ink — C05. 대합실좌석 (추상공간(방/복도) × 수량이상)\n// 원본: spaces/C05_대합실좌석.md\n// 규약: 단일 화면 경유지(C). c05_gate -> c05_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c05_gate ===\n~ current_space = \"C05\"\n~ current_weight = 0.5\n-> c05_main\n\n=== c05_main ===\n대합실이었다. 플라스틱 좌석이 여섯 줄로 놓여 있고, 입구 안내판에 \"현재 대기자 열두 명\"이라고 떠 있었다. 세어 보니 의자에 앉은 사람은 열한 명이었다. 벽시계는 03:47에 초침 없이 멈춰 있었다. 옆자리 하나가 비어 보였는데, 앉을 때마다 다른 자리가 비어 보였다. 안내판 불빛만 은은하게 깜빡였다.\n\n규칙 #rules:C05\n> 1. 숫자 다르면 자리 안 옮긴다.\n> 2. 빈자리는 손으로 안 짚는다.\n\n의자 줄을 두 번 세어 보니 매번 한 자리씩 결과가 달랐다 — 사람이 아니라 셈이 어긋나고 있었다.\n\n+ [옆자리를 손으로 짚어 확인한다] -> c05_a\n+ [세는 것을 멈추고 안내판만 본다] -> c05_b\n\n=== c05_a ===\n손이 좌석에 닿았다. 비어 보였던 자리에 온기가 남아 있었다.\n-> die(\"손끝에 닿은 자리가 나를 마주 짚었다. 셈은 거기서 멈췄다. 나는 그 셈에 들어가 있었다.\", c05_waitingroom)\n\n=== c05_b ===\n안내판만 보며 기다렸다. 숫자가 열둘에서 열하나로, 다시 열둘로 바뀌다가 방송이 나왔다.\n-> cleared\n\n// ── /INCLUDE C05.ink ──\n// ── INCLUDE C06.ink ──\n// ink/C06.ink — C06. 사내인트라넷공지 (온라인/기기 × 규칙서자체)\n// 원본: spaces/C06_사내인트라넷공지.md\n// 규약: 단일 화면 경유지(C). c06_gate -> c06_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c06_gate ===\n~ current_space = \"C06\"\n~ current_weight = 0.5\n-> c06_main\n\n=== c06_main ===\n사내 인트라넷 공지사항 게시판 화면이었다. 이용자 지침 팝업이 떠 있었다. 화면 구석 시계 위젯이 03:47에서 넘어가지 않았다. 새로고침 없이 게시글 제목이 한 줄씩 바뀌고 있었다. 팝업 아래 작은 글씨로 예외 조항이 하나 덧붙어 있었다. 창을 끄는 버튼은 회색으로 비활성화되어 있었다.\n\n규칙 #rules:C06\n> 1. 공지 바뀌어도 새로고침 안 한다.\n> 2. '시스템' 공지는 즉시 확인한다. #fake #dmg:hand\n\n2번 조항만 존댓말 어미가 달랐다 — 지침 원문과 다른 손이 쓴 문장이었다.\n\n+ [작성자가 '시스템'인 공지를 확인 버튼으로 누른다] -> c06_a\n+ [화면을 그대로 두고 아무것도 누르지 않는다] -> c06_b\n\n=== c06_a ===\n확인 버튼을 눌렀다. 팝업이 닫히며 새 창이 하나 더 열렸다. 작성자 칸이 비어 있었다.\n-> die(\"새 창에 확인 버튼이 또 있었다. 눌렀다. 창이 또 열렸다. 이용자 사번 칸이 먼저 채워져 있었다. 내 사번이 아니었다.\", c06_notice)\n\n=== c06_b ===\n화면을 그대로 뒀다. 제목이 몇 번 더 바뀌다가 멎었다. 원래 지침 문구로 돌아와 있었다.\n-> cleared\n\n// ── /INCLUDE C06.ink ──\n// ── INCLUDE C07.ink ──\n// ink/C07.ink — C07. 무인매장관제화면 (온라인/기기 × 보면안되는것)\n// 원본: spaces/C07_무인매장관제화면.md\n// 규약: 단일 화면 경유지(C). c07_gate -> c07_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c07_gate ===\n~ current_space = \"C07\"\n~ current_weight = 0.5\n-> c07_main\n\n=== c07_main ===\n무인 매장 관제실이었다. 화면 여덟 개가 채널별로 나뉘어 있었다. 관제자 근무일지가 책상 위에 펼쳐져 있었다. 벽시계는 03:47에서 초침 없이 멈춰 있었다. 4번 채널 위에만 작은 종이 스티커가 붙어 있었다. 스피커에서 낮은 잡음이 이어졌다. 다른 채널은 재고 알림만 조용히 깜빡였다.\n\n규칙 #rules:C07\n> 1. 4번 채널은 오래 안 본다.\n> 2. 소리 나도 볼륨 안 키운다.\n\n스티커만 다른 채널과 재질이 달랐다 — 최근에 덧붙인 것이었다.\n\n+ [4번 채널 소리를 키운다] -> c07_a\n+ [화면을 넘기고 다른 채널만 본다] -> c07_b\n\n=== c07_a ===\n볼륨을 키웠다. 잡음 사이로 발소리가 섞여 들렸다. 4번 채널 안이 조금씩 밝아졌다. 화면 속 통로가 점점 가까워졌다.\n-> die(\"화면 안의 통로가 이쪽을 보고 있었다. 채널을 넘기려 했다. 손이 화면에서 떨어지지 않았다.\", c07_channel4)\n\n=== c07_b ===\n화면을 넘겼다. 다른 채널을 순서대로 확인했다. 근무일지에 넘긴 시각만 적었다. 4번 채널 스티커는 다음 근무자가 알아서 볼 것이다.\n-> cleared\n\n// ── /INCLUDE C07.ink ──\n// ── INCLUDE C08.ink ──\n// ink/C08.ink — C08. 채팅상담창구 (온라인/기기 × 흉내)\n// 원본: spaces/C08_채팅상담창구.md\n// 규약: 단일 화면 경유지(C). c08_gate -> c08_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c08_gate ===\n~ current_space = \"C08\"\n~ current_weight = 0.5\n-> c08_main\n\n=== c08_main ===\n채팅 상담 창구 화면이었다. 상담원 인사말 매크로가 입력창 위에 저장되어 있었다. 화면 우측 시계가 03:47에 멈춰 있었다. 대기 중이던 채팅창에 메시지가 하나 떴다. 인사말이 저장된 매크로와 토씨 하나까지 같았다. 상담 코드 입력칸은 비어 있었다. 이전 상담 이력 칸도 텅 비어 있었다.\n\n규칙 #rules:C08\n> 1. 먼저 인사하면 답 안 한다.\n> 2. 코드 먼저 보이면 응답한다.\n\n인사말 끝 물음표 하나만 매크로 원문과 달랐다 — 그 채팅만 다른 손이 쓴 것이었다.\n\n+ [먼저 인사를 건넨 채팅에 답한다] -> c08_a\n+ [상담 코드를 요청하고 기다린다] -> c08_b\n\n=== c08_a ===\n답장을 보냈다. 상대가 곧바로 내 말투를 그대로 돌려보냈다. 토씨 하나 다르지 않았다. 창 하나가 더 열렸다.\n-> die(\"화면에 답장이 또 떴다. 내가 쓴 것과 똑같았다. 내가 보내지 않은 말이었다.\", c08_agent)\n\n=== c08_b ===\n코드를 요청했다. 채팅창이 잠시 멈췄다가, 다른 사용자의 코드가 정상적으로 들어왔다. 응대를 마치고 창을 닫았다.\n-> cleared\n\n// ── /INCLUDE C08.ink ──\n// ── INCLUDE C09.ink ──\n// ink/C09.ink — C09. 다용도실창 (가정집 × 보면안되는것)\n// 원본: spaces/C09_다용도실창.md\n// 규약: 단일 화면 경유지(C). c09_gate -> c09_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c09_gate ===\n~ current_space = \"C09\"\n~ current_weight = 0.5\n-> c09_main\n\n=== c09_main ===\n빨래집게 통이 창틀 아래 떨어져 있었다. 주워 담다가 고개를 들 뻔했다.\n다용도실 창에는 가림막 대신 반투명 시트지가 붙어 있었다. 아래쪽 모서리가 손톱만큼 들려 있어서, 몸을 낮추면 골목이 한 줄로 보였다.\n세탁기는 탈수 중이었고 배수 호스에서 물소리가 이어졌다. 거주자 수칙은 냉장고 옆에 자석으로 붙어 있었다.\n벽시계는 03:47을 가리켰다.\n\n규칙 #rules:C09\n> 1. 창밖 안 본다. 시트지 손대지 않는다.\n> 2. 알림음 울리면 곧장 나간다.\n\n수칙 종이 뒷면에 연필로 \"알림음보다 먼저 나가라\"라고 적혀 있었다.\n\n+ [시트지 들린 틈으로 골목을 내다본다] -> c09_a\n+ [알림음이 울리기 전에 문을 열고 나간다] -> c09_b\n\n=== c09_a ===\n골목에는 아무도 없어야 했는데, 창을 향해 선 사람의 뒷모습이 보였다. 거주자인 나를 등지고 선 게 아니라, 창 안쪽을 마주 보고 서 있었다.\n-> die(\"돌아섰을 때 창은 이미 나를 보고 있었다. 시트지는 들린 채로, 반대편에서.\", c09_liftedsheet)\n\n=== c09_b ===\n세탁기 탈수음이 뚝 끊기기 전에 문을 열었다. 알림음은 끝내 울리지 않았고, 복도로 나온 뒤에도 등 뒤에서 배수 소리만 이어졌다.\n-> cleared\n\n// ── /INCLUDE C09.ink ──\n// ── INCLUDE C10.ink ──\n// ink/C10.ink — C10. 세대수호칭 (가정집 × 부르는것)\n// 원본: spaces/C10_세대수호칭.md\n// 규약: 단일 화면 경유지(C). c10_gate -> c10_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c10_gate ===\n~ current_space = \"C10\"\n~ current_weight = 0.5\n-> c10_main\n\n=== c10_main ===\n초인종이 두 번 울렸다. 인터폰 화면에는 택배도 이웃도 없이 복도만 비어 있었다.\n스피커에서 \"1204호, 확인 부탁드립니다\"라는 말이 나왔다. 관리사무소 수칙에는 거주자를 세대수로만 부른다고 적혀 있었다.\n그런데 문 밖에서 다른 목소리가 이름을 불렀다. 정확한 이름이었다.\n거실 시계는 03:47, 초침이 없는 시계였다.\n\n규칙 #rules:C10\n> 1. 화면 확인 후, 안 보이면 무응답.\n> 2. 이름 부르면 절대 답 안 한다.\n\n수칙 하단에 다른 필체로 \"이름을 안다고 다 아는 게 아니다\"라고 적혀 있었다.\n\n+ [\"네, 맞아요\" 하고 이름에 대답한다] -> c10_a\n+ [대답 대신 세대수를 다시 확인한다] -> c10_b\n\n=== c10_a ===\n대답하는 순간 복도의 발소리가 문 앞에서 멎었다. 문틈 아래 그림자가 하나에서 둘로 늘었다.\n-> die(\"그림자가 둘로 늘어난 뒤, 문을 두드리는 소리는 내 쪽에서 났다.\", c10_namingvoice)\n\n=== c10_b ===\n세대수를 다시 확인하니 인터폰 화면은 여전히 비어 있었다. 이름을 부르던 목소리도 함께 사라졌다.\n-> cleared\n\n// ── /INCLUDE C10.ink ──\n// ── INCLUDE C11.ink ──\n// ink/C11.ink — C11. 마감방송 (상업시설 × 흉내)\n// 원본: spaces/C11_마감방송.md\n// 규약: 단일 화면 경유지(C). c11_gate -> c11_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c11_gate ===\n~ current_space = \"C11\"\n~ current_weight = 0.5\n-> c11_main\n\n=== c11_main ===\n벽시계가 03:47을 가리켰다. 초침은 원래 없는 시계였다.\n백화점 마감 점검 중이었다. 매장 전체가 소등돼 있었고, 진열대 조명만 구역별로 하나씩 남아 있었다.\n천장 스피커에서 익숙한 목소리가 나왔다. 같은 층에서 일하는 직원의 목소리였다. 마감 인사말을 하고 있었는데, 순서가 평소와 달랐다. 늘 조명부터 확인하라던 사람이 이번엔 문단속부터 말했다.\n마감 체크리스트는 계산대 옆에 코팅되어 걸려 있었다.\n\n규칙 #rules:C11\n> 1. 순서 바뀐 방송은 안 따른다.\n> 2. 다른 말 붙으면 답 안 한다.\n\n체크리스트 마지막 줄만 코팅 안쪽이 아니라 코팅 위에 스티커로 덧붙어 있었다.\n\n+ [방송이 시키는 대로 문단속부터 확인하러 간다] -> c11_a\n+ [체크리스트대로 조명 확인을 먼저 한다] -> c11_b\n\n=== c11_a ===\n문단속을 확인하러 가는 사이, 스피커가 한 번 더 인사말을 했다. 이번엔 문장 끝에 내 이름이 붙어 있었다.\n-> die(\"이름이 붙은 인사말이 세 번째로 반복됐을 때, 대답한 것은 내 목소리였다.\", c11_closinggreeting)\n\n=== c11_b ===\n조명 구역을 하나씩 확인하는 동안 스피커가 잠잠해졌다. 마지막 조명을 끄자 방송은 원래 순서로 돌아와 있었다.\n-> cleared\n\n// ── /INCLUDE C11.ink ──\n// ── INCLUDE C12.ink ──\n// ink/C12.ink — C12. 마감정산 (상업시설 × 심리)\n// 원본: spaces/C12_마감정산.md\n// 규약: 단일 화면 경유지(C). c12_gate -> c12_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c12_gate ===\n~ current_space = \"C12\"\n~ current_weight = 0.5\n-> c12_main\n\n=== c12_main ===\n정산표를 카운터에 펼쳤다. 손님은 이미 없었다.\n프랜차이즈 매뉴얼에는 마감 근무자가 지켜야 할 항목이 정리돼 있었다. 벽시계는 03:47, 초침이 없는 시계였다.\n포스기 화면에 뜬 금액과 손으로 적어둔 메모 속 금액이 달랐다. 어느 쪽을 먼저 적었는지 기억이 나지 않았다.\n정수기 옆에서 물소리가 났다. 잠기지 않은 수도였다.\n\n규칙 #rules:C12\n> 1. 정산은 화면 숫자만 믿는다.\n> 2. 시재는 직접 세어 대조한다.\n\n매뉴얼 여백에 \"메모가 화면보다 먼저 나올 때는 세지 마라\"라고 누가 적어놓았다.\n\n+ [메모를 믿고 시재를 다시 센다] -> c12_a\n+ [포스기 화면 숫자만 보고 정산을 마친다] -> c12_b\n\n=== c12_a ===\n세는 동안 숫자가 자꾸 헷갈렸다. 다 세고 나니 메모 속 금액과 완벽히 같아져 있었다. 화면 숫자만 달랐다.\n-> die(\"정산이 끝난 뒤에도 메모는 그대로 있었다. 방금 세었던 숫자로, 내 글씨로.\", c12_earlymemo)\n\n=== c12_b ===\n화면 숫자를 그대로 옮겨 적었다. 메모는 접어서 쓰레기통에 넣었다.\n-> cleared\n\n// ── /INCLUDE C12.ink ──\n// ── INCLUDE C13.ink ──\n// ink/C13.ink — C13. 접수시각 (관공서 × 시간이상)\n// 원본: spaces/C13_접수시각.md\n// 규약: 단일 화면 경유지(C). c13_gate -> c13_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c13_gate ===\n~ current_space = \"C13\"\n~ current_weight = 0.5\n-> c13_main\n\n=== c13_main ===\n접수 도장이 책상 위에 놓여 있었다. 잉크가 아직 덜 말라 있었다.\n동사무소 야간 당직자 자리였다. 민원 접수함에는 낮에 처리하지 못한 서류 몇 장이 남아 있었다.\n벽시계는 03:47을 가리켰다. 그런데 방금 찍힌 접수증에는 04:15라는 시각이 도장으로 찍혀 있었다.\n당직자 수칙은 창구 유리에 코팅되어 붙어 있었다.\n\n규칙 #rules:C13\n> 1. 시각은 벽시계 보고 적는다.\n> 2. 시각 다르면 접수 중단한다.\n\n수칙 아래에 다른 글씨체로 \"도장이 먼저 오면 시계는 늦는다\"라고 적혀 있었다.\n\n+ [도장에 찍힌 04:15를 접수증에 적는다] -> c13_a\n+ [벽시계를 보고 그 시각을 적은 뒤 접수를 중단한다] -> c13_b\n\n=== c13_a ===\n04:15라고 적자 접수함에 서류가 한 장 더 늘어 있었다. 아직 받지 않은 민원이었다.\n-> die(\"다음 접수증에도 04:15가 찍혀 있었다. 이번엔 내가 도장을 든 기억이 없었다.\", c13_earlystamp)\n\n=== c13_b ===\n벽시계가 가리키는 시각을 그대로 적고 창구를 닫았다. 시계는 그 뒤로 움직이지 않았다.\n-> cleared\n\n// ── /INCLUDE C13.ink ──\n// ── INCLUDE C14.ink ──\n// ink/C14.ink — C14. 라인구획 (산업시설 × 공간왜곡)\n// 원본: spaces/C14_라인구획.md\n// 규약: 단일 화면 경유지(C). c14_gate -> c14_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n// 사망 판단: 사망문구 \"다섯 번째 표지판이 나타났을 때, 배치도에는 여전히 넷까지만 적혀 있었다\"는\n// B(표지판이 순서대로 나타남)의 연속. 도감도 \"종이보다 많이 세면 하나가 더 생긴다\"로 B를 잇는다.\n\n=== c14_gate ===\n~ current_space = \"C14\"\n~ current_weight = 0.5\n-> c14_main\n\n=== c14_main ===\n컨베이어 벨트가 멈추는 소리가 났다. 야간 조 작업자는 나 혼자였다.\n공장 벽에는 오늘 자 라인 배치도가 붙어 있었다. 구획은 1라인부터 4라인까지, 늘 같은 순서로 적혀 있었다.\n그런데 방금 지나온 통로에서는 라인이 셋뿐이었다. 배치도는 넷이라고 했다.\n안전 수칙판 아래 벽시계가 03:47을 가리켰다.\n\n규칙 #rules:C14\n> 1. 구획은 배치도 번호만 따른다.\n> 2. 수가 다르면 그 자리서 기다린다.\n\n배치도 뒤쪽 벽에 \"센 수는 믿지 마라. 붙은 종이만 믿어라\"라는 낙서가 있었다.\n\n+ [눈에 보이는 대로 3라인까지만 확인하고 넘어간다] -> c14_a\n+ [배치도에 적힌 대로 4라인이 나올 때까지 그 자리에서 기다린다] -> c14_b\n\n=== c14_a ===\n3라인을 넘어서자 통로가 다시 이어졌다. 뒤를 돌아보니 지나온 통로에 라인이 넷으로 늘어 있었다.\n-> cleared\n\n=== c14_b ===\n자리에 서서 기다리자 얼마 뒤 4라인 표지판이 눈앞에 나타났다. 배치도 속 순서와 정확히 같았다.\n-> die(\"다섯 번째 표지판이 나타났을 때, 배치도에는 여전히 넷까지만 적혀 있었다.\", c14_fifthline)\n\n// ── /INCLUDE C14.ink ──\n// ── INCLUDE C15.ink ──\n// ink/C15.ink — C15. 검수대맞은편 (산업시설 × 인간)\n// 원본: spaces/C15_검수대맞은편.md\n// 규약: 단일 화면 경유지(C). c15_gate -> c15_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c15_gate ===\n~ current_space = \"C15\"\n~ current_weight = 0.5\n-> c15_main\n\n=== c15_main ===\n벽시계가 03:47을 가리켰다. 초침 없는 시계였다.\n물류창고 검수대에 혼자 앉아 있었다. 컨베이어에서 상자가 하나씩 내려왔다.\n맞은편 자리에 다른 검수자가 앉아 있었다. 언제부터 있었는지 기억나지 않았다. 그쪽도 상자를 확인하고 있었다.\n검수 수칙판에는 검수자 한 명당 한 라인만 맡는다고 적혀 있었다.\n\n규칙 #rules:C15\n> 1. 자기 앞 상자만 확인한다.\n> 2. 숫자는 맞은편과 안 바꾼다.\n\n수칙판 구석에 볼펜으로 \"맞은편이 부르는 숫자는 내 숫자가 아니다\"라고 적혀 있었다.\n\n+ [맞은편 검수자가 부르는 숫자를 받아 적는다] -> c15_a\n+ [내 앞의 상자만 확인하고 숫자를 혼자 적는다] -> c15_b\n\n=== c15_a ===\n숫자를 받아 적자 맞은편 검수자가 웃었다. 그다음부터 상자는 내 쪽으로만 내려왔다.\n-> die(\"맞은편이 부르는 숫자를 세 번 받아 적은 뒤, 내 라인이 두 줄이 되어 있었다.\", c15_opposite)\n\n=== c15_b ===\n내 앞의 상자만 세는 동안 맞은편은 조용해졌다. 나중에 보니 그 자리에는 아무도 없었다.\n-> cleared\n\n// ── /INCLUDE C15.ink ──\n// ── INCLUDE C16.ink ──\n// ink/C16.ink — C16. 갱신시각 (연구시설 × 규칙서자체)\n// 원본: spaces/C16_갱신시각.md\n// 규약: 단일 화면 경유지(C). c16_gate -> c16_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c16_gate ===\n~ current_space = \"C16\"\n~ current_weight = 0.5\n-> c16_main\n\n=== c16_main ===\n실험대 앞에 앉아 안전수칙판을 펼쳤다. 항목마다 오른쪽 여백에 작은 글씨로 갱신 시각이 찍혀 있었다.\n연구원은 나 하나였다. 실험실 조명은 비상등만 켜져 있었다.\n벽시계는 03:47이었다. 수칙판 다섯 번째 항목의 갱신 시각은 04:02라고 찍혀 있었다. 아직 오지 않은 시각이었다.\n\n규칙 #rules:C16\n> 1. 갱신시각 지난 항목만 따른다.\n> 2. 안 온 항목은 안 읽는다.\n\n네 번째 항목과 다섯 번째 항목이 서로 반대되는 지시를 하고 있었다.\n\n+ [다섯 번째 항목을 미리 읽고 그대로 따른다] -> c16_a\n+ [갱신 시각이 아직 안 된 항목은 건너뛰고 넷째 항목까지만 따른다] -> c16_b\n\n=== c16_a ===\n다섯 번째 항목을 읽자마자 그 옆 여백의 시각이 지금 시각과 같아져 있었다. 방금 읽은 항목이 이미 지나간 항목이 되어 있었다.\n-> die(\"다섯 번째 항목을 따른 자리에는 어느새 여섯 번째 항목이 찍혀 있었다. 갱신 시각은 지금이었다.\", c16_futureclause)\n\n=== c16_b ===\n넷째 항목까지만 따르고 정리를 마쳤다. 다섯 번째 항목은 끝내 갱신 시각이 오지 않았다.\n-> cleared\n\n// ── /INCLUDE C16.ink ──\n// ── INCLUDE C17.ink ──\n// ink/C17.ink — C17. 관측실창 (연구시설 × 보면안되는것)\n// 원본: spaces/C17_관측실창.md\n// 규약: 단일 화면 경유지(C). c17_gate -> c17_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c17_gate ===\n~ current_space = \"C17\"\n~ current_weight = 0.5\n-> c17_main\n\n=== c17_main ===\n냉각기 팬이 낮게 돌아간다. 3층 관측실, 초침 없는 시계가 03:47을 가리키고 있다. 유리 너머 배양조는 열두 칸, 그중 한 칸에는 라벨이 없다. 관측자 근무일지 표지 안쪽에 그 칸을 다루는 방법이 두 번 적혀 있는데, 필체가 서로 다르다. 냉각기 소리 말고는 아무 기척도 없다.\n\n규칙 #rules:C17\n> 1. 확인만 하고 다시 안 본다.\n> 2. 2시간 뒤 한 번 더 확인한다. #fake #dmg:hand\n\n두 번째 항목만 잉크 색이 다르다. 나머지는 전부 인쇄고, 그 한 줄만 손으로 눌러 쓴 글씨다.\n\n+ [인쇄된 원칙대로, 라벨 없는 칸을 확인만 하고 다시 보지 않는다] -> c17_a\n+ [손으로 덧쓴 지침대로, 두 시간 뒤 그 칸을 한 번 더 확인한다] -> c17_b\n\n=== c17_a ===\n근무일지에 이상 없음을 적어 넣고, 다음 교대자를 기다린다.\n-> cleared\n\n=== c17_b ===\n두 시간이 지나 다시 유리 앞에 선다. 라벨 없는 칸을 천천히 들여다본다.\n-> die(\"시선을 든 순간, 유리 안쪽의 것이 이미 이쪽을 보고 있었다는 걸 안다.\", c17_unlabeled)\n\n// ── /INCLUDE C17.ink ──\n// ── INCLUDE C18.ink ──\n// ink/C18.ink — C18. 임시대피소 (전역/비특정 × 심리)\n// 원본: spaces/C18_임시대피소.md\n// 규약: 단일 화면 경유지(C). c18_gate -> c18_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c18_gate ===\n~ current_space = \"C18\"\n~ current_weight = 0.5\n-> c18_main\n\n=== c18_main ===\n무릎에 덮인 담요가 까끌하다. 창이 없는 대피소, 접이식 의자가 줄지어 놓여 있다. 벽에 걸린 초침 없는 시계는 03:47에서 움직이지 않는다. 안내판에는 이곳이 어느 건물 몇 층인지 적혀 있지 않다. 대피자들은 저마다 다른 경로로 여기 왔다고 말하는데, 아무도 같은 말을 하지 않는다.\n\n규칙 #rules:C18\n> 1. 30분마다 자리를 적는다.\n> 2. 자리 다르면 안 옮긴다.\n\n기둥에 누군가 손톱으로 긁어 놓은 글씨가 있다. 안내판의 화살표와 반대 방향을 가리킨다.\n\n+ [종이에 적어 둔 자리를 믿고 그대로 앉아 있는다] -> c18_a\n+ [기둥 화살표를 따라 안내판이 가리키는 방향으로 자리를 옮긴다] -> c18_b\n\n=== c18_a ===\n안내방송이 대피자 수를 세어 부르고, 맞다는 응답이 돌아온 뒤 다음 방송을 기다리게 한다.\n-> cleared\n\n=== c18_b ===\n화살표를 따라 몇 걸음 옮긴다. 발밑 바닥재가 아까와 다르게 느껴진다.\n-> die(\"돌아보니 방금 앉아 있던 자리에 이미 누군가 담요를 덮고 앉아 있다.\", c18_movedseat)\n\n// ── /INCLUDE C18.ink ──\n// ── INCLUDE C19.ink ──\n// ink/C19.ink — C19. 특별실동 (학교 × 공간왜곡)\n// 원본: spaces/C19_특별실동.md\n// 규약: 단일 화면 경유지(C). c19_gate -> c19_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c19_gate ===\n~ current_space = \"C19\"\n~ current_weight = 0.5\n-> c19_main\n\n=== c19_main ===\n문을 밀고 특별실동으로 들어선다. 복도 끝 화장실에서 물소리가 끊이지 않는다. 복도 게시판 위 초침 없는 시계가 03:47을 가리킨다. 미술실, 음악실, 과학실 순서로 팻말이 붙어 있는데, 미술실 팻말 밑으로 다른 팻말 자국이 비쳐 보인다. 재실자는 이 실동을 야간에 혼자 도는 게 오늘이 처음이 아니다.\n\n규칙 #rules:C19\n> 1. 교실 수 맞아야 계단 간다.\n> 2. 팻말 순서대로만 지킨다.\n\n미술실 팻말만 나사 자국이 두 개 더 있다. 원래 다른 이름이 붙어 있던 자리다.\n\n+ [지금 붙은 팻말 순서(미술실 → 음악실 → 과학실)대로 지나간다] -> c19_a\n+ [나사 자국에 남은 원래 순서(미술실 → 과학실 → 음악실)대로 지나간다] -> c19_b\n\n=== c19_a ===\n세 번째 문을 열자 복도가 그대로 계단으로 이어진다. 세었던 교실 수도 셋으로 맞는다.\n-> cleared\n\n=== c19_b ===\n두 번째 문을 열자 복도가 다시 처음 그 복도로 이어진다. 센 수가 갑자기 하나로 돌아간다.\n-> die(\"세 번째로 지나는 문인데, 손잡이에 처음 지난 문과 같은 손자국이 나 있다.\", c19_shiftingzone)\n\n// ── /INCLUDE C19.ink ──\n// ── INCLUDE C20.ink ──\n// ink/C20.ink — C20. 교무실당직 (학교 × 제도)\n// 원본: spaces/C20_교무실당직.md\n// 규약: 단일 화면 경유지(C). c20_gate -> c20_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c20_gate ===\n~ current_space = \"C20\"\n~ current_weight = 0.5\n-> c20_main\n\n=== c20_main ===\n교무실 벽시계는 초침이 없다. 지금 가리키는 시각은 03:47. 야간 당직 책상 위에 규정집 두 권이 나란히 펼쳐져 있다. 하나는 생활지도규정, 하나는 안전관리지침. 둘 다 소등 이후 학생을 발견했을 때를 다루는데, 결론이 반대다. 당직 교사 인수인계 칸에는 전임자가 어느 쪽을 따랐는지 적혀 있지 않다.\n\n규칙 #rules:C20\n> 1. 소등 후 발견 시 즉시 연락.\n> 2. 소등 후 연락 없이 인계한다. #fake #dmg:ink\n\n안전관리지침 표지만 인쇄가 선명하다. 생활지도규정은 종이가 누렇게 바랬다.\n\n+ [더 최근 것으로 보이는 안전관리지침대로, 연락하지 않고 인계 기록만 남긴다] -> c20_a\n+ [오래됐어도 상위 규정이라 적힌 생활지도규정대로, 보호자에게 연락한다] -> c20_b\n\n=== c20_a ===\n인계 칸에 한 줄을 적어 넣고 다음 당직에게 넘긴다. 전화기는 손대지 않는다.\n-> die(\"인계 칸에 방금 쓴 줄이 이미 적혀 있다. 필체는 분명 자신의 것인데, 쓴 기억이 없다.\", c20_handedover)\n\n=== c20_b ===\n수화기를 든다. 신호음이 평소보다 길게 이어진다.\n-> cleared\n\n// ── /INCLUDE C20.ink ──\n// ── INCLUDE C21.ink ──\n// ink/C21.ink — C21. 응급실대기 (병원 × 인간)\n// 원본: spaces/C21_응급실대기.md\n// 규약: 단일 화면 경유지(C). c21_gate -> c21_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c21_gate ===\n~ current_space = \"C21\"\n~ current_weight = 0.5\n-> c21_main\n\n=== c21_main ===\n플라스틱 의자 팔걸이가 차갑다. 응급실 대기 구역, 대기표 번호가 벽 화면에 뜬다. 복도 끝 급수대에서 물소리가 그치지 않는다. 초침 없는 시계는 03:47에 걸려 있다. 옆줄 의자에 앉은 사람이 자꾸 이쪽을 본다. 대기표를 손에 들고 있지 않다. 대기실 안은 조용했고, 아무도 이름을 부르지 않는다.\n\n규칙 #rules:C21\n> 1. 대기표 없으면 말 안 건다.\n> 2. 보호자가 물으면 접수처로 보낸다.\n\n대기실 안내문 아래, 다른 손글씨로 한 줄이 붙어 있다. \"급한 경우엔 예외.\"\n\n+ [안내문 원칙대로, 증상을 묻는 사람을 접수처로 돌려보낸다] -> c21_a\n+ [손글씨 예외를 따라, 급해 보이는 그 사람에게 증상을 알려준다] -> c21_b\n\n=== c21_a ===\n그 사람은 순순히 접수처 쪽으로 걸어간다. 대기가 다시 조용해진다.\n-> cleared\n\n=== c21_b ===\n증상을 말해 주자 그 사람이 고맙다며 옆자리에 앉는다.\n-> die(\"증상을 말해 준 순간, 그 사람 손에 들린 대기표 번호가 자신이 받은 번호와 같다는 걸 안다.\", c21_samenumber)\n\n// ── /INCLUDE C21.ink ──\n// ── INCLUDE C22.ink ──\n// ink/C22.ink — C22. 원무과접수 (병원 × 부르는것)\n// 원본: spaces/C22_원무과접수.md\n// 규약: 단일 화면 경유지(C). c22_gate -> c22_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c22_gate ===\n~ current_space = \"C22\"\n~ current_weight = 0.5\n-> c22_main\n\n=== c22_main ===\n스피커에서 안내음이 울린다. 원무과 접수 창구, 번호표를 받아 쥔다. 초침 없는 시계가 03:47을 가리키는 채로 멈춰 있다. 창구는 이름 대신 접수번호로만 부른다. 대기석에 환자 몇이 흩어져 앉아 있는데, 다들 번호표를 손에 쥐고 창구 쪽만 본다. 안내음은 매번 같은 억양으로 사무적이다.\n\n규칙 #rules:C22\n> 1. 불리는 횟수는 안 센다.\n> 2. 내 번호 아니면 답 안 한다.\n\n창구 옆 벽에 손글씨로 정정된 줄이 있다. \"번호가 두 번 연속 불리면 대답해도 됩니다.\"\n\n+ [원무과 안내문 그대로, 자신의 번호가 아니면 대답하지 않는다] -> c22_a\n+ [벽에 붙은 손글씨대로, 번호가 두 번 연속 불리자 대답한다] -> c22_b\n\n=== c22_a ===\n다른 번호가 몇 차례 더 불리고, 마침내 자신의 접수번호가 정확히, 딱 한 번 불린다.\n-> cleared\n\n=== c22_b ===\n대답하자 창구 안쪽에서 이쪽으로 오라며 조용히 다시 부른다.\n-> die(\"창구 앞 의자에 앉는 순간, 등 뒤에서 방금까지 앉아 있던 자리를 부르는 소리가 들린다.\", c22_substitute)\n\n// ── /INCLUDE C22.ink ──\n// ── INCLUDE C23.ink ──\n// ink/C23.ink — C23. 다른팀사무실 (회사 × 심리)\n// 원본: spaces/C23_다른팀사무실.md\n// 규약: 단일 화면 경유지(C). c23_gate -> c23_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c23_gate ===\n~ current_space = \"C23\"\n~ current_weight = 0.5\n-> c23_main\n\n=== c23_main ===\n낯선 자리에 노트북을 편다. 근무자는 자리 배치 공사 때문에 다른 팀 사무실에서 며칠째 야근 중이다. 벽시계는 초침이 없고, 03:47을 가리키고 있다. 도착했을 때 다른 팀 사람이 몇 명이었는지 수첩에 적어 두었다. 지금 눈으로 세어 보면 그 수가 자꾸 달라 보인다. 키보드 소리만 이어졌다.\n\n규칙 #rules:C23\n> 1. 인원수 세어 수첩에 적는다.\n> 2. 수가 달라도 자리 지킨다.\n\n수첩 속 숫자에 지운 자국이 있다. 지운 기억이 없다.\n\n+ [처음 적어 둔 숫자를 믿고 그대로 자리를 지킨다] -> c23_a\n+ [방금 눈으로 다시 센 숫자가 맞다고 여기고 수첩을 고쳐 쓴다] -> c23_b\n\n=== c23_a ===\n자정이 넘어가고, 다른 팀 사람들이 하나둘 짐을 챙겨 나간다. 나간 수가 처음 적은 수와 맞는다.\n-> cleared\n\n=== c23_b ===\n수첩을 고쳐 쓴 순간, 옆자리 사람이 언제부터 거기 있었는지 기억이 나지 않는다.\n-> die(\"고쳐 쓴 숫자를 다시 세어 보려는데, 이 사무실에 언제부터 앉아 있었는지부터 기억이 안 난다.\", c23_revisednumber)\n\n// ── /INCLUDE C23.ink ──\n// ── INCLUDE C24.ink ──\n// ink/C24.ink — C24. 출입기록게이트 (회사 × 시간이상)\n// 원본: spaces/C24_출입기록게이트.md\n// 규약: 단일 화면 경유지(C). c24_gate -> c24_main(배경+규칙+힌트) -> 선택 A/B -> 결과(사망/생존)\n\n=== c24_gate ===\n~ current_space = \"C24\"\n~ current_weight = 0.5\n-> c24_main\n\n=== c24_main ===\n게이트 옆 모니터에 뜬 시각은 03:47, 초침은 표시되지 않는다. 사원증을 대자 게이트 로그에 출입 시각이 찍힌다. 방금 찍힌 시각이 실제 시계와 다르다. 근무자는 이 시간에 혼자 남아 퇴근 기록을 남기려는 참이다. 로그 용지에 같은 시각이 두 줄로 찍혀 있다. 복도 조명은 절반만 켜져 있었고, 발소리는 어디에서도 들리지 않는다.\n\n규칙 #rules:C24\n> 1. 시각 다르면 경비실에 알린다.\n> 2. 기록 없으면 정각까지 기다린다.\n\n로그 용지를 넘겨 보면, 같은 시각이 찍힌 줄만 인쇄 농도가 진하다.\n\n+ [기록이 어긋난 걸 보고 경비실에 먼저 알린다] -> c24_a\n+ [사원증을 다시 대어 기록을 바로잡으려 한다] -> c24_b\n\n=== c24_a ===\n인터폰이 사무적으로 응답하고, 잠시 뒤 정상 시각으로 새 기록이 찍힌다.\n-> cleared\n\n=== c24_b ===\n다시 대자 로그 용지에 시각이 한 줄 더 늘어난다.\n-> die(\"게이트가 열리고, 로그 용지에는 방금 나간 시각이 이미 한 줄 먼저 찍혀 있다.\", c24_earlylog)\n\n// ── /INCLUDE C24.ink ──\n// ── INCLUDE C25.ink ──\n// ink/C25.ink — C 경유지\n// 원본: spaces/C25_발주매뉴얼.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c25_gate ===\n~ current_weight = 0.5\n~ current_space = \"C25\"\n-> c25_main\n\n=== c25_main ===\n카운터 밑 칸에서 발주 매뉴얼을 꺼냈다. 표지에 \"야간 근무자용\"이라고 찍혀 있었다. 페이지마다 수량이 인쇄돼 있었는데, 넷째 줄만 잉크 색이 달랐다. 어제는 없던 줄이었다. 위쪽 벽시계는 03:47에서 움직이지 않았다. 초침이 없었다. 카운터 위 형광등이 한 번 깜빡였다. 종이 넘기는 소리만 간간이 이어졌다.\n\n규칙 #rules:C25\n> 1. 인쇄된 숫자만 그대로 옮겨 적는다.\n> 2. 숫자가 바뀌었으면 원래대로 정정하고 서명한다.\n\n넷째 줄만 잉크가 마르지 않은 것처럼 짙었다.\n\n+ [인쇄된 숫자를 그대로 옮겨 적는다.] -> c25_a\n+ [넷째 줄을 원래 숫자로 고쳐 쓰고 서명한다.] -> c25_b\n\n=== c25_a ===\n발주서를 완성해 봉투에 넣었다. 넷째 줄은 손대지 않은 채 남았다. 봉투를 발주함에 넣고 손을 뗐다.\n-> cleared\n\n=== c25_b ===\n볼펜 끝이 종이에 닿는 순간 다른 줄들도 색이 바뀌기 시작했다. 손을 떼도 멈추지 않았다.\n-> die(\"서명을 마쳤다. 매뉴얼이 다음 장으로 저절로 넘어갔다. 거기에도 내 이름이 있었다.\", c25_correction)\n\n// ── /INCLUDE C25.ink ──\n// ── INCLUDE C26.ink ──\n// ink/C26.ink — C 경유지\n// 원본: spaces/C26_무인계산대.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c26_gate ===\n~ current_weight = 0.5\n~ current_space = \"C26\"\n-> c26_main\n\n=== c26_main ===\n무인 계산대 앞에 서 있었다. 화면에 결제 안내가 떴다. 위쪽 스피커에서 안내 음성이 나왔다. \"봉투 필요하십니까.\" 대답하지 않았는데 잠시 뒤 같은 목소리가 다시 물었다. 이번엔 말투가 달랐다. 조금 전 앞줄에 서 있던 손님의 억양이었다. 계산대 옆 안내문 밑에 근무자 호출 버튼이 있었다. 시계는 03:47에서 움직이지 않았다. 결제 대기줄 뒤로 인기척은 없었다.\n\n규칙 #rules:C26\n> 1. 화면 안내만 보고 결제한다. 대답하지 않는다.\n> 2. 두 번째 질문엔 억양 맞춰 대답해 준다. #fake #dmg:tape\n\n2번만 종이 재질이 달랐다 — 테이프 자국이 아직 마르지 않았다.\n\n+ [대답하지 않고 결제만 마친다.] -> c26_a\n+ [앞사람 억양을 따라 대답한다.] -> c26_b\n\n=== c26_a ===\n화면이 결제 완료를 표시했다. 스피커는 더 말하지 않았다.\n-> cleared\n\n=== c26_b ===\n스피커가 \"알아보셨네요\"라고 했다. 방금 내가 쓴 억양 그대로였다.\n-> die(\"영수증이 나왔다. 다음 손님 자리에 내 억양이 남았다. 화면 속 순번이 하나 더 늘어 있었다.\", c26_accent)\n\n// ── /INCLUDE C26.ink ──\n// ── INCLUDE C27.ink ──\n// ink/C27.ink — C 경유지\n// 원본: spaces/C27_배달접수처.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c27_gate ===\n~ current_weight = 0.5\n~ current_space = \"C27\"\n-> c27_main\n\n=== c27_main ===\n배달 접수처였다. 카운터 위에 전표가 여덟 장 꽂혀 있었다. 대기 줄에는 아홉 명이 서 있었다. 벽시계는 03:47, 초침이 없었다. 접수자 명찰을 목에 걸고 있었다. 창구 안쪽에서 물소리가 한 번 났다. 주방 쪽 불빛이 유난히 밝았다. 대기 줄 맨 끝 사람은 고개를 숙이고 있었다. 카운터 위 조명이 낮게 깜빡였다.\n\n규칙 #rules:C27\n> 1. 부른 번호에게만 봉지를 건넨다.\n> 2. 부족하면 안쪽에서 채워 나눠 준다. #fake #dmg:ink\n\n2번 줄만 볼펜 색이 달랐다 — 밑에 \"채우지 마라\"가 지워진 채 있었다.\n\n+ [번호를 부른 사람에게만 봉지를 건넨다.] -> c27_a\n+ [부족한 만큼 안쪽에서 받아 채운다.] -> c27_b\n\n=== c27_a ===\n여덟 번호를 다 불렀다. 아홉 번째 사람은 대답하지 않고 서 있었다.\n-> cleared\n\n=== c27_b ===\n안쪽에서 봉지 하나가 더 나왔다. 받는 순간 대기 줄이 한 명 늘어 있었다.\n-> die(\"아홉 번째 봉지를 건넸다. 받아 간 손이 접수 전표에 적힌 이름과 같았다. 내 이름이었다.\", c27_filled_bag)\n\n// ── /INCLUDE C27.ink ──\n// ── INCLUDE C28.ink ──\n// ink/C28.ink — C 경유지\n// 원본: spaces/C28_위생점검.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c28_gate ===\n~ current_weight = 0.5\n~ current_space = \"C28\"\n-> c28_main\n\n=== c28_main ===\n프랜차이즈 매장 위생 점검 중이었다. 점검자용 체크리스트에 냉장고 온도 기준이 두 번 적혀 있었다. 하나는 본사 구지침, 하나는 신지침이었다. 두 숫자가 달랐다. 벽시계는 03:47, 초침이 없었다. 주방 안쪽에서 물소리가 났다. 냉장고 모터 소리가 낮게 이어졌다. 복도 끝 조명이 낮게 웅웅거렸다. 환풍기 소리가 낮게 이어졌다.\n\n규칙 #rules:C28\n> 1. 최신 개정일 지침만 따른다. 없으면 무효다.\n> 2. 애매하면 낮은 기준으로 통과시킨다. #fake #dmg:hand\n\n2번만 손글씨였다 — 옆에 지워진 서명 자국이 있었다.\n\n+ [개정일이 찍힌 신지침을 따른다.] -> c28_a\n+ [낮은 기준으로 통과시킨다.] -> c28_b\n\n=== c28_a ===\n신지침 숫자로 기록했다. 체크리스트에 확인 도장을 찍었다. 도장이 종이에 제대로 앉았다.\n-> cleared\n\n=== c28_b ===\n낮은 쪽 숫자를 적었다. 도장 칸에 이미 확인 도장이 찍혀 있었다. 내 도장이 아니었다.\n-> die(\"서명란에 서명을 하려는데 지워졌던 서명 자국이 손 밑에서 다시 진해지고 있었다. 손을 떼도 진해졌다.\", c28_lower_side)\n\n// ── /INCLUDE C28.ink ──\n// ── INCLUDE C29.ink ──\n// ink/C29.ink — C 경유지\n// 원본: spaces/C29_야간정비고.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c29_gate ===\n~ current_weight = 0.5\n~ current_space = \"C29\"\n-> c29_main\n\n=== c29_main ===\n야간 정비고였다. 버스 세 대가 나란히 서 있었다. 각 차량 번호판 위에 벽 표찰이 붙어 있었다. 정비원 조끼 주머니에 점검표가 있었다. 벽시계는 03:47, 초침이 없었다. 가운데 차량만 실내등이 꺼진 채 창이 젖어 있었다. 정비고 조명이 한 칸씩 순서대로 꺼졌다 켜졌다. 다른 차량들은 조용히 서 있었다.\n\n규칙 #rules:C29\n> 1. 배정된 차량만 점검한다. 옆 칸은 안 본다. #dmg:hand\n> 2. 꺼진 차량은 다가가 확인하고 켜 준다.\n\n1번 줄 옆에 다른 필체로 \"가운데는 빼고\"라고 적혀 있었다.\n\n+ [배정된 차량만 점검하고 가운데 칸은 보지 않는다.] -> c29_a\n+ [실내등이 꺼진 가운데 차량으로 다가가 확인한다.] -> c29_b\n\n=== c29_a ===\n점검표에 표시를 채우고 정비고를 나왔다. 가운데 차량은 끝까지 보지 않았다.\n-> cleared\n\n=== c29_b ===\n창에 가까이 갈수록 안쪽이 더 어두워졌다. 유리에 손자국이 먼저 와 있었다.\n-> die(\"다가가서 스위치를 눌렀다. 실내등이 켜졌다. 유리 안쪽 손자국이 하나 더 늘어 있었다. 스위치를 마주 잡은 손이 내 손과 같은 방향이었다.\", c29_middle_bay)\n\n// ── /INCLUDE C29.ink ──\n// ── INCLUDE C30.ink ──\n// ink/C30.ink — C 경유지\n// 원본: spaces/C30_교대지침서.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c30_gate ===\n~ current_weight = 0.5\n~ current_space = \"C30\"\n-> c30_main\n\n=== c30_main ===\n교대 지침서를 펼쳤다. 항목 번호가 어제와 달랐다. 내용은 같은데 순서가 바뀌어 있었다. 승무원 서명란 옆에 03:47이 인쇄돼 있었다. 초침이 없는 시계였다. 종이 넘기는 소리 말고는 조용했다. 표지에는 개정 이력이 한 줄도 적혀 있지 않았다. 종이 넘기는 소리만 규칙적으로 났다. 다음 장을 넘기는 손이 조금 느려졌다.\n\n규칙 #rules:C30\n> 1. 번호 순서대로만 읽는다. 건너뛰지 않는다.\n> 2. 바뀐 걸 알면 기억대로 다시 매긴다. #fake #dmg:hand\n\n2번만 필체가 달랐다 — 원래 문장은 지워져 있었다.\n\n+ [인쇄된 순서 그대로 읽고 넘긴다.] -> c30_a\n+ [원래 순서라고 기억하는 대로 다시 매긴다.] -> c30_b\n\n=== c30_a ===\n마지막 장까지 읽고 지침서를 덮었다. 다음 승무원에게 그대로 넘겼다.\n-> cleared\n\n=== c30_b ===\n번호를 다시 매기는 동안 항목 하나가 늘어 있었다. 내가 쓰지 않은 항목이었다.\n-> die(\"덮은 지침서를 다시 열었다. 첫 장에 내가 항목 번호로 적혀 있었다.\", c30_renumbered)\n\n// ── /INCLUDE C30.ink ──\n// ── INCLUDE C31.ink ──\n// ink/C31.ink — C 경유지\n// 원본: spaces/C31_수하물보관소.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c31_gate ===\n~ current_weight = 0.5\n~ current_space = \"C31\"\n-> c31_main\n\n=== c31_main ===\n수하물 보관소 안이었다. 선반마다 인수하지 않은 짐이 쌓여 있었다. 보관소 직원 명찰을 달고 있었다. 벽시계는 03:47, 초침이 없었다. 구석 캐리어 하나가 인수증에 적힌 이름을 손잡이 태그에 새로 달고 있었다. 안쪽 배수구에서 물소리가 났다. 선반 사이 통로가 유난히 길게 느껴졌다. 선반 안쪽은 유난히 조용했다. 천장 조명 하나가 미세하게 떨렸다.\n\n규칙 #rules:C31\n> 1. 번호와 확인증 일치할 때만 내준다.\n> 2. 오래된 짐은 선반 앞쪽에 옮겨 둔다. #fake #dmg:strike\n\n2번 옆에 다른 색 볼펜으로 \"안 온다\"가 지워진 채 남아 있었다.\n\n+ [번호와 확인증이 맞는 사람에게만 짐을 내준다.] -> c31_a\n+ [오래된 짐을 앞쪽으로 옮겨 둔다.] -> c31_b\n\n=== c31_a ===\n확인증 없는 손님을 돌려보냈다. 캐리어는 선반 안쪽에 그대로 있었다.\n-> cleared\n\n=== c31_b ===\n캐리어를 앞으로 옮겼다. 태그의 이름이 조금 전보다 또렷해져 있었다.\n-> die(\"캐리어가 내 이름을 불렀다. 인수증에 적힌 이름이 아니라, 아무도 모르는 내 이름이었다.\", c31_handle_tag)\n\n// ── /INCLUDE C31.ink ──\n// ── INCLUDE C32.ink ──\n// ink/C32.ink — C 경유지\n// 원본: spaces/C32_환승대합실.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c32_gate ===\n~ current_weight = 0.5\n~ current_space = \"C32\"\n-> c32_main\n\n=== c32_main ===\n환승 대합실 의자에 앉아 있었다. 전광판에 환승 시각이 떠 있었다. 방송에서 부르는 시각과 한 자리씩 달랐다. 대기자 번호표를 손에 쥐고 있었다. 벽시계는 03:47, 초침이 없었다. 옆자리는 비어 있었다. 등받이만 두 사람 앉은 것처럼 눌려 있었다. 안내판 불빛이 규칙적으로 깜빡였다. 옆줄 의자도 가지런히 비어 있었다.\n\n규칙 #rules:C32\n> 1. 전광판 숫자만 따른다. 방송은 무시한다.\n> 2. 다르면 방송이 최신이니 따라 이동한다.\n\n전광판 아래 유리에 낡은 매직 글씨로 \"방송 믿지 마라\"가 반쯤 지워져 있었다.\n\n+ [전광판 시각만 보고 자리에서 기다린다.] -> c32_a\n+ [방송이 부르는 시각에 맞춰 이동한다.] -> c32_b\n\n=== c32_a ===\n전광판 숫자가 바뀌었다. 그 시각에 문이 열렸다.\n-> cleared\n\n=== c32_b ===\n방송을 따라 걸었다. 통로 끝에 또 다른 대합실이 있었다. 전광판이 또 있었다.\n-> die(\"전광판을 봤다. 내 번호표 숫자가 환승 시각 자리에 떠 있었다. 방송이 그 숫자를 불렀다.\", c32_broadcast_time)\n\n// ── /INCLUDE C32.ink ──\n// ── INCLUDE C33.ink ──\n// ink/C33.ink — C 경유지\n// 원본: spaces/C33_프런트.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c33_gate ===\n~ current_weight = 0.5\n~ current_space = \"C33\"\n-> c33_main\n\n=== c33_main ===\n결재판을 펼쳤다. 카운터 위에 근무수칙 바인더가 나란히 놓여 있었다. 천장 조명 하나가 파르르 떨렸다. 벽시계는 03:47을 가리킨 채 멈춰 있었고 초침은 애초에 없었다. 로비 안쪽 어디선가 물소리가 옅게 새어 들었다. 프런트 직원 자리에 앉아 있다는 것 말고는 언제부터 여기 있었는지 알 수 없었다.\n\n규칙 #rules:C33\n> 1. 전결 아닌 요청은 결재란에 적어 넘긴다.\n> 2. 카드키 재발급은 확인 후 즉시 전결 처리한다. #fake #dmg:tape\n\n2번 조항만 코팅지였다 — 나머지는 손때 묻은 맨종이였다.\n\n+ [신분증 없이 재발급을 요청한 손님에게 카드키를 바로 만들어 준다.] -> c33_a\n+ [결재란에 적어 당직 책임자에게 넘긴다.] -> c33_b\n\n=== c33_b ===\n적어서 넘겼다. 서명은 다음 칸에서, 그다음 칸에서 채워졌다. 프런트 직원은 그사이 아무것도 결정하지 않았다.\n-> cleared\n\n=== c33_a ===\n즉석에서 만들어 줬다. 카드는 나왔는데 반납할 곳이 사라지고 없었다.\n-> die(\"카드키를 쥔 손님이 웃었다. 이름을 물으니 대답 대신 결재란을 가리켰다. 거기 프런트 직원이라는 말이 적혀 있었다.\", c33_delegated)\n\n// ── /INCLUDE C33.ink ──\n// ── INCLUDE C34.ink ──\n// ink/C34.ink — C 경유지\n// 원본: spaces/C34_린넨실.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c34_gate ===\n~ current_weight = 0.5\n~ current_space = \"C34\"\n-> c34_main\n\n=== c34_main ===\n세탁물 슈트가 벽 한쪽에서 입을 벌리고 있었다. 린넨실 선반은 여섯 칸, 시트와 수건이 개켜져 쌓여 있었다. 다섯째 칸만 늘어진 비닐이 앞을 가리고 있었다. 벽시계는 03:47, 초침은 없었다. 물소리가 배수구 쪽에서 한 번 크게 났다가 잦아들었다. 근무자 조끼는 {gender == \"m\":짙은 남색|짙은 자주색}이었다. 슈트 안쪽에서 시트 스치는 소리가 났다.\n\n규칙 #rules:C34\n> 1. 다섯째 칸은 열지 않는다. 장부숫자만 옮긴다.\n> 2. 매 근무 시작 시 눈으로 확인해 센다. #fake #dmg:hand\n\n2번 메모지만 다른 손글씨였고 압정 자국이 새것이었다.\n\n+ [비닐을 걷고 다섯째 칸을 눈으로 확인한다.] -> c34_a\n+ [걷지 않고 장부 숫자만 옮겨 적는다.] -> c34_b\n\n=== c34_b ===\n옮겨 적었다. 숫자는 어제와 같았다. 근무자는 그 이상 알지 못한 채 다음 칸으로 넘어갔다.\n-> cleared\n\n=== c34_a ===\n걷었다. 안쪽은 접힌 시트뿐이었는데, 보고 나니 눈을 뗄 수 없었다.\n-> die(\"시트 접힌 각이 조금씩 벌어지고 있었다. 그 틈으로 뭔가가 마주 보고 있었다. 눈을 뗐을 때는 이미 늦어 있었다.\", c34_fifth_shelf)\n\n// ── /INCLUDE C34.ink ──\n// ── INCLUDE C35.ink ──\n// ink/C35.ink — C 경유지\n// 원본: spaces/C35_보급창고.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c35_gate ===\n~ current_weight = 0.5\n~ current_space = \"C35\"\n-> c35_main\n\n=== c35_main ===\n철문 두드리는 소리가 났다. 창고 안 조명이 깜빡이며 선반 사이를 비췄다. 상자들이 열을 맞춰 쌓여 있었다. 벽시계는 03:47에 멈춰 있었고 초침은 없었다. 목소리가 자기도 보급병이라며 인계를 왔다고 했다. 선반 옆에 눌러 쓴 글씨가 있었다. \"증명 없으면 열지 마라.\" 창고 조명이 선반 사이로 길게 그림자를 드리웠다.\n\n규칙 #rules:C35\n> 1. 불출증 있을 때만 불출한다.\n> 2. 서명 없으면 문을 열지 않는다.\n\n눌러 쓴 글씨 밑에 다른 손으로 한 줄이 더 있었다. \"그래도 열게 만든다.\"\n\n+ [문을 열어 물건을 내준다.] -> c35_a\n+ [불출증을 요구하며 문을 열지 않는다.] -> c35_b\n\n=== c35_b ===\n요구했다. 그는 한참 서 있다가 돌아섰다. 발소리가 하나로 줄며 멀어졌다.\n-> cleared\n\n=== c35_a ===\n열어 줬다. 그가 웃으며 선반 사이로 들어갔다. 나올 때는 하나가 아니라 둘이었다.\n-> die(\"선반 사이에서 부스럭거리는 소리가 났다. 돌아보니 그가 둘이었다. 둘 다 나를 보급병이라고 불렀다.\", c35_colleague)\n\n// ── /INCLUDE C35.ink ──\n// ── INCLUDE C36.ink ──\n// ink/C36.ink — C 경유지\n// 원본: spaces/C36_초소.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c36_gate ===\n~ current_weight = 0.5\n~ current_space = \"C36\"\n-> c36_main\n\n=== c36_main ===\n벽시계는 03:47에서 멈춰 있었다. 초소 안은 좁았다. 창틀 너머로 어둠뿐이었다. 벽에 초병 수칙이 붙어 있었고 그 옆에 짧은 금이 여러 개 그어져 있었다. 발소리가 어둠 속에서 다가오다 멎었다. 방금 암구호를 물었는지 기억이 나지 않았다. 초소 밖 어둠은 미동도 없었다. 금 하나하나가 깊게 눌려 있었다.\n\n규칙 #rules:C36\n> 1. 접근 대상에게 암구호를 먼저 묻는다.\n> 2. 기억 안 나면 다시 묻는다.\n\n벽에 그어진 금을 세어 보니 기억하는 횟수보다 하나 많았다.\n\n+ [이미 물었다고 믿고 그대로 세워 둔다.] -> c36_a\n+ [기억나지 않으니 다시 암구호를 묻는다.] -> c36_b\n\n=== c36_b ===\n다시 물었다. 대답이 돌아왔다. 암구호가 맞았다. 그림자는 방향을 바꿔 어둠 속으로 천천히 사라졌다.\n-> cleared\n\n=== c36_a ===\n그대로 뒀다. 그림자가 소리 없이 다가와 초소 앞에 섰다. 총구가 그보다 먼저 식었다.\n-> die(\"그림자는 대답하지 않았다. 그런데도 암구호가 맞다는 확신이 들었다. 확신이 든 순간을 기억할 수 없었다.\", c36_judgment)\n\n// ── /INCLUDE C36.ink ──\n// ── INCLUDE C37.ink ──\n// ink/C37.ink — C 경유지\n// 원본: spaces/C37_접견실.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c37_gate ===\n~ current_weight = 0.5\n~ current_space = \"C37\"\n-> c37_main\n\n=== c37_main ===\n접견 신청서 뭉치가 접수대 위에 쌓여 있었다. 맨 위 장의 칸들이 눈에 익지 않았다. 벽시계는 03:47을 가리켰고 초침은 없었다. 창구 저편에서 대기하는 기척이 났다. 복도 끝 급수대에서 물소리가 한 번 들렸다. 교도관 근무복은 {gender == \"m\":짙은 회색|짙은 감청색}이었다.\n\n규칙 #rules:C37\n> 1. 오늘 날짜 양식만 접수한다.\n> 2. 애매한 칸은 다시 읽혀 확인한다. #fake #dmg:tape\n\n2번만 스테이플 자국이 새것이었다 — 나머지는 손때로 눌어붙어 있었다.\n\n+ [이상해 보이는 칸을 신청자에게 다시 읽어 확인시킨다.] -> c37_a\n+ [확인하지 않고 접수 순서대로 도장을 찍는다.] -> c37_b\n\n=== c37_b ===\n확인 없이 순서대로 도장을 찍었다. 다음 장으로 넘어갔다. 양식은 손 밖에서 저 혼자 뭐라도 하고 있었을 것이다.\n-> cleared\n\n=== c37_a ===\n다시 읽어 줬다. 신청자가 그 문장을 따라 읽었다. 문장은 그사이 한 번 더 바뀌어 있었다.\n-> die(\"따라 읽은 문장이 신청서에 없던 줄이었다. 도장 찍을 자리가 새로 하나 생겨 있었다. 그 자리에는 이미 교도관이라는 말이 찍혀 있었다.\", c37_form)\n\n// ── /INCLUDE C37.ink ──\n// ── INCLUDE C38.ink ──\n// ink/C38.ink — C 경유지\n// 원본: spaces/C38_대기실.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c38_gate ===\n~ current_weight = 0.5\n~ current_space = \"C38\"\n-> c38_main\n\n=== c38_main ===\n스피커가 사무적인 톤으로 번호를 불렀다. 대기실 의자가 두 줄로 놓여 있었고 의자마다 수용자 번호 팻말이 붙어 있었다. 벽시계는 03:47을 가리켰고 초침은 없었다. 내가 앉은 482가 불렸다. 일어서는데 문이 열리기 전에 스피커가 482를 한 번 더 불렀다. 대기실 의자가 조금씩 삐걱였다.\n\n규칙 #rules:C38\n> 1. 번호가 같을 때만 응한다. 다르면 안 한다.\n> 2. 두 번째 불림엔 응하지 않는다.\n\n의자 등받이에 손톱으로 판 글씨가 있었다. \"한 번만 대답해라.\"\n\n+ [다시 일어나 대답한다.] -> c38_a\n+ [앉은 채로 첫 번째 응답으로 끝난 것으로 본다.] -> c38_b\n\n=== c38_b ===\n앉아 있었다. 문이 열렸다. 처음 대답한 만큼만 불려 나갔다. 자리는 그대로 482였다.\n-> cleared\n\n=== c38_a ===\n다시 대답했다. 문이 열렸다. 저쪽에 수용자 하나가 이미 나와 있었다. 팻말이 482였다.\n-> die(\"문 너머의 482가 돌아봤다. 얼굴은 없고 팻말만 있었다. 그것이 방으로 들어가고, 대기실에는 팻말이 사라진 자리만 남았다.\", c38_second_reply)\n\n// ── /INCLUDE C38.ink ──\n// ── INCLUDE C39.ink ──\n// ink/C39.ink — C 경유지\n// 원본: spaces/C39_봉안당.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c39_gate ===\n~ current_weight = 0.5\n~ current_space = \"C39\"\n-> c39_main\n\n=== c39_main ===\n방명록을 펼친 안치실 앞 접수대였다. 위패들이 벽면 안치단마다 줄지어 있었고 향로에서 가는 연기가 올라왔다. 벽시계는 03:47, 초침은 없었다. 늦은 시간에 조문객 하나가 급한 사정이라며 서류를 내밀었다. 관리인은 명부와 서류를 번갈아 봤다. 화병 물을 따르는 소리가 어디선가 한 번 났다.\n\n규칙 #rules:C39\n> 1. 명부에 적힌 이름만 들인다.\n> 2. 서류는 본인이 소리 내어 읽는다.\n\n접수대 아래 누가 새겨 놓은 글씨가 있었다. \"서류는 소리 내어 읽게 해라.\"\n\n+ [그가 내민 서류를 대신 읽어 확인해 준다.] -> c39_a\n+ [서류는 본인이 소리 내어 읽게 하고 명부와 맞춘다.] -> c39_b\n\n=== c39_b ===\n본인이 읽게 했다. 그는 첫 줄에서 멈췄다. 이름 칸을 채우지 못하고 향로 쪽으로 돌아섰다.\n-> cleared\n\n=== c39_a ===\n대신 읽었다. 이름 칸, 관계 칸, 날짜 칸을 소리 내어 짚었다. 다 읽고 나니 명부에 없던 줄이 하나 늘어 있었다.\n-> die(\"명부의 새 줄을 봤다. 방금 읽어 준 서류의 이름과 같았는데, 필체가 관리인의 것이었다.\", c39_ghostwritten)\n\n// ── /INCLUDE C39.ink ──\n// ── INCLUDE C40.ink ──\n// ink/C40.ink — C 경유지\n// 원본: spaces/C40_종탑.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c40_gate ===\n~ current_weight = 0.5\n~ current_space = \"C40\"\n-> c40_main\n\n=== c40_main ===\n벽시계는 03:47을 가리키고 있었다. 종탑 관리실 벽에 타종 시간표가 붙어 있었다. 오늘 몫으로 세 시각만 적혀 있었다. 아래서 종소리가 한 번 올라왔는데 시간표에 없는 시각이었다. 관리인은 표와 시계를 번갈아 봤다. 계단 아래서 물소리가 희미하게 났다. 종탑 계단은 어둠뿐이었다.\n\n규칙 #rules:C40\n> 1. 시간표 시각에만 종을 친다.\n> 2. 시간표 순서를 기준으로 삼는다.\n\n시간표의 마지막 줄만 다른 필체로 덧붙어 있었다.\n\n+ [시간표에 없는 소리에도 맞춰 종을 친다.] -> c40_a\n+ [시간표에 없는 소리는 무시하고 다음 정해진 시각을 기다린다.] -> c40_b\n\n=== c40_b ===\n무시했다. 아래 소리가 한 번 더 나고 그쳤다. 시간표의 다음 시각까지는 아직 멀었다.\n-> cleared\n\n=== c40_a ===\n맞춰 쳤다. 줄을 당기는데 아래서 종소리가 먼저 울렸다. 위에서 친 것이 아래에서 먼저 울릴 이유는 없었다.\n-> die(\"줄을 당겼다. 소리가 계단 밑에서부터 올라왔다. 시간표의 마지막 줄에 '관리인'이라는 글자가 새로 적혀 있었다.\", c40_added_time)\n\n// ── /INCLUDE C40.ink ──\n// ── INCLUDE C41.ink ──\n// ink/C41.ink — C 경유지\n// 원본: spaces/C41_야영장관리소.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c41_gate ===\n~ current_weight = 0.5\n~ current_space = \"C41\"\n-> c41_main\n\n=== c41_main ===\n책상 위에 야영장 배치도가 펼쳐져 있었다. 사이트는 마흔 개, 번호는 입구에서부터 순서대로 매겨져 있었다. 관리인 근무는 두 시간마다 배치도를 들고 사이트를 도는 일이었다. 창밖 데크에는 등불 몇 개가 드문드문 켜져 있었다. 사무실 벽시계는 03:47을 가리켰고 초침이 없었다. 배치도 여백에는 다른 손으로 적은 글씨가 남아 있었다.\n\n규칙 #rules:C41\n> 1. 배치도 번호 순서대로만 돈다.\n> 2. 번호 다르면 들어가지 않는다.\n\n배치도 여백에 볼펜으로 적혀 있다 — \"32는 걷지 마라. 31 다음은 33이다.\"\n\n+ [배치도대로 32를 건너뛰고 33번 사이트로 간다.] -> c41_a\n+ [말뚝에 또렷하게 박힌 32라는 숫자를 보고 그 안으로 들어간다.] -> c41_b\n\n=== c41_a ===\n33번 사이트는 배치도와 같았다. 텐트 하나, 사람 하나. 순찰을 마치고 사무실로 돌아왔다. 사이트 수는 서른아홉으로 남았다.\n-> cleared\n\n=== c41_b ===\n안으로 들어서자 자리가 넓었다. 텐트가 없는데 자리는 이미 다져져 있었다. 누군가 오래 앉아 있던 자국이었다.\n-> die(\"말뚝 앞에서 32라는 숫자는 아직 젖은 페인트였다. 손가락이 닿자 번호가 지워졌다. 그 자리에 관리인이라는 말이 떠올랐을 때는 이미 대답한 뒤였다.\", c41_site32)\n\n// ── /INCLUDE C41.ink ──\n// ── INCLUDE C42.ink ──\n// ink/C42.ink — C 경유지\n// 원본: spaces/C42_입산통제소.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c42_gate ===\n~ current_weight = 0.5\n~ current_space = \"C42\"\n-> c42_main\n\n=== c42_main ===\n차단봉 아래 간이 초소에서 라디오가 낮게 지지직거렸다. 통제자 근무는 입산 카드를 내주고, 하산할 때 그 카드를 돌려받는 일이었다. 카드함 옆에 걸린 시계는 03:47을 가리켰고 초침이 없었다. 오늘 내준 입산 카드는 일곱 장이었다. 하산 카드함을 열자 돌아온 카드가 여덟 장이었다.\n\n규칙 #rules:C42\n> 1. 하산 카드 수는 입산 수와 같아야 한다.\n> 2. 다르면 차단봉을 올리지 않는다.\n\n카드함 안쪽에 전임 통제자의 글씨가 남아 있다 — \"한 장 더 돌아오면 받지 마라.\"\n\n+ [남는 한 장까지 카드함에 넣는다.] -> c42_a\n+ [남는 한 장을 받지 않고 카드함 밖에 내놓은 채, 내준 일곱 장만 확인한다.] -> c42_b\n\n=== c42_b ===\n남는 카드는 받지 않았다. 돌아온 카드는 일곱. 차단봉이 올라갔다.\n-> cleared\n\n=== c42_a ===\n여덟 장을 넣고 카드함을 닫았다. 다시 열자 카드가 한 장 더 있었다. 내준 적 없는 카드였다.\n-> die(\"카드함을 닫고 나니 라디오가 대장의 수를 불렀다. 아홉. 대답하기도 전에 차단봉이 저절로 올라갔다.\", c42_card13)\n\n// ── /INCLUDE C42.ink ──\n// ── INCLUDE C43.ink ──\n// ink/C43.ink — C 경유지\n// 원본: spaces/C43_방파제순찰.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c43_gate ===\n~ current_weight = 0.5\n~ current_space = \"C43\"\n-> c43_main\n\n=== c43_main ===\n초소 벽시계가 03:47을 가리켰다. 초침은 없었다. 순찰자 근무 일지에는 등대까지 여든두 걸음이라고 적혀 있었다. 방파제 아래에서 물소리가 낮게 밀려왔다 밀려갔다. 손전등을 들고 나서면서 걸음 수를 세기 시작했다. 예순쯤에서 숫자가 헷갈렸다.\n\n규칙 #rules:C43\n> 1. 초소~등대 왕복이 끝이다. 중간에 안 돈다.\n> 2. 걸음은 안 센다. 일지 숫자만 믿는다.\n\n일지 여백에 적혀 있다 — \"세다가 틀리면 다른 것이 센 것이다.\"\n\n+ [걸음이 일지와 다르게 느껴진 지점에서 방향을 돌린다.] -> c43_a\n+ [세던 걸음을 멈추고 일지의 숫자만 믿은 채 등대까지 계속 걷는다.] -> c43_b\n\n=== c43_b ===\n등대까지 걸었다. 몇 걸음이었는지는 세지 않았다. 일지의 숫자와 다르지 않았을 것이다.\n-> cleared\n\n=== c43_a ===\n방파제 끝인 줄 알았던 자리는 아직 절반이었다. 발밑은 젖어 있었고 다음 디딤이 없었다.\n-> die(\"돌아선 자리는 익숙했지만 디딜 곳이 하나 모자랐다. 마지막 숫자를 세려던 순간, 세는 쪽이 내가 아니게 됐다.\", c43_step82)\n\n// ── /INCLUDE C43.ink ──\n// ── INCLUDE C44.ink ──\n// ink/C44.ink — C 경유지\n// 원본: spaces/C44_수상안전초소.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c44_gate ===\n~ current_weight = 0.5\n~ current_space = \"C44\"\n-> c44_main\n\n=== c44_main ===\n초소 의자에 앉아 무전기를 켰다. 안전요원 근무표가 벽에 붙어 있었다 — 오늘 밤 근무는 1초소, 2초소, 4초소, 5초소뿐이다. 3초소는 지난주 파손으로 비워 뒀다. 벽시계는 03:47, 초침이 없었다. 창밖 저수지 쪽에서 물소리가 이따금 들렸다.\n\n규칙 #rules:C44\n> 1. 번호 먼저 대야 위치를 알려준다.\n> 2. 없는 초소 무전엔 응답 않는다.\n\n근무표 아래 볼펜으로 적혀 있다 — \"3초소는 없다. 불러도 나가지 마라.\"\n\n+ [\"3초소, 확인 요청합니다.\" 목소리가 번호를 정확히 대며 도움을 청한다 — 나가서 확인한다.] -> c44_a\n+ [근무표를 다시 본다. 3초소는 없는 초소다 — 응답하지 않는다.] -> c44_b\n\n=== c44_b ===\n무전을 껐다. 근무표대로 넷뿐이었다. 아침까지 조용했다.\n-> cleared\n\n=== c44_a ===\n저수지 쪽 어둠으로 나섰다. 3초소 자리에는 아무것도 없었다. 목소리는 아직 무전기 안에서 나오고 있었다.\n-> die(\"3초소 자리에는 콘크리트 기초만 남아 있었다. 무전기에서는 여전히 내 번호를 부르는 소리가 났다. 돌아보니 목소리가 똑같은 사람이 서 있었는데, 조끼 색만 근무표와 달랐다.\", c44_post3)\n\n// ── /INCLUDE C44.ink ──\n// ── INCLUDE C45.ink ──\n// ink/C45.ink — C 경유지\n// 원본: spaces/C45_지하주차장경비.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c45_gate ===\n~ current_weight = 0.5\n~ current_space = \"C45\"\n-> c45_main\n\n=== c45_main ===\n손전등과 순찰 기록판이 경비실 책상에 놓여 있었다. 경비원 근무는 지하 1층부터 3층까지 계단으로 내려가며 층마다 표시를 남기는 일이었다. 벽시계는 03:47을 가리켰고 초침이 없었다. 계단 벽의 층수 표지판은 페인트로 그려져 있었다. 기록판 첫 장에 적혀 있었다 — 표지판이 아니라 내려간 계단 수로 층을 센다.\n\n규칙 #rules:C45\n> 1. 계단 수로 층을 센다.\n> 2. 숫자 다르면 그 층서 안 멈춘다.\n\n지하 2층 표지판 아래 누가 볼펜으로 적어 놓았다 — \"여기는 두 번째다. 세 번째가 진짜다.\"\n\n+ [계단을 두 층 내려왔는데 표지판은 지하 3층이라고 적혀 있다 — 표지판을 믿고 그 층에서 멈춘다.] -> c45_a\n+ [표지판을 무시하고 걸음 수를 믿은 채 한 층 더 내려간다.] -> c45_b\n\n=== c45_b ===\n한 층을 더 내려가자 차들이 줄지어 있었다. 표지판에는 지하 2층이라고 적혀 있었다. 걸음 수와 같았다.\n-> cleared\n\n=== c45_a ===\n지하 3층이라는 표지판 아래 차는 한 대도 없었다. 기둥 간격만 두 층치고는 낮았다.\n-> die(\"표지판을 믿고 멈춘 층은 기둥이 낮았다. 손전등으로 위를 비추자 천장이 아니라 바닥이 하나 더 있었다. 그 위에서, 내가 서 있는 자리와 같은 소리로 발소리가 났다.\", c45_basement2)\n\n// ── /INCLUDE C45.ink ──\n// ── INCLUDE C46.ink ──\n// ink/C46.ink — C 경유지\n// 원본: spaces/C46_지하보도안내방송.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c46_gate ===\n~ current_weight = 0.5\n~ current_space = \"C46\"\n-> c46_main\n\n=== c46_main ===\n안내방송이 지하보도 천장 스피커에서 낮게 흘러나왔다. 관리자 근무표에는 이름 대신 번호로 사람을 부른다고 적혀 있었다. 손에 든 표에는 07이라는 숫자가 찍혀 있었다. 매표소 위 시계는 03:47, 초침이 없었다. 방송은 삼십 분마다 한 번씩 번호를 불렀다.\n\n규칙 #rules:C46\n> 1. 번호가 완전히 같을 때만 대답한다.\n> 2. 다른 번호엔 돌아보지 않는다.\n\n표 뒷면에 원래 인쇄돼 있던 번호 위로 다른 잉크로 07이 덧대어 찍혀 있다.\n\n+ [방송이 07번과 한 자리만 다르게 부른다 — 비슷하니 대답한다.] -> c46_a\n+ [표를 뒤집어 확인한다. 방송이 부른 숫자는 07이 아니라 70이다 — 대답하지 않는다.] -> c46_b\n\n=== c46_b ===\n방송은 세 번 더 불렀다. 세 번째 이후로는 다른 번호를 불렀다. 07은 다시 불리지 않았다.\n-> cleared\n\n=== c46_a ===\n대답하자 방송이 멈췄다. 걸음 소리가 스피커 반대편에서 다가오기 시작했다.\n-> die(\"대답한 목소리는 내 것이었는데 스피커 쪽에서 흘러나오고 있었다. 걸음 소리가 다가오다 등 뒤에서 멎었다. 돌아보니 07이 찍힌 표를 든 손이 하나 더 있었다.\", c46_number07)\n\n// ── /INCLUDE C46.ink ──\n// ── INCLUDE C47.ink ──\n// ink/C47.ink — C 경유지\n// 원본: spaces/C47_만화방열람실.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c47_gate ===\n~ current_weight = 0.5\n~ current_space = \"C47\"\n-> c47_main\n\n=== c47_main ===\n카운터에 앉아 순찰 표를 펼쳤다. 근무자 수칙에는 열람실을 한 바퀴 돌며 소등 여부만 확인하라고 적혀 있었다. 벽시계는 03:47, 초침이 없었다. 7번 열람실 문에는 작은 유리창이 나 있었다. 다른 방과 달리 그 문 앞에서는 걸음을 멈추지 말라는 문장이 밑줄로 그어져 있었다.\n\n규칙 #rules:C47\n> 1. 7번 문 유리 안을 들여다보지 않는다.\n> 2. 손님 없는 방은 소등만 확인한다.\n\n수칙판 옆 벽에 볼펜으로 적혀 있다 — \"불이 꺼져 있어도 보지 마라.\"\n\n+ [7번 문 앞에서 걸음을 늦추고 유리 너머를 슬쩍 본다.] -> c47_a\n+ [시선을 정면에 둔 채 그대로 지나간다.] -> c47_b\n\n=== c47_b ===\n7번 앞을 지났다. 유리 쪽은 보지 않았다. 다음 방으로 넘어갔다.\n-> cleared\n\n=== c47_a ===\n유리 안쪽은 캄캄했다. 그런데 화면 하나가 꺼진 채로도 빛을 내고 있었다. 그 빛이 이쪽을 향해 있었다.\n-> die(\"화면이 꺼져 있는데도 유리에 얼굴이 하나 비쳤다. 내 얼굴이 아니었다. 그쪽이 먼저 눈을 맞췄고, 돌아서려 했을 때는 발이 이미 문 쪽으로 반 걸음 나가 있었다.\", c47_room7)\n\n// ── /INCLUDE C47.ink ──\n// ── INCLUDE C48.ink ──\n// ink/C48.ink — C 경유지\n// 원본: spaces/C48_콜센터야간조.md (## 배경/규칙/힌트/선택/결과/사망)\n// 규약: C 경유지 — gate -> main(배경+규칙2+힌트) -> 선택 A/B -> 결과 knot(A/B). 가중치 C = 0.5.\n\n=== c48_gate ===\n~ current_weight = 0.5\n~ current_space = \"C48\"\n-> c48_main\n\n=== c48_main ===\n헤드셋과 단말기가 책상 위에 놓여 있었다. 상담원 교대 수칙에는 전광판의 누적 응대 건수와 단말기 건수가 같아야 퇴근이 인정된다고 적혀 있었다. 사무실 벽시계는 03:47, 초침이 없었다. 전광판은 마흔둘, 단말기는 마흔하나를 가리켰다. 마지막 통화 기록은 남아 있지 않았다.\n\n규칙 #rules:C48\n> 1. 전광판과 단말기 건수는 같아야 한다.\n> 2. 다르면 자리를 안 뜨고 다시 센다.\n\n모니터 옆에 붙은 메모지에 적혀 있다 — \"숫자가 하나 앞서 있으면 처음부터 다시 세라.\"\n\n+ [단말기 숫자를 마흔둘로 그대로 맞춰 제출한다.] -> c48_a\n+ [단말기를 마흔하나로 둔 채 처음부터 다시 센다.] -> c48_b\n\n=== c48_b ===\n처음부터 다시 셌다. 마흔한 건, 전광판과 같아질 때까지 자리를 뜨지 않았다.\n-> cleared\n\n=== c48_a ===\n제출하자 헤드셋에서 신호음이 울렸다. 받지 않은 통화 하나가 이미 응대 완료로 표시돼 있었다.\n-> die(\"헤드셋을 다시 쓰자 이미 끊긴 통화 하나가 이어지고 있었다. 상대는 내 인사말을 그대로 따라 했다. 내가 하기도 전에.\", c48_call42)\n\n// ── /INCLUDE C48.ink ──\n// ── 배정 로직 — 05 §1·§2 (scripts/merge_ink.py 생성) ──\n// next_anchor = 다음에 열릴 앵커 번호(2~12). nonanchor_since = 직전 앵커 이후 클리어한 비앵커 수.\n// 비앵커는 B/C 교대 순환(결정적 — CLAUDE.md §4 '규칙은 결정적'). C .ink 가 없으면 B 만 순환.\n=== assign ===\n{a12_pending > 0:\n    -> assign_nonanchor\n}\n{next_anchor == 1 && nonanchor_since >= 2:\n    -> a01_gate\n}\n{next_anchor == 2 && nonanchor_since >= 2:\n    -> a02_gate\n}\n{next_anchor == 3 && nonanchor_since >= 3:\n    -> a03_gate\n}\n{next_anchor == 4 && nonanchor_since >= 3:\n    -> a04_gate\n}\n{next_anchor == 5 && nonanchor_since >= 4:\n    -> a05_gate\n}\n{next_anchor == 6 && nonanchor_since >= 4:\n    -> a06_gate\n}\n{next_anchor == 7 && nonanchor_since >= 4 && (fragments ? fragment_6):\n    -> a07_gate\n}\n{next_anchor == 8 && nonanchor_since >= 3:\n    -> a08_gate\n}\n{next_anchor == 9 && nonanchor_since >= 3:\n    -> a09_gate\n}\n{next_anchor == 10 && nonanchor_since >= 3:\n    -> a10_gate\n}\n{next_anchor == 11 && nonanchor_since >= 3:\n    -> a11_gate\n}\n{next_anchor == 12 && nonanchor_since >= 2 && (fragments ? fragment_11):\n    -> a12_gate\n}\n-> assign_nonanchor\n\n=== assign_nonanchor ===\n// 짝수 슬롯 = B, 홀수 슬롯 = C (C 미구현이면 B). a12_pending 재배정도 같은 순환.\n~ nonanchor_slot += 1\n{nonanchor_slot % 2 == 1:\n    -> assign_c\n}\n-> assign_b\n\n=== assign g == 0:\n        ~ transit_target = 12\n    }\n    ~ return 0\n}\n{a12_pending > 0:\n    ~ return 0\n}\n{next_anchor == 1 && nonanchor_since >= 2:\n    ~ transit_target = 1\n}\n{next_anchor == 2 && nonanchor_since >= 2:\n    ~ transit_target = 2\n}\n{next_anchor == 3 && nonanchor_since >= 3:\n    ~ transit_target = 3\n}\n{next_anchor == 4 && nonanchor_since >= 3:\n    ~ transit_target = 4\n}\n{next_anchor == 5 && nonanchor_since >= 4:\n    ~ transit_target = 5\n}\n{next_anchor == 6 && nonanchor_since >= 4:\n    ~ transit_target = 6\n}\n{next_anchor == 7 && nonanchor_since >= 4 && (fragments ? fragment_6):\n    ~ transit_target = 7\n}\n{next_anchor == 8 && nonanchor_since >= 3:\n    ~ transit_target = 8\n}\n{next_anchor == 9 && nonanchor_since >= 3:\n    ~ transit_target = 9\n}\n{next_anchor == 10 && nonanchor_since >= 3:\n    ~ transit_target = 10\n}\n{next_anchor == 11 && nonanchor_since >= 3:\n    ~ transit_target = 11\n}\n{next_anchor == 12 && nonanchor_since >= 2 && (fragments ? fragment_11):\n    ~ transit_target = 12\n}\n~ return 0\n\n=== transit_clear ===\n{cycle:\n- 닫힌 문 안쪽은 조용했다. 좌석은 전부 비어 있었고, 맨 앞줄은 두고 두 번째 줄에 앉았다. 앉자마자 바닥이 움직였다. 창밖의 검은 것이 뒤로 갔다.\n- 밖으로 나오니 국도였다. 갓길에 버스가 서 있었다. 실내등, 빈 좌석, 운전석 쪽을 가린 칸막이. 올라타자 등 뒤에서 문이 접혔고, 그걸로 출발이었다.\n- 버스는 이미 와 있었다. 기다린 시간이 없었다. 발판에 오르니 문이 닫혔고, 닫힌 문이 다시 열리지 않는 것만 확인하고 앉았다. 바퀴가 구르기 시작했다.\n- 정류장 표지판이 하나. 노선 번호도 행선지도 없는 판이었다. 그 앞에 버스가 서고, 탔고, 문이 닫혔다. 운전석 쪽은 보지 않았다. 봐도 없을 것 같아서.\n}\n{\n- frag_count() >= 12:\n    버스가 강을 따라 달렸다. 창 아래로 물이 계속 있었다.\n- frag_count() >= 8:\n    강이 보이기 시작했다. 도로 아래, 아직 멀었다.\n- frag_count() >= 4:\n    검은 것 너머, 멀리 한 줄이 희게 반짝였다. 물빛이었다.\n- else:\n    창밖은 검었다. 유리에 비친 실내등 말고는 없었다.\n}\n{\n- sibling_memory >= 12:\n    앞 유리 위에 바늘 시계. 03:47. 초침 자리가 비어 있었다.\n- sibling_memory >= 6:\n    시계를 봤다. 바늘이 둘. 읽는 데 두 번 봐야 했다. 03:47이었다. 맞을 것이다.\n- else:\n    시계 쪽으로 눈이 갔다가 돌아왔다. 바늘이 어디를 가리키는지 읽히지 않았다.\n}\n{\n- frag_count() >= 12:\n    물소리가 발밑에서 올라왔다. 바퀴 소리보다 가까웠다.\n- frag_count() >= 8:\n    엔진 소리 사이로 어디선가 물소리가 섞여 들어왔다.\n}\n+
