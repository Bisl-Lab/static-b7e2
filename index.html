</script>

<script>
(function(){
  "use strict";

  // ── 상태 ──────────────────────────────────────────────────────────
  var storyJSON = null;   // 컴파일된 story 의 ToJson() 결과. 새 게임/재시작마다 여기서 인스턴스를 새로 만든다.
  var story = null;
  var startTime = Date.now();
  var log = [];
  var lastSpace = null;
  var lastRenderedText = "";
  var rulesDwellStart = null;
  var rulesDwellSpace = null;
  var codexOpenAt = null;
  var endingLogged = false;
  var selectedGender = "m";

  var SAVE_KEY = "gwidam_save_v1";
  var LOG_KEY = "gwidam_log_v1";
  var RUN_KEY = "gwidam_run_v1";
  var runNo = 0;
  try{ runNo = parseInt(localStorage.getItem(RUN_KEY) || "0", 10) || 0; }catch(e){ runNo = 0; }

  var $ = function(id){ return document.getElementById(id); };

  // ── 로그 ──────────────────────────────────────────────────────────
  function nowIso(){ return new Date().toISOString(); }

  function safeVar(name, fallback){
    try{
      var v = story.variablesState[name];
      return (v === undefined || v === null) ? fallback : v;
    }catch(e){ return fallback; }
  }

  function currentSM(){
    var sm = safeVar("sibling_memory", null);
    return (sm === null || isNaN(Number(sm))) ? null : Number(sm);
  }

  function logEvent(eventName, extra){
    var rec = {
      t: nowIso(),
      elapsed_ms: Date.now() - startTime,
      event: eventName,
      run: runNo,
      space: lastSpace,
      sm: currentSM()
    };
    if (extra){
      for (var k in extra){ if (Object.prototype.hasOwnProperty.call(extra,k)) rec[k] = extra[k]; }
    }
    log.push(rec);
    persistLog();
    return rec;
  }

  function persistLog(){
    try{ localStorage.setItem(LOG_KEY, JSON.stringify(log)); }catch(e){ /* 용량 초과 등은 무시 — 플레이테스트용 */ }
  }

  function loadLog(){
    try{
      var raw = localStorage.getItem(LOG_KEY);
      if (raw) log = JSON.parse(raw);
    }catch(e){ log = []; }
  }

  // ── inkjs LIST → 이름 배열 ───────────────────────────────────────
  function inkListToNames(list){
    if (!list) return [];
    try{
      var s = String(list);
      if (!s) return [];
      return s.split(",").map(function(x){ return x.trim(); })
        .filter(function(x){ return x && x.toLowerCase() !== "none"; });
    }catch(e){ return []; }
  }

  function codexNames(){ return inkListToNames(safeVar("codex", null)); }
  function fragmentNames(){ return inkListToNames(safeVar("fragments", null)); }

  // ── 컴파일 ────────────────────────────────────────────────────────
  function showCompileErrors(errors){
    var box = $("compileBanner");
    // 실전 빌드: 진짜 ERROR 가 있거나 URL 에 ?debug 가 있을 때만 배너. 경고만 있으면 콘솔에만.
    var debug = /[?&]debug\b/.test(location.search);
    // inkjs ErrorType: 1 = Warning, 2 = Error (메시지도 "WARNING:"/"ERROR:" 접두)
    var hasError = errors.some(function(e){ return !(e.errorType === 1 || /^\s*WARNING/i.test(String(e.message))); });
    errors.forEach(function(e){ console.warn("[ink " + (e.errorType || "ERROR") + "] " + e.message); });
    if (!hasError && !debug){ box.classList.add("hidden"); return; }
    var html = "<h3>Ink 컴파일 " + (hasError ? "오류" : "경고") + " (" + errors.length + "건)" + (debug ? " — ?debug" : "") + "</h3>";
    errors.forEach(function(e){
      html += "[" + (e.errorType || "ERROR") + "] " + escapeHtml(e.message) + "\n";
    });
    box.innerHTML = html;
    box.classList.remove("hidden");
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function compileInk(){
    if (INK_SOURCE === null || INK_SOURCE === undefined){
      var box = $("compileBanner");
      box.innerHTML = "<h3>소스 없음</h3>" +
        "이 파일은 템플릿입니다(build/index_template.html). " +
        "scripts/build_web.py 가 INK_SOURCE 자리표시를 채워 build/index.html 을 생성해야 실행됩니다.";
      box.classList.remove("hidden");
      disableStart();
      return false;
    }
    var errors = [];
    var compiler;
    try{
      compiler = new inkjs.Compiler(INK_SOURCE, {
        errorHandler: function(message, errorType){
          errors.push({ message: message, errorType: errorType });
        }
      });
    }catch(e){
      showCompileErrors([{ message: "Compiler 생성 실패: " + e.message, errorType: "EXCEPTION" }]);
      disableStart();
      return false;
    }
    var compiled = null;
    try{
      compiled = compiler.Compile();
    }catch(e){
      errors.push({ message: "Compile() 예외: " + e.message + "\n" + (e.stack || ""), errorType: "EXCEPTION" });
    }
    if (errors.length) showCompileErrors(errors);
    if (!compiled){ disableStart(); return false; }
    try{
      storyJSON = compiled.ToJson();
    }catch(e){
      showCompileErrors(errors.concat([{ message: "ToJson() 실패: " + e.message, errorType: "EXCEPTION" }]));
      disableStart();
      return false;
    }
    return true;
  }

  function disableStart(){
    $("startNewBtn").disabled = true;
    $("continueBtn").disabled = true;
  }

  // ── 게임 시작/이어하기 ───────────────────────────────────────────
  function newStoryInstance(){
    var s = new inkjs.Story(storyJSON);
    s.onError = function(message, type){
      logEvent("runtime_error", { message: message, error_type: type });
      var box = $("compileBanner");
      box.innerHTML += "\n[RUNTIME " + type + "] " + escapeHtml(message);
      box.classList.remove("hidden");
    };
    return s;
  }

  // ── 회차 간 도감 유지 (05 §1 "둘째 판부터 진엔딩 가능"의 전제) ──
  // 새 게임 = sm·조각·플래그·시드 초기화(새 Story 인스턴스), 도감(codex)만 이전 회차에서 이어받는다.
  var CODEX_KEY = "gwidam_codex_v1";
  function codexPersist(){
    try{ localStorage.setItem(CODEX_KEY, JSON.stringify(codexNames())); }catch(e){}
  }
  function codexRestore(s){
    var names = [];
    try{ names = JSON.parse(localStorage.getItem(CODEX_KEY) || "[]"); }catch(e){ names = []; }
    if (!names.length) return 0;
    try{
      var list = new inkjs.InkList("codex", s);
      names.forEach(function(n){ try{ list.AddItem(n); }catch(e){} });
      s.variablesState["codex"] = list;
      return names.length;
    }catch(e){ return 0; }
  }

  function startNewGame(){
    story = newStoryInstance();
    try{ story.variablesState["gender"] = selectedGender; }catch(e){}
    startTime = Date.now();
    runNo += 1;
    try{ localStorage.setItem(RUN_KEY, String(runNo)); }catch(e){}
    // 회차 시드: 비앵커 셔플(ink SEED_RANDOM). 로그 첫 줄에 기록 — 같은 시드면 같은 배정 순서.
    var seed = Math.floor(Date.now() % 1000000);
    try{ story.variablesState["run_seed"] = seed; }catch(e){}
    logEvent("seed", { seed: seed, gender: selectedGender });
    // 도감 이어받기는 log 초기화 뒤에 (이벤트가 지워지지 않도록)
    var carried = codexRestore(story);
    if (carried) logEvent("codex_carry", { count: carried });
    lastSpace = null;
    lastRenderedText = "";
    rulesDwellStart = null;
    endingLogged = false;
    showStoryScreen();
    advance(null);
  }

  function continueGame(){
    var raw = null;
    try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
    if (!raw){ return; }
    story = newStoryInstance();
    try{ story.state.LoadJson(raw); }catch(e){
      var box = $("compileBanner");
      box.innerHTML += "\n[저장본 로드 실패] " + escapeHtml(e.message);
      box.classList.remove("hidden");
      return;
    }
    startTime = Date.now();
    loadLog();
    lastSpace = safeVar("current_space", null);
    lastRenderedText = "";
    rulesDwellStart = null;
    endingLogged = false;
    showStoryScreen();
    renderFromCurrentState();
  }

  function saveGame(){
    try{ localStorage.setItem(SAVE_KEY, story.state.ToJson()); }catch(e){ /* 용량/직렬화 오류 무시 */ }
  }

  function showStoryScreen(){
    $("storyText").innerHTML = "";   // 새 게임/이어하기 시작: 이력 비움
    rulesheets = {};
    $("startScreen").classList.add("hidden");
    $("codexScreen").classList.add("hidden");
    $("storyScreen").classList.remove("hidden");
    $("topbar").classList.remove("hidden");
  }

  // ── 본문 진행 ────────────────────────────────────────────────────
  var lastLineTags = [];   // continueAll 이 채움: lines[i] 의 ink 태그 배열
  function continueAll(){
    var lines = [];
    lastLineTags = [];
    while (story.canContinue){
      var line = story.Continue();
      lines.push(line);
      var tg = [];
      try{ tg = (story.currentTags || []).slice(); }catch(e){ tg = []; }
      lastLineTags.push(tg);
    }
    return lines;
  }

  var RULE_LINE_RE = /^\s*>?\s*\d+(?:-\d+)?\.\s/;   // "6-1." 형식(A09) 포함
  var DOC_LINE_RE = /^>\s?/;

  // 공간별 최근 규칙서 카드 HTML (하단 "규칙서" 버튼이 연다)
  var rulesheets = {};

  function dmgClassFromTags(tags){
    var cls = [];
    (tags || []).forEach(function(tg){
      var s = String(tg).trim();
      if (s === "fake") cls.push("fake");
      var m = /^dmg:(\w+)$/.exec(s);
      if (m) cls.push("dmg-" + m[1]);
    });
    return cls.join(" ");
  }

  function renderLines(lines){
    var container = $("storyText");
    var joined = lines.join("");
    lastRenderedText = joined;

    // 이전 블록은 흐리게
    Array.prototype.forEach.call(container.querySelectorAll(".story-block"), function(b){ b.classList.add("past"); });

    var block = document.createElement("div");
    block.className = "story-block";
    var docBuffer = [];
    var card = null, cardSpace = null, cardHasRule = false;
    function flushDoc(){
      if (docBuffer.length){
        var div = document.createElement("div");
        div.className = "doc-block";
        div.textContent = docBuffer.join("\n");
        block.appendChild(div);
        docBuffer = [];
      }
    }
    function closeCard(){
      if (card){
        if (cardHasRule){
          rulesheets[cardSpace] = card.outerHTML;
        }
        card = null; cardSpace = null; cardHasRule = false;
      }
    }
    lines.forEach(function(raw, i){
      var line = raw.replace(/\n+$/,"");
      var tags = lastLineTags[i] || [];
      var rulesTag = null;
      tags.forEach(function(tg){ var m = /^rules:(\S+)$/.exec(String(tg).trim()); if (m) rulesTag = m[1]; });
      if (line.trim() === "" && !rulesTag){ return; }

      if (rulesTag !== null){
        flushDoc(); closeCard();
        card = document.createElement("div");
        card.className = "rulesheet";
        cardSpace = rulesTag || safeVar("current_space", null) || "-";
        card.setAttribute("data-space", cardSpace);
        var title = document.createElement("div");
        title.className = "rs-title";
        title.textContent = line.replace(DOC_LINE_RE, "").trim() || "규칙";
        card.appendChild(title);
        block.appendChild(card);
        return;
      }
      var hasDmg = tags.some(function(tg){ return /^(fake|dmg:)/.test(String(tg).trim()); });
      var isRule = RULE_LINE_RE.test(line) || (card && hasDmg);   // 번호 없는 훼손 줄도 카드 안 항목
      if (card){
        if (isRule){
          var r = document.createElement("div");
          r.className = "rule " + dmgClassFromTags(tags);
          r.textContent = line.replace(DOC_LINE_RE, "").trim();
          card.appendChild(r); cardHasRule = true;
          return;
        }
        if (!cardHasRule && DOC_LINE_RE.test(line)){
          // 머리말 문장(번호 전) — 카드 안 부제
          var pre = document.createElement("div");
          pre.className = "rs-pre";
          pre.textContent = line.replace(DOC_LINE_RE, "").trim();
          card.appendChild(pre);
          return;
        }
        closeCard();
      } else if (isRule){
        // 표지 태그 없이 번호 줄이 나오면(구형) 카드 자동 시작
        card = document.createElement("div");
        card.className = "rulesheet";
        cardSpace = safeVar("current_space", null) || "-";
        card.setAttribute("data-space", cardSpace);
        block.appendChild(card);
        var r0 = document.createElement("div");
        r0.className = "rule " + dmgClassFromTags(tags);
        r0.textContent = line.replace(DOC_LINE_RE, "").trim();
        card.appendChild(r0); cardHasRule = true;
        return;
      }
      if (DOC_LINE_RE.test(line)){
        docBuffer.push(line.replace(DOC_LINE_RE,""));
      } else {
        flushDoc();
        var p = document.createElement("p");
        p.className = "para";
        p.innerHTML = escapeHtml(line).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        block.appendChild(p);
      }
    });
    flushDoc(); closeCard();
    container.appendChild(block);
    // 이력 상한: 오래된 블록 정리
    var blocks = container.querySelectorAll(".story-block");
    for (var k = 0; k < blocks.length - 40; k++){ blocks[k].remove(); }
    var pcs = container.querySelectorAll(".past-choice");
    for (var k2 = 0; k2 < pcs.length - 40; k2++){ pcs[k2].remove(); }
    // 새 본문 시작점으로 스크롤 (첫 화면은 맨 위)
    if (blocks.length > 1){
      var top = block.getBoundingClientRect().top + window.scrollY - 60;
      window.scrollTo({ top: top, behavior: "auto" });
      // 선택지 렌더 뒤 레이아웃이 바뀌어도 시작점을 유지
      setTimeout(function(){ window.scrollTo({ top: block.getBoundingClientRect().top + window.scrollY - 60, behavior: "auto" }); }, 0);
    } else {
      window.scrollTo(0, 0);
    }

    // rules_dwell 타이머: 이 화면에 규칙서 카드가 있으면 시작
    var ruleCount = lines.filter(function(l){ return RULE_LINE_RE.test(l); }).length;
    if (ruleCount >= 2 || block.querySelector(".rulesheet")){
      rulesDwellStart = Date.now();
      rulesDwellSpace = safeVar("current_space", null) || lastSpace;
    } else {
      rulesDwellStart = null;
    }
  }

  // ── 규칙서 오버레이 ──
  var rulesOpenAt = null;
  function openRules(){
    var space = safeVar("current_space", null) || lastSpace || "-";
    var html = rulesheets[space];
    if (!html){
      // 현재 공간 카드가 없으면 가장 최근 카드
      var keys = Object.keys(rulesheets);
      html = keys.length ? rulesheets[keys[keys.length - 1]] : null;
    }
    $("rulesOverlayTitle").textContent = "규칙서 — " + space;
    $("rulesOverlayBody").innerHTML = html || '<p class="para" style="color:var(--muted)">이 공간에는 아직 본 규칙서가 없다.</p>';
    $("rulesOverlay").classList.remove("hidden");
    rulesOpenAt = Date.now();
    logEvent("rules_open", { space: space, has_sheet: !!html });
  }
  function closeRules(){
    $("rulesOverlay").classList.add("hidden");
    if (rulesOpenAt !== null){
      logEvent("rules_close", { duration_ms: Date.now() - rulesOpenAt });
      rulesOpenAt = null;
    }
  }

  function finalizeRulesDwell(){
    if (rulesDwellStart !== null){
      var ms = Date.now() - rulesDwellStart;
      logEvent("rules_dwell", { space: rulesDwellSpace, dwell_ms: ms });
      rulesDwellStart = null;
    }
  }

  var ENDING_PATTERNS = [/잊힌/, /홀로/, /진엔딩/];

  function checkEnding(joinedText){
    if (endingLogged) return;
    var noMore = !story.canContinue && story.currentChoices.length === 0;
    // 엔딩 판정은 Ink 변수 ending_reached("forgotten"|"alone"|"true")가 기준. 텍스트 정규식은 보조.
    var reached = null;
    try{ reached = String(story.variablesState["ending_reached"] || "none"); }catch(e){ reached = "none"; }
    var matched = reached !== "none" || (noMore && ENDING_PATTERNS.some(function(p){ return p.test(joinedText); }));
    if (matched || noMore){
      endingLogged = true;
      logEvent("ending", { space: lastSpace, sm: currentSM(), ending: reached });
      codexPersist();
      $("endingNote").textContent = "— 이 회차는 여기서 끝났습니다. 상단 '재시작'으로 새로 시작할 수 있습니다. —";
      $("endingNote").classList.remove("hidden");
    }
  }

  function renderChoices(){
    var box = $("choices");
    box.innerHTML = "";
    if (!story.currentChoices.length){ return; }
    $("endingNote").classList.add("hidden");
    story.currentChoices.forEach(function(choice, idx){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.type = "button";
      btn.textContent = choice.text;
      btn.addEventListener("click", function(){ onChoiceClick(idx, choice.text); });
      box.appendChild(btn);
    });
  }

  function updateTopbar(){
    var sm = currentSM();
    var space = safeVar("current_space", null) || "-";
    $("spaceLabel").textContent = "공간: " + space;
    $("smLabel").textContent = "기억: " + (sm === null ? "-" : sm);
    var stage = maskStage(sm === null ? 20 : sm);
    $("lockPhoto").className = "lock-photo stage-" + stage;
  }

  function maskStage(sm){
    if (sm >= 16) return 1;
    if (sm >= 12) return 2;
    if (sm >= 8) return 3;
    if (sm >= 4) return 4;
    return 5;
  }

  // afterChoiceText: 방금 고른 선택지 텍스트(없으면 게임 시작 직후 호출)
  function advance(afterChoiceText){
    var beforeSM = currentSM();
    var beforeFragCount = fragmentNames().length;
    var spaceBefore = lastSpace;   // 사망은 선택을 고른 공간에 귀속 (재배정으로 공간이 바뀌기 전)

    var lines = continueAll();
    renderLines(lines);
    var joined = lines.join("");

    var newSpace = safeVar("current_space", null);
    if (newSpace !== lastSpace){
      lastSpace = newSpace;
      logEvent("enter", { space: newSpace });
    }

    var afterSM = currentSM();
    if (afterChoiceText !== null && beforeSM !== null && afterSM !== null && afterSM < beforeSM){
      logEvent("death", {
        space: spaceBefore,
        next_space: lastSpace,
        choice_text: afterChoiceText,
        reason: firstParagraph(joined),
        weight: Math.round((beforeSM - afterSM) * 100) / 100
      });
    }

    codexPersist();   // 도감은 회차를 넘어 유지 — 사망·클리어마다 저장
    var afterFragCount = fragmentNames().length;
    if (afterFragCount > beforeFragCount){
      logEvent("fragment", { n: afterFragCount });
    }

    checkEnding(joined);
    updateTopbar();
    renderChoices();
    saveGame();
  }

  // 저장본을 로드한 직후 — Continue 를 다시 호출하지 않고 현재 상태(currentText/currentChoices)만 그린다.
  function renderFromCurrentState(){
    var text = story.currentText || "";
    var lines = text ? text.split(/(?<=\n)/) : [];
    if (!lines.length && text) lines = [text];
    renderLines(lines);
    updateTopbar();
    renderChoices();
    checkEnding(text);
  }

  function firstParagraph(text){
    var parts = text.split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
    return parts.length ? parts[0] : "";
  }

  function onChoiceClick(idx, choiceText){
    var knotHint = lastRenderedText.replace(/\s+/g," ").trim().slice(0,20);
    logEvent("choice", {
      space: lastSpace,
      choice_text: choiceText,
      choice_index: idx,
      knot_hint: knotHint
    });
    finalizeRulesDwell();
    var pc = document.createElement("div");
    pc.className = "past-choice";
    pc.textContent = choiceText;
    $("storyText").appendChild(pc);
    story.ChooseChoiceIndex(idx);
    advance(choiceText);
  }

  // ── 도감 ─────────────────────────────────────────────────────────
  function openCodex(){
    codexOpenAt = Date.now();
    logEvent("codex_open", {});
    var list = codexNames();
    var box = $("codexList");
    if (!list.length){
      box.innerHTML = '<div class="codex-empty">아직 기록된 항목이 없습니다.</div>';
    } else {
      box.innerHTML = list.map(function(name){
        return '<div class="codex-item">' + escapeHtml(name) + "</div>";
      }).join("");
    }
    $("codexScreen").classList.remove("hidden");
  }

  function closeCodex(){
    var durationMs = codexOpenAt !== null ? (Date.now() - codexOpenAt) : 0;
    codexOpenAt = null;
    logEvent("codex_close", { duration_ms: durationMs });
    $("codexScreen").classList.add("hidden");
  }

  // ── 로그 복사 ────────────────────────────────────────────────────
  function buildSummary(){
    var deaths = log.filter(function(e){ return e.event === "death"; });
    var bySpace = {};
    deaths.forEach(function(d){
      var sp = d.space || "?";
      bySpace[sp] = (bySpace[sp] || 0) + 1;
    });
    var deathLine = "사망 총 " + deaths.length + "건 (" +
      Object.keys(bySpace).sort().map(function(k){ return k + ":" + bySpace[k]; }).join(", ") + ")";

    var opens = log.filter(function(e){ return e.event === "codex_open"; }).length;
    var closeDur = log.filter(function(e){ return e.event === "codex_close"; })
      .reduce(function(sum, e){ return sum + (e.duration_ms || 0); }, 0);
    var codexLine = "도감 열람 " + opens + "회, 총 " + (closeDur/1000).toFixed(1) + "초";

    var dwellEvents = log.filter(function(e){ return e.event === "rules_dwell"; });
    var dwellSum = dwellEvents.reduce(function(sum, e){ return sum + (e.dwell_ms || 0); }, 0);
    var dwellBySpace = {};
    dwellEvents.forEach(function(e){
      var sp = e.space || "?";
      if (!dwellBySpace[sp]) dwellBySpace[sp] = { sum: 0, n: 0 };
      dwellBySpace[sp].sum += (e.dwell_ms || 0);
      dwellBySpace[sp].n += 1;
    });
    var dwellAvgStr = Object.keys(dwellBySpace).sort().map(function(k){
      var v = dwellBySpace[k];
      return k + ":" + (v.sum / v.n / 1000).toFixed(1) + "초(" + v.n + "회)";
    }).join(", ");
    var dwellLine = "규칙서 체류 합계 " + (dwellSum/1000).toFixed(1) + "초 / 공간별 평균: " + (dwellAvgStr || "-");

    return [
      "=== 요약 ===",
      deathLine,
      codexLine,
      dwellLine,
      "총 이벤트 " + log.length + "건",
      "==========="
    ].join("\n");
  }

  function buildLogText(){
    var header = buildSummary();
    var seedEvs = log.filter(function(e){ return e.event === "seed"; });
    var seedLine = seedEvs.length ? seedEvs.map(function(e){ return "run " + e.run + ": 시드 " + e.seed + (e.gender ? "/" + e.gender : ""); }).join(", ") : "(없음)";
    header = "회차: " + seedLine + "\n" + header;
    var lines = log.map(function(e){
      var known = ["t","elapsed_ms","event","run","space","sm"];
      var extra = [];
      Object.keys(e).forEach(function(k){
        if (known.indexOf(k) === -1) extra.push(k + "=" + e[k]);
      });
      return [e.t, e.elapsed_ms, e.event, e.space, e.sm].join("\t") +
        (extra.length ? "\t" + extra.join(", ") : "");
    });
    var body = "t\telapsed_ms\tevent\tspace\tsm\textra\n" + lines.join("\n");
    return header + "\n\n" + body + "\n\n=== JSON ===\n" + JSON.stringify(log, null, 2);
  }

  function copyLog(){
    var text = buildLogText();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        alert("로그를 복사했습니다.");
      }).catch(function(){ showCopyFallback(text); });
    } else {
      showCopyFallback(text);
    }
  }

  function showCopyFallback(text){
    $("copyTextarea").value = text;
    $("copyModal").classList.remove("hidden");
    $("copyTextarea").focus();
    $("copyTextarea").select();
  }

  // ── 재시작 ───────────────────────────────────────────────────────
  function restartGame(){
    if (!confirm("새 회차를 시작할까요? (기억·조각·플래그·시드 초기화. 도감과 로그는 유지)")) return;
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    logEvent("run_end", { reason: "restart" });
    $("storyScreen").classList.add("hidden");
    $("topbar").classList.add("hidden");
    $("continueBtn").disabled = true;
    $("startScreen").classList.remove("hidden");
  }

  function wipeAll(){
    if (!confirm("전부 삭제: 저장본·로그·도감·회차 번호를 모두 지웁니다. 계속할까요?")) return;
    if (!confirm("정말 지웁니다. 되돌릴 수 없습니다. 로그를 아직 복사하지 않았다면 취소하세요.")) return;
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    try{ localStorage.removeItem(LOG_KEY); }catch(e){}
    try{ localStorage.removeItem(CODEX_KEY); }catch(e){}
    try{ localStorage.removeItem(RUN_KEY); }catch(e){}
    log = []; runNo = 0;
    $("storyScreen").classList.add("hidden");
    $("topbar").classList.add("hidden");
    $("continueBtn").disabled = true;
    $("startScreen").classList.remove("hidden");
  }

  // ── 초기화 ───────────────────────────────────────────────────────
  function initUI(){
    $("rulesBtn").addEventListener("click", openRules);
    $("rulesCloseBtn").addEventListener("click", closeRules);
    $("rulesOverlay").addEventListener("click", function(e){ if (e.target === $("rulesOverlay")) closeRules(); });
    $("genderM").addEventListener("click", function(){ selectGender("m"); });
    $("genderF").addEventListener("click", function(){ selectGender("f"); });
    $("startNewBtn").addEventListener("click", startNewGame);
    $("continueBtn").addEventListener("click", continueGame);
    $("codexBtn").addEventListener("click", openCodex);
    $("codexCloseBtn").addEventListener("click", closeCodex);
    $("copyBtn").addEventListener("click", copyLog);
    $("copyModalClose").addEventListener("click", function(){ $("copyModal").classList.add("hidden"); });
    $("restartBtn").addEventListener("click", restartGame);
    $("wipeBtn").addEventListener("click", wipeAll);

    var hasSave = false;
    try{ hasSave = !!localStorage.getItem(SAVE_KEY); }catch(e){}
    $("continueBtn").disabled = !hasSave;
  }

  function selectGender(g){
    selectedGender = g;
    $("genderM").classList.toggle("selected", g === "m");
    $("genderF").classList.toggle("selected", g === "f");
  }

  document.addEventListener("DOMContentLoaded", function(){
    initUI();
    var ok = compileInk();
    if (!ok){
      // INK_SOURCE 가 없거나 컴파일 실패 — 시작/이어하기 버튼은 이미 비활성화됨.
      return;
    }
  });
})();
</script>
</body>
