 배웠는지는 떠오르지 않았다.\n\n여기까지 오는 길에 관리실 앞을 지났다. 창 너머 벽에 시계가 있었다. 03:47. 초침이 없었다.\n-> b06_t1\n\n=== b06_t1 ===\n좌대였다.\n\n물 위로 나온 나무 상판. 난간 세 면, 뭍 쪽으로 계단 열두 칸. 계단 위가 제방이고 제방 위가 관리실이다. 여기서 관리실까지는 등을 돌리면 보인다.\n\n난간 받침에 낚싯대가 걸려 있었다. 릴, 원줄, 초릿대. 줄은 팽팽하지도 늘어지지도 않았다.\n\n기둥에 아크릴 액자가 하나 붙어 있었다.\n\n\\**○○지 낚시터 야간 이용 수칙** #rules:B06\n\n1. 좌대 아래 물가로 내려가지 않는다.\n2. 안내는 처마의 확성기로만 나간다.\n3. 찌가 잠길 때만 챔질하고 무거우면 끊는다.\n4. 물 쪽에서 부르면 응답한다. #fake #dmg:blur\n\n□□낚시터 관리실. {gender == \"m\":남성|여성} 이용객 화장실은 관리실 뒤편입니다. 야간 조사(釣士)는 위를 지켜 주십시오.\n\n2번과 4번을 나란히 읽었다.\n\n안내는 확성기로만 나간다. 확성기는 처마에 있다. 처마는 내 등 뒤다. 그런데 4번은 물 쪽에서 부르는 경우를 말하고 있다. 물은 앞이다.\n\n앞에서 나는 소리를 안내라고 부르려면 2번이 틀려야 한다. 2번이 맞으면 4번이 부르는 것은 관리실이 아니다.\n\n둘 중 하나는 나중에 끼워 넣은 것이다.\n\n+ [관리실 창을 들여다본다] -> b06_t1_a\n+ [좌대를 살핀다] -> b06_t1_b\n+ [액자를 다시 본다] -> b06_t1_c\n\n=== b06_t1_a ===\n계단 열두 칸을 올랐다. 1번은 물가로 내려가지 말라고 했지 올라가지 말라고는 하지 않았다.\n\n창은 잠겨 있었다. 안은 불이 켜져 있고 사람은 없었다. 카운터 위에 접수대장이 펼쳐져 있었다.\n\n좌대 번호별로 칸이 나뉘어 있었다. 1번 칸, 입실 옆에 퇴실. 2번 칸, 입실 옆에 퇴실. 3번도, 5번도, 9번도.\n\n7번 칸만 줄이 열한 개였다. 퇴실 칸이 열한 개 다 비어 있었다.\n\n기둥에 붙은 팻말을 확인하러 계단을 내려왔다. 7번이었다.\n-> b06_t2\n\n=== b06_t1_b ===\n상판에 엎드려 난간 밖으로 고개를 내밀었다. 상판 밑면이 보였다.\n\n나무가 오래돼서 결이 일어나 있었다. 그 위에 유성펜으로 한 줄이 적혀 있었다.\n\n> 관리실은 등 뒤에 있다\n\n당연한 말이었다. 당연한 말을 좌대 밑면에 적으려면 엎드려야 한다. 엎드려서까지 적을 만한 말이라는 뜻이다.\n-> b06_t2\n\n=== b06_t1_c ===\n아크릴 틀을 흔들어 봤다. 1번부터 3번까지는 움직이지 않았고 4번만 움직였다 — 얇은 다른 종이에 적혀 틈에 끼워져 있었다.\n\n빼내려다 그만뒀다. 종이를 빼도 규칙은 남는다. 규칙은 종이에 있는 게 아니니까.\n-> b06_t2\n\n=== b06_t2 ===\n확성기가 켜지는 소리가 났다. 등 뒤였다.\n\n> 7번 좌대 이용객님. 관리실입니다. 야간 안전 확인 중입니다. 이상 없으시면 손 들어 주십시오.\n\n고른 목소리였다. 높낮이가 없어서 사람인지 기계인지 갈리지 않았다. 이용객님, 에서 한 번 끊겼다. 뒤에 뭘 더 붙이려다 만 것 같았다.\n\n+ [손을 든다] -> b06_t2_a\n+ [소리 내어 대답한다] -> b06_t2_b\n+ [아무것도 하지 않는다] -> b06_t2_c\n\n=== b06_t2_a ===\n한쪽 손을 들었다. 앉은 채로. 안내가 그러라고 했다.\n\n확성기가 잡음 한 번 내고 꺼졌다. 그게 다였다.\n-> b06_t3\n\n=== b06_t2_b ===\n\"이상 없습니다.\"\n\n확성기가 잠깐 조용했다. 그리고 같은 문장을 다시 냈다.\n\n> 이상 없으시면 손 들어 주십시오.\n\n손을 들었다. 그제야 꺼졌다. 이쪽은 소리를 안 듣는 모양이었다. 아니면 소리를 듣는 건 이쪽이 아니거나.\n~ b06_answered_aloud = true\n-> b06_t3\n\n=== b06_t2_c ===\n가만히 있었다.\n\n안내가 한 번 더 나왔다. 세 번째도 나왔다. 세 번 다 같은 간격이었고 같은 높이였다. 녹음이었을 수도 있다. 그럴 리 없다는 근거도 없었다.\n\n네 번째는 없었다.\n-> b06_t3\n\n=== b06_t3 ===\n찌가 흔들렸다.\n\n케미라이트 점이 좌우로 두 번, 그리고 멈췄다. 아래 반사가 따라 흔들리다 늦게 멈췄다.\n\n바람은 없었다. 난간에 걸어 둔 수건이 그대로였다.\n\n물소리가 났다. 좌대 밑에서. 나무 기둥에 물이 부딪히는 소리였다. 그런 소리가 나려면 물결이 있어야 한다. 수면은 그대로였다.\n\n줄을 봤다. 원줄이 앞이 아니라 기둥 쪽으로 비스듬히 들어가 있었다. 밑걸림처럼 보였다.\n\n3번: 잠길 때만 챔질한다.\n\n+ [챔질한다] -> b06_death_a\n+ [찌가 잠길 때까지 기다린다] -> b06_t3_b\n+ [좌대 밑으로 내려가 줄이 뭐에 걸렸는지 본다] -> b06_death_c\n\n=== b06_t3_b ===\n기다렸다.\n\n찌가 한 번 더 흔들리고, 그다음에 내려갔다. 초록 점이 물 밑에서 잠깐 번지다가 사라졌다. 초릿대가 휘었다. 3번이 말한 그대로였다.\n\n챔질했다. 무거웠다. 살아 있는 무거움이 아니라 가라앉은 무거움이었다. 릴이 돌아가지 않았다.\n\n손전등을 켜서 줄을 따라 비췄다. 수면 아래 한 뼘쯤에서 줄이 뭔가에 감겨 있었다. 흰 것이 조금 보였다.\n\n나뭇가지이길 바라면서 봤다.\n\n다 보기 전에 3번의 뒷말을 떠올렸다. 무거우면 끊는다.\n\n줄을 손가락에 감아 끊었다. 한 번에 끊어지지 않아서 두 번 감았다. 끊어지는 순간 무게가 사라졌고, 물속에서 뭔가 아래로 내려가는 게 손끝에 전해졌다. 그게 전해졌다는 게 이상했다. 줄은 이미 끊어져 있었다.\n\n새 채비를 다는 대신 대를 받침에 걸어 뒀다.\n-> shard(\"나뭇가지이길 바라면서\") -> b06_t4\n\n=== b06_t4 ===\n불렀다.\n\n> 거기 낚시하시는 분.\n\n같은 목소리였다. 확성기 잡음까지 같았다. 켜질 때 나는 딸깍 소리도 같았다.\n\n방향만 달랐다. 등 뒤가 아니었다. 앞이었다. 물 쪽, 수면에서 한 뼘쯤 위, 좌대 기둥에서 열 걸음쯤.\n\n4번은 응답하라고 한다. 2번은 안내가 확성기로만 나간다고 한다. 확성기는 지금 내 등 뒤에서 꺼져 있다.\n\n{b06_answered_aloud: 아까보다 가까웠다. 기둥 바로 앞이었다.}\n\n> 거기 낚시하시는 분. 확인 부탁드립니다.\n\n이름을 부르지는 않았다. 부를 수 있었으면 벌써 불렀을 것이다.\n\n+ [대답한다] -> b06_death_b\n+ [손을 든다] -> b06_death_b\n+ {codex ? calling_voice} [반응하지 않고 계단으로 올라간다] (도감: 부르는 소리) -> b06_t4_c\n+ {not (codex ? calling_voice)} [반응하지 않고 계단으로 올라간다] -> b06_t4_c\n\n=== b06_t4_c ===\n일어섰다. 대를 두고 갔다.\n\n계단 열두 칸을 셌다. 세 칸에서 한 번 더 불렀고, 여덟 칸에서 한 번 더 불렀다. 열두 칸에서는 부르지 않았다.\n-> b06_clear\n\n=== b06_clear ===\n제방 위에 서서 뒤를 봤다. 좌대 열두 개가 검은 물 위에 나란히 있었다. 7번 좌대에 케미라이트가 없었다. 아까 끊어 보냈으니 당연했다.\n\n나머지 열한 개 좌대에는 전부 초록 점이 하나씩 켜져 있었다. 앉아 있는 사람은 없었다.\n\n확성기가 켜졌다. 등 뒤였다.\n\n> 7번 좌대. 이용 종료.\n\n번호로 시작해서 번호로 끝났다. 그게 제일 나은 마무리라는 걸 이제는 알았다.\n\n주차장 쪽으로 걸었다. 물 쪽은 조용했다.\n-> cleared\n\n// ── 사망 knot 3종(트리거 4개 — 턴4 A/B가 같은 사망으로 합류). 본문 §사망 그대로.\n// 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b06_death_a ===\n흔들리는 데 맞춰 대를 세웠다.\n\n줄이 팽팽해졌다. 그리고 반대쪽에서 똑같은 세기로 팽팽해졌다. 밀고 당기는 게 아니라 맞춰 주는 힘이었다.\n\n흔드는 것은 묻는 것이고, 채는 것은 대답하는 것이다. 3번은 그 얘기를 하고 있었다. 읽고도 몰랐다.\n\n릴이 저절로 풀리기 시작했다. 대가 아니라 내가 딸려 갔다.\n-> die(\"당신은 흔들리는 찌에 챔질했습니다.\", b06_bite)\n\n=== b06_death_b ===\n\"네.\"\n\n손을 들었더라도 같았을 것이다. 4번은 응답하라고 했고, 손 드는 것도 응답이다.\n\n물 쪽에서 잡음이 한 번 났다.\n\n> 확인됐습니다. 7번 좌대.\n\n그리고 확성기가 켜졌다. 등 뒤에서. 같은 목소리가 같은 문장을 한 번 더 말했다. 이번엔 관리실 쪽에서 났다.\n\n앞에 있던 것이 뒤로 왔다. 그 사이를 지나온 자리가 어디인지는 보지 않았다.\n-> die(\"당신은 물 쪽 부름에 응답했습니다.\", b06_angler)\n\n=== b06_death_c ===\n난간을 넘어 좌대 밑으로 내려갔다. 콘크리트 경사에 이끼가 앉아 있었다. 발이 미끄러져서 물에 닿았다.\n\n발목까지였다. 차갑지 않았다. 차가워야 했는데.\n\n줄이 기둥을 돌아 물속으로 곧게 들어가 있었다. 손으로 잡았다. 잡자마자 저쪽에서 잡았다.\n\n흐르는 물이면 뭔가 떠내려가기라도 한다. 여긴 흐르지 않는다. 들어간 것은 그 자리에 있다. 열한 줄이 그 자리에 있다.\n-> die(\"당신은 물가로 내려갔습니다.\", b06_waterside)\n\n// ── /INCLUDE B06.ink ──\n// ── INCLUDE B07.ink ──\n// ink/B07.ink — B07. 배달 대기실 (식당 × 공간왜곡)\n// 원본: spaces/B07_배달대기실.md\n// 규약: A02.ink와 동일. 턴 = flat knot. 선택지 divert는 같은 줄. 사망은 별도 knot ->\n// die(\"사망 문구\", codex_entry). B 가중치 = 1. 조각 없음. 파편 없음(표 \"·\").\n// 내부 상태(공간 밖으로 안 나감): b07_knows_lamp / b07_got / b07_missed.\n// codex 신규 항목(main.ink에 추가 필요): b07_lamp, b07_gap, b07_wall — ink/B07.codex.txt 참조.\n\n=== b07_gate ===\n~ current_space = \"B07\"\n~ current_weight = 1.0\n~ b07_knows_lamp = false\n~ b07_got = false\n~ b07_missed = false\n-> b07_intro\n\n=== b07_intro ===\n접이식 철제 의자에 앉아 있었다.\n\n등받이가 낮아서 어깨가 남았다. 무릎에 보온 가방이 있었다. 사각형인데 비어 있어서 각이 죽어 있었다.\n\n자세부터 알았다. 오래 앉아 있던 자세였다.\n-> b07_t1\n\n=== b07_t1 ===\n배달 대기실이었다.\n\n넓지 않았다. 벽 넷, 의자 한 줄, 형광등 하나. 창은 없었다.\n\n출입문 위에 벽시계가 걸려 있었다. 03:47. 초침이 없었다.\n\n벽 위쪽에 페인트로 번호가 하나씩 적혀 있었다. 1, 2, 3, 4.\n\n주방문은 하나였다. 3번 벽에 있었다. 스테인리스, 손잡이 하나, 문 위에 작은 등. 지금은 꺼져 있었다.\n\n옆 벽에 아크릴 액자가 걸려 있었다.\n\n\\**배달 대기실 이용 안내** (□□식당) #rules:B07\n\n1. 표시등이 켜진 문에 순번 없이 들어간다. #fake #dmg:tape\n2. 순번표가 지정한 벽만 연다. 없으면 기다린다.\n3. 문틈으로 냄새를 맡지 않는다.\n4. 벨이 멎은 뒤에 출입문을 연다.\n\n대기석 배정 — {gender == \"m\":남 기사 안쪽 줄|여 기사 바깥 줄}\n\n의자는 한 줄뿐이었다. 배정된 줄이 어느 줄인지 알 수 없었다.\n\n1번은 불 켜진 문이면 어디든 된다고 하고, 2번은 지정된 벽만 열라고 한다. 지정된 벽에 불이 켜지면 둘 다 지킨다. 문제는 안 오는 경우다.\n\n+ [순번표를 본다] -> b07_t1_a\n+ [벽 번호를 보러 간다] -> b07_t1_b\n+ [보온 가방을 연다] -> b07_t1_c\n\n=== b07_t1_a ===\n출입문 옆에 종이가 세로로 붙어 있었다. 왼쪽에 순번, 오른쪽에 벽 번호.\n\n위쪽 줄들은 볼펜으로 그어져 있었다. 지나간 순번이다. 벽 번호가 제각각이었다. 3, 1, 3, 4, 2, 2, 4. 규칙을 찾다가 그만뒀다.\n\n그어지지 않은 첫 줄이 17번이었다. 오른쪽 칸이 비어 있었다.\n\n그 아래로 18, 19, 20. 오른쪽 칸이 전부 비어 있었다.\n\n내가 몇 번인지는 아무도 안 알려줬다. 17번일 것이다. 그어지지 않은 첫 줄이니까.\n-> b07_t2\n\n=== b07_t1_b ===\n네 벽을 한 바퀴 돌았다. 번호는 눈높이보다 한참 위에 있었다.\n\n3번 벽 앞에서 문틀을 봤다. 벽에 제대로 물려 있었다. 나중에 뚫어서 끼운 문이 아니었다.\n\n돌아서다가 걸레받이 위에 볼펜 글씨를 봤다. 앉아 있다가 몸을 숙여야 보이는 높이였다.\n\n> 불 켜진 데로 세 번 갔다. 순번표는 그대로였다.\n\n세 번 갔다고 적을 시간이 있었다는 뜻이다. 네 번째는 적혀 있지 않았다.\n-> b07_t2\n\n=== b07_t1_c ===\n지퍼를 열었다. 비어 있었다.\n\n안쪽 바닥에 국물 자국이 있었다. 마른 테두리가 겹쳐서 나이테처럼 남아 있었다. 세었다. 세 겹이었다.\n\n세 번 실었다는 뜻이다. 네 번째 자국은 없었다.\n\n지퍼를 닫고 무릎에 올렸다. 원래 자리인 것처럼 손이 알아서 했다.\n-> b07_t2\n\n=== b07_t2 ===\n벨이 울렸다. 딩동, 두 음.\n\n천장 스피커가 켜졌다.\n\n> 대기 중인 기사님. 준비됐습니다.\n\n녹음이었다. 남자인지 여자인지 알 수 없는 목소리로 두 번 반복하고 끊겼다.\n\n출입문 옆 순번표를 봤다. 그어지지 않은 첫 줄은 17번이었고, 오른쪽 칸에 2가 적혀 있었다. 적히는 걸 보지는 못했다.\n\n2번 벽을 봤다. 번호만 있고 문은 없었다.\n\n3번 벽에는 문이 있었다. 문 위의 등이 켜져 있었다. 초록색이었다.\n\n+ [표시등이 켜진 문으로 들어간다] -> b07_death_a\n+ [앉아서 기다린다] -> b07_t2_b\n+ [안내문 1번을 다시 본다] -> b07_t2_c\n\n=== b07_t2_b ===\n앉았다. 2번 벽에 문이 없으니 남는 선택이 없었다.\n\n벨이 한 번 더 울리다 뚝 끊겼다. 초록 등이 꺼졌다.\n\n그다음이 이상했다. 3번 벽을 보고 있었는데, 눈을 한 번 감았다 뜨니 그 자리가 그냥 벽이었다. 문틀도 경첩 자국도 없었다.\n\n문이 어디로 갔는지는 다음 벨까지 알 수 없었다.\n-> b07_t3\n\n=== b07_t2_c ===\n액자 앞으로 갔다. 유리에 얼굴이 비쳐서 각도를 틀었다.\n\n첫 줄만 유리 안이 아니라 바깥면에 붙은 라벨지였다. 손톱이 걸렸다.\n\n떼었다. 밑에 인쇄된 원래 1번이 있었다.\n\n> 1. 표시등은 환기 표시다. 출입 기준이 아니다.\n\n라벨지는 주머니에 넣었다. 버릴 데가 없었다.\n\n그사이 벨이 뚝 끊겼고, 3번 벽의 문도 없어져 있었다.\n~ b07_knows_lamp = true\n-> b07_t3\n\n=== b07_t3 ===\n벨. 딩동.\n\n> 대기 중인 기사님. 준비됐습니다.\n\n같은 문장, 같은 목소리. 순번표에서 17번 줄이 그어져 있었다. 내가 긋지 않았다.\n\n18번 오른쪽 칸에 4가 적혀 있었다.\n\n4번 벽에 문이 있었다. 아까는 없던 자리다. 문 위 등은 꺼져 있었다.\n\n지정된 벽에 문이 있다. 그런데 불은 꺼져 있다. 2번대로면 열어야 하고, 1번대로면 아직 아니다.\n\n문틈에 코를 대면 안쪽이 주방인지 아닌지 알 수 있을 것 같았다. 3번이 하지 말라고 한 게 정확히 그거였다.\n\n+ [문을 연다] -> b07_t3_a\n+ [등이 켜질 때까지 기다린다] -> b07_t3_b\n+ [문틈에 코를 대고 확인한다] -> b07_death_b\n\n=== b07_t3_a ===\n{b07_knows_lamp: 등은 환기 표시다. 종이가 그렇게 말했다.}\n\n손잡이가 차가웠다. 당기는 문이었다.\n\n주방이었다. 좁고 짧았다. 조리대 하나, 스테인리스 선반, 후드. 불은 반만 켜져 있었다.\n\n사람은 없었다.\n\n안쪽 어디선가 물이 흐르고 있었다. 수도를 끝까지 잠그지 않은 소리. 흐르는 데가 보이지 않아서 소리만 좁은 방을 돌았다.\n\n선반 위에 비닐로 묶은 포장이 하나 있었다. 아직 뜨거웠다.\n\n가방에 넣고 나왔다. 열어 둔 채로 나왔는데 돌아보니 닫혀 있었다.\n~ b07_got = true\n-> b07_t4\n\n=== b07_t3_b ===\n기다렸다. 1번대로.\n\n등은 켜지지 않았다. 대신 벨이 뚝 끊겼고, 4번 벽의 문이 없어졌다. 없어지는 걸 본 건 아니다. 그건 안 볼 때만 하는 모양이었다.\n\n순번표에서 18번 줄이 그어졌다. 이번에도 내가 긋지 않았다.\n~ b07_missed = true\n-> b07_t4\n\n=== b07_t4 ===\n벨. 이번엔 길게 울렸다. 끊지 않고 이어서.\n\n> 대기 중인 기사님. 1번 벽입니다.\n\n처음으로 다른 말이었다. 두 번 반복했다.\n\n1번 벽에 문이 있었다. 문 위 등이 켜져 있었다. 초록색.\n\n순번표를 봤다.\n\n{b07_got: 19번 오른쪽 칸에 3이 적혀 있었다. 3번 벽에는 문이 없었다.}\n{b07_missed: 19번 오른쪽 칸도, 그 아래도 비어 있었다. 내 순번은 이미 그어진 뒤였다.}\n\n안내문을 다시 읽었다. 네 줄 어디에도 스피커 얘기는 없었다. 벽 번호는 순번표에서 확인한다고만 적혀 있었다.\n\n안내문에 없는 지시가 천장에서 내려오고 있었다.\n\n+ [1번 벽 문으로 들어간다] -> b07_death_c\n+ {not (codex ? calling_voice)} [앉아서 벨이 멎기를 기다린다] -> b07_t4_b\n+ {codex ? calling_voice} [앉아서 벨이 멎기를 기다린다] (도감: 부르는 소리) -> b07_t4_b\n+ [순번표를 한 번 더 확인한다] -> b07_t4_c\n\n=== b07_t4_b ===\n앉았다. 무릎에 가방을 올리고 손을 얹었다.\n\n스피커가 세 번째, 네 번째로 1번 벽을 말했다. 다섯 번째에는 벽 번호 없이 기사님만 불렀다. 불러 놓고 아무 말도 하지 않았다.\n\n벨이 잦아들었다. 끊긴 게 아니라 멎었다. 등이 꺼졌고, 1번 벽을 다시 봤을 때 거기는 벽이었다.\n\n4번대로 출입문을 열었다.\n-> b07_clear\n\n=== b07_t4_c ===\n줄을 손가락으로 짚어 가며 다시 읽었다. 바뀐 건 없었다.\n\n읽는 동안 스피커는 계속 1번 벽을 말했다. 종이는 아무 말도 하지 않았다.\n-> b07_t4\n\n=== b07_clear ===\n밖은 골목이었다. 시멘트 담, 실외기, 어둠.\n\n{b07_got: 가방이 한쪽으로 기울었다. 어디로 가져가야 하는지는 아무도 말해주지 않았다.}\n{b07_missed: 가방은 가벼웠다. 빈 가방을 들고 나가는 게 나가는 건지는 모르겠지만, 벨이 멎었고 문은 열렸다.}\n\n등 뒤에서 벨이 다시 울렸다. 이번엔 나를 부르는 게 아니었다. 종이에 20번이 있었다.\n-> cleared\n\n// ── 사망 knot 3종 ──\n\n=== b07_death_a ===\n문을 당겼다. 열렸다.\n\n주방이 아니었다. 문틀 안쪽이 콘크리트였다. 미장이 되어 있고 페인트까지 칠해져 있었다. 문 뒤에 급하게 세운 벽이 아니라, 원래부터 거기 있던 벽이었다.\n\n닫으려고 손잡이를 당겼는데 문이 움직이지 않았다. 문이 안 움직이는 게 아니었다. 내가 문틀 안에 들어와 있었다. 언제 한 발을 옮겼는지 모르겠다.\n\n등이 머리 위에서 켜져 있었다. 초록색은 사람 얼굴에 좋은 색이 아니다.\n\n등 뒤에서 벨이 울렸다. 종이가 한 줄 내려가는 소리는 나지 않았지만, 내려갔을 것이다.\n-> die(\"당신은 표시등을 따라갔습니다.\", b07_lamp)\n\n=== b07_death_b ===\n무릎을 굽히고 문틈에 얼굴을 댔다.\n\n음식 냄새는 나지 않았다. 젖은 종이 냄새가 났다. 오래 접어 둔 걸 펼쳤을 때 나는 냄새.\n\n숨을 들이켰는데 들어오지 않았다. 나가고 있었다. 틈은 좁은데 나가는 양이 많았다.\n\n문 반대쪽에도 누가 문틈에 얼굴을 대고 있었다. 그쪽은 들이켜고 있었다.\n-> die(\"당신은 문틈으로 확인했습니다.\", b07_gap)\n\n=== b07_death_c ===\n문을 열었다. 주방이었다. 조리대, 선반, 후드. 사람은 없었다.\n\n선반 위에 포장이 하나 있었다. 그 옆 벽에 종이가 붙어 있었다. 순번표였다. 대기실 것과 같은 종이, 같은 칸.\n\n19번 오른쪽 칸에 3이 적혀 있었다. 3번 벽으로 가라는 뜻이다.\n\n주방을 둘러봤다. 벽은 하나였고 번호가 없었다. 문도 없었다. 들어온 문이 있던 자리로 후드 배관이 지나가고 있었다.\n\n스피커가 켜졌다.\n\n> 대기 중인 기사님. 준비됐습니다.\n\n이쪽에서 들으니 알겠다. 저건 부르는 소리가 아니라 내보내는 소리다. 내보낼 사람이 여기 없어서 계속 울린다.\n-> die(\"당신은 안내문에 없는 지시를 따랐습니다.\", b07_wall)\n\n// ── /INCLUDE B07.ink ──\n// ── INCLUDE B08.ink ──\n// ink/B08.ink — B08. 새벽 예배 (종교시설 × 수량이상)\n// 원본: spaces/B08_새벽예배.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b08_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0.\n// 파편 없음(설계서 §1 표 \"·\") — shard() 호출 없음.\n// (필요 항목은 ink/B08.codex.txt 참고 — main.ink는 건드리지 않는다.)\n//\n// 공간 로컬 플래그: b08_still(턴2-B) / b08_counted(턴2-C) — 턴3 호명 문장만 바꾸고\n// 밖으로 나가지 않는다. gate에서 리셋. b08_still은 이 배치본에서 텍스처 전용으로\n// 대입만 하고 조건부 텍스트에는 쓰지 않는다(원본 §6 그대로 — 참조 지점 없음).\n\nVAR b08_still = false\nVAR b08_counted = false\n\n=== b08_gate ===\n~ current_space = \"B08\"\n~ current_weight = 1.0\n~ b08_still = false\n~ b08_counted = false\n-> b08_intro\n\n=== b08_intro ===\n종이 넘어가는 소리가 났다.\n\n한 장이 아니었다. 여러 장이 거의 같이, 조금씩 어긋나게 넘어갔다. 그걸 듣고 나서 눈을 떴다.\n\n나무 바닥이었다. 방석 위에 앉아 있었고, 무릎에 접힌 종이가 한 장 놓여 있었다. 양말이 얇았다.\n\n예배당이었다. 회중석 맨 뒷줄. 앞쪽으로 뒤통수들이 있었다. 가운데 통로를 두고 좌우로 나뉘어 있었고, 기둥에 낡은 종이가 붙어 있었다. {gender == \"m\":남자석|여자석}. 그쪽에 앉아 있었다.\n\n강대상 왼쪽 벽에 시계가 걸려 있었다. 03:47. 초침이 없었다. 벽지가 그 자리만 덜 바랬다.\n\n무릎 위 종이를 폈다.\n-> b08_t1\n\n=== b08_t1 ===\n\\**새벽 예배 안내** #rules:B08\n\n1. 예배 중에는 세지 않고 순서지를 넘긴다.\n2. 자리를 부르면 답하거나 돌아보지 않는다.\n3. 수가 맞지 않으면 뒤를 확인해 알린다. #fake #dmg:ink\n4. 신발장은 번호표에 적힌 칸만 연다. #dmg:ink\n\n3번을 두 번 읽었다. 세지 말라고 해 놓고, 수가 맞지 않는 걸 알아차리면 어떻게 하라고 한다. 세지 않은 사람이 무엇을 알아차리나.\n\n마지막 번호 4는 인쇄된 3 위에 덧찍혀 획이 두 겹이었다 — 세 줄이어야 할 종이에 줄이 넷이었다.\n\n아직 강대상은 비어 있었다. 예배는 시작하지 않았다. 1번은 예배 중의 이야기다.\n\n+ [방석을 본다] -> b08_t1_a\n+ [뒤쪽 입구를 본다] -> b08_t1_b\n+ [순서지를 뒤집어 본다] -> b08_t1_c\n\n=== b08_t1_a ===\n바닥에 깔린 방석을 셌다. 앞줄부터 왼쪽 오른쪽, 열둘. 내 것까지 열둘.\n\n앉은 사람은 세지 않았다. 뒤통수는 다 비슷하게 생겼고 어두웠다. 세려면 일어서야 했을 것이다.\n\n내 방석 옆에 나무 패가 하나 놓여 있었다. 신발장 번호표였다. 7이라고 파여 있었다.\n-> b08_t2\n\n=== b08_t1_b ===\n뒷줄이라 몸만 틀면 보였다. 문 옆에 신발장. 열두 칸, 칸마다 번호가 붙어 있었다.\n\n신발이 든 칸은 열하나였다. 그 옆 봉투꽂이에 흰 봉투가 꽂혀 있었고, 빠진 자리가 열하나였다.\n\n신발장 위에 공책이 펼쳐져 있었다. 날짜와 숫자만 적혀 있었다. 11 11 12 11 11 12 12 11. 오늘 날짜 칸은 비어 있었다. 관리인은 끝난 뒤에 적으니까.\n-> b08_t2\n\n=== b08_t1_c ===\n뒷면은 순서 목록이었다. 묵도, 찬송, 읽는 순서, 기도, 헌금, 마침. 여섯 줄에 번호가 붙어 있었고 이쪽 번호는 멀쩡했다.\n\n아래 여백에 연필로 세 줄이 적혀 있었다. 눌러 쓴 자국만 남을 만큼 작았다.\n\n> 손만 움직여라\n> 세면 부른다\n> 뒤는 없다\n\n세 줄 다 같은 필체였다. 앉아서 무릎 위에 대고 쓴 글씨였다.\n-> b08_t2\n\n=== b08_t2 ===\n인도자가 강대상에 올라왔다. 스피커가 켜지는 소리가 났다.\n\n인도자가 낮게 뭔가를 읽기 시작했다. 소리는 계속 났는데 단어가 하나도 잡히지 않았다. 귀가 이상한 건지 소리가 이상한 건지는 알 수 없었다.\n\n앞에서 종이가 넘어갔다. 여러 장이 거의 같이, 조금씩 어긋나게.\n\n+ [순서지를 넘긴다] -> b08_t2_a\n+ [손을 무릎에 둔다] -> b08_t2_b\n+ [넘기는 소리를 센다] -> b08_t2_c\n\n=== b08_t2_a ===\n같이 넘겼다. 내 종이가 내는 소리는 남들 것에 묻혀서 들리지 않았다.\n\n뒷면 목록의 두 번째 줄이 진행 중이었다. 손이 할 일이 있는 게 나쁘지 않았다.\n-> b08_t3\n\n=== b08_t2_b ===\n넘기지 않았다. 손을 무릎에 얹고 앞을 봤다.\n\n앞줄들이 넘기는 동안 내 자리만 조용했다. 인도자가 순서를 한 번 더 불렀다. 아까와 같은 높이, 같은 속도로. 재촉은 아니었다.\n~ b08_still = true\n-> b08_t3\n\n=== b08_t2_c ===\n세지 말라고 한 건 예배 중이었고, 예배는 이미 시작한 뒤였다.\n\n그래도 셌다. 소리가 겹치는 것들을 하나씩 떼어 냈다. 앞줄에서 넷, 그다음 줄에서 넷, 그다음에서 셋. 내 것 하나.\n\n열둘이었다. 신발은 열하나였는데.\n\n인도자의 소리가 한 박자 멈췄다가 이어졌다.\n~ b08_counted = true\n-> b08_t3\n\n=== b08_t3 ===\n밖에서 물소리가 났다. 마당 수돗가 같았다. 잠그다 만 것처럼 가늘게 흘렀고, 아무도 나가지 않았다.\n\n마이크가 울렸다. 인도자의 목소리였는데 읽을 때와 달리 단어가 또렷했다.\n\n> 뒤에 앉으신 분.\n\n{b08_counted: 한 박자 뒤에 덧붙었다. **맨 뒷줄, 왼쪽에서 세 번째.** 내 자리였다.}\n\n사무적인 목소리였다. 안내 방송처럼. 뒤에 앉은 사람이 누구인지 이미 아는 사람의 목소리는 아니었다. 그냥 자리를 읽는 목소리였다.\n\n내가 맨 뒷줄이었다. 내 뒤에는 문과 신발장뿐이었다.\n\n+ [대답한다] -> b08_death_a\n+ [고개를 돌린다] -> b08_death_b\n+ {codex ? calling_voice} [앞만 보고 순서지를 넘긴다] (도감: 부르는 소리) -> b08_t3_c\n+ {not (codex ? calling_voice)} [앞만 보고 순서지를 넘긴다] -> b08_t3_c\n\n=== b08_t3_c ===\n넘겼다. 종이 소리가 났다.\n\n마이크는 같은 말을 한 번 더 했다. 그다음엔 하지 않았다. 인도자가 다시 낮게 읽기 시작했고 단어는 여전히 들리지 않았다.\n\n목록의 다섯 번째 줄에서 헌금 봉투 꽂이가 앞줄로 돌아왔다. 내 앞으로는 오지 않았다. 뒷줄까지 오기 전에 방향이 바뀌었다.\n-> b08_t4\n\n=== b08_t4 ===\n인도자의 마지막 소리가 났다. 짧았다. 그것도 무슨 말인지는 몰랐다.\n\n창이 회색이 됐다. 시계는 그대로였다.\n\n사람들이 일어났다. 아무도 뒤를 보지 않고 통로로 나가서, 신발장에서 자기 칸을 열고, 신고, 나갔다. 열한 명이었을 것이다. 세지 않았으니 모른다.\n\n관리인이 들어와 방석을 걷기 시작했다.\n\n남은 건 내 칸과, 아까부터 비어 있던 칸이었다. 내 번호표는 7이었다.\n\n+ [번호표대로 7번 칸을 연다] -> b08_t4_a\n+ [빈 칸을 열어 본다] -> b08_death_c\n+ [방석 걷는 것을 돕는다] -> b08_t4_c\n\n=== b08_t4_a ===\n순서지를 접어 꽂이에 뒀다. 7번 칸을 열었다. 신발이 있었다. 내 발에 맞았다.\n\n문을 밀었다. 마당 수도는 아직 흐르고 있었고, 잠그러 가지 않았다. 그건 관리인 일이다.\n-> b08_clear\n\n=== b08_t4_c ===\n방석을 걷어 관리인에게 건넸다. 관리인이 받으면서 소리를 내지 않고 입만 움직였다. 세고 있었다.\n\n다 걷고 나서 공책을 폈다. 오늘 날짜 옆에 12를 적었다.\n\n신발장은 보지 않았다. 봉투꽂이도 보지 않았다. 관리인이 세는 것은 방석이고, 방석은 열둘이었다.\n\n밖으로 나간 사람이 몇인지 물어보고 싶었지만 묻지 않았다. 안내 1번이 그 뜻이었다. 세는 건 관리인 일이다. 관리인은 방석만 센다.\n\n7번 칸에서 신발을 꺼냈다. 나오면서 빈 칸을 지나쳤다. 열지 않았다.\n-> b08_clear\n\n=== b08_clear ===\n// 클리어. 다음 앵커 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b08_death_a ===\n\"예.\"\n\n내 목소리가 예배당에 크게 울리지도 않았는데 강대상 스피커가 바로 받았다.\n\n> 예. 자리 확인했습니다.\n\n그게 끝이었다. 인도자는 다시 낮게 읽었고, 앞줄들은 순서지를 넘겼고, 아무도 돌아보지 않았다.\n\n뒤에 앉은 사람이 됐다. 이 자리는 이제 대답할 사람이 있는 자리다. 다음 새벽에도 누군가 여기까지 부를 것이고, 그때 대답하는 것은 내가 아닐 것이다.\n-> die(\"당신은 자리로 부르는 소리에 대답했습니다.\", b08_seat)\n\n=== b08_death_b ===\n고개를 돌렸다.\n\n문과 신발장. 열두 칸. 아무도 없었다. 부를 사람이 없었다.\n\n다시 앞을 봤다. 무릎 위가 비어 있었다.\n\n앞줄 어딘가에서 종이가 한 장 넘어갔다. 그 소리는 남들 것에 묻히지 않았다. 내 것이었다.\n\n순서지를 넘기라고 적혀 있었다. 멈춘 게 아니었다. 넘길 것이 없었다.\n-> die(\"당신은 뒤를 돌아봤습니다.\", b08_behind)\n\n=== b08_death_c ===\n빈 칸을 열었다. 번호가 지워져 있었다.\n\n손을 넣었다. 아무것도 없었다. 먼지도 없었다. 오래 비어 있던 칸이 아니라 방금 비운 칸 같았다.\n\n등 뒤에서 스피커가 켜지는 소리가 났다. 인도자의 첫 소리가 났다.\n\n예배당을 봤다. 방석이 다시 깔려 있었다. 열둘. 열한 자리에 뒤통수가 있었다.\n-> die(\"당신은 남는 수를 찾았습니다.\", b08_empty)\n\n// ── /INCLUDE B08.ink ──\n// ── INCLUDE B09.ink ──\n// ink/B09.ink — B09. 심야 피시방 (오락시설 × 규칙서자체)\n// 원본: spaces/B09_PC방.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지 divert는 같은 줄. 사망은 별도 knot ->\n// die(\"사망 문구\", codex_entry). B 가중치 = 1. 조각 없음(앵커 전용). 파편 1(턴 1-A) — B01.ink와\n// 같은 방식으로 shard()에 문구를 직접 인자로 넘긴다(main.ink는 아직 shard()가 없다 —\n// ink/B09.codex.txt 참고, 상위가 fragment()와 같은 tunnel 방식으로 병합할 것).\n// 내부 상태 없음(공간 로컬 VAR 0개).\n\n=== b09_gate ===\n~ current_space = \"B09\"\n~ current_weight = 1.0\n-> b09_intro\n\n=== b09_intro ===\n생수통에서 공기 방울이 올라갔다. 꼬록, 하고 한 번. 물이 조금 줄었다.\n\n손에 플라스틱 조각이 있었다. 손톱만 했다. 검은 바탕에 흰 숫자로 17.\n\n키보드 앞이었다. 화면은 켜져 있었고 아직 아무것도 없었다.\n-> b09_t1\n\n=== b09_t1 ===\n피시방이었다.\n\n좌석이 벽을 따라 늘어서 있었다. 칸막이는 어깨 높이. 의자는 전부 밀어 넣어져 있었고, 화면은 전부 꺼져 있었다. 내 것과 바로 옆 것만 켜져 있었다.\n\n화면 위쪽에 좌석 번호가 떠 있었다. 17. 그 옆이 시각 표시 자리였는데 비어 있었다. 숫자가 들어갈 칸만 있고 숫자가 없었다.\n\n고개를 들었다. 안쪽 카운터 벽에 시계가 걸려 있었다. 03:47. 초침이 없었다.\n\n화면 가운데에 창이 떴다.\n\n\\**□□피시 이용 수칙** — 좌석 17 / v.9 / 수칙은 좌석마다 다릅니다. #rules:B09\n\n1. 본인 좌석의 수칙만 따릅니다.\n2. 인접 좌석의 최신 수칙을 적용합니다. (18) #fake #dmg:ink\n3. 다른 번호를 부르면 일어나지 않습니다.\n4. 마칠 때 로그아웃하고 번호표를 반납합니다.\n\n부칙. {gender == \"m\":남성|여성} 손님은 좌석을 옮길 때 카운터에 알립니다.\n\n확인 버튼 위에 커서를 올려놓고 다시 읽었다.\n\n2번만 줄 간격이 좁고 글자가 작았다. 문장 끝에 (18)이 붙어 있었다.\n\n1번은 내 자리 것만 따르라고 했고, 2번은 옆 자리 것을 따르라고 했다. 두 문장이 같은 창 안에 있었다.\n\n확인을 눌렀다. 창이 접혀 들어가고 바탕만 남았다.\n\n+ [옆 좌석 화면을 본다] -> b09_t1_a\n+ [책상 유리 밑을 본다] -> b09_t1_b\n+ [카운터로 가 본다] -> b09_t1_c\n\n=== b09_t1_a ===\n의자를 조금 밀고 목을 뺐다. 18번이었다. 의자는 안쪽까지 밀어 넣어져 있는데 화면은 켜져 있었다.\n\n같은 창이 떠 있었다. 좌석 18 / 수칙 v.12. 항목이 8번까지 갔다. 2번 자리에 내 2번과 똑같은 문장이 있었다. 줄 간격이 위아래와 같았고, 끝에 괄호가 없었다.\n\n그 창 뒤에 다른 창이 하나 더 있었다. 채팅창이었다. 말한 사람 자리가 비어 있고, 남은 줄은 하나였다.\n\n> 이제 그만\n\n입력칸에 커서가 깜빡였다. 비어 있었다.\n-> shard(\"이제 그만\") -> b09_t2\n\n=== b09_t1_b ===\n책상 유리 밑에 종이가 눌려 있었다. 전단지 뒷면 같은 것. 손으로 쓴 두 줄이었다.\n\n> 17은 17만.\n\n볼펜. 그 아래 다른 필체로, 종이가 파일 만큼 눌러쓴 것.\n\n> 버전 올리지 마.\n\n두 사람이었다. 아니면 한 사람이 두 번. 어느 쪽이든 둘 다 이 자리에 앉아 있었고, 둘 다 자리에 대해 썼다.\n-> b09_t2\n\n=== b09_t1_c ===\n카운터에 사람이 없었다. 의자는 있었고, 등받이에 옷이 걸려 있지 않았다.\n\n방송 장치가 하나 있었다. 스위치가 눌린 채였다. 그 옆 정산기, 그 옆 좌석 현황판. 네모가 잔뜩인 판에서 켜진 건 둘이었다. 17, 18. 둘 다 이용 중.\n\n옆에 정수기. 생수통이 반쯤 찼다. 시계는 그 위였다. 아까 본 그대로였다.\n\n자리로 돌아왔다. 내 화면은 켜져 있었다. 당연했다.\n-> b09_t2\n\n=== b09_t2 ===\n스피커가 켜지는 소리가 났다.\n\n> 18번 손님. 이용 시간 종료됐습니다. 카운터로 와 주세요.\n\n사무적이었다. 하루에 같은 문장을 백 번쯤 말하는 사람의 목소리. 급하지 않고, 다시 부를 생각도 없어 보였다.\n\n책상 홈을 봤다. 번호표가 하나 놓여 있었다. 18. 내 17번은 손에 있었다.\n\n언제부터 거기 있었는지는 모른다. 앉을 때는 보지 않았다.\n\n3번은 부르는 번호가 내 번호와 다르면 일어나지 말라고 했다.\n\n+ {codex ? calling_voice} [일어나지 않는다] (도감: 부르는 소리) -> b09_t2_a\n+ {not (codex ? calling_voice)} [일어나지 않는다] -> b09_t2_a\n+ [18번 번호표를 들고 카운터로 간다] -> b09_death_b\n+ [18번 번호표를 뒤집어 본다] -> b09_t2_c\n\n=== b09_t2_a ===\n앉아 있었다. 등받이에 등을 붙이고, 발을 의자 다리에 걸고.\n\n방송은 그걸로 끝이었다. 18번 화면이 스스로 어두워졌다가 다시 켜졌다. 채팅창이 맨 앞으로 올라와 있었다.\n-> b09_t3\n\n=== b09_t2_c ===\n집어서 뒤집었다. 17번 것과 똑같은 플라스틱이었다. 뒷면에 네모 칸이 인쇄돼 있고 위에 작게 \"반납\" 이라고 찍혀 있었다.\n\n칸이 비어 있었다. 내 것도 비어 있었다. 그건 당연했다. 아직 안 나갔으니까.\n\n18번은 이용 시간이 끝났다고 했다. 끝난 사람의 칸도 비어 있었다.\n-> b09_t3\n\n=== b09_t3 ===\n화면 가운데에 창이 새로 떴다. 하던 것을 덮고 앞으로 올라왔다.\n\n> 인접 좌석의 수칙이 갱신되었습니다. 좌석 18 / 수칙 v.12.\n> 최신 수칙을 적용하시겠습니까?\n\n버튼이 둘이었다. 적용, 취소. 그 사이에 작은 글씨로 \"수칙 비교\".\n\n2번은 적용하라고 했다. 1번은 내 좌석 것만 따르라고 했다. 둘 다 내가 확인을 누른 창에 있던 문장이다.\n\n한 문장은 줄 간격이 위아래와 같았다. 다른 문장은 좁았고 끝에 괄호가 붙어 있었다.\n\n+ [적용한다] -> b09_death_a\n+ [취소한다] -> b09_t3_b\n+ [수칙 비교를 눌러 본다] -> b09_t3_c\n\n=== b09_t3_b ===\n취소를 눌렀다. 창이 닫혔다.\n\n닫히고 나서 화면 위 좌석 번호를 봤다. 17. 그대로였다. 그대로인 걸 확인해야 하는 상황이 어떤 상황인지는 생각하지 않기로 했다.\n-> b09_t4\n\n=== b09_t3_c ===\n눌렀다. 화면이 좌우로 갈렸다.\n\n왼쪽이 내 것. 네 항목. 오른쪽이 18번 것. 여덟 항목. 겹치는 문장에 색이 들어왔다. 2번이 양쪽에서 같이 켜졌다.\n\n오른쪽 2번은 위아래와 조판이 같았고 왼쪽 2번만 좁고 작았다. 어느 쪽이 원래 자리인지는 볼 것도 없었다.\n\n비교 창을 닫았다. 적용 버튼이 회색이 되어 있었다. 눌리지 않았다. 취소만 남아서 취소를 눌렀다.\n-> b09_t4\n\n=== b09_t4 ===\n화면 위를 봤다. 좌석 번호는 17이었고, 그 옆 칸은 아직도 비어 있었다. 들어올 때부터 한 번도 채워진 적이 없었다.\n\n스피커가 켜졌다.\n\n> 17번 손님. 이용 시간 종료됐습니다. 카운터로 와 주세요.\n\n아까와 같은 문장이었다. 번호만 달랐다. 목소리도 같았고 피로도 같았다.\n\n3번은 부르는 번호가 내 번호와 다르면 일어나지 말라고 했다. 다르지 않았다.\n\n+ [로그아웃하고 17번 번호표를 들고 간다] -> b09_clear\n+ [화면을 잠그고 번호표만 들고 나간다] -> b09_death_c\n+ [그대로 앉아 있는다] -> b09_t4_c\n\n=== b09_t4_c ===\n앉아 있었다. 방송은 다시 나오지 않았다.\n\n화면 위 좌석 번호가 한 번 깜빡였다. 17이 잠깐 18이 됐다가 17로 돌아왔다. 화면 밝기가 변한 것도 아니고, 창이 뜬 것도 아니었다.\n\n이 자리는 내가 앉아 있는 동안만 내 자리다. 그건 어느 항목에도 적혀 있지 않았고, 적혀 있을 필요도 없었다.\n\n일어났다. 로그아웃을 눌렀다.\n-> b09_clear\n\n=== b09_clear ===\n화면이 검어졌다. 좌석 번호도 빈 칸도 같이 사라졌다.\n\n17번 번호표를 들고 카운터로 갔다. 18번 것은 책상 홈에 그대로 뒀다. 옮기지 않았다. 옮기는 건 알리게 되어 있었고, 알릴 데가 없었다.\n\n정산기 접시에 번호표를 놓았다. 화면에 한 줄이 떴다. 좌석 17 / 정산 완료. 금액 칸은 비어 있었다.\n\n카운터 스피커에 불이 들어왔다가 꺼졌다. 아무 말도 나오지 않았다.\n\n나오는 길에 현황판을 봤다. 켜진 네모가 하나였다. 18.\n\n생수통 안쪽 벽에 방울이 하나 붙어 있었다. 올라가지 않았다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b09_death_a ===\n적용을 눌렀다. 화면이 한 번 깜빡이더니 항목이 여덟 개가 됐다. 2번 끝의 괄호가 사라져 있었다.\n\n화면 위 좌석 번호를 봤다. 18.\n\n의자를 밀지도 않았고 일어서지도 않았는데, 칸막이가 아까와 반대쪽에 있었다. 오른쪽을 봤다. 17번 자리였다. 화면이 켜져 있고, 의자가 안쪽까지 밀어 넣어져 있고, 책상 홈에 번호표가 하나 놓여 있었다.\n\n> 17번 손님. 이용 시간 종료됐습니다. 카운터로 와 주세요.\n\n일어나지 않았다. 내 번호가 아니었으니까. 3번은 그렇게 하라고 했고, 나는 이제 그 자리의 수칙을 따르고 있었다.\n-> die(\"당신은 다른 좌석의 수칙을 적용했습니다.\", b09_neighbor)\n\n=== b09_death_b ===\n18번 번호표를 들고 카운터로 갔다. 아무도 없었다. 접시에 올려놓았다.\n\n정산기가 읽었다. 좌석 18 / 이용 시간 종료 / 정산 완료. 그리고 한 줄 더.\n\n> 다음 이용 시 좌석 18을 배정합니다.\n\n뒤를 돌아봤다. 17번 자리 화면이 꺼져 있었다. 손에 아직 17번 번호표가 있는데도 꺼져 있었다.\n\n정산된 좌석은 다음 손님에게 배정된다. 4번은 번호표를 반납하라고 했지, 자기 번호표여야 한다고는 하지 않았다.\n-> die(\"당신은 다른 번호로 정산했습니다.\", b09_tag)\n\n=== b09_death_c ===\n화면을 잠갔다. 번호표를 주머니에 넣고 계단을 올라갔다.\n\n문은 밀리는 문이었고, 밀리는 대로 열렸다. 계단참에서 스피커 소리가 따라왔다.\n\n> 17번 손님. 이용 중이십니다.\n\n한 층 더 올라가서도 들렸다. 소리가 커지지도 작아지지도 않았다. 이용 중인 좌석에는 손님이 앉아 있다. 판은 그렇게 세고, 판이 틀리는 경우는 규칙 어디에도 없었다.\n\n주머니에 손을 넣었다. 번호표가 없었다. 넣을 때는 있었다.\n-> die(\"당신은 로그아웃하지 않았습니다.\", b09_inuse)\n\n// ── /INCLUDE B09.ink ──\n// ── INCLUDE B10.ink ──\n// ink/B10.ink — B10. 폐점 직전의 마트 (상점(마트) × 시간이상)\n// 원본: spaces/B10_마트.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지 divert는 같은 줄. 사망은 별도 knot ->\n// die(\"사망 문구\", codex_entry). B 가중치 = 1. 조각 없음(앵커 전용). 파편 없음(05 §4 표 \"·\").\n// 내부 상태(공간 밖으로 안 나감): b10_script_seen — 턴 4 텍스처 한 줄만 바꾼다.\n\n=== b10_gate ===\n~ current_space = \"B10\"\n~ current_weight = 1.0\n~ b10_script_seen = false\n-> b10_intro\n\n=== b10_intro ===\n영수증이 바닥까지 흘러 있었다.\n\n계산대 6번. 롤이 다 풀려서 종이가 발치에 쌓여 있었다. 한 뼘쯤 집어 들어 봤는데 인쇄된 게 하나도 없었다. 흰 종이가 길게.\n\n손에 라벨 프린터가 있었다. 초록 불이 켜져 있었다. 조끼 왼쪽 가슴에 검은 글씨로 정리.\n\n스피커가 켜졌다.\n\n> 고객님께 안내 말씀드립니다. □□마트 신영지점은 10분 후 영업을 종료합니다. 구매하실 상품은 계산대로 가져와 주시기 바랍니다.\n-> b10_t1\n\n=== b10_t1 ===\n매장이었다.\n\n매대 사이 조명은 절반만 켜져 있었다. 켜진 줄과 꺼진 줄이 번갈아 갔다. 통로 끝은 어두웠고 그 어둠이 어디까지인지는 서서 보는 걸로 알 수 없었다.\n\n카트가 몇 대 흩어져 있었다. 밀고 있는 사람은 없었다. 고객님이라고 부른 대상이 이 안에 있는지도 확실하지 않았다.\n\n수산 코너 쪽에서 물소리가 났다. 여과기가 도는 소리였다.\n\n계산대 6번 위에 시계가 있었다. 03:47. 초침이 없었다.\n\n모니터에는 정산 화면이 떠 있었다. 아래쪽에 작은 글씨로 영업 종료까지 00:10:00.\n\n기둥에 코팅된 종이가 케이블타이로 묶여 있었다.\n\n\\**폐점 절차 안내 (야간 정리조용)** — □□마트 신영지점 관리팀 #rules:B10\n\n1. 방송 중에는 출입구를 열지 않는다.\n2. 회차는 남은 시간이 아니라 지점명으로 센다.\n3. 방송이 \"마지막 안내\"라고 말하면 나간다. #fake #dmg:tape\n4. 지점명이 없는 방송 뒤 {gender == \"m\":남자|여자} 탈의실로 나간다.\n\n3번만 글씨가 달랐다. 인쇄체가 아니라 매직이었다.\n\n2번과 4번은 지점명을 세라고 했다. 3번은 말을 세라고 했다. 셋 중 둘만 같은 편이었다.\n\n방송은 방금 신영지점이라고 했다. 네 글자였다.\n\n+ [반품 상자를 본다] -> b10_t1_a\n+ [계산대 화면을 본다] -> b10_t1_b\n+ [수산 코너에 가 본다] -> b10_t1_c\n\n=== b10_t1_a ===\n포장 코너 옆에 골판지 상자가 쌓여 있었다. 맨 위 상자 옆면에 유성펜 글씨가 세로로 있었다.\n\n> 신영지점\n> 영지점\n> 지점\n> 점\n> ―\n\n다섯 줄이었다. 마지막 줄에는 글자 없이 가로줄만 그어져 있었다.\n\n그 아래에 다른 필체로 작게 한 줄.\n\n> 점도 글자다\n\n한 글자씩 줄어든다. 다섯 번이면 없어진다. 상자에 적어 둔 사람은 다섯까지 세고 나서 이걸 여기 두고 갔거나, 다섯까지 세지 못했다.\n-> b10_t2\n\n=== b10_t1_b ===\n정산 화면이었다. 거래 건수 0, 누계 0. 오늘 아무것도 팔지 않았다는 뜻이다.\n\n아래쪽 00:10:00을 한참 봤다. 초 단위가 있는데 초가 움직이지 않았다.\n\n초침이 없는 건 시계 쪽 사정이다. 초침이 있어야 할 자리에 숫자가 있는데 그 숫자가 안 움직이는 건 다른 일이었다.\n\n2번이 왜 시간은 회차가 아니라고 했는지 알 것 같았다. 셀 수 있는 척하는 걸 치워 두려는 것이다.\n-> b10_t2\n\n=== b10_t1_c ===\n수조가 세 칸이었다. 물은 맑았고 여과기는 돌았다. 안에는 아무것도 없었다.\n\n바닥에 굵은소금이 깔려 있고 집게발 하나가 있었다. 나머지는 없었다.\n\n유리에 손자국이 있었다. 손바닥 하나. 바깥이 아니라 안쪽이었다.\n\n물 밖에서 유리 안쪽을 만질 방법을 생각해 봤다. 물속으로 들어가는 방법뿐이었다.\n-> b10_t2\n\n=== b10_t2 ===\n> 고객님께 안내 말씀드립니다. □□마트 영지점은 5분 후 영업을 종료합니다. 구매하실 상품은 계산대로 가져와 주시기 바랍니다.\n\n같은 목소리였다. 같은 속도, 같은 억양. 문장도 한 글자만 빼고 같았다.\n\n영지점. 앞 글자가 없었다. 없어진 자리에서 목소리가 멈추지도 않았다. 원래 세 글자였던 것처럼 매끄럽게 읽었다.\n\n10분이 5분이 됐다. 그건 줄어든 것처럼 보였다.\n\n+ [상자에 회차를 적는다] -> b10_t2_a\n+ [정문 셔터를 올려 본다] -> b10_death_a\n+ [3번 항목의 라벨을 들춘다] -> b10_t2_c\n\n=== b10_t2_a ===\n프린터에서 빈 라벨을 하나 뽑아 상자 옆면에 붙이고, 두 번째 줄 옆에 유성펜으로 작대기를 그었다.\n\n앞사람의 다섯 줄과 나란해졌다. 앞사람은 다섯 줄을 미리 다 적어 놓고 시작했고, 내가 그을 수 있는 건 지나간 만큼뿐이었다.\n\n어느 쪽이 나은지는 모르겠다. 미리 적어 놓고 간 손은 이 매장에 남아 있지 않았다.\n-> b10_t3\n\n=== b10_t2_c ===\n라벨 가장자리가 들떠 있었다. 손톱을 넣으니 절반쯤 떨어지고 아래에서 인쇄체가 나왔다. 앞부분은 접착제에 붙어 뜯겨 나갔다.\n\n> …라고 말해도 회차로 세지 않는다.\n\n라벨을 도로 눌러 붙였다. 붙지 않았다. 반쯤 들린 채로 두고 손을 뗐다.\n\n덧붙인 사람은 인쇄체를 읽고 나서 그 위에 반대말을 썼다. 읽었으면서 그랬다는 게 걸렸다.\n-> b10_t3\n\n=== b10_t3 ===\n> 고객님께 안내 말씀드립니다. □□마트 지점은 10분 후 영업을 종료합니다. 마지막 안내입니다. 직원 여러분은 폐점 준비를 완료해 주시기 바랍니다.\n\n두 글자가 없었다. 그리고 5분이 다시 10분이 됐다.\n\n남은 시간은 줄어드는 게 아니라 왔다 갔다 하는 것이었다. 2번은 그걸 알고 있었다.\n\n마지막 안내입니다, 는 처음 나왔다. 직원 여러분,도 처음이었다. 고객님과 직원 여러분 사이에 이름이 들어갈 자리는 없었다.\n\n3번대로라면 지금 나가야 했다. 4번대로라면 두 글자가 남았으니 아직이었다.\n\n+ [직원 출입구로 나간다] -> b10_death_b\n+ {codex ? calling_voice} [매장에 남아 정리를 계속한다] (도감: 부르는 소리) -> b10_t3_b\n+ {not (codex ? calling_voice)} [매장에 남아 정리를 계속한다] -> b10_t3_b\n+ [방송실에서 대본철을 본다] -> b10_t3_c\n\n=== b10_t3_b ===\n카트를 하나 끌어다 매대에 붙였다. 정리라고 할 만한 걸 했다. 진열이 흐트러진 데는 없었다.\n\n스피커는 조용했다. 방송과 방송 사이는 조용하다. 그 조용함이 얼마나 긴지는 재지 않기로 했다. 재지 말라고 적혀 있었으니까.\n\n두 글자가 남아 있었다.\n-> b10_t4\n\n=== b10_t3_c ===\n사무실 안쪽에 방송실이 있었다. 4번은 지점명이 없어진 뒤에야 나가라고 했고, 사무실은 매장 안이었다.\n\n앰프 랙에 불이 들어와 있었다. 그 위에 코팅된 대본철.\n\n회차별로 문장이 인쇄돼 있었다. 1회부터 5회까지. 지점명 들어갈 자리가 회차마다 짧아졌고, 5회 칸은 괄호만 있고 안이 비어 있었다.\n\n3회, 4회, 5회 문장에 전부 \"마지막 안내입니다\"가 인쇄돼 있었다.\n\n대본 맨 아래에 한 줄.\n\n> 6회 이후 없음\n\n방송을 누가 읽는지는 적혀 있지 않았다.\n~ b10_script_seen = true\n-> b10_t4\n\n=== b10_t4 ===\n> 고객님께 안내 말씀드립니다. □□마트 점은 5분 후 영업을 종료합니다. 마지막 안내입니다. 직원 여러분은 폐점 준비를 완료해 주시기 바랍니다.\n\n{b10_script_seen: 대본 4회 칸과 한 글자도 다르지 않았다. | 세 번째와 한 글자만 달랐다.}\n\n점.\n\n한 글자였다. 조사 앞에 붙은 그 한 글자가 지점명의 전부였다.\n\n한 글자는 글자가 아니라고 생각하고 싶어졌다. 상자 옆면에 그러지 말라고 적혀 있었다.\n\n계산대 화면은 여전히 00:10:00이었다. 시계도 그대로였다. 이 방에서 움직인 건 방송뿐이었다.\n\n+ [지금 나간다] -> b10_death_c\n+ [다섯 번째 방송을 기다린다] -> b10_t4_b\n\n=== b10_t4_b ===\n기다렸다.\n\n조용한 동안 매대 사이를 한 번 걸었다. 걸으면서도 다섯이라는 숫자만 붙들고 있었다. 다섯을 놓치면 다시 셀 방법이 없었다.\n\n스피커가 켜졌다.\n\n> 고객님께 안내 말씀드립니다. □□마트는 영업을 종료합니다. 마지막 안내입니다.\n\n남은 시간이 없었다. 지점명도 없었다.\n\n□□마트, 다음에 목소리가 바로 조사로 넘어갔다. 걸릴 것이 없어서 걸리지 않았다.\n\n문장이 끝났다. 스피커에서 잡음이 한 번 나고 꺼졌다.\n-> b10_clear\n\n=== b10_clear ===\n{gender == \"m\":남자|여자} 탈의실을 지나 직원 출입구를 열었다.\n\n하역장이었다. 셔터가 올라가 있고 그 너머는 주차장이었다. 가로등 하나가 켜져 있었다. 차는 없었다.\n\n밖으로 두 걸음 나가서 돌아봤다. 매장 스피커가 전부 안쪽을 향해 달려 있었다. 여기서는 아무 소리도 들리지 않았다.\n\n부를 이름이 남지 않아서인지 밖이라서인지는 알 수 없었다. 둘 다일 수도 있었다.\n\n반품 상자의 다섯째 줄에는 아무것도 적지 않고 나왔다. 가로줄은 이미 그어져 있었다. 그 위에 덧그으면 두 줄이 된다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b10_death_a ===\n정문 셔터 스위치는 계산대 끝 기둥에 있었다. 위쪽 버튼을 눌렀다.\n\n셔터가 올라가는 동안 방송이 계속 나왔다. 영지점은 5분 후 영업을 종료합니다.\n\n무릎 높이까지 올라갔을 때 아래로 바깥이 보였다. 주차장이 아니었다. 매대였다. 켜진 줄과 꺼진 줄이 번갈아 가고, 계산대 6번이 있고, 그 위에 시계가 있었다.\n\n건너편 셔터도 무릎 높이까지 올라와 있었다. 그 아래로 또 매대가 보였다.\n\n양쪽에서 방송이 나왔다. 신영지점은 10분 후 영업을 종료합니다.\n\n네 글자로 돌아가 있었다.\n-> die(\"당신은 방송 중에 출입구를 열었습니다.\", b10_shutter)\n\n=== b10_death_b ===\n탈의실을 지나 직원 출입구를 열었다. 하역장이었다. 셔터는 내려가 있고 파렛트가 벽까지 쌓여 있었다.\n\n밖에서도 방송이 들렸다. □□마트 지점은.\n\n두 글자가 남아 있었다. 남아 있는 동안에는 안에 있어야 했다.\n\n등 뒤에서 문이 닫혔다. 다시 열었더니 안쪽은 매장이 아니었다. 매대도 계산대도 없고, 매대가 있던 자리마다 골판지 상자가 서 있었다.\n\n전부 반품 상자였다. 옆면마다 유성펜 글씨가 있었다. 필체가 전부 달랐다. 적힌 글자는 전부 같았다.\n\n> 지점\n-> die(\"당신은 마지막 안내를 믿었습니다.\", b10_lastcall)\n\n=== b10_death_c ===\n직원 출입구를 열었다. 통로가 있었고 통로 끝에 문이 하나 더 있었다.\n\n열었더니 매장이었다. 조명은 절반만 켜져 있었다. 계산대 6번 위에 시계. 초침 없음.\n\n조끼 주머니에 라벨 프린터가 있었다. 초록 불이 켜져 있었다.\n\n스피커가 켜졌다. □□마트 점은 5분 후 영업을 종료합니다.\n\n여전히 한 글자였다. 줄어들 것이 없으면 줄어들지도 않는다.\n\n처음부터 다시 세야 하는데, 처음이 어디였는지 모르겠다.\n-> die(\"당신은 한 글자를 세지 않았습니다.\", b10_letter)\n\n// ── /INCLUDE B10.ink ──\n// ── INCLUDE B11.ink ──\n// ink/B11.ink — B11. 기숙사 야간 점호 (기숙사 × 시간이상)\n// 원본: spaces/B11_기숙사점호.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지 divert는 같은 줄. 사망은 별도 knot ->\n// die(\"사망 문구\", codex_entry). B 가중치 = 1. 조각 없음(앵커 전용). 파편 1(턴 2 진입 자동,\n// 선택과 무관) — B01.ink와 같은 방식으로 shard()에 문구를 직접 인자로 넘긴다(main.ink는\n// 아직 shard()가 없다 — ink/B11.codex.txt 참고, 상위가 fragment()와 같은 tunnel 방식으로\n// 병합할 것). 내부 상태(공간 밖으로 안 나감): b11_unmarked — 턴 4 방송 한 줄 + 클리어 한\n// 문단만 바뀐다.\n// 원본 턴 4-C(\"→ [선택 4]로 (A / B)\")의 되돌림 루프는 무한 루프를 막기 위해 별도 knot\n// b11_t4_retry(선택지 C 없이 A/B만)로 처리했다 — INK_BRIEF 지시.\n\n=== b11_gate ===\n~ current_space = \"B11\"\n~ current_weight = 1.0\n~ b11_unmarked = false\n-> b11_intro\n\n=== b11_intro ===\n압정이 네 개였다.\n\n게시판을 보고 있었다는 걸 알고 나서 눈을 떴다. 손에 종이 한 장이 있었다. 얇은 유인물, 아래쪽이 접혔다 펴진 자국.\n\n복도는 소등돼 있었다. 비상등만 초록으로 켜져 있었다.\n-> b11_t1\n\n=== b11_t1 ===\n4층이었다.\n\n계단실 쪽 벽에 흰 판이 붙어 있고 거기 **4**라고 적혀 있었다. 그 아래로 복도가 길게 이어지고 문마다 이름표 홀더가 달려 있었다. 홀더는 전부 투명하고 전부 비어 있었다.\n\n게시판 옆에 시계. 03:47. 초침이 없었다.\n\n게시판에는 종이가 한 장 붙어 있었다. 손에 든 것과 제목이 같았다.\n\n손에 든 것을 먼저 읽었다.\n\n\\**야간 점호 안내** — □□대학교 생활관 4층 / 점호 **02:20** #rules:B11\n\n1. 점호는 1일 1회, 1층부터 올라간다.\n2. 층과 호실을 함께 부를 때만 답한다.\n3. 점호 중에는 호실 문을 열지 않는다.\n4. 예비 점호는 20분 전에 하고 같이 응답한다. #fake #dmg:ink\n\n4번만 글꼴이 다르고 토너가 진했다 — 한 번 더 찍혀 들어간 줄이었다.\n\n1번과 4번을 나란히 읽었다. 1일 1회라고 해 놓고 점호가 둘이다. 둘 다 점호이면 1번이 틀렸고, 1번이 맞으면 둘 중 하나는 점호가 아니다.\n\n상단의 02:20에서 앞자리가 두꺼웠다. 덧찍은 자국이었다.\n\n시각을 확인할 데는 게시판뿐이었다. 게시판은 두 걸음 옆에 있었다.\n\n+ [게시판의 원본과 대조한다] -> b11_t1_a\n+ [복도 끝까지 가 본다] -> b11_t1_b\n+ [그대로 412호로 들어간다] -> b11_t1_c\n\n=== b11_t1_a ===\n같은 제목, 같은 서식. 다른 것이 두 군데였다.\n\n상단 시각이 **02:40**이었다. 그리고 항목이 셋이었다. 1, 2, 3. 4번 자리에는 여백만 있었다.\n\n게시판에 붙은 것이 원본이었다. 유인물은 각 방에 한 장씩 복사돼 들어간다. 복사기를 지나간 종이만 한 줄 늘어났다.\n\n여백 아래쪽에 볼펜 글씨가 있었다.\n\n> 네 번째가 우리 층\n> 세 번째로 오면 아니다\n\n그 밑에 다른 필체로, 더 눌러 쓴 것.\n\n> 두 번 왔다\n\n02:40에서 20분을 빼면 02:20이다. 누가 예비 점호를 본 점호처럼 보이게 만들어 두었다.\n-> b11_t2\n\n=== b11_t1_b ===\n끝까지 걸었다. 스물몇 걸음이었다.\n\n문이 아홉 개. 홀더는 전부 비어 있었다.\n\n끝에 세면장. 문이 열려 있었고 안은 어두웠다. 거울 앞 수도꼭지 세 개가 전부 잠겨 있었다.\n\n계단실 문 유리로 아래를 봤다. 층계참마다 흰 판. 3, 2, 1. 위로도 있었다. 5.\n\n점호가 1층부터 올라온다면 이 층은 네 번째다. 셀 것이 있다는 뜻이었다.\n-> b11_t2\n\n=== b11_t1_c ===\n문패 자리에 매직으로 **412**. 손잡이가 돌아갔다.\n\n방은 2인실이었다. 침대 둘, 책상 둘. 한쪽 이불이 젖혀져 있고 반대쪽은 반듯했다.\n\n문 위에 스피커. 회색 플라스틱 격자에 먼지가 얇게 앉아 있었다.\n\n문 밑에 틈이 있었다. 복도 비상등의 초록이 그 틈으로 가늘게 들어왔다.\n-> b11_t2\n\n=== b11_t2 ===\n412호 안이었다. 문은 안에서 잠갔다.\n\n맞은편 책상 앞 벽에 포스트잇이 한 장 붙어 있었다. 볼펜 글씨.\n\n> 　　　 나 먼저 잔다\n\n앞의 세 칸이 비어 있었다. 지운 자국이 아니었다. 지웠으면 종이가 일어난다. 그 자리는 매끄러웠다.\n\n무슨 말이 거기 있었는지 생각해 봤다. 자리가 비어 있으니 넣어 볼 말도 없었다.\n-> shard(\"룸메이트가 나를 뭐라고 불렀더라\") -> b11_t2_cont\n\n=== b11_t2_cont ===\n스피커가 켜졌다.\n\n> 야간 점호. 5층.\n\n잠시 뒤 다시.\n\n> 야간 점호. 4층. 412호 재실자.\n\n또박또박했다. 호실 번호를 세 자리로 끊어 읽는 사람의 속도였다.\n\n+ [\"재실\"이라고 답한다] -> b11_death_a\n+ [답하지 않는다] -> b11_t2_b\n+ [문 밑 틈으로 복도를 본다] -> b11_t2_c\n\n=== b11_t2_b ===\n입을 다물고 있었다.\n\n스피커가 한 번 더 4층을 불렀다. 그다음 3층을 불렀다. 그다음 2층.\n\n내려가고 있었다. 1번은 올라간다고 했다.\n-> b11_t3\n\n=== b11_t2_c ===\n바닥에 엎드려 틈에 눈을 댔다.\n\n초록 비상등 위로 흰 빛 하나가 지나갔다. 손전등이었다. 빛은 왼쪽에서 오른쪽으로, 계단실 쪽으로 갔다.\n\n발소리는 그 뒤에 났다. 빛보다 늦게. 그리고 계단을 내려갔다.\n\n내려간다는 건, 올라온 적이 없다는 뜻이었다.\n-> b11_t3\n\n=== b11_t3 ===\n조용해졌다.\n\n복도 끝에서 물 떨어지는 소리가 났다. 세면장이었다. 수도꼭지는 세 개 다 잠겨 있었는데 한 방울씩 떨어지고 있었다.\n\n스피커가 켜졌다.\n\n> 야간 점호. 1층.\n\n한참 뒤에 2층. 그다음 3층. 사이가 일정했다. 아래에서 발소리가 계단을 밟아 올라오는 것도 들렸다.\n\n> 야간 점호. 4층. 412호 재실자.\n\n빛이 문 밑에 왔다. 이번엔 멈췄다.\n\n호명은 사무적이었다. 화도 안 났고 급하지도 않았다. 하루에 아홉 번쯤 하는 말투였다.\n\n방송은 다음 호실로 넘어가지 않았다. 문 밖에서 볼펜 끝이 종이를 두드리는 소리가 몇 번 났다. 기다리는 소리였다.\n\n+ [문을 연다] -> b11_death_b\n+ [\"재실\"이라고 답한다] -> b11_t3_b\n+ [답하지 않는다] -> b11_t3_c\n\n=== b11_t3_b ===\n\"재실.\"\n\n문 밖에서 종이 넘기는 소리가 났다. 볼펜으로 뭔가를 긋는 소리도.\n\n> 확인. 412호 이상 없음.\n\n빛이 오른쪽으로 옮겨 갔다. 413호. 그다음 414호. 그리고 5층 계단으로.\n-> b11_t4\n\n=== b11_t3_c ===\n아무 말도 하지 않았다.\n\n빛이 문 밑에서 조금 오래 머물렀다. 종이 넘기는 소리, 그리고 짧게 긋는 소리.\n\n> 412호 미확인.\n\n빛이 옮겨 갔다.\n\n답해야 했던 것 같기도 했다. 답하지 않았을 때의 처분은 어디에도 없었고, 답해야 할 때 답하지 않으면 어떻게 되는지는 어디에도 없었다. 적혀 있지 않은 것은 금지도 허가도 아니다.\n~ b11_unmarked = true\n-> b11_t4\n\n=== b11_t4 ===\n5층 호명이 끝났다. 발소리가 계단을 올라가 옥상 쪽으로 사라졌다.\n\n게시판 시각으로 점호는 끝났다. 1일 1회니까 오늘 것은 다 지나갔다.\n\n스피커가 켜졌다.\n\n> 야간 점호. 412호 재실자.\n\n층이 없었다.\n\n{b11_unmarked: 그리고 한 줄이 더 붙었다. \"412호 미확인.\" | }\n\n> 412호. 412호\n\n거기서 한 번 넘어갔다. 넘어간 자리에 뭔가가 들어가야 하는 길이였다. 들어가지 않았다. 방송은 그냥 다음으로 갔다.\n\n> 재실자. 응답 바랍니다.\n\n2번: 층과 호실을 함께 부를 때만 답한다.\n\n+ [\"재실\"이라고 답한다] -> b11_death_c\n+ {codex ? calling_voice} [답하지 않는다] (도감: 부르는 소리) -> b11_t4_b\n+ {not (codex ? calling_voice)} [답하지 않는다] -> b11_t4_b\n+ [유인물의 4번 줄을 비상등에 비춰 본다] -> b11_t4_c\n\n=== b11_t4_b ===\n답하지 않았다.\n\n스피커가 세 번 더 같은 문장을 냈다. 갈수록 사이가 짧아지다가, 마지막엔 \"재실자\"까지만 하고 끊겼다.\n\n문 밑에 빛은 오지 않았다. 올 곳에서 오는 방송이 아니었다.\n-> b11_clear\n\n=== b11_t4_c ===\n문 밑 틈으로 들어오는 초록에 종이를 대고 비췄다.\n\n다른 줄은 뒷면까지 잉크가 조금씩 배어 있었다. 4번만 앞면에서 끝났다. 종이에 스밀 시간이 없었던 잉크였다.\n\n세 줄짜리 종이 끝에 한 줄을 더 얹은 간격이었다.\n\n방송은 계속 나오고 있었다.\n-> b11_t4_retry\n\n=== b11_t4_retry ===\n+ [\"재실\"이라고 답한다] -> b11_death_c\n+ {codex ? calling_voice} [답하지 않는다] (도감: 부르는 소리) -> b11_t4_b\n+ {not (codex ? calling_voice)} [답하지 않는다] -> b11_t4_b\n\n=== b11_clear ===\n스피커가 조용해졌다.\n\n문 밑 초록이 그대로였다. 복도에서 종이 한 장이 압정에서 빠지는 소리가 났다. 가벼운 소리였다.\n\n{b11_unmarked: 미확인이라고 적힌 칸이 어딘가에 남아 있을 것이다. 그 칸이 어떻게 처리되는지는 안내문에 없었다. 없는 것을 걱정하지 않기로 했다.|\"이상 없음\"이라고 적힌 칸이 어딘가에 남아 있을 것이다. 그 칸에 들어간 것은 호실 번호 하나였다.}\n\n유인물의 4번 줄에 볼펜으로 두 줄을 그었다. 종이는 책상에 펴 둔 채로 뒀다. 다음에 이 방에 들어오는 사람이 세 개짜리를 받는 편이 나을 것 같았다.\n\n포스트잇은 벽에 그대로 붙어 있었다. 앞의 세 칸도 그대로였다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b11_death_a ===\n\"재실.\"\n\n말이 끝나기 전에 빛이 문 밑에 와 있었다. 빨랐다. 방송이 4층을 부른 지 얼마 되지도 않았는데 벌써 문 앞이었다.\n\n> 확인.\n\n빛이 꺼졌다. 그리고 문 밖에서 볼펜으로 긋는 소리가 났다. 한 번이 아니었다. 같은 자리를 여러 번, 종이가 얇아질 때까지 문지르는 소리였다.\n\n방송이 3층으로 내려갔다. 2층, 1층. 게시판 안내문 1번이 생각났다. 점호는 1층부터 올라간다. 내려오는 것에 확인을 받은 사람이 어떻게 되는지는 1번에 적혀 있지 않았다.\n\n그다음 점호부터 412호는 호명되지 않았다.\n-> die(\"당신은 게시되지 않은 점호에 응답했습니다.\", b11_prelim)\n\n=== b11_death_b ===\n잠금을 풀고 문을 열었다.\n\n복도에 아무도 없었다. 손전등만 바닥에 놓여 있었다. 켜진 채로 벽을 비추고 있었고, 비추는 자리에 아무 표시도 없었다.\n\n등 뒤에서 문이 닫혔다. 안에서 목소리가 났다.\n\n> 재실.\n\n짧고 사무적이었다. 손잡이는 돌아가지 않았다.\n\n복도를 걸었다. 문마다 홀더가 비어 있었는데, 412호 것에만 종이가 한 장 끼워져 있었다. 세 자리 숫자만 적혀 있었다.\n-> die(\"당신은 점호 중에 문을 열었습니다.\", b11_light)\n\n=== b11_death_c ===\n\"재실.\"\n\n> 확인.\n\n방송이 끊겼다. 복도도 조용했고 발소리도 없었다. 아무 일도 일어나지 않았다.\n\n책상에 유인물을 폈다. 4번 항목이 두 줄이었다. 같은 문장이 두 번 찍혀 있었고, 아랫줄이 윗줄보다 진했다.\n\n손끝에 토너 냄새가 났다. 언제 다시 찍었는지는 모르겠다. 다음 사람이 받을 안내문에는 항목이 다섯 개일 것이다.\n-> die(\"당신은 층 없는 호명에 응답했습니다.\", b11_noflor)\n\n// ── /INCLUDE B11.ink ──\n// ── INCLUDE B12.ink ──\n// ink/B12.ink — B12. 야간 당직 (군대(야간 당직실) × 부르는것)\n// 원본: spaces/B12_군대당직.md (§4 턴 / §6 예산 / 본문 / 사망)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지 divert는 같은 줄. 사망은 별도 knot ->\n// die(\"사망 문구\", codex_entry). B 가중치 = 1. 조각 없음(앵커 전용). 파편 없음(05 §4 표 \"·\").\n// 성별 2단계(이번 배치 지시): 턴 3(순찰 시각, 세면장)은 큰 텍스트 블록이 통째로 갈리므로\n// {gender==...} 치환 대신 knot 둘(b12_t3_m / b12_t3_f) + 선택지 조건\n// `* {gender == \"m\"}` / `* {gender == \"f\"}`로 분기한다.\n// 내부 상태(공간 밖으로 안 나감): b12_hungup — 턴 4 노크 문장만 바뀐다.\n\n=== b12_gate ===\n~ current_space = \"B12\"\n~ current_weight = 1.0\n~ b12_hungup = false\n-> b12_intro\n\n=== b12_intro ===\n왼팔이 조였다.\n\n완장이었다. 노란 바탕에 검은 글씨. **당직**. 고무줄이 팔뚝에 자국을 내고 있었다. 그걸 알고 나서 눈을 떴다.\n\n책상에 엎드려 있었다. 형광등은 둘 중 하나만 켜져 있었다.\n\n당직실이었다. 문 옆에 상황판, 책상 위에 야전전화, 그 옆에 갱지 묶음. 벽에 시계. 03:47. 초침이 없었다. 그 자리를 오래 보지 않았다.\n\n완장 아래쪽에 네모난 자국이 있었다. 명찰이 붙어 있던 자리인데 뜯겨서 실밥만 남았다. 위쪽 계급장 자리는 멀쩡했다. 절반은 있고 절반은 없었다.\n\n정면 벽에 액자가 걸려 있었다. 같은 인쇄물이 책상 유리 밑에도 깔려 있었다.\n-> b12_t1\n\n=== b12_t1 ===\n\\**야간 당직 근무 수칙** #rules:B12\n\n1. 어떤 호명에도 응답한다. 복창으로만 한다.\n2. 순찰 중 세면장은 {gender == \"m\":문 밖에서|칸을 열지 않고} 확인한다.\n3. 완장은 인수자에게만 넘긴다.\n4. 야전전화에는 관등성명을 먼저 밝힌다. #fake #dmg:hand\n\n1번과 4번을 나란히 읽었다. 앞에 \"어떤\"이 붙어 있으면 뒤에 예외를 두기 어렵다. 그런데 4번이 예외를 두고 있었다. 채널이 다르면 규칙도 다르다는 식으로.\n\n액자에 인쇄된 항목은 셋이었다. 4번만 유리 바깥면에 유성펜이었고, 문지르니 획 끝이 번졌다.\n\n책상 유리 밑 인쇄물에는 4번이 아예 없었다.\n\n빈 자리에 뭔가를 적어 넣는 사람이 있다. 적어 넣는 이유도 하나뿐일 것이다.\n\n+ [갱지 묶음을 본다] -> b12_t1_a\n+ [상황판을 본다] -> b12_t1_b\n+ [책상 유리를 들춰 본다] -> b12_t1_c\n\n=== b12_t1_a ===\n일지가 아니라 인계표였다. 한 장에 한 줄. 넘긴 쪽과 받은 쪽을 나란히 적게 되어 있었다.\n\n> 인계자 ~~당직~~　인수자 ~~당직~~\n\n두 칸 다 그어져 있었다. 장을 넘겼다. 같았다. 그다음도 같았다. 넘긴 사람과 받은 사람을 함께 지우는 이유는 적혀 있지 않았다.\n\n마지막 장.\n\n> 인계자 당직　인수자 ______\n\n받는 칸만 줄이었다. 다음 장은 없었다.\n-> b12_t2\n\n=== b12_t1_b ===\n코르크판에 종이 세 장이 압정으로 박혀 있었다.\n\n근무 인원표. 칸이 여럿인데 한 칸에만 적혀 있었다. 당직 1. 나머지는 비었다.\n\n순찰 약도. 당직실에서 생활관 복도를 지나 세면장까지 화살표가 그어져 있었다. {gender == \"m\":세면장에서 화살표가 문 앞에 붙어 멈췄다.|세면장 안까지 들어갔다가 되돌아 나왔다.} 그 아래 칸에 다른 동선이 하나 더 그려져 있고 X가 쳐져 있었다. 지운 게 아니라 X만 쳤다. 두 개를 그려 놓은 이유는 적혀 있지 않았다.\n\n시각표는 두 줄이었다. 순찰. 교대.\n-> b12_t2\n\n=== b12_t1_c ===\n유리를 들췄다. 인쇄물 밑에 종이쪽이 한 장 더 있었다. 볼펜으로 눌러 쓴 글씨.\n\n> 그대로 돌려줘라\n> 네 것을 하나도 주지 마라\n> 유리 밖은 다른 사람이 썼다\n\n세 번째 줄을 읽고 액자 쪽을 봤다. 유리 바깥면에 아까 문지른 자국이 남아 있었다.\n-> b12_t2\n\n=== b12_t2 ===\n손잡이 도는 소리가 났다. 그다음에 야전전화가 울렸다.\n\n수화기를 들었다.\n\n> 당직.\n\n사무적이었다. 부르는 소리라기보다 칸에 적힌 것을 읽는 소리에 가까웠다. 잠깐 비고, 이어서.\n\n> 관등성명.\n\n입 안쪽이 먼저 반응했다. 뭘 해야 하는지 몸이 아는 것 같았다. 계급을 말하고, 그다음에 이름을 말하는 순서. 순서는 아는데 두 번째 칸에 넣을 것이 없었다.\n\n+ [관등성명을 댄다] -> b12_death_b\n+ [복창한다] -> b12_t2_b\n+ [수화기를 내려놓는다] -> b12_t2_c\n\n=== b12_t2_b ===\n\"당직.\"\n\n들은 말을 그대로 돌려줬다.\n\n수화기 저쪽이 잠깐 조용했다. 그리고 다음 말이 왔다.\n\n> 순찰 시각. 동선 확인.\n\n\"순찰 시각. 동선 확인.\"\n\n끊겼다. 이쪽에서 나간 것은 하나도 없었다. 저쪽 말을 두 번 썼을 뿐이다.\n-> b12_t3\n\n=== b12_t2_c ===\n내려놓았다.\n\n다시 울렸다. 세 번 울리고 멈췄다.\n\n상황판을 봤다. 근무 인원표에 당직 1. 아직 1이었다.\n~ b12_hungup = true\n-> b12_t3\n\n=== b12_t3 ===\n야전전화가 한 번 짧게 울리고 끊겼다. 순찰 시각이었다.\n\n약도대로 갔다. 생활관 복도. 문마다 번호가 붙어 있었다. 숨소리가 나는 문도 있고 안 나는 문도 있었다. 열어 보라고 적힌 규칙은 없었다.\n\n복도 끝이 세면장이었다.\n\n{gender == \"m\":\n    -> b12_t3_m\n- else:\n    -> b12_t3_f\n}\n\n=== b12_t3_m ===\n2번은 문 밖에서 확인하라고 했다.\n\n스위치를 눌렀다. 안이 밝아졌다. 문틀에 보이는 만큼만 봤다. 세면대 여섯, 그 위로 거울 여섯. 바닥이 젖어 있었다.\n\n수도꼭지 하나에서 물이 가늘게 흘렀다. 잠그러 들어가라는 말은 어디에도 없었다.\n\n안에서 소리가 났다.\n\n> 당직.\n\n전화기에서 나던 것과 같은 높이였다. 이어서.\n\n> 관등성명.\n\n+ [관등성명을 댄다] -> b12_death_b\n+ {codex ? calling_voice} [복창한다] (도감: 부르는 소리) -> b12_t3_m_b\n+ {not (codex ? calling_voice)} [복창한다] -> b12_t3_m_b\n+ [들어가서 확인한다] -> b12_death_c\n\n=== b12_t3_m_b ===\n\"당직.\"\n\n문 밖에서 그대로 돌려줬다.\n\n안이 조용해졌다. 물소리만 남았다. 불은 끄지 않았다. 끄라는 말은 없었다.\n\n복도를 되짚어 왔다.\n-> b12_t4\n\n=== b12_t3_f ===\n2번은 칸을 열지 말라고 했다.\n\n문을 밀고 들어갔다. 세면대 여섯, 그 위로 거울 여섯. 안쪽으로 칸이 넷. 바닥이 젖어 있었다.\n\n수도꼭지 하나에서 물이 가늘게 흘렀다. 잠갔다. 다시 흘렀다. 한 번 더 잠그고 그냥 뒀다.\n\n칸 문 넷 중 셋이 열려 있었다. 하나가 닫혀 있었다. 문 밑으로 발은 보이지 않았다.\n\n닫힌 칸에서 소리가 났다.\n\n> 당직.\n\n전화기에서 나던 것과 같은 높이였다. 이어서.\n\n> 관등성명.\n\n+ [관등성명을 댄다] -> b12_death_b\n+ {codex ? calling_voice} [복창한다] (도감: 부르는 소리) -> b12_t3_f_b\n+ {not (codex ? calling_voice)} [복창한다] -> b12_t3_f_b\n+ [칸 문을 연다] -> b12_death_c\n\n=== b12_t3_f_b ===\n\"당직.\"\n\n칸 앞에서 그대로 돌려줬다.\n\n안이 조용해졌다. 스위치를 내렸다. 어두워지는 순간 거울 여섯이 한꺼번에 검어졌는데, 하나가 조금 늦었다. 확인하려고 다시 켜지는 않았다.\n\n복도를 되짚어 왔다.\n-> b12_t4\n\n=== b12_t4 ===\n당직실로 돌아와 인계표를 폈다. 마지막 장은 그대로였다. 받는 칸은 아직 줄이었다.\n\n시각표의 두 번째 줄이 남아 있었다. 교대.\n\n문에서 노크가 났다. 세 번. 간격이 고르고 힘이 일정했다. {b12_hungup: 세 번이 아니었다. 세 번씩 끊어서, 멈추지 않고 계속 났다.}\n\n> 당직.\n\n문 아래 틈으로 복도 불빛이 들어왔다. 그림자는 지나가지 않았다.\n\n> 인수자다. 관등성명.\n\n3번은 완장을 인수자에게만 넘기라고 했다. 인수자는 밖에 있고, 완장을 달라고 하지 않았다.\n\n+ [관등성명을 댄다] -> b12_death_b\n+ [복창하고 완장을 넘긴다] -> b12_t4_b\n+ [응답하지 않는다] -> b12_death_a\n\n=== b12_t4_b ===\n\"인수자.\"\n\n문 밖이 잠깐 조용했다. 그리고 같은 말이 돌아왔다.\n\n> 인수자.\n\n이쪽이 하던 것을 그쪽도 했다. 배운 것 같지는 않았다. 원래 그렇게 하는 것을 이제야 서로 맞춘 쪽에 가까웠다.\n\n문을 열었다. 복도가 밝았고 아무도 없었다. 바닥에 완장이 하나 놓여 있었다. 노란 바탕에 검은 글씨. 명찰 자리가 뜯겨 있었다.\n\n왼팔의 것을 풀어 그 옆에 놓았다. 두 개가 같아 보였다. 어느 쪽이 방금 벗은 것인지 표시할 방법은 없었다.\n\n인계표의 빈 칸을 채웠다. 인수자 당직. 앞 장들과 같은 줄이 됐다. 이름을 적는 칸은 처음부터 없었다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b12_death_a ===\n대답하지 않았다.\n\n노크가 몇 번 더 나다가 멈췄다. 발소리가 복도 저쪽으로 멀어졌다. 서두르지 않는 걸음이었다.\n\n상황판을 봤다. 근무 인원표의 한 칸이 비어 있었다. 아까까지 당직 1이 적혀 있던 칸이다.\n\n인계표를 폈다. 비어 있던 칸이 채워져 있었다. 내가 적은 것이 아니었다.\n\n> 근무자 부재. 확인 요망.\n\n확인하러 가는 것은 당직이 할 일이다. 지금 이 방에는 당직이 없다.\n-> die(\"당신은 호명에 응답하지 않았습니다.\", b12_absent)\n\n=== b12_death_b ===\n입이 먼저 움직였다. 계급을 말하고, 그다음이 이름 자리였다.\n\n이름 자리에서 소리가 났다. 소리가 나긴 났는데 내 귀에는 들리지 않았다. 입은 그 길이만큼 움직였다.\n\n> 확인했다.\n\n그쪽이 끊겼다.\n\n왼팔이 헐거워졌다. 완장의 뜯긴 네모 자리에 하얀 천이 붙어 있었다. 검은 글씨가 있었다. 몇 자인지 세려고 팔을 들었는데 팔이 올라오지 않았다.\n\n이름이 없는 쪽이 아니라 형식이 비어 있는 쪽이 문제였던 것이다. 형식은 아무 이름으로나 채워진다.\n-> die(\"당신은 관등성명을 댔습니다.\", b12_rank)\n\n=== b12_death_c ===\n{gender == \"m\":문을 밀고 들어갔다. 세면대 여섯. 아무도 없었다.|칸 문을 열었다. 안은 비어 있었다.}\n\n2번에 없는 확인이었다. 수도꼭지는 계속 흘렀다. 잠그려다 말았다. 그것도 적힌 일이 아니었다.\n\n거울에 완장이 비쳤다. 노란 바탕에 검은 글씨. 명찰 자리에 하얀 천이 붙어 있었고 거기 글자가 있었다.\n\n팔을 내려다봤다. 이쪽 완장에는 실밥뿐이었다.\n\n다시 거울을 봤다. 거울 쪽이 맞았다.\n-> die(\"당신은 규칙에 없는 확인을 했습니다.\", b12_mirror)\n\n// ── /INCLUDE B12.ink ──\n// ── INCLUDE B13.ink ──\n// ink/B13.ink — B13. 야간 등산로 (야외(산/숲) × 규칙서자체)\n// 원본: spaces/B13_등산로.md (§4 턴 / §6 예산 / 본문 / 사망)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지 divert는 같은 줄. 사망은 별도 knot ->\n// die(\"사망 문구\", codex_entry). B 가중치 = 1. 조각 없음(앵커 전용). 파편 없음(05 §4 표 \"·\").\n// 내부 상태 없음(공간 로컬 VAR 0개).\n\n=== b13_gate ===\n~ current_space = \"B13\"\n~ current_weight = 1.0\n-> b13_intro\n\n=== b13_intro ===\n자갈이 굴렀다. 발밑에서 하나가 빠져 아래로 갔고, 소리가 오래 났다. 아래쪽이 비어 있다는 뜻이었다.\n\n세 번 접힌 종이가 손에 쥐어져 있었다. 마르고 뻣뻣했다.\n\n바람이 위에서 내려왔다. 나무 냄새가 났다.\n-> b13_t1\n\n=== b13_t1 ===\n등산로 입구였다.\n\n차단봉이 내려와 있었다. 봉 끝과 돌기둥 사이에 사람 하나 지날 틈이 있었고, 그 틈 바닥만 흙이 반들반들했다. 다들 그리로 지나간 것이다.\n\n왼쪽에 관리초소. 창이 닫혀 있고 안에 불이 켜져 있었다. 사람은 없었다. 창 너머 벽에 시계가 걸려 있었다. 03:47. 초침이 없었다.\n\n초소 오른쪽에 큰 안내판. 철제였고 네 귀퉁이에 볼트가 박혀 있었다.\n\n\\**야간 등산로 이용 안내** — 야간 탐방은 입구에서 정상 방향으로만 허용됩니다. #rules:B13\n\n1. 이 안내판과 다른 항목은 따르지 않습니다.\n2. 산 위에서 부르는 소리에 응답하지 않습니다.\n3. 항목이 다르면 앞선 지점으로 되돌아갑니다. #fake #dmg:ink\n4. 하산은 올라온 길로만 합니다.\n\n손의 종이를 폈다. 리플릿이었다. 같은 안내가 작게 인쇄돼 있었다.\n\n항목이 셋이었다. 되돌아가라는 항목이 없었다.\n\n3번만 줄 간격이 좁고 볼트가 글자 한가운데를 지났다 — 판을 만들 때 없던 줄이다.\n\n1번은 다른 항목을 따르지 말라고 했다. 3번은 되돌아가라고 했다.\n\n+ [초소 창을 들여다본다] -> b13_t1_a\n+ [안내판 뒤로 돌아가 본다] -> b13_t1_b\n+ [차단봉 옆으로 바로 들어간다] -> b13_t1_c\n\n=== b13_t1_a ===\n유리에 얼굴을 붙였다. 책상 하나, 손전등 두 개, 걸이에 형광 조끼. 조끼는 접혀 있었다.\n\n창턱에 아크릴 통이 있었다. 리플릿 꽂는 통이었다. 비어 있었다.\n\n손에 든 걸 봤다. 마지막 한 장을 내가 들고 있었다.\n-> b13_t2\n\n=== b13_t1_b ===\n철판 뒷면은 녹만 있었다. 아무것도 적혀 있지 않았다.\n\n판을 세운 콘크리트 기초에 매직으로 한 줄이 있었다. 낮아서 쪼그려 앉아야 보였다.\n\n> 셋째는 여기서만\n\n굵게 눌러쓴 글씨였다. 다 쓰고 마지막 획을 한 번 더 덧그은 자국이 있었다.\n-> b13_t2\n\n=== b13_t1_c ===\n틈으로 몸을 넣었다. 흙이 단단해서 발자국이 남지 않았다.\n\n열 걸음쯤 가니 {gender == \"m\":왼편|오른편} 나무에 노란 끈이 묶여 있었다. 무릎보다 조금 위. 반대편에는 없었다.\n-> b13_t2\n\n=== b13_t2 ===\n0.4. 첫 이정표였다.\n\n나무 기둥에 알루미늄 판이 붙어 있었다. 거리 아래에 안내가 작게 인쇄돼 있었다.\n\n항목이 셋이었다. 1번과 2번은 입구 판과 글자까지 같았다. 3번 자리에는 하산 이야기가 있었다. 입구 판에서는 4번이던 문장이다.\n\n되돌아가라는 항목이 없으니 번호가 한 칸씩 앞으로 당겨져 있었다. 리플릿과 이 판이 같고, 입구 판만 하나 많았다.\n\n산 위에서 소리가 났다.\n\n> 올라가시는 분.\n\n사람 목소리였다. 화나지도 급하지도 않았다. 하루에 같은 말을 몇 번씩 하는 사람의 목소리. 거리는 가늠이 안 됐다.\n\n걸음을 멈추지 않았다. 0.9. 두 번째 이정표.\n\n판을 봤다. 2번 줄이 이랬다.\n\n> 2. 산 위에서 부르는 소리에 응답하여 위치를 알립니다.\n\n나머지 줄은 입구 판과 같았다. 3번도 있었다.\n\n> 올라가시는 분. 위치 알려 주세요.\n\n+ {codex ? calling_voice} [응답하지 않고 걸음을 유지한다] (도감: 부르는 소리) -> b13_t2_a\n+ {not (codex ? calling_voice)} [응답하지 않고 걸음을 유지한다] -> b13_t2_a\n+ [응답한다] -> b13_death_c\n+ [2번 줄을 손으로 문질러 본다] -> b13_t2_c\n\n=== b13_t2_a ===\n대답하지 않았다. 속도도 바꾸지 않았다. 바꾸면 그것도 대답이 될 것 같았다.\n\n소리가 두 번 더 났다. 같은 문장이었다. 세 번째부터는 나지 않았다.\n-> b13_t3\n\n=== b13_t2_c ===\n장갑을 벗고 엄지로 2번 줄을 문질렀다.\n\n손끝에 검은 게 묻었다. 위아래 줄을 같은 힘으로 문질러 봤다. 아무것도 묻지 않았다.\n\n판 전체가 볕에 바래 있었는데 그 줄만 덜 바랬다. 나중에 얹은 것이다. 얹은 사람이 판을 새로 만들지는 않았다.\n-> b13_t3\n\n=== b13_t3 ===\n1.6.\n\n경사가 꺾이는 자리에 세 번째 이정표가 있었다.\n\n1번 자리가 회색이었다. 붓자국이 판 밖으로 나가 나무껍질까지 묻어 있었다. 급하게 덮은 것이다.\n\n그 아래 3번만 획이 두 겹으로 굵었다.\n\n> 3. 항목이 다르면 앞선 지점으로 되돌아갑니다.\n\n덮인 1번의 문장은 기억하고 있었다. 다른 항목은 따르지 않는다.\n\n덮였다고 없어지지는 않는다. 입구 판에는 아직 붙어 있다.\n\n고개를 들었다. 양쪽 나무에 다 노란 끈이 있었다. 아까까지는 한쪽뿐이었다.\n\n+ [앞선 지점으로 되돌아간다] -> b13_death_a\n+ [지나간다] -> b13_t3_b\n+ [판 뒷면을 본다] -> b13_t3_c\n\n=== b13_t3_b ===\n지나갔다.\n\n몇 걸음 가서 뒤를 돌아보지는 않았다. 돌아보라는 항목도, 돌아보지 말라는 항목도 없었다. 그냥 목이 돌아가지 않았다.\n-> b13_t4\n\n=== b13_t3_c ===\n기둥을 안고 판 뒤로 손을 넣었다. 매직 글씨가 있었다. 판을 보려면 고개를 옆으로 눕혀야 했다.\n\n> 셋째는 여기서만\n\n입구 기초에 있던 것과 같은 필체였다. 그 아래 다른 필체로 한 줄 더.\n\n> 되돌아가면 길이 없다\n\n두 사람이었다. 아니면 한 사람이 두 번 지나간 것이다. 어느 쪽이든 둘 다 셋째 항목에 대해서만 썼다.\n-> b13_t4\n\n=== b13_t4 ===\n2.2.\n\n네 번째 이정표. 여기서 길이 두 갈래였다. 오른쪽은 계속 오르막, 왼쪽은 아래로 꺾여 나무 사이로 사라졌다.\n\n판의 4번이 이랬다.\n\n> 4. 하산은 가장 가까운 하산로를 이용합니다. 계곡 방향 하산로 0.3km.\n\n그 줄만 글자체가 달랐다. 위아래는 각진 글자였고 4번만 획 끝이 둥글었다.\n\n계곡 쪽에서 물소리가 났다. 있었다, 정도의 소리였다. 커지지도 작아지지도 않았다.\n\n아래쪽에서 목소리가 났다. 산 위에서 나던 그 목소리였다. 이번에는 아래에 있었다.\n\n> 내려오세요. 하산로 열려 있습니다.\n\n입구 판의 4번은 올라온 길로만 내려가라고 했다. 여기 4번은 계곡으로 0.3킬로미터라고 했다. 둘 중 하나는 나중에 얹은 것이고, 나중에 얹은 쪽은 언제나 글자가 달랐다.\n\n+ [계곡 하산로로 내려간다] -> b13_death_b\n+ [올라온 길로 내려간다] -> b13_clear\n+ [계속 올라간다] -> b13_t4_c\n\n=== b13_t4_c ===\n오르막으로 갔다.\n\n리본이 두 번 더 나왔다. 왼편에 하나, 오른편에 하나. 그다음부터는 나무에 아무것도 없었다.\n\n이정표도 없었다. 판을 세울 만한 자리가 몇 번 나왔는데 비어 있었다. 아무도 여기까지는 뭘 시키지 않은 것이다.\n\n길이 끊긴 데서 섰다. 아무 일도 없었다. 아무 일도 없다는 게 여기가 지정된 곳이 아니라는 뜻이었다.\n\n돌아서 내려왔다. 올라온 길로만.\n-> b13_clear\n\n=== b13_clear ===\n이정표를 역순으로 지났다. 2.2, 1.6, 0.9, 0.4.\n\n내려가면서 판을 하나씩 다시 봤다. 갈렸던 줄이 그대로 갈려 있었다. 한 번 읽어 뒀으니까.\n\n0.4 판에는 여전히 항목이 셋이었다.\n\n차단봉 틈으로 나왔다. 초소에 불이 켜져 있었고 사람은 없었다.\n\n입구 안내판 앞에 섰다. 세 번째 줄이 그대로 있었다. 볼트 자국도 그대로였다.\n\n창턱의 아크릴 통을 봤다. 리플릿이 한 장 꽂혀 있었다. 올라갈 때는 손에 든 것이 마지막이었다.\n\n손에 든 걸 통에 넣지 않았다. 접어서 주머니에 넣었다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b13_death_a ===\n돌아 내려갔다. 3번대로였다.\n\n0.9까지는 금방이었다. 그런데 0.9에 이정표가 없었다. 기둥 박았던 자리에 구멍만 있었다.\n\n구멍 옆으로 좁은 길이 나 있었다. 발이 두 개 들어갈 폭. 리본은 왼편에도 오른편에도 없었다.\n\n그 길 끝에 판이 하나 서 있었다. 새 판이었다. 거리 표시가 없고 항목이 하나였다.\n\n> 1. 탐방객은 여기서 대조가 끝날 때까지 기다립니다.\n\n대조할 판이 없었다. 그래서 끝나지 않았다.\n-> die(\"당신은 앞선 지점으로 되돌아갔습니다.\", b13_return)\n\n=== b13_death_b ===\n왼쪽 길로 꺾었다. 내리막이 가팔라서 옆으로 디뎠다.\n\n0.3킬로미터는 금방이었다. 나무가 끝나고 자갈이 나왔다. 젖은 자갈이었다.\n\n물소리가 없었다. 위에서는 났는데 여기서는 나지 않았다. 젖어 있는데 나지 않았다.\n\n자갈밭 가운데에 판이 서 있었다. 여기까지 판을 지고 온 사람이 있었다는 뜻이다.\n\n> 하산 완료. 탐방객 확인.\n\n확인은 내가 하는 게 아니었다.\n-> die(\"당신은 계곡 방향 하산로를 이용했습니다.\", b13_valley)\n\n=== b13_death_c ===\n\"여기 있습니다.\"\n\n말하고 나서 걸음이 멈췄다. 멈추려고 한 게 아니었다.\n\n> 확인했습니다.\n\n목소리가 아까와 같은 자리에서 났다. 더 가깝지도 멀지도 않았다. 위치를 알린 건 나인데 움직인 쪽도 나였다.\n\n발밑을 봤다. 리본이 한쪽에만 있었다. 올라올 때와 반대쪽이었다. 올라가는 방향이 뒤집힌 것이다.\n\n> 올라가시는 분.\n\n이번에는 아래에서 났다.\n-> die(\"당신은 위치를 알렸습니다.\", b13_climber)\n\n// ── /INCLUDE B13.ink ──\n// ── INCLUDE B14.ink ──\n// ink/B14.ink — B14. 산림 감시초소 야간 근무 (야외(산/숲) × 보면안되는것)\n// 원본: spaces/B14_감시초소.md (§4 턴 / §6 예산 / 본문 / 사망)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지 divert는 같은 줄. 사망은 별도 knot ->\n// die(\"사망 문구\", codex_entry). B 가중치 = 1. 조각 없음(앵커 전용). 파편 없음(05 §4 표 \"·\").\n// 내부 상태(공간 밖으로 안 나감): b14_lit_once — 턴 4 한 문장만 바뀐다.\n// IN 없음(§6: calling_voice가 이 방의 판정축이 아니라 걸지 않음 — 원본 그대로 조건 선택지 미사용).\n\n=== b14_gate ===\n~ current_space = \"B14\"\n~ current_weight = 1.0\n~ b14_lit_once = false\n-> b14_intro\n\n=== b14_intro ===\n물 떨어지는 소리가 일정했다.\n\n처마 밑 빗물받이였다. 한 방울 세고 나면 다음 한 방울. 간격이 정확해서 세다가 그만뒀다.\n\n비는 오지 않았다. 유리 밖은 말라 있고 검었다.\n\n벽에 시계가 있었다. 03:47. 초침이 없었다. 초침이 갈 자리를 그 물소리가 대신 갔다.\n-> b14_t1\n\n=== b14_t1 ===\n사방이 유리였다.\n\n두 평쯤 되는 방이 능선 꼭대기에 얹혀 있었다. 네 면이 창이고 창 아래로 좁은 나무 창틀이 둘렸다. 문은 하나, 안쪽에 걸쇠.\n\n실내등은 꺼져 있었다. 스위치는 문 옆이었다.\n\n책상에 노트 한 권과 무전기. 벽에 코팅한 종이가 압정 네 개로 붙어 있었다.\n\n밖을 봤다. 어디까지가 산이고 어디부터가 하늘인지 갈리지 않았다. 그 검은 것 위에 흰 점이 다섯 개 떠 있었다. 일정한 간격으로 깜빡였다.\n\n종이를 봤다.\n\n\\**야간 감시 근무 요령** — □□국유림관리소 6초소. 일몰부터 일출까지 적용한다. #rules:B14\n\n1. 관측 중 초소 문을 열지 않는다.\n2. 실내등을 끄고 유리에 비친 것은 보지 않는다.\n3. 붉은 등화는 방위만 적고 시선을 돌린다.\n4. 등화가 다섯을 넘으면 계속 관측한다. #fake #dmg:hand\n\n※ {gender == \"m\":남성|여성} 근무자 화장실 — 능선 아래 관리초소.\n\n인쇄된 항목은 셋이었다. 4번 자리는 결번이고, 거기 볼펜 글씨가 코팅 바깥 여백에 얹혀 있었다.\n\n3번은 시선을 돌리라고 한다. 4번은 계속 보라고 한다. 붉은 것이 여섯 번째로 뜨면 두 항목을 같이 지킬 방법이 없다.\n\n+ [감시일지를 넘겨 본다] -> b14_t1_a\n+ [창틀을 살핀다] -> b14_t1_b\n+ [무전기를 본다] -> b14_t1_c\n\n=== b14_t1_a ===\n날짜마다 한 장, 정시마다 한 줄이었다. 시각, 등화 수, 방위. 22:00 등화 5. 23:00 등화 5. 24:00 등화 5. 어느 날짜나 같았다.\n\n03시 칸만 달랐다. 날짜가 넘어갈 때마다 그 칸이 한 어절씩 길어졌다.\n\n> 등화 5\n> 등화 5 남서\n> 등화 6 남서\n> 등화 6 남서 아님\n> 등화 6 남서 아님 두 번 셈\n\n마지막 날짜의 03시 칸은 어절이 아니라 문장이었다. 앞의 칸들은 수와 방위뿐이었다.\n\n> 여섯째는 능선에 없다\n\n그 아래로 날짜가 없었다.\n-> b14_t2\n\n=== b14_t1_b ===\n나무 창틀 안쪽에 볼펜 글씨가 있었다. 페인트에 자국이 남을 만큼 여러 번 덧그은 것이었다.\n\n> 여섯째는 유리 이쪽에 있다\n\n유리 이쪽에는 등이 없다. 확인하려고 방 안을 둘러봤다. 없었다.\n\n그런데도 이걸 쓴 사람은 창틀에 엎드려 볼펜을 눌렀다. 없는 걸 세 번 네 번 덧그으면서.\n-> b14_t2\n\n=== b14_t1_c ===\n검은 상자에 다이얼 하나. 눈금 옆에 초소 번호가 새겨져 있었다. 1, 2, 3, 4, 5, 6.\n\n눈금은 6에 맞춰져 있었다. 이 초소 번호였다. 자기 번호에 맞춰 두는 건 부르려는 쪽이 아니라 불리는 쪽이다.\n\n6 다음에 눈금이 한 칸 더 있었다. 번호가 새겨지지 않은 칸이었다. 돌려 보려다 손을 뗐다.\n-> b14_t2\n\n=== b14_t2 ===\n스피커가 열리는 소리가 났다.\n\n> 6초소. 정시. 등화 보고.\n\n낮고 짧은 목소리였다. 6초소, 다음에 아무것도 붙이지 않았다.\n\n세어 봤다. 왼쪽부터 하나, 둘, 셋, 넷, 다섯. 능선을 따라 낮아지는 순서로 다섯 개.\n\n+ [\"다섯.\"] -> b14_t2_a\n+ [확인등을 깜빡여 답한다] -> b14_t2_b\n+ [실내등을 켜고 일지에 적는다] -> b14_t2_c\n\n=== b14_t2_a ===\n\"다섯.\"\n\n> 확인.\n\n스피커가 닫혔다. 이쪽이 다섯이라고 하니까 다섯인 모양이었다. 개수는 세는 쪽에서 정해진다는 뜻이기도 했다.\n-> b14_t3\n\n=== b14_t2_b ===\n무전기 옆 확인등 버튼을 다섯 번 눌렀다. 초소끼리 등을 깜빡여 답하는 방식이다.\n\n지붕 어딘가에서 딸깍 소리가 다섯 번 났다. 이쪽에서 그 등은 보이지 않았다.\n\n> 6초소 등화 다섯. 확인.\n\n저쪽은 봤다는 뜻이었다. 내가 못 보는 것을 세어서 내 보고가 됐다.\n-> b14_t3\n\n=== b14_t2_c ===\n스위치를 올렸다.\n\n유리가 순식간에 안쪽을 비췄다. 밖이 지워지고 책상과 노트와 문이 떠올랐다. 방 하나가 유리 저편에 통째로 들어앉았다.\n\n그 방 안쪽 깊은 데에 흰 점이 하나 있었다. 이쪽 방 그 자리에는 아무것도 없다.\n\n껐다. 밖이 돌아왔다. 다섯이었다.\n~ b14_lit_once = true\n-> b14_t3\n\n=== b14_t3 ===\n남서쪽에 점이 하나 더 있었다.\n\n흰 다섯보다 낮은 자리였다. 색이 달랐다. 붉었다.\n\n깜빡이지 않았다. 표지등은 다섯 개가 다 일정한 간격으로 깜빡이는데 그것만 계속 켜져 있었다. 켜져 있다기보다, 꺼질 생각이 없어 보였다.\n\n> 6초소. 5초소다. 그쪽 남서 방위 등화 보이나.\n\n\"보인다.\"\n\n> 이쪽은 안 보인다. 확인 바람.\n\n4번은 다섯을 넘으면 계속 관측하라고 한다. 저쪽에서는 안 보인다고 한다. 저쪽이 보게 될 일은 없을 것이다. 그러면 확인은 오지 않고, 계속은 끝나지 않는다.\n\n+ [확인이 올 때까지 계속 본다] -> b14_death_a\n+ [방위와 시각만 적고 시선을 창틀 안쪽으로 돌린다] -> b14_t3_b\n+ [문을 열고 나가서 방위를 확인한다] -> b14_death_c\n\n=== b14_t3_b ===\n노트를 폈다. 등화 5, 붉은 것 남서. 여섯이라고 적지 않았다. 시각 칸은 비웠다. 벽시계는 아까와 같았고, 앞 줄들이 적어 놓은 시각과 이어지지 않았다.\n\n문장은 적지 않았다. 적고 싶은 문장이 하나 떠올랐는데, 앞 근무자가 마지막 칸에 왜 문장을 적었는지 알 것 같았다.\n\n고개를 숙였다. 창틀 안쪽 나무만 보이도록. 볼펜 글씨가 코앞에 있었다.\n\n붉은 것이 시야 위쪽 가장자리에 걸려 있었다. 그쪽으로 눈을 올리지 않았다.\n\n대답은 했다. 대답은 시선이 아니니까.\n-> b14_t4\n\n=== b14_t4 ===\n창틀 나무결 위로 빛이 옮겨 왔다.\n\n붉은 게 아니라 흰 빛이었다. 밖의 것이 창틀 안쪽까지 닿으려면 유리를 지나야 한다. 지나온 게 아니라 비친 것이면 이야기가 달라진다.\n\n실내등은 꺼져 있었다.\n\n{b14_lit_once: 아까 켰을 때 저 안쪽에 있던 점이, 이만큼 앞으로 나와 있었다.}\n\n> 6초소. 창 확인 바람.\n\n발신 번호를 말하지 않았다. 근무 내내 처음이었다.\n\n2번이 떠올랐다. 유리에 비친 것은 보지 않는다. 비친 것을 확인하라는 말은 요령 어디에도 없었다.\n\n+ [유리에 비친 것을 본다] -> b14_death_b\n+ [일지를 덮고 창틀 안쪽과 바닥만 본다] -> b14_t4_b\n+ [실내등을 켠다] -> b14_death_b\n\n=== b14_t4_b ===\n노트를 덮었다. 표지의 글자를 읽고 또 읽었다.\n\n무전이 두 번 더 같은 말을 했다. 세 번째는 없었다.\n\n창틀 나무결 위의 빛이 오래 머물렀다. 나무결을 하나하나 셀 만큼 오래. 세는 동안 그것은 창틀 위에 있었고, 창틀 위에 있는 것은 등화가 아니다. 등화는 능선에 있는 것이다.\n\n빛이 물러갔다.\n-> b14_clear\n\n=== b14_clear ===\n유리가 회색이 됐다.\n\n능선이 형태를 갖고, 검은 덩어리였던 것들이 나무가 됐다. 산은 산이 되면 별것 아니게 생겼다.\n\n고개를 들었다. 흰 점 다섯 개가 하나씩 꺼졌다. 순서는 어제도 그랬을 순서 같았다.\n\n다 꺼진 뒤에 남서쪽을 봤다. 아무것도 없었다. 그 자리에 능선도 없었다. 거기는 골짜기였다.\n\n> 6초소. 근무 종료.\n\n6초소, 라고만 했다. 근무 내내 그 말 뒤에 무엇도 오지 않았다.\n\n걸쇠를 풀고 문을 열었다. 서리 냄새가 났다. 지붕 위에 표지등이 하나 켜져 있었다. 안에서는 보이지 않던 것이었다.\n\n그것도 곧 꺼졌다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b14_death_a ===\n4번대로 계속 봤다.\n\n붉은 점은 커지지도 움직이지도 않았다. 대신 흰 점이 하나 꺼졌다. 넷. 조금 뒤에 셋.\n\n남은 것들이 차례로 꺼지는 동안 붉은 것만 그대로였다. 하나가 남았을 때, 그것이 깜빡이기 시작했다. 표지등이 깜빡이는 그 간격으로.\n\n표지등이 깜빡인다는 건 거기 초소가 있다는 뜻이다. 초소가 있다는 건 안에서 누가 세고 있다는 뜻이다.\n\n> 6초소. 등화 하나. 확인 바람.\n\n부르는 쪽이 저기였다.\n-> die(\"당신은 확인이 올 때까지 봤습니다.\", b14_watch)\n\n=== b14_death_b ===\n밖이 아니라 유리를 보고 있었다.\n\n방이 통째로 들어 있었다. 책상, 무전기, 펼친 노트. 그리고 창가에 점이 하나 켜져 있었다. 이쪽 방 창가에는 아무것도 없다.\n\n비친 방 안의 그 등은 흰색이었고, 다른 다섯과 같은 간격으로 깜빡였다.\n\n유리 이쪽에도 능선이 있다는 뜻이었다. 그 능선에 초소가 하나 있고, 그 안에 근무자가 하나 있고, 그 근무자를 지금 누가 세고 있었다.\n\n비치려면 이쪽에 있어야 한다. 그러면 저건 어느 방의 등인가.\n-> die(\"당신은 유리에 비친 것을 봤습니다.\", b14_reflection)\n\n=== b14_death_c ===\n걸쇠를 풀었다. 문을 열자 바람이 들어왔다. 밖은 생각보다 밝았다.\n\n밖에서 세니 표지등이 여섯이었다. 여섯째는 등 뒤, 이 초소 지붕에 달린 것이었다. 안에서는 안 보이니까 다섯이었던 것이다.\n\n남서쪽 붉은 것까지 하면 일곱이었다.\n\n안으로 들어가려고 몸을 돌렸다. 능선을 따라 흰 점이 낮아지는 순서로 늘어서 있었고, 그중 하나가 내가 서 있는 자리였다.\n-> die(\"당신은 초소 밖으로 나갔습니다.\", b14_outside)\n\n// ── /INCLUDE B14.ink ──\n// ── INCLUDE B15.ink ──\n// ink/B15.ink — B15. 산장 야간 대피소 (야외(산/숲) × 부르는것)\n// 원본: spaces/B15_산장대피소.md (§4 턴 / §6 예산 / 본문 / 사망)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b15_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0. 조각 없음. 파편 없음(표 \"·\").\n//\n// 공간 로컬 변수(둘 다 공간 밖으로 안 나감, gate에서 리셋):\n//   b15_listened(턴 2-C, 열쇠 소리 부재 확인) — 턴 4 본문 한 문장 분기.\n//   b15_lit_window(턴 3-C) — 사망 (c) 첫 문장 분기.\n// codex 신규 항목(main.ink에 추가 필요): b15_inside, b15_latch, b15_lantern — ink/B15.codex.txt 참조.\n\nVAR b15_listened = false\nVAR b15_lit_window = false\n\n=== b15_gate ===\n~ current_space = \"B15\"\n~ current_weight = 1.0\n~ b15_listened = false\n~ b15_lit_window = false\n-> b15_intro\n\n=== b15_intro ===\n처마에서 물이 떨어졌다.\n\n한 방울씩, 간격이 고르게. 그 소리를 몇 번 세고 나서 눈을 떴다.\n\n마루였다. 널이 넓고 찼다. 등 밑에 담요가 접혀 깔려 있었는데 내가 깐 것 같지는 않았다.\n\n칸 하나짜리 집이었다. 문 하나, 창 하나, 마루 하나. 벽은 합판이고 못 자국이 많았다. 창은 손바닥만 했고 유리가 아니라 두꺼운 비닐이었다. 밖은 검었다.\n\n벽에 시계. 03:47. 초침이 없었다. 숫자만 보고 눈을 뗐다.\n\n문 옆 걸이에 등이 걸려 있었다. 손잡이를 돌려 심지를 올리고 내리는 것. 지금은 중간쯤이었다. 방 안이 겨우 보일 만큼.\n\n그 옆 벽에 아크릴판이 나사 넷으로 박혀 있었다.\n-> b15_t1\n\n=== b15_t1 ===\n\\**대피소 이용 수칙** — 관리 산악회 게시. 무인 대피소입니다. #rules:B15\n\n1. 야간에는 문을 열지 않는다.\n2. 관리자는 부르지 않는다. 열쇠로 연다.\n3. 부르면 등을 줄이고 소리를 내지 않는다.\n4. 방명록은 겹쳐 쓰지 않고 새 줄에 적는다.\n4. \"안에 계신 분\"은 관리자다. 문을 연다. #fake #dmg:tape\n\n마지막 4번만 아크릴판이 아니라 그 아래 못 하나에 걸린 나무 조각이었다. 칼끝으로 판 글씨가 인쇄체를 흉내 내고 있었다.\n\n4번이 둘이었다.\n\n판에 박힌 4번은 방명록 얘기였고, 못에 걸린 4번은 문을 열라는 얘기였다. 번호가 겹치면 둘 중 하나는 나중에 왔다는 뜻이다. 나사 넷과 못 하나 중 어느 쪽이 나중인지는 세어 보지 않아도 됐다.\n\n2번을 다시 읽었다. 관리자는 부르지 않는다. 못에 걸린 4번은 관리자가 부르는 호칭을 알려 주고 있었다. 같은 사람을 두고 두 문장이 반대 방향을 가리켰다.\n\n칼로 널을 파서 벽에 거는 데 드는 시간을 생각해 봤다. 짧은 시간은 아니었다.\n+ [방명록을 본다] -> b15_t1_a\n+ [등과 문을 살핀다] -> b15_t1_b\n+ [문설주를 본다] -> b15_t1_c\n\n=== b15_t1_a ===\n선반에 노트가 있었다. 표지에 **대피자 방명록**. 칸이 넷이었다. 인원, 조치, 성명, 성별.\n\n줄이 몇 안 됐다. 마지막 한 줄을 세 번 덧썼기 때문이었다. 지우지 않고 겹쳐 써서 잉크가 층으로 남았다.\n\n> 맨 아래, 검은색. 인원 1 / 밖에서 부름. 문 개방.\n> 그 위, 파란색. 인원 1 / 등 그대로 둠. 인원 확인 응답.\n> 맨 위, 연필. 인원 2 /\n\n맨 위 줄은 조치 칸이 종이째 찢겨 없었다. 찢긴 자리가 칸 하나 크기에 맞았다.\n\n성명 칸은 세 겹 다 비었고 성별 칸은 세 겹 다 찼다. 다음 줄에도 성별 칸에만 {gender == \"m\":남|여}가 적혀 있었다.\n\n4번은 겹쳐 쓰지 말고 아래에 새 줄을 만들라고 했다. 새 줄을 만든 사람이 없었다.\n-> b15_t2\n\n=== b15_t1_b ===\n심지를 조금 내려 봤다. 방이 어두워지는 만큼 문 아래 틈으로 나가던 빛도 줄었다. 틈은 손가락 하나가 들어갈 만큼 넓었고, 문지방이 가운데만 닳아 있었다.\n\n빗장은 나무였다. 걸려 있었다. 걸쇠 자리에 긁힌 자국이 여럿이었는데, 방향이 전부 같았다. 안쪽에서 빼면서 난 자국이었다. 밖에서 밀어 생긴 자국은 하나도 없었다.\n\n이 문은 여러 번 열렸고, 매번 안에서 열렸다.\n-> b15_t2\n\n=== b15_t1_c ===\n문설주에 연필 글씨가 있었다. 눈높이보다 한참 낮았다. 앉아서 쓴 것이다.\n\n> 부르면 아니다\n> 부르지 않으면 열쇠가 있다\n> 나무는 산악회가 안 걸었다\n\n세 줄 다 같은 필체였다. 마지막 줄만 획이 얕았다. 힘이 덜 들어간 게 아니라 시간이 없었던 쪽으로 보였다.\n-> b15_t2\n\n=== b15_t2 ===\n밖에서 발소리가 났다.\n\n마루 밑으로 진동이 왔다. 계단을 올라와 문 앞에서 멈췄다. 노크는 없었다.\n\n> 안에 계신 분.\n\n크지도 작지도 않았다. 묻는 억양이 아니었고 대답을 기다리는 억양도 아니었다. 한 번 말하고 끝이었다.\n\n못에 걸린 4번대로면 지금 문을 열 차례였다. 2번이 맞다면 방금 부른 것은 관리자가 아니다.\n+ [\"누구세요.\"라고 묻는다] -> b15_death_a\n+ [대답하지 않는다] -> b15_t2_b\n+ [문에 귀를 댄다] -> b15_t2_c\n\n=== b15_t2_b ===\n숨만 쉬었다.\n\n밖도 더 말하지 않았다. 발소리도 나지 않았다. 갔다는 소리가 나야 갔는지 아는데, 그 소리가 없었다.\n-> b15_t3\n\n=== b15_t2_c ===\n나무에 귀를 댔다. 찼다.\n\n밖에서 나는 것은 서 있는 소리였다. 옮기지 않고 서 있는 사람의 옷이 스치는 소리. 그 외에는 없었다.\n\n쇳소리가 없었다. 열쇠를 가진 사람은 손을 움직일 때마다 쇳소리를 낸다. 그런 소리는 한 번도 나지 않았다.\n~ b15_listened = true\n-> b15_t3\n\n=== b15_t3 ===\n한참 뒤에 다시 왔다.\n\n> 안에 계신 분. 인원 확인이 필요합니다.\n\n같은 높이, 같은 간격. 아까 한 말에 한 줄이 붙었을 뿐이었다.\n\n등을 봤다. 심지가 중간에 있었다. 문 아래 틈으로 빛이 한 줄 나가고 있었다. 밖에서 보면 그 줄은 방 안에서 누가 움직일 때마다 끊겼다 이어졌다 할 것이다.\n\n3번은 등을 줄이라고 했다. 그 줄은 빛이고, 빛은 밖에서 세어진다.\n+ [심지를 끝까지 내린다] -> b15_t3_a\n+ [그대로 둔다] -> b15_death_c\n+ [등을 창에 대어 밖을 비춘다] -> b15_t3_c\n\n=== b15_t3_a ===\n손잡이를 끝까지 돌렸다. 불이 실처럼 남았다가 꺼졌다.\n\n방이 검어졌다. 문 아래의 줄도 없어졌다.\n\n어두워지니 밖의 소리가 더 잘 들렸다. 그쪽도 같은 조건이 됐을 거라는 생각은 하지 않기로 했다.\n\n밖이 조용해졌다. 오래.\n-> b15_t4\n\n=== b15_t3_c ===\n~ b15_lit_window = true\n-> b15_death_c\n\n=== b15_t4 ===\n발소리가 다시 계단을 올라왔다.\n\n> 관리 산악회입니다. 야간 순회 중입니다.\n\n소속을 먼저 말했다. 여기까지는 관리자가 하는 말이었다.\n\n> 안에 계신 분, 인원 확인하겠습니다.\n\n한 문장 안에서 형식이 갈라졌다. 앞은 자기 얘기였고 뒤는 나를 부르는 말이었다. 2번은 관리자가 부르지 않는다고 했다. 하나만 어긋나도 어긋난 것이다.\n\n열쇠 소리를 기다렸다. 관리자라면 열쇠로 연다고 적혀 있었으니까. {b15_listened: 아까 귀를 댔을 때도 쇳소리는 없었다. 지금도 없었다.|나지 않았다.}\n\n빗장은 걸린 채였다.\n+ [문을 연다] -> b15_death_b\n+ {codex ? calling_voice} [아무 소리도 내지 않는다] (도감: 부르는 소리) -> b15_t4_b\n+ {not (codex ? calling_voice)} [아무 소리도 내지 않는다] -> b15_t4_b\n+ [\"관리자십니까.\"라고 묻는다] -> b15_death_a\n\n=== b15_t4_b ===\n빗장에 손이 올라가 있었다. 손을 내렸다.\n\n밖에서 한 번 더 불렀다. 그다음에는 부르지 않았다. 발소리가 계단을 내려갔다. 올라올 때와 걸음 수가 달랐는데, 세다가 그만뒀다.\n\n한참 뒤에 비닐 창이 허옇게 됐다. 밖이 밝아진 것이다. 1번이 금한 것은 야간이었다.\n\n빗장을 뺐다. 문 앞 마루에 젖은 발자국이 남아 있었다. 문 쪽을 보고 선 두 발. 돌아서서 내려간 자국은 없었다.\n\n방명록에 새 줄을 만들었다. 인원 1, 심지를 내림. 성명 칸은 그대로 뒀다. 적을 것이 없었다.\n-> b15_clear\n\n=== b15_clear ===\n// 클리어. 다음 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b15_death_a ===\n물었다.\n\n말이 나가고 나서 그게 몇 글자였는지 세어 봤다. 밖이 그만큼 조용했다.\n\n> 안에 계신 분입니다.\n\n같은 높이로 돌아왔다. 묻는 말에 답한 게 아니라 이름을 댄 쪽에 가까웠다.\n\n호칭 하나가 저쪽으로 넘어갔다. 그 말이 저쪽 것이 되면 이쪽에는 뭐가 남는지 생각해 봤다.\n\n등의 심지가 저절로 올라갔다. 방이 밝아졌고, 안이 다 보였다. 안에 있는 것이 다 보였다.\n-> die(\"당신은 대답했습니다.\", b15_inside)\n\n=== b15_death_b ===\n빗장을 뺐다. 문은 안쪽으로 열렸다.\n\n밖에 아무도 없었다. 마루 끝, 계단, 그 아래 검은 나무들. 한 발 나가서 좌우를 봤다.\n\n돌아서기 전에 뒤에서 소리가 났다. 나무가 나무 홈으로 들어가는 소리. 짧고 한 번이었다.\n\n문은 닫혀 있었다. 아래 틈으로 빛이 한 줄 나와 있었다. 가늘던 것이 천천히 넓어지다 중간에서 멈췄다. 누가 심지를 올린 높이였다.\n\n걸쇠의 긁힌 자국은 전부 안쪽 것이었다.\n\n> 안에 계신 분.\n\n문 안쪽에서 났다. 그 호칭이 가리키는 자리에 내가 없었다.\n-> die(\"당신은 문을 열었습니다.\", b15_latch)\n\n=== b15_death_c ===\n빛이 나갔다. {b15_lit_window: 창의 비닐이 통째로 노랗게 밝아졌다.|문 아래로 한 줄, 계속.}\n\n밖에서 말이 왔다.\n\n> 빛 확인했습니다. 인원 확인하겠습니다.\n\n그리고 세기 시작했다. 하나. 둘.\n\n방 안에는 하나였다. 세는 소리는 셋에서 멈췄다.\n\n> 확인했습니다. 세 분.\n\n뒤를 보지 않았다. 볼 필요도 없었다. 등이 벽에 만든 그림자가 몇 개인지는 앉은 자리에서도 셀 수 있었다.\n-> die(\"당신은 불을 켜 두었습니다.\", b15_lantern)\n\n// ── /INCLUDE B15.ink ──\n// ── INCLUDE B16.ink ──\n// ink/B16.ink — B16. 심야 열차 3호차 (교통(열차) × 수량이상)\n// 원본: spaces/B16_심야열차.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink·B04.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b16_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0. 조각 없음.\n//\n// 파편: \"창가. 강이 보인다\" — 턴 2 진입 공통. shard(\"창가. 강이 보인다\") -> 다음knot (n = B 번호,\n// fragment(n)과 동일한 숫자 인자 관례로 이번 배치부터 통일. B01·B04는 shard(\"문구\")\n// 문자열 인자 관례였다 — 상위가 main.ink에 shard()를 실제로 추가할 때 두 관례가\n// 혼재하니 주의. 문구는 ink/B16.codex.txt ## shard 참조.\n//\n// 원본 턴 4-C \"→ [선택 4]로 (A / B)\" 되돌림 루프는 B04.ink 표본과 동일하게, C 선택지를\n// 뺀 b16_t4_repeat(A/B 둘만)으로 처리했다(무한 루프 방지 + C 소거).\n// 공간 로컬 변수: 없음(설계서 §6에 내부 상태 표기 없음).\n// codex 신규 항목(main.ink에 추가 필요): b16_button, b16_seat, b16_headcount — ink/B16.codex.txt 참조.\n\n=== b16_gate ===\n~ current_space = \"B16\"\n~ current_weight = 1.0\n-> b16_intro\n\n=== b16_intro ===\n이음매 소리가 일정했다.\n\n쥐고 있던 것이 종이라는 걸 알고 나서 눈을 떴다. 접힌 자국이 세 번 나 있었고 위쪽 가장자리가 거칠었다. 어디선가 뜯어낸 종이였다.\n\n바닥이 낮게 흔들렸다. 흔들림에 맞춰 종이가 조금씩 떨렸다.\n-> b16_t1\n\n=== b16_t1 ===\n3호차였다.\n\n앞쪽 문 위에 전광판이 있었다. 붉은 글자가 왼쪽으로 흘렀다. **□□행**. 글자가 다 지나가자 시각이 떴다. 03:47. 가운데 두 점이 깜빡이지 않았다.\n\n천장 조명은 꺼져 있고 좌석 독서등 몇 개만 켜져 있었다. 통로 양쪽으로 두 자리씩, 뒤쪽까지 열두 줄. 사람들은 고개를 창 쪽으로 두고 있었다.\n\n내 자리는 통로 쪽이었다. 옆 창가 자리는 비어 있었다.\n\n종이를 폈다.\n\n\\**심야 열차 이용 안내** — □□행 · 3호차 객실 게시. 세면실은 {gender == \"m\":객실 앞쪽|객실 뒤쪽}입니다. #rules:B16\n\n1. 검표는 발권 매수대로 1회 합니다.\n2. 검표를 못 받으면 호출 버튼을 누릅니다. #fake #dmg:tape\n3. 실제 인원과 달라도 발권 매수로 답합니다.\n4. 발권 표시가 없는 좌석에 앉지 않습니다.\n\n3번이 이상했다. 실제 인원과 달라도 발권 매수로 답하라. 다를 수 있다는 걸 미리 알고 쓴 문장이었다.\n\n2번은 반대쪽이었다. 수가 안 맞으면 불러서 맞추라고 한다.\n\n종이 위쪽 3분의 1이 색이 조금 달랐다. 눌러 보니 두 겹이었다.\n+ [출입문 옆 게시틀을 본다] -> b16_t1_a\n+ [통로를 걸으며 사람을 센다] -> b16_t1_b\n+ [접이 테이블을 펴 본다] -> b16_t1_c\n\n=== b16_t1_a ===\n투명 아크릴 틀. 같은 안내문이 한 장 끼워져 있고, 그 아래 좌석 배치도가 있었다.\n\n3호차 도면이었다. 좌석마다 네모가 그려져 있고, 발권된 좌석에는 네모 안에 동그라미가 찍혀 있었다. 동그라미를 셌다. 열여덟.\n\n틀 옆 플라스틱 꽂이에 카드가 한 장 꽂혀 있었다. 손글씨가 아니라 도장 같은 활자였다.\n\n> 3호차 · 발권 17\n\n열일곱과 열여덟. 종이 두 장이 서로 다른 수를 말하고 있었다.\n-> b16_t2\n\n=== b16_t1_b ===\n통로를 천천히 걸었다.\n\n세기는 어렵지 않았다. 다들 움직이지 않았으니까. 머리를 하나씩 짚어 갔다. 열넷, 열다섯, 열여섯, 열일곱. 자리로 돌아와 앉으면서 하나를 더했다. 열여덟.\n\n다시 셌다. 열여덟이었다. 지나가는 동안 고개를 든 사람은 없었다.\n-> b16_t2\n\n=== b16_t1_c ===\n앞 좌석 등받이의 걸쇠를 풀었다. 테이블이 내려왔다.\n\n상판에 볼펜 글씨가 있었다. 세 줄이었고 필체가 둘이었다.\n\n> 열일곱으로 답해라\n> 세어 보면 열여덟이다\n\n그 밑에 다른 필체로, 눌러 쓴 것.\n\n> 그래도 열일곱\n\n팔걸이 안쪽에 버튼이 하나 있었다. 사람 모양이 새겨져 있고 그 위에 작은 표시등. 꺼져 있었다.\n-> b16_t2\n\n=== b16_t2 ===\n옆자리가 비어서 창이 통째로 보였다. 검은 유리 밖으로 둑이 지나갔다. 둑 아래가 넓게 트여 있었고, 그 위로 불빛 몇 개가 길게 늘어져 흔들렸다.\n-> shard(\"창가. 강이 보인다\") -> b16_t2_cont\n\n=== b16_t2_cont ===\n방송이 나왔다.\n\n> 3호차 승객 여러분. 잠시 후 검표가 있겠습니다. 승차권을 준비해 주시기 바랍니다.\n\n말투에 서두름이 없었다. 앞쪽 통로문이 열리고 제복을 입은 사람이 들어와 첫 줄 앞에 섰다. 손에 단말기가 있었다.\n+ [창가 자리로 옮겨 앉는다] -> b16_death_b\n+ [검표원이 몇 번 멈추는지 센다] -> b16_t2_b\n+ [주머니를 뒤져 승차권을 찾는다] -> b16_t2_c\n\n=== b16_t2_b ===\n셌다.\n\n검표원은 한 줄에서 한 번, 또는 두 번 멈췄다. 멈출 때마다 단말기를 승차권에 대고 눌렀다. 종이 가장자리에 톱니 자국이 우표처럼 남았다.\n\n열둘, 열셋, 열넷. 내 줄에 왔을 때 검표원은 옆 창가 자리를 한 번 보고 그냥 지나갔다. 나를 못 본 게 아니었다. 볼 곳이 여기가 아닌 것 같았다.\n\n뒤쪽에서 세 번 더 멈추고 끝났다. 열일곱이었다.\n-> b16_t3\n\n=== b16_t2_c ===\n주머니를 전부 뒤졌다. 안주머니, 바깥 주머니, 뒷주머니.\n\n종이는 손에 든 안내문 한 장뿐이었다. 승차권은 없었다. 있다가 없어진 자리 같은 것도 없었다.\n\n검표원이 옆을 지나갔다. 멈추지 않았다. 세 줄쯤 뒤에서 단말기 누르는 소리가 났다.\n-> b16_t3\n\n=== b16_t3 ===\n검표가 끝났다. 검표원이 뒤쪽 통로문으로 나갔고 문이 닫혔다.\n\n세면실 쪽에서 물 내려가는 소리가 났다. 문이 열리거나 닫히는 소리는 나지 않았고, 통로로 나오는 사람도 없었다.\n\n팔걸이 안쪽 버튼의 표시등에 불이 들어와 있었다. 주황색이었다. 누른 적이 없었다.\n\n2번: 검표를 못 받으면 호출 버튼을 누릅니다.\n+ [버튼을 누른다] -> b16_death_a\n+ [안내문 위쪽 두 겹을 들춰 본다] -> b16_t3_b\n+ [게시틀의 배치도를 다시 본다] -> b16_t3_c\n\n=== b16_t3_b ===\n덧댄 자리 모서리에 손톱을 넣었다. 풀이 얇게 발려 있어서 쉽게 떨어졌다.\n\n덧댄 종이 밑에 인쇄가 있었다. 2번 자리였다.\n\n> 2. 검표를 못 받아도 그대로 착석해 계십시오.\n\n위에 붙은 쪽은 활자로 찍은 것이 아니었다. 획이 굵고 끝이 뭉툭했다.\n\n두 개의 2번을 나란히 놓고 봤다. 하나는 가만히 있으라고 하고 하나는 부르라고 한다. 나중에 붙은 쪽이 부르라고 했다.\n-> b16_t4\n\n=== b16_t3_c ===\n게시틀 앞으로 갔다.\n\n도면도 같고 네모도 같았다. 동그라미를 다시 셌다.\n\n열일곱이었다.\n\n내 좌석 자리를 찾았다. 네모는 있는데 동그라미가 없었다. 잉크가 빠진 게 아니라 처음부터 찍히지 않은 자리였다.\n\n카드는 여전히 발권 17이었고, 사람은 열여덟이었다.\n-> b16_t4\n\n=== b16_t4 ===\n전광판이 □□행을 한 바퀴 흘리고 멈췄다. 시각은 아까와 같았다.\n\n방송.\n\n> 3호차. 객실 인원을 확인합니다. 응답해 주십시오.\n\n객실 어디에서도 대답이 없었다. 사람들은 아까와 같은 각도로 앉아 있었다.\n\n3번: 실제 인원과 달라도 발권 매수로 답합니다.\n+ {codex ? calling_voice} [\"열일곱.\"] (도감: 부르는 소리) -> b16_clear\n+ {not (codex ? calling_voice)} [\"열일곱.\"] -> b16_clear\n+ [\"열여덟.\"] -> b16_death_c\n+ [대답하지 않는다] -> b16_t4_c\n\n=== b16_t4_c ===\n그냥 앉아 있었다.\n\n방송이 같은 문장을 두 번 더 냈다. 사이가 조금씩 짧아졌다.\n\n세 번째가 끝나고 앞쪽 통로문이 열렸다. 검표원이 들어왔는데 이번엔 걷지 않았다. 통로 끝에 서서 객실 전체를 보고 있었다.\n\n기다리는 자세였다. 대답이 나올 때까지 저기 서 있을 것 같았다.\n-> b16_t4_repeat\n\n=== b16_t4_repeat ===\n+ {codex ? calling_voice} [\"열일곱.\"] (도감: 부르는 소리) -> b16_clear\n+ {not (codex ? calling_voice)} [\"열일곱.\"] -> b16_clear\n+ [\"열여덟.\"] -> b16_death_c\n\n=== b16_clear ===\n\"열일곱.\"\n\n> 확인했습니다. 3호차 열일곱.\n\n방송이 끊겼다. 앞쪽 통로문이 닫혔다.\n\n그 수에 내가 없다는 게 별로 이상하지 않았다. 이상한 건 이상하지 않다는 쪽이었는데, 오래 붙들고 있을 일은 아니었다.\n\n이음매 소리가 다시 일정해졌다. 창밖은 둑이 끝나고 검기만 했다.\n\n안내문을 접어 앞 좌석 그물 주머니에 넣었다. 두 겹은 들춘 채로 뒀다. 다음에 이 자리에 앉는 사람은 2번을 두 개 보게 될 것이다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b16_death_a ===\n버튼을 눌렀다. 표시등이 주황에서 흰색으로 바뀌었다.\n\n통로문이 열리고 검표원이 왔다. 단말기를 몇 번 누르자 얇은 종이가 밀려 나왔다. 따뜻했다.\n\n> 발권해 드렸습니다.\n\n승차권이었다. 열차 이름과 하차역이 찍혀 있고 좌석 칸만 비어 있었다.\n\n> 좌석은 다음 역에서 안내드리겠습니다.\n\n게시틀 쪽에서 카드 넘어가는 소리가 났다. 발권 18. 동그라미는 열일곱 그대로였다.\n\n> 3호차. 좌석 배정 초과. 미배정 승객 한 분은 승무원의 안내를 따라 주십시오.\n\n통로 끝에서 검표원이 손을 들었다. 이쪽을 보고 있었다. 검표원이 나를 본 것은 그때가 처음이었다.\n-> die(\"당신은 발권을 요청했습니다.\", b16_button)\n\n=== b16_death_b ===\n창가로 옮겨 앉았다. 등받이가 통로 쪽 것보다 조금 낮았다.\n\n검표원이 내 줄에 왔다. 앞줄에서 멈췄고 뒷줄에서도 멈췄는데 이 줄에서는 멈추지 않았다. 단말기 화면을 보고, 좌석 두 개를 보고, 그냥 갔다.\n\n검표가 끝나자 검표원이 앞쪽부터 다시 걸어왔다. 이번엔 좌석 정리였다. 동그라미가 없는 좌석의 등받이를 하나씩 앞으로 접었다. 접은 자리는 통로에서 보이지 않게 됐다.\n\n내 등받이에 손이 왔다.\n-> die(\"당신은 발권 표시가 없는 좌석에 앉았습니다.\", b16_seat)\n\n=== b16_death_c ===\n\"열여덟.\"\n\n> 확인했습니다. 3호차 열여덟.\n\n잠시 뒤 게시틀에서 카드 넘어가는 소리가 났다.\n\n> 3호차 승객 여러분. 검표가 있겠습니다. 승차권을 준비해 주시기 바랍니다.\n\n통로문이 열리고 검표원이 첫 줄부터 다시 왔다. 이번에는 멈추는 자리가 하나 더 많았다.\n\n열여덟 번째가 내 자리였다. 검표원이 손바닥을 위로 하고 기다렸다. 내놓을 것이 없었다. 검표원이 단말기를 보고, 나를 보고, 다시 단말기를 봤다.\n\n> 열일곱입니다.\n\n수를 맞추는 방법은 둘이다. 표를 하나 늘리거나, 사람을 하나 줄이거나. 검표원은 단말기를 주머니에 넣었다.\n-> die(\"당신은 착석 인원으로 응답했습니다.\", b16_headcount)\n\n// ── /INCLUDE B16.ink ──\n// ── INCLUDE B17.ink ──\n// ink/B17.ink — B17. 야간 투약 시각표 (병원(6인 병실) × 시간이상)\n// 원본: spaces/B17_투약시각표.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b17_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0. 조각 없음.\n//\n// 파편: \"서명 칸이 비어 있다\" — 턴 1-B 본문 안 한 문장으로 자연스럽게 등장(별도 표시 없이\n// 서명 장면 없이 자동 획득). 문장은 그대로 두고 바로 뒤에 shard(\"서명 칸이 비어 있다\") -> 다음knot을 넣어\n// b17_t1_b를 두 knot(b17_t1_b / b17_t1_b_cont)으로 쪼갰다. n = B 번호(fragment(n)과 동일\n// 숫자 인자 관례 — 이번 배치부터 통일, B01·B04의 shard(\"문구\") 관례와 다름). 문구는\n// ink/B17.codex.txt ## shard 참조.\n//\n// 공간 로컬 변수: saw_print(턴 1-A, 훼손 확인) — 턴 4 선택지 B의 힌트 한 문장에만 쓰고\n// 공간 밖으로 나가지 않는다. gate에서 리셋.\n// codex 신규 항목(main.ink에 추가 필요): b17_cart, b17_first, b17_second — ink/B17.codex.txt 참조.\n\nVAR saw_print = false\n\n=== b17_gate ===\n~ current_space = \"B17\"\n~ current_weight = 1.0\n~ saw_print = false\n-> b17_intro\n\n=== b17_intro ===\n방울 떨어지는 소리가 났다.\n\n일정했다. 셋 세고 하나, 셋 세고 하나. 소리 나는 쪽에 링거대가 서 있었고 주머니는 반쯤 남아 있었다.\n\n줄이 침대 난간을 타고 손등까지 내려와 있었다. 바늘 자리에 투명한 테이프가 두 겹 붙어 있었다. 언제 꽂았는지는 기억나지 않았고, 기억날 거라고 기대하지도 않았다.\n\n환자복 가슴께에 인쇄된 글씨가 있었다. 입원 환자.\n-> b17_t1\n\n=== b17_t1 ===\n침대가 여섯이었다. 다섯은 커튼이 쳐져 있었다.\n\n내 자리 발치 난간에 플라스틱 표가 꽂혀 있었다. 4.\n\n문 위에 시계가 걸려 있었다. 03:47. 초침이 있어야 할 자리에 아무것도 없었다.\n\n머리맡 벽에 코팅된 카드 두 장이 나란히 붙어 있었다. 왼쪽이 시각표였다.\n\n\\**투약 시각표 — 4번 침상**\n\n22:00\n00:00\n02:00\n04:00\n04:00\n06:00\n\n여섯 줄인데 시각은 다섯 개였다. 넷째와 다섯째가 같았다.\n\n오른쪽 카드를 읽었다.\n\n\\**야간 투약 안내** — □□ 야간 간호팀. {gender == \"m\":남성|여성} 병동 22시부터 06시까지. #rules:B17\n\n1. 같은 시각 봉투는 도착 순서로 센다. #fake #dmg:strike\n2. 카트가 멈춰 있으면 문을 열지 않는다.\n3. 한 시각에 두 번째 봉투는 복용하지 않는다.\n4. 봉투의 조제 번호가 조제 순서다.\n\n3번은 두 번째를 복용하지 말라고 했다. 어느 것이 두 번째인지는 1번과 4번이 서로 다르게 말하고 있었다.\n\n두 시각이 같은 시각이면 둘 중 하나는 늦게 온 것이다. 늦게 온 것과 나중에 도착한 것이 같은 말인지는 아직 알 수 없었다.\n+ [카드 두 장을 가까이 본다] -> b17_t1_a\n+ [발치의 확인표를 본다] -> b17_t1_b\n+ [옆 침상의 커튼을 젖힌다] -> b17_t1_c\n\n=== b17_t1_a ===\n시각표의 두 04:00은 글자 간격도 잉크 농도도 같았다. 덧쓴 것도 고친 것도 아니고 처음부터 그렇게 찍혀 나왔다.\n\n안내문 쪽은 1번만 글씨가 코팅 위에 얹혀 있었고 손끝으로 문지르니 검은 게 묻어났다.\n\n카드를 기울였다. 유성펜 밑으로 인쇄가 비쳤다. 덮인 문장은 짧았다.\n\n> 도착 순서는 투약 순서가 아니다.\n\n덮어 쓴 사람은 원래 문장을 읽고 나서 그 위에 반대말을 얹었다. 지우지 않고 얹기만 한 것이 마음에 걸렸다. 지우려면 지울 수 있었을 텐데.\n~ saw_print = true\n-> b17_t2\n\n=== b17_t1_b ===\n난간에 클립보드가 걸려 있었다. 표에 시각 칸이 여섯이었다. 22:00, 00:00, 02:00, 04:00, 04:00, 06:00. 시각표와 같았다.\n\n확인 칸은 여섯 개 다 비어 있었다. 맨 아래 서명 칸이 비어 있다.\n-> shard(\"서명 칸이 비어 있다\") -> b17_t1_b_cont\n\n=== b17_t1_b_cont ===\n종이를 넘겼다. 뒷장 아래쪽에 볼펜 글씨가 있었다.\n\n> 나중에 온 게 먼저 만든 거다\n\n한 번에 쓴 글씨였다. 망설인 자국이 없었다. 알고 나서 쓴 사람의 글씨였다.\n-> b17_t2\n\n=== b17_t1_c ===\n커튼을 한 뼘 젖혔다. 침대는 비어 있었다. 시트가 각 잡혀 있고 베개에 눌린 자국이 없었다.\n\n발치 확인표의 04:00 칸이 두 개, 둘 다 볼펜으로 표시돼 있었다.\n\n한 시각에 한 번이라고 3번에 적혀 있었다. 이 사람은 두 번 표시했고, 지금 이 침대에 없다.\n-> b17_t2\n\n=== b17_t2 ===\n복도에서 바퀴 소리가 났다. 점점 커지다가 문 앞에서 멈췄다.\n\n> 4번 침상. 투약입니다.\n\n천장 스피커였다. 침상 번호 앞뒤로 아무것도 붙지 않았다.\n\n문 아래 여닫이 투입구가 한 번 여닫혔다. 안쪽 선반에 종이봉투 떨어지는 소리.\n\n바퀴 소리는 멈춘 채였다. 지나가지 않았다.\n+ [봉투를 가져와 복용한다] -> b17_t2_a\n+ {codex ? calling_voice} [문을 열어 본다] (도감: 부르는 소리 — 부름은 대답을 요구하지 않는다) -> b17_death_a\n+ {not (codex ? calling_voice)} [문을 열어 본다] -> b17_death_a\n+ [확인표에 02:00을 표시하고 봉투는 둔다] -> b17_t2_c\n\n=== b17_t2_a ===\n바퀴 소리가 다시 굴러 복도 끝으로 멀어졌다. 그다음에 선반으로 갔다.\n\n라벨이 붙어 있었다.\n\n> 4번 침상\n> 02:00\n> 조제 12\n\n시각표에 02:00은 한 줄뿐이었다. 봉투를 뜯었다. 흰 알약 둘, 노란 것 하나. 링거 줄이 걸리지 않게 팔을 돌려 삼켰다.\n\n확인표 02:00 칸에 표시하고, 칸 옆 여백에 12라고 적었다. 숫자를 세려면 시작할 숫자가 필요했다.\n-> b17_t3\n\n=== b17_t2_c ===\n확인표의 02:00 칸에 볼펜으로 표시했다. 봉투는 선반에 그대로 두었다.\n\n바퀴 소리가 멀어지고 한참 뒤에 표를 다시 봤다. 칸이 비어 있었다. 지운 자국이 아니라 애초에 긋지 않은 것처럼 매끄러웠다. 선반도 비어 있었다.\n\n이 표는 내가 쓰는 게 아니었다. 표시는 내가 하는 게 아니라 생기는 것이었다.\n-> b17_t3\n\n=== b17_t3 ===\n바퀴 소리가 다시 왔다.\n\n> 4번 침상. 투약입니다.\n\n같은 문장, 같은 속도. 투입구가 여닫히고 봉투 하나.\n\n바퀴가 굴러 멀어진 뒤에 선반으로 갔다.\n\n> 4번 침상\n> 04:00\n> 조제 17\n\n04:00이었다. 시각표에서 두 줄을 차지한 시각이었다.\n\n이게 위 줄인지 아래 줄인지 알 방법이 봉투 하나로는 없었다. 첫 번째는 두 번째가 와야 첫 번째가 된다.\n+ [복용한다] -> b17_death_b\n+ [선반에 두고 기다린다] -> b17_t3_b\n+ [호출 버튼을 누른다] -> b17_t3_c\n\n=== b17_t3_b ===\n봉투를 선반 왼쪽에 놓고 침대에 앉았다.\n\n기다리는 동안 안내문 1번을 한 번 더 봤다. 유성펜은 문지른 자리만 흐려져 있었다. 나머지는 그대로였다.\n-> b17_t4\n\n=== b17_t3_c ===\n머리맡의 호출 버튼을 눌렀다. 빨간 불이 들어왔다가 꺼졌다.\n\n> 4번 침상. 04시 투약 두 건 예정. 대기하십시오.\n\n두 건. 예정. 두 단어 다 이 방에서는 이상한 말이었다. 이미 하나가 와 있는데 두 건이 예정이라고 했다.\n\n빨간 불은 다시 들어오지 않았다.\n-> b17_t4\n\n=== b17_t4 ===\n세 번째 바퀴 소리였다.\n\n> 4번 침상. 투약입니다.\n\n투입구. 봉투. 멀어지는 바퀴.\n\n선반에 봉투가 둘이 됐다. 새 것의 라벨을 읽었다.\n\n> 4번 침상\n> 04:00\n> 조제 14\n\n둘 다 04:00이었다. 조제 17이 먼저 왔고 조제 14가 나중에 왔다.\n\n4번은 번호가 조제한 순서라고 했다. 14를 만들고 나서 17을 만든 것이다. 그러니 04:00의 첫 번째는 지금 막 도착한 쪽이고, 아까부터 선반에 놓여 있던 쪽이 두 번째다.\n\n1번은 반대로 말했다. 1번은 유성펜이었다.\n\n두 봉투를 나란히 놓았다. 종이도 접힌 자리도 같았다. 다른 건 두 자리 숫자 하나뿐이었다.\n+ [먼저 온 봉투를 복용한다] -> b17_death_c\n+ [나중에 온 봉투를 복용한다{saw_print: (인쇄가 비쳤다: 도착 순서는 투약 순서가 아니다)}] -> b17_clear\n\n=== b17_clear ===\n조제 14를 뜯었다. 흰 알약 둘, 노란 것 하나. 세 알이었다.\n\n삼키고 확인표 04:00 위 칸에 표시했다. 아래 칸은 비워 뒀다. 조제 17은 선반에 그대로 두었다.\n\n복도에서 바퀴 소리가 한 번 더 났다. 이번에는 문 앞에서 멈추지 않고 지나갔다.\n\n> 4번 침상. 야간 투약 종료.\n\n06:00 칸은 끝내 비어 있었다. 표시하지 않았으니 없었던 것이다. 없었던 것으로 밤이 끝났다.\n\n커튼 틈으로 회색이 들어왔다. 창이 있는 줄 처음 알았다.\n\n선반의 조제 17을 마지막으로 봤다. 뜯지 않은 채였고 라벨의 시각은 아직 04:00이었다. 지나간 시각을 붙이고도 봉투는 하나도 낡지 않았다.\n\n문이 열렸다. 밀고 들어온 사람은 없었다. 열린 것만 확인하고 나갔다.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b17_death_a ===\n문을 열었다. 복도였다.\n\n카트는 이미 저 끝에 가 있었다. 멈춘 소리가 나는 동안에도 저기까지 가 있었던 것이다. 미는 사람 쪽은 보이지 않았다.\n\n병실로 돌아왔다. 확인표의 여섯 칸이 전부 표시돼 있었다. 22:00부터 06:00까지, 내가 하지 않은 표시로.\n\n머리맡 시각표를 봤다. 04:00 아래에 04:00이 한 줄 늘어 있었다. 보고 있는 동안 한 줄 더 늘었다.\n\n복도에서 바퀴 소리가 났다.\n-> die(\"당신은 카트가 멈춰 있는 동안 문을 열었습니다.\", b17_cart)\n\n=== b17_death_b ===\n뜯어서 삼켰다. 04:00은 시각표에 있는 시각이고, 규칙이 금지한 건 두 번째뿐이었다. 이건 하나였다.\n\n확인표를 집었다. 04:00 아래 칸에 표시가 생겨 있었다. 위 칸은 비어 있었다.\n\n위 칸이 아직 오지 않은 것으로 처리돼 있었다. 그러니까 방금 삼킨 것이 두 번째였고, 첫 번째는 이제부터 온다.\n\n투입구가 여닫혔다.\n\n> 4번 침상. 투약입니다.\n-> die(\"당신은 비교하기 전에 삼켰습니다.\", b17_first)\n\n=== b17_death_c ===\n조제 17을 뜯어 삼켰다.\n\n스피커는 아무 말도 하지 않았다. 확인표에도 아무 표시가 생기지 않았다.\n\n선반의 조제 14 옆에 봉투가 하나 더 놓여 있었다. 조제 12였다. 그 옆에 09, 그 옆에 07. 투입구는 여닫히지 않았는데 봉투가 늘었다.\n\n번호가 거꾸로 내려가면서 선반을 채웠다. 라벨의 시각은 전부 04:00이었다. 침상 번호도 전부 4였다.\n\n한 시각의 투약은 한 번이라고 했다. 한 번이 몇 개인지는 적혀 있지 않았다.\n-> die(\"당신은 두 번째를 복용했습니다.\", b17_second)\n\n// ── /INCLUDE B17.ink ──\n// ── INCLUDE B18.ink ──\n// ink/B18.ink — B18. 야간 점호 (교도소(수용동 사동) × 수량이상)\n// 원본: spaces/B18_야간점호.md (§4 턴 / §6 예산 / 본문 / 사망 / 파편)\n// 규약: A02.ink·A09.ink·B01.ink·B04.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b18_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0. 조각 없음.\n//\n// 파편: \"번호로 불린다\" — 턴 2 진입 공통. shard(\"번호로 불린다\") -> 다음knot (n = B 번호, fragment(n)과\n// 동일 숫자 인자 관례로 이번 배치부터 통일). 문구는 ink/B18.codex.txt ## shard 참조.\n//\n// 성별 2단계(A09.ink 표본과 동일 패턴): 공통 도입 knot(b18_t2_cont)이\n// `* {gender == \"m\"} [계속] -> b18_t2_m` / `* {gender == \"f\"} [계속] -> b18_t2_f`로 갈라지고,\n// 이후 \"정답\"(A)·\"번호표를 만져본다\"(C) 결과 텍스트는 두 갈래가 완전히 같은 문장이라\n// b18_t2_common_a / b18_t2_common_c로 합류시켰다(원문 \"#### 2-공통-A\"·\"#### 2-공통-C\" 표기 그대로).\n//\n// 원본의 \"→ [선택 2]로 (A / B)\" 되돌림(턴 2-C 이후)은 B04.ink 표본과 동일하게, C 선택지를\n// 뺀 b18_t2_recall(A/B 둘만)로 처리했다(무한 루프 방지 + C 소거).\n//\n// 공간 로컬 변수: b18_seam(턴 2-C에서 번호표 밑 자국을 봤을 때) — 턴 4 클리어 한 문단만\n// 바뀌고 공간 밖으로 나가지 않는다. gate에서 리셋.\n// codex 신규 항목(main.ink에 추가 필요): b18_number, b18_count, b18_peephole — ink/B18.codex.txt 참조.\n\nVAR b18_seam = false\n\n=== b18_gate ===\n~ current_space = \"B18\"\n~ current_weight = 1.0\n~ b18_seam = false\n-> b18_intro\n\n=== b18_intro ===\n복도 저쪽에서 쇠문이 한 번 여닫혔다.\n\n소리가 길게 끌리다가 끊겼다. 그 소리를 듣고 있었다는 걸 알고 나서 눈을 떴다.\n\n거실 안이었다. 매트 하나, 접힌 담요, 구석에 세면대. 창은 높고 좁아서 밖이 아니라 밖의 색만 보였다.\n\n문에 시찰구가 있었고 덮개가 올려져 있었다. 그 사각으로 복도 건너편 벽이 보였다. 벽에 시계. 03:47. 초침이 없었다.\n\n옷 왼쪽 가슴에 천이 한 장 박혀 있었다. 숫자 하나. **7**.\n\n벽에 흰 페인트로 글씨가 쓰여 있었다. 정자체였고 네 줄이었다.\n-> b18_t1\n\n=== b18_t1 ===\n\\**수용동 야간 점호 수칙** — 사동 3 · 거실 12 · 정원 12 · {gender == \"m\":남 사동|여 사동}. 호명은 번호로 하고 이름은 쓰지 않는다. #rules:B18\n\n1. 순서를 벗어난 호명에는 답하지 않는다.\n2. 인원을 세거나 소리 내지 않는다.\n3. 점호는 {gender == \"m\":앉아|서서} 받고 시찰구를 보지 않는다.\n4. 앞뒤 번호를 확인해 근무자에게 알린다. #fake #dmg:strike\n\n2번과 4번을 나란히 읽었다. 세지 말라고 해 놓고 앞뒤를 확인하라고 한다. 앞뒤를 확인하려면 세야 한다.\n\n이름은 쓰지 않는다고 머리말이 적어 뒀다. 쓸 이름이 없어서 다행이라고 해야 하는지는 모르겠다.\n+ [4번 줄을 가까이서 본다] -> b18_t1_a\n+ [문 안쪽을 본다] -> b18_t1_b\n+ [벽 아래 벗겨진 자리를 본다] -> b18_t1_c\n\n=== b18_t1_a ===\n4번 줄에서만 손끝에 턱이 걸렸다. 그 줄만 덧칠 위에 다시 쓴 것이고, 비스듬히 보면 밑의 획이 지금 글씨보다 짧게 끝나 있었다.\n\n원래 4번은 확인하지 말라고 적혀 있었다. 누가 '확인' 뒤를 덮고 반대로 이어 썼다.\n-> b18_t2\n\n=== b18_t1_b ===\n문 안쪽 옆에 홈이 파여 있었다. 번호패를 꽂는 자리였다.\n\n패가 두 장 꽂혀 있었다. 앞엣것에 7. 뒤엣것은 숫자가 들어갈 자리가 매끈했다. 지워진 게 아니라 눌린 자국도 없었다.\n\n시찰구로 맞은편을 봤다. 거실 문이 여섯 개, 문마다 같은 홈. 홈마다 패가 한 장씩이었다.\n\n여기만 두 장이었다. 두 장이 필요한 이유는 벽에 적혀 있지 않았다.\n-> b18_t2\n\n=== b18_t1_c ===\n바닥에서 한 뼘쯤 높이에 페인트가 벗겨진 자리가 있었다. 손톱으로 판 글씨가 있었다.\n\n> 여섯 다음이 나였다\n> 여섯 다음이 내가 아니면 대답하지 마라\n\n그 밑에 더 얕게, 다른 손으로.\n\n> 세지 마라\n\n세 줄 다 힘이 들어가 있었다. 페인트 밑 시멘트까지 파였다.\n-> b18_t2\n\n=== b18_t2 ===\n가슴의 천을 봤다. 실이 촘촘했고 네 모서리가 다 물려 있었다.\n\n여기서 나를 가리키는 것은 이것 하나였다. 벽은 이것으로 부른다고 했다.\n-> shard(\"번호로 불린다\") -> b18_t2_cont\n\n=== b18_t2_cont ===\n복도 끝에서 발소리가 시작됐다. 문마다 멈췄다가 갔다.\n\n> 1번.\n\n> 1번, 있습니다.\n\n> 2번.\n\n목소리는 낮고 고르게 나왔다. 화도 안 났고 서두르지도 않았다. 대답도 마찬가지였다.\n\n숫자가 올라왔다. 3번. 4번. 5번. 6번.\n{gender == \"m\":\n    -> b18_t2_m\n- else:\n    -> b18_t2_f\n}\n\n=== b18_t2_m ===\n3번은 앉은 자세라고 했다. 문을 등지지 않았다.\n\n매트에 앉아 문 쪽을 봤다. 눈높이가 낮아서 문 밑 틈이 정면에 왔다. 복도 불빛이 그 틈으로 얇게 들어왔다.\n\n빛이 왼쪽에서 오른쪽으로 지나갔다. 우리 문 앞을 지나 옆 거실 쪽으로. 그리고 다시 왼쪽으로 되돌아왔다. 되돌아온 뒤에 멈췄다.\n+ [\"7번, 있습니다.\"] -> b18_t2_common_a\n+ [앞뒤 번호를 확인하고 알린다] -> b18_death_b\n+ [번호표를 만져 본다] -> b18_t2_common_c\n\n=== b18_t2_f ===\n3번은 선 자세라고 했다. 문에서 한 걸음 물러섰다.\n\n일어나서 뒤로 한 걸음 물러섰다. 그러니 시찰구 유리가 눈높이에 왔다. 유리 너머 복도가 밝았다.\n\n복도 불빛이 한 번 가려졌다. 우리 문 앞을 지나 옆 거실 쪽으로. 그리고 다시 가려졌다. 두 번째로 가려진 뒤에는 다시 밝아지지 않았다.\n+ [\"7번, 있습니다.\"] -> b18_t2_common_a\n+ [앞뒤 번호를 확인하고 알린다] -> b18_death_b\n+ [번호표를 만져 본다] -> b18_t2_common_c\n\n=== b18_t2_common_a ===\n> 7번.\n\n\"7번, 있습니다.\"\n\n문 앞이 잠깐 있다가 옆으로 옮겨 갔다. 8번. 9번. 숫자가 12번까지 갔다.\n\n> 취침 점호 종료.\n\n자세를 풀었다. 발소리가 복도 끝으로 빠졌다.\n-> b18_t3\n\n=== b18_t2_common_c ===\n천을 손가락으로 눌렀다. 그 밑에 딱딱한 게 만져졌다.\n\n옷깃 쪽을 젖혀 안을 봤다. 지금 천이 박힌 자리 안쪽에 실 구멍이 한 줄 더 있었다. 먼저 박혔던 천을 뜯어낸 자국이었다.\n\n구멍 줄의 길이가 지금 것보다 넓었다. 두 자리였던 것 같기도 했다. 확인할 방법은 없었다.\n~ b18_seam = true\n-> b18_t2_recall\n\n=== b18_t2_recall ===\n+ [\"7번, 있습니다.\"] -> b18_t2_common_a\n+ [앞뒤 번호를 확인하고 알린다] -> b18_death_b\n\n=== b18_t3 ===\n조용해졌다.\n\n구석 세면대에서 물이 떨어졌다. 꼭지는 잠겨 있었는데 한 방울씩 떨어졌다. 떨어지는 간격은 세지 않았다.\n\n발소리가 다시 복도 끝에서 시작됐다.\n\n> 인원 점검. 1번.\n\n같은 목소리, 같은 높이였다. 2번. 3번. 4번. 5번. 6번.\n\n그다음이 왔다.\n\n> 13번.\n\n대답이 있었다. 어느 문에서 났는지는 알 수 없었다.\n\n벽은 거실 12, 정원 12라고 적어 뒀다. 13번은 이 사동에 없다.\n\n> 7번.\n\n발소리가 문 앞에 와 있었다.\n+ [\"7번, 있습니다.\"] -> b18_death_a\n+ {codex ? calling_voice} [답하지 않는다] (도감: 부르는 소리) -> b18_t3_b\n+ {not (codex ? calling_voice)} [답하지 않는다] -> b18_t3_b\n\n=== b18_t3_b ===\n입을 다물고 있었다. 자세는 그대로 뒀다.\n\n문 앞이 조금 있다가 옆으로 갔다. 8번. 9번. 답하지 않았는데 넘어갔다.\n\n12번까지 가고 끝났다. 대답은 전부 있었다.\n\n벽 아래의 글씨가 생각났다. 여섯 다음이 나였다. 오늘은 여섯 다음이 내가 아니었다.\n-> b18_t4\n\n=== b18_t4 ===\n> 계수 실시.\n\n발소리가 다시 복도 끝에서 왔다. 이번에는 문마다 멈추지 않고 걸으면서 셌다. 시찰구 덮개가 하나씩 젖혀졌다 닫혔다.\n\n> 하나. 둘. 셋.\n\n우리 문 앞에서 덮개가 젖혀졌다. 빛이 잠깐 들어왔다.\n\n> 여섯. 일곱.\n\n이 거실에는 매트가 하나다.\n\n덮개가 닫히고 발소리가 갔다. 옆에서 여덟. 그다음 아홉.\n\n2번은 세거나 소리 내지 말라고 했다. 3번은 시찰구를 보지 말라고 했다. 벽이 시킨 것은 전부 하지 않는 쪽이었다.\n+ [하나라고 말한다] -> b18_death_b\n+ [시찰구로 복도를 본다] -> b18_death_c\n+ [자세를 유지한다] -> b18_t4_c\n\n=== b18_t4_c ===\n움직이지 않았다. 눈도 감지 않았다.\n\n세는 소리가 복도 끝까지 갔다. 열둘에서 끝나지 않았다.\n\n> 열셋. 계수 종료. 인원 이상 없음.\n\n적는 소리가 짧게 났다. 열셋을 세고 이상 없다고 적는 일이 어떻게 성립하는지는 벽에 적혀 있지 않았다. 적혀 있지 않은 것은 근무자가 알아서 하는 것이다.\n\n> 점호 종료. 소등.\n\n복도 불이 꺼졌다. 문 밑 틈이 어두워졌다.\n\n{b18_seam:번호패 꽂이 쪽을 봤다. 어두워서 몇 장인지는 보이지 않았다. 세지 않았다.|번호패 꽂이 쪽을 봤다. 어두워서 아무것도 보이지 않았다.}\n\n가슴의 천은 그대로 붙어 있었다. 7이었다.\n-> b18_clear\n\n=== b18_clear ===\n// 클리어. 다음 배정은 05 앵커배치표 기준 — 아직 미구현이므로 종료.\n-> cleared\n\n// ── 사망 knot 3종. 본문 §사망 그대로. 마지막 줄에서 die(사망 문구, 도감 entry) 호출. ──\n\n=== b18_death_a ===\n\"7번, 있습니다.\"\n\n> 확인.\n\n발소리가 옆으로 갔다. 8번. 9번. 12번까지 가고 끝났다.\n\n조금 뒤에 다시 1번부터 시작됐다. 재확인이라고 했다.\n\n2번. 3번. 4번. 5번. 6번. 그리고 8번.\n\n7번을 부르지 않고 넘어갔다. 8번에서 대답이 있었고, 그 목소리는 아까 7번에서 대답한 것과 같은 높이였다.\n\n가슴을 봤다. 천이 없었다. 실 구멍만 한 줄 남아 있었다. 구멍은 넓었고, 두 자리가 들어갈 만했다.\n-> die(\"당신은 순서를 벗어난 호명 뒤에 답했습니다.\", b18_number)\n\n=== b18_death_b ===\n숫자를 입 밖으로 냈다.\n\n세는 소리가 멈췄다.\n\n> 다시 세겠습니다.\n\n복도 끝으로 돌아가 처음부터 셌다. 하나. 둘. 셋. 우리 문 앞에서 둘이 나갔다.\n\n또 멈췄다. 또 처음부터. 그때마다 우리 문 앞에서 하나씩 늘었다. 셋이 되고 넷이 되었다.\n\n몇 번째부터인지 모르겠는데, 세는 목소리가 문 밖이 아니라 이쪽에서 나고 있었다. 입이 움직이고 있었다. 멈추려고 했지만 그건 이제 근무자가 하는 일이 아니었다.\n\n복도에서 덮개가 젖혀졌다. 빛이 들어왔고, 그 빛에 매트가 비었다.\n-> die(\"당신은 인원을 셌습니다.\", b18_count)\n\n=== b18_death_c ===\n문에 다가가 사각에 얼굴을 댔다.\n\n복도가 보였다. 맞은편 거실 문이 여섯 개. 그중 하나의 시찰구가 열려 있었고 거기에 얼굴이 있었다. 이쪽을 보고 있었다.\n\n가슴께가 보였다. 천이 한 장 박혀 있었고 숫자가 7이었다.\n\n덮개가 닫히는 소리가 났다. 내 쪽이 아니라 저쪽에서 났다. 그런데 눈앞이 어두워졌다.\n\n세는 소리가 다시 복도 끝에서 시작됐다. 이번에는 문 밖이 아니라 문 안에서 들렸다. 문 안에 있었고, 소리도 문 안에서 났다.\n-> die(\"당신은 시찰구에 얼굴을 댔습니다.\", b18_peephole)\n\n// ── /INCLUDE B18.ink ──\n// ── INCLUDE B19.ink ──\n// ink/B19.ink — B19. 새벽 기도 순서지 (종교시설(기도실 칸) × 규칙서자체)\n// 원본: spaces/B19_새벽기도순서지.md (§4 턴 / §6 예산 / 본문 / 사망)\n// 규약: A02.ink·B01.ink와 동일. 턴 = knot. 선택지는 divert 대상을 같은 줄에 명시한다.\n// 사망은 별도 death-knot(b19_death_*)에 본문 그대로 두고, 마지막 줄에서\n// die(\"사망 문구\", codex_entry) 를 호출한다. 가중치는 B = 1.0. 조각 없음. 파편 없음(표 \"·\").\n//\n// 공간 로컬 변수: b19_reread(턴 2-B, 순서지를 다시 읽어 2번 줄이 바뀐 걸 목격) — 턴 3의\n// 한 문단만 바뀌고 공간 밖으로 나가지 않는다. gate에서 리셋.\n// 2-C 문장(벽의 손글씨)은 05_앵커배치표·B_BRIEF 지시대로 이미 경로 중립 문장이라 그대로 둠.\n// codex 신규 항목(main.ink에 추가 필요): b19_standing, b19_line5, b19_readagain — ink/B19.codex.txt 참조.\n\nVAR b19_reread = false\n\n=== b19_gate ===\n~ current_space = \"B19\"\n~ current_weight = 1.0\n~ b19_reread = false\n-> b19_intro\n\n=== b19_intro ===\n복도에서 슬리퍼 소리가 났다. 문 하나를 지나 다음 문으로. 간격이 일정했다.\n\n무릎이 차가웠다. 앉은 자세였고, 손에 종이가 한 장 있었다.\n-> b19_t1\n\n=== b19_t1 ===\n기도실이었다.\n\n한 사람이 무릎 꿇을 자리만 남는 칸. 문은 안에서 닫혀 있었고, 위쪽에 손바닥만 한 유리창이 있었다. 유리가 흐려서 복도 불빛만 번졌다. 문 아래에는 손가락 두 개 들어갈 틈.\n\n벽에 알전구가 하나 켜져 있었다. 그 옆에 시계. 03:47. 초침이 없었다.\n\n문 옆 벽에 못이 박혀 있었다. 비어 있었다.\n\n손의 종이를 폈다.\n\n\\**새벽 기도 순서지**\n\n이 종이는 {gender == \"m\":2층|3층} 기도실 안에서만 봅니다. 아래 네 줄이 오늘 순서입니다. #rules:B19\n1. 순서지는 한 번만 읽고 표시를 남깁니다.\n2. 대답하지 않습니다. 인도자는 서지 않습니다.\n3. 순서를 마치면 종이를 접어 못에 겁니다.\n4. 줄이 다르면 소리 내어 읽고 확인받습니다. #fake\n\n줄 끝마다 앞사람이 그은 연필 빗금이 있었는데 셋뿐이었다 — 넷째 줄 끝만 비어 있었다.\n\n1번과 4번이 한눈에 같이 들어왔다. 한 번만 읽으라고 해 놓고, 처음 읽은 것과 다르면 어떻게 하라고 한다. 한 번만 읽은 사람은 무엇과 무엇을 비교하나.\n\n2번과 4번도 붙지 않았다. 대답하지 않는다면서, 확인을 받으라고 한다.\n\n읽기를 여기서 멈췄다. 한 번은 다 읽었으니까.\n+ [벽에 붙은 손글씨 종이를 본다] -> b19_t1_a\n+ [줄 끝에 표시를 남긴다] -> b19_t1_b\n+ [종이를 알전구에 비춰 본다] -> b19_t1_c\n\n=== b19_t1_a ===\n옆 벽에 종이 한 장이 압정 넷으로 붙어 있었다. 볼펜으로 옮겨 적은 것이었다. 자를 대고 그은 줄 위에 네 줄.\n\n1번부터 3번까지는 손에 든 것과 글자까지 같았다. 4번만 달랐다.\n\n> 4. 마지막 순서 뒤 종소리가 날 때까지는 아무것도 하지 않습니다.\n\n옮겨 적은 사람은 인쇄된 걸 보고 썼을 것이다. 그 사람이 본 넷째 줄은 저거였다.\n-> b19_t2\n\n=== b19_t1_b ===\n못 아래 바닥에 몽당연필이 굴러 있었다. 심이 뭉툭했다.\n\n줄 끝에 하나씩 빗금을 그었다. 앞사람 것 옆에 나란히. 넷째 줄에도 그었다. 필체는 달라도 빗금에는 필체가 없다.\n\n몸을 숙였을 때 무릎 높이 벽에 글씨가 보였다. 연필이었고, 앉지 않으면 안 보이는 높이였다.\n\n> 한 번만 읽어라\n> 두 번째부터 한 줄이 바뀐다\n> 바뀐 줄은 늘 뭘 시킨다\n\n가운데 줄만 필체가 달랐다. 두 사람이 같은 자리에 앉았다는 뜻이다.\n-> b19_t2\n\n=== b19_t1_c ===\n종이를 알전구 쪽으로 들었다. 인쇄가 뒷면으로 비쳐 나왔다. 거꾸로 뒤집힌 글자들.\n\n세 줄이었다. 넷째 줄 자리는 그냥 종이였다.\n\n뒤집어 보니 넷째 줄은 앞면 제자리에 멀쩡히 있었다. 잉크가 종이에 배지 않은 줄이 하나 있는 것이다. 찍힌 게 아니라 얹혀 있는 줄.\n-> b19_t2\n\n=== b19_t2 ===\n종소리가 났다. 한 번, 짧게. 무슨 뜻인지는 종이에 없었다.\n\n복도의 슬리퍼 소리가 멀어졌다. 벽 안에서 물이 도는 소리가 났다. 새벽에 난방을 넣은 것이다. 한 바퀴 돌고 조용해졌다.\n\n순서를 따랐다. 몇 번째까지 했는지가 곧 흐려졌다. 아무것도 하지 않는 자세로 앉아 있으면 한 줄과 다음 줄 사이가 지워진다.\n+ [표시만 보고 따른다] -> b19_t2_a\n+ [종이를 처음부터 다시 읽는다] -> b19_t2_b\n+ [벽의 손글씨를 본다] -> b19_t2_c\n\n=== b19_t2_a ===\n빗금만 봤다. 글자 쪽으로 눈이 가지 않게 종이를 반쯤 접어 쥐었다.\n\n기억한 순서대로 갔다. 기억은 종이가 아니라서 밤중에 고쳐지지 않는다.\n-> b19_t3\n\n=== b19_t2_b ===\n처음부터 다시 읽었다.\n\n네 줄이 그대로 있었다. 그대로 있었는데 2번이 이랬다.\n\n> 2. 부르는 소리에는 칸 번호를 말합니다.\n\n줄 끝에 빗금이 있었다. 아까 내 손으로 그은 빗금이었다.\n\n빗금은 그대로인데 문장이 달랐다. 표시는 줄이 바뀌는 걸 막지 못한다. 다만 바뀌었다는 건 알려 준다.\n~ b19_reread = true\n-> b19_t3\n\n=== b19_t2_c ===\n벽의 손글씨를 봤다. 압정 자국이 종이 귀퉁이마다 여러 개였다. 붙였다 뗐다 한 자리가 많았다.\n\n1번부터 3번까지는 손의 것과 같았다. 넷째 줄만 달랐다.\n\n손으로 쓴 쪽은 바뀌지 않는다. 바뀌는 건 인쇄된 쪽이다. 어느 쪽이 오래된 종이인지와는 상관이 없었다.\n-> b19_t3\n\n=== b19_t3 ===\n슬리퍼 소리가 돌아왔다. 문 하나, 다음 문. 그러다 내 문 앞에서 멎었다.\n\n문 아래 틈으로 그림자 두 짝이 들어왔다. 발끝이 이쪽을 향해 있었다.\n\n> 기도하시는 분.\n\n말끝이 내려가는 목소리였다. 문마다 같은 말을 하고 온 사람의 목소리. 급한 데가 하나도 없었다.\n\n2번 줄의 뒷문장을 생각했다. 인도자는 서지 않는다.\n\n{b19_reread: 다시 읽은 종이의 2번 줄은 칸 번호를 말하라고 했다. 이 칸에는 번호가 붙어 있지 않았다.}\n+ [대답한다] -> b19_death_a\n+ [넷째 줄대로 한다] -> b19_death_b\n+ {codex ? calling_voice} [아무 소리도 내지 않는다] (도감: 부르는 소리) -> b19_t3_c\n+ {not (codex ? calling_voice)} [아무 소리도 내지 않는다] -> b19_t3_c\n\n=== b19_t3_c ===\n숨소리도 길게 내지 않았다.\n\n그림자가 한참 있었다. 발끝의 방향이 바뀌지 않았다. 문을 두드리지도 않았고 손잡이를 돌리지도 않았다.\n\n그러다 물러났다. 슬리퍼 소리가 다음 문으로 갔다.\n\n문 앞에 서지 않고 지나가는 쪽이 인도자라면, 방금 것은 인도자가 아니었다. 그러니 인도자는 아직 지나가지 않은 것이다.\n-> b19_t4\n\n=== b19_t4 ===\n마지막 순서를 마쳤다.\n\n슬리퍼 소리가 한 번 더 왔다. 이번에는 멎지 않고 지나갔다. 문 앞에 서지 않았으니 그쪽이 인도자였다.\n\n종소리는 아직이었다.\n\n못은 비어 있었다. 접어서 걸면 끝이다. 종이는 손에 펴져 있었고, 접으려면 손 안에서 한 번은 눈에 들어올 것이다.\n+ [보지 않고 접어 못에 건다] -> b19_t4_a\n+ [접기 전에 한 번 더 읽는다] -> b19_death_c\n+ [벽의 손글씨와 맞춰 본다] -> b19_t4_c\n\n=== b19_t4_a ===\n눈을 내리깔고 접었다. 세로로 한 번,
